name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync
      - name: Lint
        run: uv run ruff check src scripts
      - name: Types
        run: uv run mypy src/ai_debugger
      - name: NPCI map is in sync with the source text
        run: uv run python scripts/build_npci_map.py --check
