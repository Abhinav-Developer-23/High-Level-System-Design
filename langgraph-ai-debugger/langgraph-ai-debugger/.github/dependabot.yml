# Weekly dependency-update PRs (Python packages via uv, and the GitHub Actions used by CI).
version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      langchain-stack:
        patterns: ["langchain*", "langgraph*", "mcp"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
