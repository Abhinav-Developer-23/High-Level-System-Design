[project]
name = "langgraph-ai-debugger"
version = "0.3.0"
description = "LangGraph production debugger for TPAP / TSP UPI — Claude via the Anthropic API (ChatAnthropic) with LangGraph tools: native DB tools plus the Agent-debugger MCP servers."
requires-python = ">=3.13"
dependencies = [
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.0",
    "langchain-core>=1.0",
    "langchain-anthropic>=1.0",      # ChatAnthropic: Claude through the Anthropic API
    "langchain-mcp-adapters>=0.3",   # MCP servers → LangGraph tools
    "aiosqlite>=0.20",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    # MCP client (the adapters) + runtime deps of the read-only MCP servers (mcp_servers/**)
    "mcp[cli]>=1.20,<2",
    "httpx>=0.27.0",
    "truststore>=0.9",
]

[project.optional-dependencies]
# `uv sync --extra eval`: RAGAS metrics for `ai-debugger eval --ragas` (not needed to run the app)
eval = ["ragas>=0.2"]

[project.scripts]
ai-debugger = "ai_debugger.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_debugger"]

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["mcp_servers"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_ignores = false
