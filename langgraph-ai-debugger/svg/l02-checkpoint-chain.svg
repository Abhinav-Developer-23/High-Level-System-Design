<svg xmlns="http://www.w3.org/2000/svg" width="900" height="742" viewBox="0 0 900 742" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>A thread is a chain of checkpoints</title>
  <desc>Two turns of one thread. Every super-step saves a checkpoint holding the full state and the list of nodes to run next. Each checkpoint points to its parent, and turn 2 continues the same chain.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="741" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="450" y="36" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">ONE THREAD (thread_id = "7f3a9c…") = ONE CHAIN OF CHECKPOINTS</text>
  <line x1="24" y1="50" x2="876" y2="50" stroke="#30363d"/>

  <text x="40" y="78" fill="#e6edf3" font-size="14" font-weight="600">Turn 1: new question</text>
  <text x="40" y="96" fill="#8b949e" font-size="12">every node run adds one checkpoint</text>
  <rect x="40" y="112" width="370" height="34" rx="8" fill="#58a6ff" fill-opacity="0.10" stroke="#58a6ff"/>
  <text x="54" y="134" fill="#8b949e" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">step -1</text>
  <rect x="132" y="118" width="92" height="22" rx="11" fill="#58a6ff" fill-opacity="0.14" stroke="#58a6ff"/>
  <text x="178" y="133" fill="#79c0ff" font-size="11" font-weight="600" text-anchor="middle">new message</text>
  <text x="236" y="134" fill="#8b949e" font-size="13">next: <tspan fill="#e3b341" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="13">__start__</tspan></text>
  <line x1="80" y1="146" x2="80" y2="156" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="40" y="158" width="370" height="34" rx="8" fill="#1c2128" fill-opacity="1" stroke="#30363d"/>
  <text x="54" y="180" fill="#8b949e" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">step 0</text>
  <text x="236" y="180" fill="#8b949e" font-size="13">next: <tspan fill="#e3b341" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="13">triage</tspan></text>
  <line x1="80" y1="192" x2="80" y2="202" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="40" y="204" width="370" height="34" rx="8" fill="#1c2128" fill-opacity="1" stroke="#30363d"/>
  <text x="54" y="226" fill="#8b949e" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">step 1</text>
  <text x="236" y="226" fill="#8b949e" font-size="13">next: <tspan fill="#e3b341" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="13">npci</tspan></text>
  <line x1="80" y1="238" x2="80" y2="248" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="40" y="250" width="370" height="34" rx="8" fill="#1c2128" fill-opacity="1" stroke="#30363d"/>
  <text x="54" y="272" fill="#8b949e" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">step 2</text>
  <text x="236" y="272" fill="#8b949e" font-size="13">next: <tspan fill="#e3b341" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="13">plan</tspan></text>
  <line x1="80" y1="284" x2="80" y2="294" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="40" y="296" width="370" height="34" rx="8" fill="#1c2128" fill-opacity="1" stroke="#30363d"/>
  <text x="54" y="318" fill="#8b949e" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">step 3</text>
