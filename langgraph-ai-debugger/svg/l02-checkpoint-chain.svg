  <rect x="40" y="342" width="370" height="34" rx="8" fill="#1c2128" fill-opacity="1" stroke="#30363d"/>
  <text x="54" y="364" fill="#8b949e" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">step 4</text>
  <text x="236" y="364" fill="#8b949e" font-size="13">next: <tspan fill="#e3b341" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="13">npci_enrich</tspan></text>
  <line x1="80" y1="376" x2="80" y2="386" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="40" y="388" width="370" height="34" rx="8" fill="#1c2128" fill-opacity="1" stroke="#30363d"/>
  <text x="54" y="410" fill="#8b949e" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">step 5</text>
  <text x="236" y="410" fill="#8b949e" font-size="13">next: <tspan fill="#e3b341" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="13">review</tspan></text>
  <line x1="80" y1="422" x2="80" y2="432" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="40" y="434" width="370" height="34" rx="8" fill="#1c2128" fill-opacity="1" stroke="#30363d"/>
  <text x="54" y="456" fill="#8b949e" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">step 6</text>
  <text x="236" y="456" fill="#8b949e" font-size="13">next: <tspan fill="#e3b341" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="13">report</tspan></text>
  <line x1="80" y1="468" x2="80" y2="478" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="40" y="480" width="370" height="34" rx="8" fill="#3fb950" fill-opacity="0.10" stroke="#3fb950"/>
  <text x="54" y="502" fill="#8b949e" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">step 7</text>
  <text x="236" y="502" fill="#56d364" font-size="13">next: [ ]  turn finished</text>
  <text x="490" y="78" fill="#e6edf3" font-size="14" font-weight="600">Turn 2: follow-up, same thread_id</text>
  <text x="490" y="96" fill="#8b949e" font-size="12">plan is skipped; old state is loaded first</text>
  <rect x="490" y="112" width="370" height="34" rx="8" fill="#58a6ff" fill-opacity="0.10" stroke="#58a6ff"/>
  <text x="504" y="134" fill="#8b949e" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">step 8</text>
  <rect x="582" y="118" width="92" height="22" rx="11" fill="#58a6ff" fill-opacity="0.14" stroke="#58a6ff"/>
  <text x="628" y="133" fill="#79c0ff" font-size="11" font-weight="600" text-anchor="middle">new message</text>
  <text x="686" y="134" fill="#8b949e" font-size="13">next: <tspan fill="#e3b341" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="13">__start__</tspan></text>
  <line x1="530" y1="146" x2="530" y2="156" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="490" y="158" width="370" height="34" rx="8" fill="#1c2128" fill-opacity="1" stroke="#30363d"/>
  <text x="504" y="180" fill="#8b949e" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">step 9</text>
  <text x="686" y="180" fill="#8b949e" font-size="13">next: <tspan fill="#e3b341" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="13">triage</tspan></text>
  <line x1="530" y1="192" x2="530" y2="202" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="490" y="204" width="370" height="34" rx="8" fill="#1c2128" fill-opacity="1" stroke="#30363d"/>
  <text x="504" y="226" fill="#8b949e" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">step 10</text>
  <text x="686" y="226" fill="#8b949e" font-size="13">next: <tspan fill="#e3b341" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="13">npci</tspan></text>
  <line x1="530" y1="238" x2="530" y2="248" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="490" y="250" width="370" height="34" rx="8" fill="#1c2128" fill-opacity="1" stroke="#30363d"/>
  <text x="504" y="272" fill="#8b949e" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">step 11</text>
  <text x="686" y="272" fill="#8b949e" font-size="13">next: <tspan fill="#e3b341" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="13">investigate</tspan></text>
  <line x1="530" y1="284" x2="530" y2="294" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="490" y="296" width="370" height="34" rx="8" fill="#1c2128" fill-opacity="1" stroke="#30363d"/>
  <text x="504" y="318" fill="#8b949e" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">step 12</text>
  <text x="686" y="318" fill="#8b949e" font-size="13">next: <tspan fill="#e3b341" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="13">npci_enrich</tspan></text>
  <line x1="530" y1="330" x2="530" y2="340" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="490" y="342" width="370" height="34" rx="8" fill="#1c2128" fill-opacity="1" stroke="#30363d"/>
  <text x="504" y="364" fill="#8b949e" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">step 13</text>
  <text x="686" y="364" fill="#8b949e" font-size="13">next: <tspan fill="#e3b341" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="13">review</tspan></text>
  <line x1="530" y1="376" x2="530" y2="386" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="490" y="388" width="370" height="34" rx="8" fill="#1c2128" fill-opacity="1" stroke="#30363d"/>
  <text x="504" y="410" fill="#8b949e" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">step 14</text>
  <text x="686" y="410" fill="#8b949e" font-size="13">next: <tspan fill="#e3b341" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="13">report</tspan></text>
  <line x1="530" y1="422" x2="530" y2="432" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="490" y="434" width="370" height="34" rx="8" fill="#3fb950" fill-opacity="0.10" stroke="#3fb950"/>
  <text x="504" y="456" fill="#8b949e" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">step 15</text>
  <text x="686" y="456" fill="#56d364" font-size="13">next: [ ]  turn finished</text>
  <polyline points="410,497.0 450,497.0 450,129.0 487,129.0" fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrB)"/>
  <text x="458" y="305.0" fill="#79c0ff" font-size="12" data-nocheck="1">parent</text>
  <text x="458" y="321.0" fill="#79c0ff" font-size="12" data-nocheck="1">link</text>
  <text x="490" y="490" fill="#8b949e" font-size="12">Each card stores parent_checkpoint_id = the card above it.</text>
  <line x1="24" y1="542" x2="876" y2="542" stroke="#21262d"/>
  <text x="40" y="564" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">ONE ROW OF THE checkpoints TABLE (SQLite)</text>
  <rect x="40" y="578" width="130" height="30" fill="#1c2128" stroke="#30363d"/>
  <text x="52" y="598" fill="#e6edf3" font-size="12" font-weight="600" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">thread_id</text>
  <rect x="40" y="608" width="130" height="52" fill="#161b22" stroke="#30363d"/>
  <text x="52" y="628" fill="#79c0ff" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">7f3a9c…</text>
  <rect x="170" y="578" width="170" height="30" fill="#1c2128" stroke="#30363d"/>
  <text x="182" y="598" fill="#e6edf3" font-size="12" font-weight="600" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">checkpoint_id</text>
  <rect x="170" y="608" width="170" height="52" fill="#161b22" stroke="#30363d"/>
  <text x="182" y="628" fill="#79c0ff" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">1f1c87a2-ac81…</text>
  <text x="182" y="648" fill="#8b949e" font-size="12" >(time-sortable)</text>
  <rect x="340" y="578" width="190" height="30" fill="#1c2128" stroke="#30363d"/>
  <text x="352" y="598" fill="#e6edf3" font-size="12" font-weight="600" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">parent_checkpoint_id</text>
  <rect x="340" y="608" width="190" height="52" fill="#161b22" stroke="#30363d"/>
  <text x="352" y="628" fill="#79c0ff" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">1f1c87a1-0bc5…</text>
  <text x="352" y="648" fill="#8b949e" font-size="12" >(the step before)</text>
  <rect x="530" y="578" width="170" height="30" fill="#1c2128" stroke="#30363d"/>
  <text x="542" y="598" fill="#e6edf3" font-size="12" font-weight="600" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">checkpoint</text>
  <rect x="530" y="608" width="170" height="52" fill="#161b22" stroke="#30363d"/>
  <text x="542" y="628" fill="#79c0ff" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">full state + versions</text>
  <text x="542" y="648" fill="#8b949e" font-size="12" >(msgpack blob)</text>
  <rect x="700" y="578" width="160" height="30" fill="#1c2128" stroke="#30363d"/>
  <text x="712" y="598" fill="#e6edf3" font-size="12" font-weight="600" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">metadata</text>
  <rect x="700" y="608" width="160" height="52" fill="#161b22" stroke="#30363d"/>
  <text x="712" y="628" fill="#79c0ff" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">source: "loop"</text>
  <text x="712" y="648" fill="#8b949e" font-size="12" >step: 3</text>
  <text x="40" y="692" fill="#8b949e" font-size="12">Primary key (thread_id, checkpoint_ns, checkpoint_id). A second table, <tspan fill="#79c0ff" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">writes</tspan>, keeps each finished node’s output for its step.</text>
  <text x="40" y="712" fill="#8b949e" font-size="12">“Latest checkpoint of a thread” = the row with the newest checkpoint_id for that thread_id.</text>
</svg>
