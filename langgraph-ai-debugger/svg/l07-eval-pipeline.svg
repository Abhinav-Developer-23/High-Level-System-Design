<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Evaluating the agent</title>
  <desc>Golden cases or saved threads become samples (answer, tool outputs, tools called, cost, latency). Three scorers grade each sample: free code checks, Claude Opus 5.5 as LLM-as-a-judge with a rubric, and optional RAGAS metrics. The report is compared with a baseline and a regression fails the run.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="469" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="450" y="36" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">ai-debugger eval: THREE SCORERS, CHEAPEST FIRST</text>
  <line x1="24" y1="50" x2="876" y2="50" stroke="#30363d"/>
  <rect x="24" y="74" width="176" height="84" rx="9" fill="#1c2128" stroke="#30363d"/>
  <text x="112.0" y="98" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">golden.jsonl</text>
  <text x="112.0" y="120" fill="#8b949e" font-size="12" text-anchor="middle">question + reference,</text>
  <text x="112.0" y="138" fill="#8b949e" font-size="12" text-anchor="middle">must_include, expected_tools</text>
  <rect x="24" y="176" width="176" height="84" rx="9" fill="#1c2128" stroke="#30363d"/>
  <text x="112.0" y="200" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle" >saved threads</text>
  <text x="112.0" y="222" fill="#8b949e" font-size="12" text-anchor="middle">real conversations</text>
  <text x="112.0" y="240" fill="#8b949e" font-size="12" text-anchor="middle">from the checkpoint DB</text>
  <polyline points="200,116 226,116 226,158 246,158" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <polyline points="200,218 226,218 226,176 246,176" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="248" y="116" width="184" height="104" rx="9" fill="#1c2128" stroke="#30363d"/>
  <text x="340.0" y="140" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">Sample</text>
  <text x="340.0" y="162" fill="#8b949e" font-size="12" text-anchor="middle">answer</text>
  <text x="340.0" y="180" fill="#8b949e" font-size="12" text-anchor="middle">tool outputs (contexts)</text>
  <text x="340.0" y="198" fill="#8b949e" font-size="12" text-anchor="middle">tools called</text>
  <text x="340.0" y="216" fill="#8b949e" font-size="12" text-anchor="middle">cost, latency</text>
  <rect x="478" y="70" width="250" height="84" rx="9" fill="#3fb950" fill-opacity="0.10" stroke="#3fb950"/>
  <text x="603.0" y="94" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle" >1. code checks</text>
  <text x="603.0" y="116" fill="#56d364" font-size="12" text-anchor="middle">right system, expected tools,</text>
  <text x="603.0" y="134" fill="#56d364" font-size="12" text-anchor="middle">required facts, under budget · free</text>
  <rect x="478" y="166" width="250" height="84" rx="9" fill="#bc8cff" fill-opacity="0.12" stroke="#bc8cff"/>
  <text x="603.0" y="190" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle" >2. Opus 5.5 as judge</text>
  <text x="603.0" y="212" fill="#d2a8ff" font-size="12" text-anchor="middle">rubric 1–5: root cause, evidence,</text>
  <text x="603.0" y="230" fill="#d2a8ff" font-size="12" text-anchor="middle">completeness, action, safety</text>
  <rect x="478" y="262" width="250" height="84" rx="9" fill="#39c5cf" fill-opacity="0.10" stroke="#39c5cf"/>
  <text x="603.0" y="286" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle" >3. RAGAS (optional)</text>
  <text x="603.0" y="308" fill="#56d4dd" font-size="12" text-anchor="middle">Faithfulness (no hallucination),</text>
  <text x="603.0" y="326" fill="#56d4dd" font-size="12" text-anchor="middle">FactualCorrectness vs reference</text>
  <polyline points="432,168 455,168 455,112 476,112" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <polyline points="432,168 455,168 455,208 476,208" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <polyline points="432,168 455,168 455,304 476,304" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="756" y="150" width="120" height="104" rx="9" fill="#1c2128" stroke="#30363d"/>
  <text x="816.0" y="174" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle" >report</text>
  <text x="816.0" y="196" fill="#8b949e" font-size="12" text-anchor="middle">var/evals/</text>
  <text x="816.0" y="214" fill="#8b949e" font-size="12" text-anchor="middle">*.json + *.md</text>
  <text x="816.0" y="232" fill="#8b949e" font-size="12" text-anchor="middle">averages</text>
  <polyline points="728,112 742,112 742,202 754,202" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <polyline points="728,208 742,208 742,202 754,202" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <polyline points="728,304 742,304 742,202 754,202" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="588" y="370" width="288" height="64" rx="9" fill="#f85149" fill-opacity="0.10" stroke="#f85149"/>
  <text x="732.0" y="394" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle" >CI gate vs --baseline</text>
  <text x="732.0" y="416" fill="#ff7b72" font-size="12" text-anchor="middle">exit 1 if a score drops or cost rises > 5%</text>
  <polyline points="816,254 816,368" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="24" y="392" fill="#c9d1d9" font-size="13"><tspan fill="#e6edf3" font-weight="600">Judge ≠ judged:</tspan> the app runs on Sonnet 5,</text>
  <text x="24" y="412" fill="#c9d1d9" font-size="13">the grader is the stronger Opus 5.5, with structured</text>
  <text x="24" y="432" fill="#c9d1d9" font-size="13">output (json_schema) and reasoning before scores.</text>
</svg>
