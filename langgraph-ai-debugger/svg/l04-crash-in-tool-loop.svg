<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Server crash and resume</title>
  <desc>The server dies during the agent's second LLM call, after the tools node ran get_txn. Checkpoints up to tools are on disk, with next = agent. On restart the thread is marked interrupted; astream(None, config) re-runs only the agent call, not the tool.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="619" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="450" y="36" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">THE SERVER DIES IN THE MIDDLE OF THE TOOL LOOP</text>
  <line x1="24" y1="50" x2="876" y2="50" stroke="#30363d"/>
  <rect x="34" y="72" width="106" height="40" rx="8" fill="#3fb950" fill-opacity="0.10" stroke="#3fb950"/>
  <text x="87.0" y="97" fill="#e6edf3" font-size="13" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">triage</text>
  <text x="87.0" y="134" fill="#56d364" font-size="12" text-anchor="middle">✓ checkpoint saved</text>
  <line x1="141" y1="92.0" x2="154" y2="92.0" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="156" y="72" width="106" height="40" rx="8" fill="#3fb950" fill-opacity="0.10" stroke="#3fb950"/>
  <text x="209.0" y="97" fill="#e6edf3" font-size="13" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">npci</text>
  <text x="209.0" y="134" fill="#56d364" font-size="12" text-anchor="middle">✓ checkpoint saved</text>
  <line x1="263" y1="92.0" x2="276" y2="92.0" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="278" y="72" width="106" height="40" rx="8" fill="#3fb950" fill-opacity="0.10" stroke="#3fb950"/>
  <text x="331.0" y="97" fill="#e6edf3" font-size="13" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">investigate</text>
  <text x="331.0" y="134" fill="#56d364" font-size="12" text-anchor="middle">✓ checkpoint saved</text>
  <line x1="385" y1="92.0" x2="398" y2="92.0" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="400" y="72" width="106" height="40" rx="8" fill="#3fb950" fill-opacity="0.10" stroke="#3fb950"/>
  <text x="453.0" y="97" fill="#e6edf3" font-size="13" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">agent</text>
  <text x="453.0" y="134" fill="#56d364" font-size="12" text-anchor="middle">✓ checkpoint saved</text>
  <text x="453.0" y="152" fill="#8b949e" font-size="11" text-anchor="middle">asks: get_txn</text>
  <line x1="507" y1="92.0" x2="520" y2="92.0" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="522" y="72" width="106" height="40" rx="8" fill="#3fb950" fill-opacity="0.10" stroke="#3fb950"/>
  <text x="575.0" y="97" fill="#e6edf3" font-size="13" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">tools</text>
  <text x="575.0" y="134" fill="#56d364" font-size="12" text-anchor="middle">✓ checkpoint saved</text>
  <text x="575.0" y="152" fill="#8b949e" font-size="11" text-anchor="middle">ran get_txn</text>
  <line x1="629" y1="92.0" x2="642" y2="92.0" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="644" y="72" width="106" height="40" rx="8" fill="#f85149" fill-opacity="0.14" stroke="#f85149" stroke-width="2"/>
  <text x="697.0" y="97" fill="#e6edf3" font-size="13" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">agent</text>
  <text x="697.0" y="134" fill="#ff7b72" font-size="12" font-weight="700" text-anchor="middle">✗ CRASH here</text>
  <text x="697.0" y="152" fill="#ff7b72" font-size="11" text-anchor="middle">OOM, kill -9, restart</text>
  <line x1="751" y1="92.0" x2="764" y2="92.0" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="766" y="72" width="106" height="40" rx="8" fill="none" stroke="#484f58" stroke-dasharray="5 4"/>
  <text x="819.0" y="97" fill="#8b949e" font-size="13" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">npci_enrich</text>
  <text x="819.0" y="134" fill="#8b949e" font-size="12" text-anchor="middle">never ran</text>
  <text x="34" y="182" fill="#c9d1d9" font-size="13">Latest checkpoint: state after <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" fill="#79c0ff">tools</tspan> (the get_txn result is in agent_messages), with <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" fill="#e3b341">next = ["agent"]</tspan>.</text>
  <rect x="34" y="202" width="410" height="160" rx="10" fill="#1c2128" stroke="#30363d"/>
  <path d="M34 234 V212 Q34 202 44 202 H434 Q444 202 444 212 V234 Z" fill="#3fb950" fill-opacity="0.14"/>
  <line x1="34" y1="234" x2="444" y2="234" stroke="#3fb950" stroke-opacity="0.5"/>
  <text x="50" y="223" fill="#56d364" font-size="13" font-weight="700">SURVIVES (it is on disk)</text>
  <text x="50" y="260" fill="#c9d1d9" font-size="13"><tspan fill="#56d364">•</tspan>  every finished node, one checkpoint each</text>
  <text x="50" y="288" fill="#c9d1d9" font-size="13"><tspan fill="#56d364">•</tspan>  every finished tool call and its result</text>
  <text x="50" y="316" fill="#c9d1d9" font-size="13"><tspan fill="#56d364">•</tspan>  txn_rows written by get_txn (Command)</text>
  <text x="50" y="344" fill="#c9d1d9" font-size="13"><tspan fill="#56d364">•</tspan>  the thread row in threads.sqlite</text>
  <rect x="456" y="202" width="410" height="160" rx="10" fill="#1c2128" stroke="#30363d"/>
  <path d="M456 234 V212 Q456 202 466 202 H856 Q866 202 866 212 V234 Z" fill="#f85149" fill-opacity="0.14"/>
  <line x1="456" y1="234" x2="866" y2="234" stroke="#f85149" stroke-opacity="0.5"/>
  <text x="472" y="223" fill="#ff7b72" font-size="13" font-weight="700">LOST (it was only in RAM)</text>
  <text x="472" y="260" fill="#c9d1d9" font-size="13"><tspan fill="#ff7b72">•</tspan>  the LLM call that was in flight</text>
  <text x="472" y="288" fill="#c9d1d9" font-size="13"><tspan fill="#ff7b72">•</tspan>  tokens it had streamed so far</text>
  <text x="472" y="316" fill="#c9d1d9" font-size="13"><tspan fill="#ff7b72">•</tspan>  the asyncio task and the open SSE stream</text>
  <text x="472" y="344" fill="#c9d1d9" font-size="13"><tspan fill="#ff7b72">•</tspan>  nothing else: no tool is re-run</text>
  <text x="34" y="396" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">ON RESTART</text>
  <rect x="34" y="410" width="410" height="190" rx="10" fill="#58a6ff" fill-opacity="0.08" stroke="#58a6ff"/>
  <text x="50" y="436" fill="#79c0ff" font-size="14" font-weight="600" >What this app does today</text>
  <text x="50" y="462" fill="#c9d1d9" font-size="13" >ThreadStore.open() runs on startup:</text>
  <text x="50" y="484" fill="#79c0ff" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">UPDATE threads SET status='interrupted'</text>
  <text x="50" y="502" fill="#79c0ff" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">WHERE status='running'</text>
  <text x="50" y="528" fill="#c9d1d9" font-size="13" >The user re-asks in the same thread: a new turn</text>
  <text x="50" y="548" fill="#c9d1d9" font-size="13" >starts from START, and agent_messages (with</text>
  <text x="50" y="568" fill="#c9d1d9" font-size="13" >the get_txn result) is still there.</text>
  <rect x="456" y="410" width="410" height="190" rx="10" fill="#3fb950" fill-opacity="0.08" stroke="#3fb950"/>
  <text x="472" y="436" fill="#56d364" font-size="14" font-weight="600" >LangGraph’s built-in resume</text>
  <text x="472" y="464" fill="#79c0ff" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">graph.astream(None, {"configurable":</text>
  <text x="472" y="482" fill="#79c0ff" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">&#160;&#160;&#160;&#160;{"thread_id": tid}})</text>
  <text x="472" y="508" fill="#c9d1d9" font-size="13" >Input None means “continue, don’t start over”.</text>
  <text x="472" y="528" fill="#c9d1d9" font-size="13" >It loads the latest checkpoint, sees</text>
  <text x="472" y="548" fill="#c9d1d9" font-size="13" >next = ["agent"] and repeats only that LLM call.</text>
  <text x="472" y="568" fill="#c9d1d9" font-size="13" >get_txn is not run again.</text>
</svg>
