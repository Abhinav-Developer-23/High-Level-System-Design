<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Reading a payment screenshot</title>
  <desc>A pasted screenshot goes to a read_screenshot node (Claude Haiku 5.5, no tools, JSON schema), the ids are checked in code, then the normal graph runs and get_txn confirms them against the DB. If a check fails, the user is asked to type the id.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="399" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="450" y="36" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">A PM PASTES THE CUSTOMER’S PAYMENT SCREENSHOT</text>
  <line x1="24" y1="50" x2="876" y2="50" stroke="#30363d"/>
  <rect x="24" y="80" width="120" height="80" rx="9" fill="#1c2128" stroke="#30363d"/>
  <text x="84.0" y="104" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle" >screenshot</text>
  <text x="84.0" y="124" fill="#8b949e" font-size="12" text-anchor="middle">PhonePe, GPay,</text>
  <text x="84.0" y="142" fill="#8b949e" font-size="12" text-anchor="middle">Paytm, BHIM</text>
  <line x1="144" y1="120" x2="168" y2="120" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="170" y="80" width="190" height="80" rx="9" fill="#bc8cff" fill-opacity="0.12" stroke="#bc8cff"/>
  <text x="265.0" y="104" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">read_screenshot</text>
  <text x="265.0" y="124" fill="#d2a8ff" font-size="12" text-anchor="middle">Claude Haiku 5.5</text>
  <text x="265.0" y="142" fill="#d2a8ff" font-size="12" text-anchor="middle">no tools · JSON schema</text>
  <line x1="360" y1="120" x2="384" y2="120" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="386" y="80" width="160" height="80" rx="9" fill="#3fb950" fill-opacity="0.10" stroke="#3fb950"/>
  <text x="466.0" y="104" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle" >check in code</text>
  <text x="466.0" y="124" fill="#56d364" font-size="12" text-anchor="middle">RRN = 12 digits,</text>
  <text x="466.0" y="142" fill="#56d364" font-size="12" text-anchor="middle">txn id pattern</text>
  <line x1="546" y1="120" x2="570" y2="120" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="572" y="80" width="130" height="80" rx="9" fill="#1c2128" stroke="#30363d"/>
  <text x="637.0" y="104" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">triage</text>
  <text x="637.0" y="124" fill="#8b949e" font-size="12" text-anchor="middle">ids → entities</text>
  <line x1="702" y1="120" x2="726" y2="120" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="728" y="80" width="148" height="80" rx="9" fill="#3fb950" fill-opacity="0.10" stroke="#3fb950"/>
  <text x="802.0" y="104" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">get_txn</text>
  <text x="802.0" y="124" fill="#56d364" font-size="12" text-anchor="middle">confirm in the DB:</text>
  <text x="802.0" y="142" fill="#56d364" font-size="12" text-anchor="middle">amount + status match</text>
  <line x1="466" y1="160" x2="466" y2="206" stroke="#f85149" stroke-width="1.5" marker-end="url(#arrR)"/>
  <text x="476" y="188" fill="#ff7b72" font-size="12" data-nocheck="1">field missing or check fails</text>
  <rect x="334" y="208" width="264" height="64" rx="9" fill="#f85149" fill-opacity="0.10" stroke="#f85149"/>
  <text x="466.0" y="232" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">AskUser</text>
  <text x="466.0" y="252" fill="#ff7b72" font-size="12" text-anchor="middle">“I can’t read the UTR, can you type it?”</text>
  <line x1="24" y1="300" x2="876" y2="300" stroke="#21262d"/>
  <text x="24" y="328" fill="#c9d1d9" font-size="13"><tspan fill="#e6edf3" font-weight="600">Output:</tspan> fields as JSON (app, status, amount, txn_id, utr_rrn, payee, time, error message), null when not visible.</text>
  <text x="24" y="350" fill="#c9d1d9" font-size="13"><tspan fill="#e6edf3" font-weight="600">Cost:</tspan> ~1,500 image tokens after shrinking to ~720 px wide; with Haiku about $0.0003 per screenshot.</text>
  <text x="24" y="372" fill="#c9d1d9" font-size="13"><tspan fill="#e6edf3" font-weight="600">Safety:</tspan> no tools at this step, so text inside the image can’t trigger anything; the image itself isn’t stored.</text>
</svg>
