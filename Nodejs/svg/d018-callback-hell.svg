<svg xmlns="http://www.w3.org/2000/svg" width="900" height="495" viewBox="0 0 900 495" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <rect x="0.5" y="0.5" width="899" height="494" rx="14" fill="#161b22" stroke="#30363d"/>
  <title>Callback hell (pyramid of doom)</title>
  <desc>Five dependent async steps written as nested error-first callbacks. The code drifts right with every step into a pyramid, the same if (err) return done(err) check repeats at every level, try/catch cannot catch errors thrown inside the callbacks, you must trust each library to call your callback exactly once, and running steps in parallel or adding a step means re-nesting everything.</desc>
  <defs>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker>
  </defs>
  <text x="24" y="38" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">CODE · 5 STEPS, 5 LEVELS DEEP</text>
  <text x="484" y="38" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">WHAT GOES WRONG</text>
  <rect x="24" y="52" width="436" height="391" rx="10" fill="#0d1117" stroke="#30363d"/>
  <rect x="73.1" y="90" width="385.9" height="322" fill="#f85149" fill-opacity=".07"/>
  <rect x="87.2" y="136" width="371.8" height="253" fill="#f85149" fill-opacity=".07"/>
  <rect x="101.2" y="182" width="357.8" height="184" fill="#f85149" fill-opacity=".07"/>
  <rect x="115.3" y="228" width="343.7" height="115" fill="#f85149" fill-opacity=".07"/>
  <rect x="129.4" y="274" width="329.6" height="46" fill="#f85149" fill-opacity=".07"/>
  <rect x="74.1" y="91" width="184.0" height="21" rx="4" fill="#d29922" fill-opacity=".22" stroke="#d29922" stroke-opacity=".7"/>
  <rect x="25" y="91" width="3" height="21" fill="#d29922"/>
  <rect x="88.2" y="137" width="184.0" height="21" rx="4" fill="#d29922" fill-opacity=".22" stroke="#d29922" stroke-opacity=".7"/>
  <rect x="25" y="137" width="3" height="21" fill="#d29922"/>
  <rect x="102.2" y="183" width="184.0" height="21" rx="4" fill="#d29922" fill-opacity=".22" stroke="#d29922" stroke-opacity=".7"/>
  <rect x="25" y="183" width="3" height="21" fill="#d29922"/>
  <rect x="116.3" y="229" width="184.0" height="21" rx="4" fill="#d29922" fill-opacity=".22" stroke="#d29922" stroke-opacity=".7"/>
  <rect x="25" y="229" width="3" height="21" fill="#d29922"/>
  <rect x="130.4" y="275" width="184.0" height="21" rx="4" fill="#d29922" fill-opacity=".22" stroke="#d29922" stroke-opacity=".7"/>
  <rect x="25" y="275" width="3" height="21" fill="#d29922"/>
  <g font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="12">
    <g fill="#6e7681" text-anchor="end">
      <text x="52" y="82">1</text><text x="52" y="105">2</text><text x="52" y="128">3</text><text x="52" y="151">4</text><text x="52" y="174">5</text><text x="52" y="197">6</text><text x="52" y="220">7</text><text x="52" y="243">8</text><text x="52" y="266">9</text><text x="52" y="289">10</text><text x="52" y="312">11</text><text x="52" y="335">12</text><text x="52" y="358">13</text><text x="52" y="381">14</text><text x="52" y="404">15</text><text x="52" y="427">16</text>
    </g>
    <text x="64.0" y="82"><tspan fill="#d2a8ff">getUser</tspan><tspan fill="#e6edf3">(id,&#160;(err,&#160;user)&#160;</tspan><tspan fill="#ff7b72">=&gt;</tspan><tspan fill="#e6edf3">&#160;{</tspan></text>
    <text x="78.1" y="105"><tspan fill="#ff7b72">if</tspan><tspan fill="#e6edf3">&#160;(err)&#160;</tspan><tspan fill="#ff7b72">return</tspan><tspan fill="#e6edf3">&#160;</tspan><tspan fill="#d2a8ff">done</tspan><tspan fill="#e6edf3">(err)</tspan></text>
    <text x="78.1" y="128"><tspan fill="#d2a8ff">getOrders</tspan><tspan fill="#e6edf3">(user.id,&#160;(err,&#160;orders)&#160;</tspan><tspan fill="#ff7b72">=&gt;</tspan><tspan fill="#e6edf3">&#160;{</tspan></text>
    <text x="92.2" y="151"><tspan fill="#ff7b72">if</tspan><tspan fill="#e6edf3">&#160;(err)&#160;</tspan><tspan fill="#ff7b72">return</tspan><tspan fill="#e6edf3">&#160;</tspan><tspan fill="#d2a8ff">done</tspan><tspan fill="#e6edf3">(err)</tspan></text>
    <text x="92.2" y="174"><tspan fill="#d2a8ff">getItems</tspan><tspan fill="#e6edf3">(orders[</tspan><tspan fill="#79c0ff">0</tspan><tspan fill="#e6edf3">].id,&#160;(err,&#160;items)&#160;</tspan><tspan fill="#ff7b72">=&gt;</tspan><tspan fill="#e6edf3">&#160;{</tspan></text>
    <text x="106.2" y="197"><tspan fill="#ff7b72">if</tspan><tspan fill="#e6edf3">&#160;(err)&#160;</tspan><tspan fill="#ff7b72">return</tspan><tspan fill="#e6edf3">&#160;</tspan><tspan fill="#d2a8ff">done</tspan><tspan fill="#e6edf3">(err)</tspan></text>
    <text x="106.2" y="220"><tspan fill="#d2a8ff">getPrice</tspan><tspan fill="#e6edf3">(items,&#160;(err,&#160;price)&#160;</tspan><tspan fill="#ff7b72">=&gt;</tspan><tspan fill="#e6edf3">&#160;{</tspan></text>
    <text x="120.3" y="243"><tspan fill="#ff7b72">if</tspan><tspan fill="#e6edf3">&#160;(err)&#160;</tspan><tspan fill="#ff7b72">return</tspan><tspan fill="#e6edf3">&#160;</tspan><tspan fill="#d2a8ff">done</tspan><tspan fill="#e6edf3">(err)</tspan></text>
    <text x="120.3" y="266"><tspan fill="#d2a8ff">sendEmail</tspan><tspan fill="#e6edf3">(user,&#160;price,&#160;(err)&#160;</tspan><tspan fill="#ff7b72">=&gt;</tspan><tspan fill="#e6edf3">&#160;{</tspan></text>
    <text x="134.4" y="289"><tspan fill="#ff7b72">if</tspan><tspan fill="#e6edf3">&#160;(err)&#160;</tspan><tspan fill="#ff7b72">return</tspan><tspan fill="#e6edf3">&#160;</tspan><tspan fill="#d2a8ff">done</tspan><tspan fill="#e6edf3">(err)</tspan></text>
    <text x="134.4" y="312"><tspan fill="#d2a8ff">done</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#ff7b72">null</tspan><tspan fill="#e6edf3">,&#160;</tspan><tspan fill="#a5d6ff">'sent'</tspan><tspan fill="#e6edf3">)</tspan></text>
    <text x="120.3" y="335"><tspan fill="#e6edf3">})</tspan></text>
    <text x="106.2" y="358"><tspan fill="#e6edf3">})</tspan></text>
    <text x="92.2" y="381"><tspan fill="#e6edf3">})</tspan></text>
    <text x="78.1" y="404"><tspan fill="#e6edf3">})</tspan></text>
    <text x="64.0" y="427"><tspan fill="#e6edf3">})</tspan></text>
  </g>
  <path d="M59,71 L129.4,297 L59,431" fill="none" stroke="#f85149" stroke-width="1.5" stroke-dasharray="5 4" stroke-opacity=".8"/>
  <circle cx="90.0" cy="262" r="10" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="90.0" y="266.5" fill="#ff7b72" font-size="12.5" font-weight="700" text-anchor="middle" data-nocheck="1">1</text>
  <circle cx="272.1" cy="101" r="10" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
  <text x="272.1" y="105.5" fill="#e3b341" font-size="12.5" font-weight="700" text-anchor="middle" data-nocheck="1">2</text>
  <circle cx="356.6" cy="216" r="10" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="356.6" y="220.5" fill="#ff7b72" font-size="12.5" font-weight="700" text-anchor="middle" data-nocheck="1">3</text>
  <circle cx="370.6" cy="262" r="10" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
  <text x="370.6" y="266.5" fill="#e3b341" font-size="12.5" font-weight="700" text-anchor="middle" data-nocheck="1">4</text>
  <circle cx="107.1" cy="400" r="10" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="107.1" y="404.5" fill="#ff7b72" font-size="12.5" font-weight="700" text-anchor="middle" data-nocheck="1">5</text>
  <rect x="484" y="52.0" width="392" height="71.8" rx="10" fill="#f85149" fill-opacity=".07" stroke="#f85149" stroke-opacity=".6"/>
  <circle cx="506" cy="76.0" r="11" fill="#f85149" fill-opacity=".2" stroke="#f85149" stroke-width="1.5"/>
  <text x="506" y="80.5" fill="#ff7b72" font-size="13" font-weight="700" text-anchor="middle">1</text>
  <text x="528" y="79.0" fill="#e6edf3" font-size="14" font-weight="600">Nesting grows to the right</text>
  <text x="528" y="100.0" fill="#c9d1d9" font-size="13">every step adds one more level,</text>
  <text x="528" y="118.0" fill="#c9d1d9" font-size="13">so it gets hard to read</text>
  <rect x="484" y="131.8" width="392" height="71.8" rx="10" fill="#d29922" fill-opacity=".07" stroke="#d29922" stroke-opacity=".6"/>
  <circle cx="506" cy="155.8" r="11" fill="#d29922" fill-opacity=".2" stroke="#d29922" stroke-width="1.5"/>
  <text x="506" y="160.3" fill="#e3b341" font-size="13" font-weight="700" text-anchor="middle">2</text>
  <text x="528" y="158.8" fill="#e6edf3" font-size="14" font-weight="600">Same error check at every level</text>
  <text x="528" y="179.8" fill="#e3b341" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">if (err) return done(err)</text>
  <text x="528" y="197.8" fill="#c9d1d9" font-size="13">repeated at each of the 5 levels</text>
  <rect x="484" y="211.6" width="392" height="71.8" rx="10" fill="#f85149" fill-opacity=".07" stroke="#f85149" stroke-opacity=".6"/>
  <circle cx="506" cy="235.6" r="11" fill="#f85149" fill-opacity=".2" stroke="#f85149" stroke-width="1.5"/>
  <text x="506" y="240.1" fill="#ff7b72" font-size="13" font-weight="700" text-anchor="middle">3</text>
  <text x="528" y="238.6" fill="#e6edf3" font-size="14" font-weight="600">try/catch can't catch callback errors</text>
  <text x="528" y="259.6" fill="#c9d1d9" font-size="13">callbacks run later, on a new stack, so a</text>
  <text x="528" y="277.6" fill="#c9d1d9" font-size="13">throw inside one escapes your outer try</text>
  <rect x="484" y="291.4" width="392" height="71.8" rx="10" fill="#d29922" fill-opacity=".07" stroke="#d29922" stroke-opacity=".6"/>
  <circle cx="506" cy="315.4" r="11" fill="#d29922" fill-opacity=".2" stroke="#d29922" stroke-width="1.5"/>
  <text x="506" y="319.9" fill="#e3b341" font-size="13" font-weight="700" text-anchor="middle">4</text>
  <text x="528" y="318.4" fill="#e6edf3" font-size="14" font-weight="600">Inversion of control</text>
  <text x="528" y="339.4" fill="#c9d1d9" font-size="13">you trust each library to call your callback</text>
  <text x="528" y="357.4" fill="#c9d1d9" font-size="13">exactly once: not twice, not never</text>
  <rect x="484" y="371.2" width="392" height="71.8" rx="10" fill="#f85149" fill-opacity=".07" stroke="#f85149" stroke-opacity=".6"/>
  <circle cx="506" cy="395.2" r="11" fill="#f85149" fill-opacity=".2" stroke="#f85149" stroke-width="1.5"/>
  <text x="506" y="399.7" fill="#ff7b72" font-size="13" font-weight="700" text-anchor="middle">5</text>
  <text x="528" y="398.2" fill="#e6edf3" font-size="14" font-weight="600">Hard to change</text>
  <text x="528" y="419.2" fill="#c9d1d9" font-size="13">running steps in parallel or adding a step</text>
  <text x="528" y="437.2" fill="#c9d1d9" font-size="13">means re-nesting everything</text>
  <text x="24" y="473" fill="#c9d1d9" font-size="13"><tspan fill="#e3b341" font-weight="700">Key point: </tspan>Promises were introduced to flatten this and give one place to handle errors.</text>
</svg>
