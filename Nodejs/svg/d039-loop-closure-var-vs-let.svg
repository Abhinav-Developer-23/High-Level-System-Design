<svg xmlns="http://www.w3.org/2000/svg" width="900" height="372" viewBox="0 0 900 372" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Loop closures: var vs let</title>
  <desc>A loop schedules three timer callbacks that log i. With var there is one shared i; the callbacks run after the loop, when i is already 3, so the output is 3 3 3. With let each iteration gets its own i, so each callback sees 0, 1 and 2.</desc>
  <defs>
    <marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="371" rx="14" fill="#161b22" stroke="#30363d"/>

  <!-- var panel -->
  <rect x="24" y="24" width="418" height="268" rx="10" fill="#f85149" fill-opacity=".04" stroke="#f85149" stroke-opacity=".5"/>
  <text x="40" y="50" fill="#ff7b72" font-size="14" font-weight="700">var i · ONE variable for the whole loop</text>
  <g font-size="12.5" text-anchor="middle">
    <rect x="52" y="76" width="110" height="32" rx="7" fill="#1c2128" stroke="#30363d"/><text x="107" y="97" fill="#e6edf3">callback 1</text>
    <rect x="178" y="76" width="110" height="32" rx="7" fill="#1c2128" stroke="#30363d"/><text x="233" y="97" fill="#e6edf3">callback 2</text>
    <rect x="304" y="76" width="110" height="32" rx="7" fill="#1c2128" stroke="#30363d"/><text x="359" y="97" fill="#e6edf3">callback 3</text>
  </g>
  <g stroke="#f85149" stroke-width="1.6">
    <line x1="107" y1="108" x2="214" y2="160" marker-end="url(#aR)"/>
    <line x1="233" y1="108" x2="233" y2="158" marker-end="url(#aR)"/>
    <line x1="359" y1="108" x2="252" y2="160" marker-end="url(#aR)"/>
  </g>
  <rect x="173" y="162" width="120" height="48" rx="10" fill="#d29922" fill-opacity=".16" stroke="#d29922"/>
  <text x="233" y="192" fill="#e3b341" font-size="16" font-weight="700" text-anchor="middle" font-family="Cascadia Code, Consolas, monospace">i = 3</text>
  <text x="233" y="232" fill="#8b949e" font-size="12" text-anchor="middle">loop already finished when they run</text>
  <text x="233" y="270" fill="#ff7b72" font-size="15" font-weight="700" text-anchor="middle">prints  3  3  3</text>

  <!-- let panel -->
  <rect x="458" y="24" width="418" height="268" rx="10" fill="#3fb950" fill-opacity=".04" stroke="#3fb950" stroke-opacity=".5"/>
  <text x="474" y="50" fill="#56d364" font-size="14" font-weight="700">let i · a NEW variable every iteration</text>
  <g font-size="12.5" text-anchor="middle">
    <rect x="486" y="76" width="110" height="32" rx="7" fill="#1c2128" stroke="#30363d"/><text x="541" y="97" fill="#e6edf3">callback 1</text>
    <rect x="612" y="76" width="110" height="32" rx="7" fill="#1c2128" stroke="#30363d"/><text x="667" y="97" fill="#e6edf3">callback 2</text>
    <rect x="738" y="76" width="110" height="32" rx="7" fill="#1c2128" stroke="#30363d"/><text x="793" y="97" fill="#e6edf3">callback 3</text>
  </g>
  <g stroke="#3fb950" stroke-width="1.6">
    <line x1="541" y1="108" x2="541" y2="158" marker-end="url(#aG)"/>
    <line x1="667" y1="108" x2="667" y2="158" marker-end="url(#aG)"/>
    <line x1="793" y1="108" x2="793" y2="158" marker-end="url(#aG)"/>
  </g>
  <g font-size="16" font-weight="700" text-anchor="middle" font-family="Cascadia Code, Consolas, monospace">
    <rect x="491" y="162" width="100" height="48" rx="10" fill="#3fb950" fill-opacity=".14" stroke="#3fb950"/><text x="541" y="192" fill="#56d364">i = 0</text>
    <rect x="617" y="162" width="100" height="48" rx="10" fill="#3fb950" fill-opacity=".14" stroke="#3fb950"/><text x="667" y="192" fill="#56d364">i = 1</text>
    <rect x="743" y="162" width="100" height="48" rx="10" fill="#3fb950" fill-opacity=".14" stroke="#3fb950"/><text x="793" y="192" fill="#56d364">i = 2</text>
  </g>
  <text x="667" y="232" fill="#8b949e" font-size="12" text-anchor="middle">each callback keeps its own copy</text>
  <text x="667" y="270" fill="#56d364" font-size="15" font-weight="700" text-anchor="middle">prints  0  1  2</text>

  <text x="24" y="322" fill="#c9d1d9" font-size="13">The callbacks run <tspan font-weight="700" fill="#e6edf3">after</tspan> the loop (the event loop runs timers only once the stack is empty).</text>
  <text x="24" y="352" fill="#c9d1d9" font-size="13"><tspan fill="#e3b341" font-weight="700">Key point: </tspan>a closure remembers the variable, not its value at that moment. let gives each iteration its own variable.</text>
</svg>
