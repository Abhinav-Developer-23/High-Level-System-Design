<svg xmlns="http://www.w3.org/2000/svg" width="900" height="424" viewBox="0 0 900 424" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>worker_threads vs cluster vs child_process</title>
  <desc>worker_threads: threads inside one process, own heap each, SharedArrayBuffer allowed, talk with postMessage, for CPU-heavy JS. cluster: copies of your server as separate processes sharing a port, nothing shared, IPC, to use all cores for a server. child_process: runs another program, talks over stdin/stdout or IPC, for ffmpeg, python, git.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="423" rx="14" fill="#161b22" stroke="#30363d"/>

  <!-- ===== col 1: worker_threads ===== -->
  <rect x="24" y="24" width="272" height="352" rx="10" fill="#bc8cff" fill-opacity=".06" stroke="#bc8cff" stroke-opacity=".7"/>
  <text x="40" y="50" fill="#d2a8ff" font-size="15" font-weight="700" font-family="Cascadia Code, Consolas, monospace">worker_threads</text>
  <text x="40" y="70" fill="#c9d1d9" font-size="12.5">threads inside <tspan font-weight="700" fill="#e6edf3">one</tspan> process</text>
  <rect x="40" y="84" width="240" height="112" rx="8" fill="none" stroke="#484f58" stroke-dasharray="5 4"/>
  <text x="50" y="100" fill="#8b949e" font-size="11.5">1 process</text>
  <rect x="52" y="108" width="216" height="22" rx="5" fill="#58a6ff" fill-opacity=".16" stroke="#58a6ff" stroke-opacity=".7"/>
  <text x="62" y="123" fill="#79c0ff" font-size="12">main thread</text>
  <rect x="52" y="136" width="216" height="22" rx="5" fill="#bc8cff" fill-opacity=".16" stroke="#bc8cff" stroke-opacity=".7"/>
  <text x="62" y="151" fill="#d2a8ff" font-size="12">worker 1</text>
  <rect x="52" y="164" width="216" height="22" rx="5" fill="#bc8cff" fill-opacity=".16" stroke="#bc8cff" stroke-opacity=".7"/>
  <text x="62" y="179" fill="#d2a8ff" font-size="12">worker 2</text>

  <g font-size="11.5" fill="#8b949e" font-weight="700" letter-spacing="1">
    <text x="40" y="220">MEMORY</text><text x="40" y="260">START COST</text><text x="40" y="300">TALK VIA</text><text x="40" y="340">USE FOR</text>
  </g>
  <g font-size="12.5" fill="#c9d1d9">
    <text x="40" y="238">own heap each · can share bytes</text>
    <text x="40" y="278">medium: a new V8 isolate</text>
    <text x="40" y="318" font-family="Cascadia Code, Consolas, monospace" font-size="12" fill="#79c0ff">postMessage()</text>
    <text x="40" y="358" fill="#56d364" font-weight="600">CPU-heavy JS in one app</text>
  </g>

  <!-- ===== col 2: cluster ===== -->
  <rect x="314" y="24" width="272" height="352" rx="10" fill="#58a6ff" fill-opacity=".06" stroke="#58a6ff" stroke-opacity=".7"/>
  <text x="330" y="50" fill="#79c0ff" font-size="15" font-weight="700" font-family="Cascadia Code, Consolas, monospace">cluster</text>
  <text x="330" y="70" fill="#c9d1d9" font-size="12.5">copies of your server as <tspan font-weight="700" fill="#e6edf3">processes</tspan></text>
  <rect x="370" y="86" width="160" height="26" rx="6" fill="#1c2128" stroke="#58a6ff" stroke-opacity=".8"/>
  <text x="450" y="104" fill="#e6edf3" font-size="12" text-anchor="middle">primary · port <tspan font-family="Cascadia Code, Consolas, monospace" fill="#79c0ff">3000</tspan></text>
  <g stroke="#8b949e" stroke-width="1.3">
    <line x1="450" y1="112" x2="366" y2="138" marker-end="url(#arr)"/>
    <line x1="450" y1="112" x2="440" y2="138" marker-end="url(#arr)"/>
    <line x1="450" y1="112" x2="514" y2="138" marker-end="url(#arr)"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#79c0ff" font-family="Cascadia Code, Consolas, monospace">
    <rect x="330" y="140" width="72" height="30" rx="6" fill="#58a6ff" fill-opacity=".14" stroke="#58a6ff" stroke-opacity=".7"/><text x="366" y="159">node #1</text>
    <rect x="404" y="140" width="72" height="30" rx="6" fill="#58a6ff" fill-opacity=".14" stroke="#58a6ff" stroke-opacity=".7"/><text x="440" y="159">node #2</text>
    <rect x="478" y="140" width="72" height="30" rx="6" fill="#58a6ff" fill-opacity=".14" stroke="#58a6ff" stroke-opacity=".7"/><text x="514" y="159">node #3</text>
  </g>
  <text x="450" y="190" fill="#8b949e" font-size="11.5" text-anchor="middle">each one a full Node process</text>

  <g font-size="11.5" fill="#8b949e" font-weight="700" letter-spacing="1">
    <text x="330" y="220">MEMORY</text><text x="330" y="260">START COST</text><text x="330" y="300">TALK VIA</text><text x="330" y="340">USE FOR</text>
  </g>
  <g font-size="12.5" fill="#c9d1d9">
    <text x="330" y="238">fully separate, nothing shared</text>
    <text x="330" y="278">high: a whole process</text>
    <text x="330" y="318">IPC: <tspan font-family="Cascadia Code, Consolas, monospace" font-size="12" fill="#79c0ff">process.send()</tspan></text>
    <text x="330" y="358" fill="#56d364" font-weight="600">use all cores for a server</text>
  </g>

  <!-- ===== col 3: child_process ===== -->
  <rect x="604" y="24" width="272" height="352" rx="10" fill="#39c5cf" fill-opacity=".06" stroke="#39c5cf" stroke-opacity=".7"/>
  <text x="620" y="50" fill="#56d4dd" font-size="15" font-weight="700" font-family="Cascadia Code, Consolas, monospace">child_process</text>
  <text x="620" y="70" fill="#c9d1d9" font-size="12.5">runs <tspan font-weight="700" fill="#e6edf3">another program</tspan></text>
  <rect x="620" y="114" width="104" height="36" rx="6" fill="#1c2128" stroke="#39c5cf" stroke-opacity=".8"/>
  <text x="672" y="137" fill="#e6edf3" font-size="12" text-anchor="middle" font-family="Cascadia Code, Consolas, monospace">node app.js</text>
  <g stroke="#8b949e" stroke-width="1.3">
    <line x1="724" y1="132" x2="774" y2="101" marker-end="url(#arr)"/>
    <line x1="724" y1="132" x2="774" y2="132" marker-end="url(#arr)"/>
    <line x1="724" y1="132" x2="774" y2="163" marker-end="url(#arr)"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#56d4dd" font-family="Cascadia Code, Consolas, monospace">
    <rect x="776" y="88" width="84" height="26" rx="6" fill="#39c5cf" fill-opacity=".12" stroke="#39c5cf" stroke-opacity=".6"/><text x="818" y="106">ffmpeg</text>
    <rect x="776" y="119" width="84" height="26" rx="6" fill="#39c5cf" fill-opacity=".12" stroke="#39c5cf" stroke-opacity=".6"/><text x="818" y="137">python</text>
    <rect x="776" y="150" width="84" height="26" rx="6" fill="#39c5cf" fill-opacity=".12" stroke="#39c5cf" stroke-opacity=".6"/><text x="818" y="168">git</text>
  </g>
  <text x="740" y="190" fill="#8b949e" font-size="11.5" text-anchor="middle">spawn · exec · fork</text>

  <g font-size="11.5" fill="#8b949e" font-weight="700" letter-spacing="1">
    <text x="620" y="220">MEMORY</text><text x="620" y="260">START COST</text><text x="620" y="300">TALK VIA</text><text x="620" y="340">USE FOR</text>
  </g>
  <g font-size="12.5" fill="#c9d1d9">
    <text x="620" y="238">a separate program</text>
    <text x="620" y="278">high: a whole process</text>
    <text x="620" y="318">stdin / stdout, or IPC with fork()</text>
    <text x="620" y="358" fill="#56d364" font-weight="600">run ffmpeg, python, git…</text>
  </g>

  <text x="24" y="406" fill="#c9d1d9" font-size="13"><tspan fill="#e3b341" font-weight="700">Rule of thumb: </tspan>CPU work inside your app → worker_threads. More cores for a server → cluster (or more containers).</text>
</svg>
