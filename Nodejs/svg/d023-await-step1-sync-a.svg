  <text x="64" y="316" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace"><tspan fill="#e6edf3">Promise</tspan><tspan fill="#e6edf3">.</tspan><tspan fill="#d2a8ff">resolve</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#e6edf3">)</tspan><tspan fill="#e6edf3">.</tspan><tspan fill="#d2a8ff">then</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#e6edf3">)</tspan><tspan fill="#e6edf3">&#160;</tspan><tspan fill="#ff7b72">=></tspan><tspan fill="#e6edf3">&#160;</tspan><tspan fill="#e6edf3">console</tspan><tspan fill="#e6edf3">.</tspan><tspan fill="#d2a8ff">log</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#a5d6ff">'E'</tspan><tspan fill="#e6edf3">)</tspan><tspan fill="#e6edf3">)</tspan></text>
