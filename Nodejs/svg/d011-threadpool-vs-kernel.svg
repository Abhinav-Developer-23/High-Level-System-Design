<svg xmlns="http://www.w3.org/2000/svg" width="900" height="472" viewBox="0 0 900 472" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Where async work actually runs</title>
  <desc>The event loop hands slow work off. File system, dns.lookup, crypto and zlib go to the libuv thread pool (4 threads by default, extra tasks wait). Network sockets go to the OS kernel (epoll, kqueue, IOCP), which watches many sockets without extra threads. Finished work comes back as a callback in the poll phase.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="471" rx="14" fill="#161b22" stroke="#30363d"/>

  <!-- event loop -->
  <rect x="320" y="24" width="260" height="76" rx="10" fill="#58a6ff" fill-opacity=".12" stroke="#58a6ff" stroke-opacity=".8"/>
  <text x="450" y="54" fill="#79c0ff" font-size="15" font-weight="600" text-anchor="middle">Event loop · main thread</text>
  <text x="450" y="76" fill="#c9d1d9" font-size="12.5" text-anchor="middle">runs your JS callbacks only,</text>
  <text x="450" y="92" fill="#c9d1d9" font-size="12.5" text-anchor="middle">never waits on slow I/O itself</text>

  <!-- arrows left -->
  <line x1="330" y1="100" x2="196" y2="146" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="236" y1="146" x2="352" y2="104" stroke="#3fb950" stroke-width="1.8" marker-end="url(#arrG)"/>
  <text x="196" y="116" fill="#8b949e" font-size="12" text-anchor="end">hand off</text>
  <text x="300" y="140" fill="#56d364" font-size="12">done → callback</text>
  <!-- arrows right -->
  <line x1="570" y1="100" x2="704" y2="146" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="664" y1="146" x2="548" y2="104" stroke="#3fb950" stroke-width="1.8" marker-end="url(#arrG)"/>
  <text x="704" y="116" fill="#8b949e" font-size="12">hand off</text>
  <text x="600" y="140" fill="#56d364" font-size="12" text-anchor="end">ready → callback</text>

  <!-- thread pool -->
  <rect x="24" y="150" width="368" height="266" rx="10" fill="#39c5cf" fill-opacity=".06" stroke="#39c5cf" stroke-opacity=".6"/>
  <text x="40" y="176" fill="#56d4dd" font-size="15" font-weight="600">libuv thread pool</text>
  <text x="40" y="196" fill="#8b949e" font-size="12">4 threads by default · set UV_THREADPOOL_SIZE</text>
  <text x="40" y="218" fill="#79c0ff" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">fs.* · dns.lookup · crypto · zlib</text>

  <g font-size="12.5">
    <rect x="40" y="232" width="336" height="28" rx="6" fill="#1c2128" stroke="#30363d"/>
    <text x="52" y="251" fill="#8b949e">Thread 1</text><text x="122" y="251" fill="#e6edf3" font-family="Cascadia Code, Consolas, monospace" font-size="12">fs.readFile('big.log')</text>
    <rect x="40" y="266" width="336" height="28" rx="6" fill="#1c2128" stroke="#30363d"/>
    <text x="52" y="285" fill="#8b949e">Thread 2</text><text x="122" y="285" fill="#e6edf3" font-family="Cascadia Code, Consolas, monospace" font-size="12">crypto.pbkdf2(...)</text>
    <rect x="40" y="300" width="336" height="28" rx="6" fill="#1c2128" stroke="#30363d"/>
    <text x="52" y="319" fill="#8b949e">Thread 3</text><text x="122" y="319" fill="#e6edf3" font-family="Cascadia Code, Consolas, monospace" font-size="12">zlib.gzip(buf)</text>
    <rect x="40" y="334" width="336" height="28" rx="6" fill="#1c2128" stroke="#30363d"/>
    <text x="52" y="353" fill="#8b949e">Thread 4</text><text x="122" y="353" fill="#e6edf3" font-family="Cascadia Code, Consolas, monospace" font-size="12">dns.lookup('a.com')</text>
  </g>
  <g font-size="11" font-weight="700" fill="#e3b341" text-anchor="middle" letter-spacing=".6">
    <rect x="322" y="238" width="46" height="16" rx="8" fill="#d29922" fill-opacity=".18"/><text x="345" y="250">BUSY</text>
    <rect x="322" y="272" width="46" height="16" rx="8" fill="#d29922" fill-opacity=".18"/><text x="345" y="284">BUSY</text>
    <rect x="322" y="306" width="46" height="16" rx="8" fill="#d29922" fill-opacity=".18"/><text x="345" y="318">BUSY</text>
    <rect x="322" y="340" width="46" height="16" rx="8" fill="#d29922" fill-opacity=".18"/><text x="345" y="352">BUSY</text>
  </g>
  <rect x="40" y="372" width="336" height="30" rx="6" fill="none" stroke="#d29922" stroke-dasharray="5 4"/>
  <text x="52" y="392" fill="#e3b341" font-size="12.5">⚠ 5th task (<tspan font-family="Cascadia Code, Consolas, monospace" font-size="12">fs.stat</tspan>) waits for a free thread</text>

  <!-- kernel -->
  <rect x="508" y="150" width="368" height="266" rx="10" fill="#3fb950" fill-opacity=".05" stroke="#3fb950" stroke-opacity=".55"/>
  <text x="524" y="176" fill="#56d364" font-size="15" font-weight="600">OS kernel async I/O</text>
  <text x="524" y="196" fill="#8b949e" font-size="12">epoll (Linux) · kqueue (macOS) · IOCP (Windows)</text>
  <text x="524" y="218" fill="#79c0ff" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">net · http · https · dgram · pipes</text>

  <rect x="524" y="232" width="336" height="130" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="540" y="254" fill="#c9d1d9" font-size="12.5">kernel watches every open socket</text>
  <g fill="#30363d">
    <circle cx="548" cy="278" r="7"/><circle cx="572" cy="278" r="7"/><circle cx="596" cy="278" r="7"/><circle cx="620" cy="278" r="7"/><circle cx="644" cy="278" r="7"/><circle cx="668" cy="278" r="7"/><circle cx="692" cy="278" r="7"/><circle cx="716" cy="278" r="7"/><circle cx="740" cy="278" r="7"/><circle cx="764" cy="278" r="7"/><circle cx="788" cy="278" r="7"/><circle cx="812" cy="278" r="7"/><circle cx="836" cy="278" r="7"/>
    <circle cx="548" cy="302" r="7"/><circle cx="572" cy="302" r="7"/><circle cx="596" cy="302" r="7"/><circle cx="620" cy="302" r="7"/><circle cx="644" cy="302" r="7"/><circle cx="668" cy="302" r="7"/><circle cx="692" cy="302" r="7"/><circle cx="716" cy="302" r="7"/><circle cx="740" cy="302" r="7"/><circle cx="764" cy="302" r="7"/><circle cx="788" cy="302" r="7"/><circle cx="812" cy="302" r="7"/><circle cx="836" cy="302" r="7"/>
  </g>
  <g fill="#3fb950">
    <circle cx="596" cy="278" r="7"/><circle cx="740" cy="278" r="7"/><circle cx="668" cy="302" r="7"/><circle cx="812" cy="302" r="7"/>
  </g>
  <circle cx="548" cy="333" r="5" fill="#3fb950"/>
  <text x="560" y="337" fill="#56d364" font-size="12">= data ready</text>
  <text x="660" y="337" fill="#8b949e" font-size="12">10,000s of sockets, 0 extra threads</text>

  <rect x="524" y="372" width="336" height="30" rx="6" fill="#3fb950" fill-opacity=".10" stroke="#3fb950" stroke-opacity=".6"/>
  <text x="536" y="392" fill="#56d364" font-size="12.5">✓ no thread limit. Ready sockets show up in poll</text>

  <text x="24" y="450" fill="#c9d1d9" font-size="13"><tspan fill="#e3b341" font-weight="700">"Is Node single-threaded?" </tspan>Your JS is. Node itself is not: libuv adds a thread pool, and the kernel does network I/O.</text>
</svg>
