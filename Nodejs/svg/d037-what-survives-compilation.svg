<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>What survives compilation</title>
  <desc>When tsc compiles TypeScript, type annotations, interfaces, type aliases, generics, the private/public/readonly keywords, as-casts and type-only imports are erased. Classes, functions, values, #private fields, enums and decorators stay as real JavaScript. So there is no type checking at runtime: validate outside data yourself.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="399" rx="14" fill="#161b22" stroke="#30363d"/>

  <!-- erased -->
  <rect x="24" y="24" width="410" height="250" rx="10" fill="#f85149" fill-opacity=".05" stroke="#f85149" stroke-opacity=".55" stroke-dasharray="6 4"/>
  <text x="40" y="52" fill="#ff7b72" font-size="15" font-weight="700">Erased by tsc</text>
  <text x="40" y="72" fill="#8b949e" font-size="12">compile-time only, gone from the .js</text>
  <g font-size="13" fill="#c9d1d9">
    <text x="40" y="104">✗ type annotations on variables and params</text>
    <text x="40" y="130">✗ interfaces</text>
    <text x="40" y="156">✗ type aliases (the type keyword)</text>
    <text x="40" y="182">✗ generics like the T in Array of T</text>
    <text x="40" y="208">✗ private / public / protected / readonly</text>
    <text x="40" y="234">✗ "as" casts and type-only imports</text>
  </g>

  <!-- kept -->
  <rect x="466" y="24" width="410" height="250" rx="10" fill="#3fb950" fill-opacity=".05" stroke="#3fb950" stroke-opacity=".55"/>
  <text x="482" y="52" fill="#56d364" font-size="15" font-weight="700">Kept as real JavaScript</text>
  <text x="482" y="72" fill="#8b949e" font-size="12">exists at runtime</text>
  <g font-size="13" fill="#c9d1d9">
    <text x="482" y="104">✓ classes, functions, objects, values</text>
    <text x="482" y="130">✓ #private fields (real JS privacy)</text>
    <text x="482" y="156">✓ enums (become plain objects)</text>
    <text x="482" y="182">✓ decorators (become function calls)</text>
    <text x="482" y="208">✓ all your logic, unchanged</text>
  </g>

  <!-- consequence -->
  <rect x="24" y="290" width="852" height="66" rx="10" fill="#d29922" fill-opacity=".08" stroke="#d29922" stroke-opacity=".7"/>
  <text x="40" y="316" fill="#e3b341" font-size="14" font-weight="600">⚠ So TypeScript can't check data that arrives at runtime</text>
  <text x="40" y="340" fill="#c9d1d9" font-size="13">A request body, a JSON file or an API response can be anything. Validate it (e.g. with zod) before trusting its type.</text>

  <text x="24" y="384" fill="#c9d1d9" font-size="13"><tspan fill="#e3b341" font-weight="700">Key point: </tspan>types are a compile-time safety net. They never slow down or change what your program does at runtime.</text>
</svg>
