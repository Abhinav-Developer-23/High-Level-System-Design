<svg xmlns="http://www.w3.org/2000/svg" width="900" height="716" viewBox="0 0 900 716" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>await one by one vs Promise.all</title>
  <desc>Top: three independent calls awaited one after another (300 ms, 500 ms, 400 ms) take about 1200 ms in total. Bottom: the same three calls started together and awaited with Promise.all finish in about 500 ms, the time of the slowest call.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="715" rx="14" fill="#161b22" stroke="#30363d"/>

  <!-- ===== panel A: sequential ===== -->
  <rect x="24" y="20" width="852" height="286" rx="10" fill="#f85149" fill-opacity=".04" stroke="#f85149" stroke-opacity=".5"/>
  <text x="40" y="44" fill="#ff7b72" font-size="14" font-weight="700">✗ Sequential: each await waits for the previous</text>

  <rect x="36" y="56" width="828" height="80" rx="8" fill="#0d1117" stroke="#30363d"/>
  <g font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="12">
    <text x="52" y="80"><tspan fill="#ff7b72">const</tspan><tspan fill="#e6edf3">&#160;user&#160;&#160;&#160;=&#160;</tspan><tspan fill="#ff7b72">await</tspan><tspan fill="#e6edf3">&#160;</tspan><tspan fill="#d2a8ff">getUser</tspan><tspan fill="#e6edf3">()&#160;&#160;&#160;&#160;&#160;</tspan><tspan fill="#8b949e">//&#160;300&#160;ms</tspan></text>
    <text x="52" y="102"><tspan fill="#ff7b72">const</tspan><tspan fill="#e6edf3">&#160;orders&#160;=&#160;</tspan><tspan fill="#ff7b72">await</tspan><tspan fill="#e6edf3">&#160;</tspan><tspan fill="#d2a8ff">getOrders</tspan><tspan fill="#e6edf3">()&#160;&#160;&#160;</tspan><tspan fill="#8b949e">//&#160;500&#160;ms</tspan></text>
    <text x="52" y="124"><tspan fill="#ff7b72">const</tspan><tspan fill="#e6edf3">&#160;recs&#160;&#160;&#160;=&#160;</tspan><tspan fill="#ff7b72">await</tspan><tspan fill="#e6edf3">&#160;</tspan><tspan fill="#d2a8ff">getRecs</tspan><tspan fill="#e6edf3">()&#160;&#160;&#160;&#160;&#160;</tspan><tspan fill="#8b949e">//&#160;400&#160;ms</tspan></text>
  </g>

  <rect x="36" y="146" width="828" height="38" rx="8" fill="#1c2128" stroke="#30363d"/>
  <rect x="36" y="190" width="828" height="38" rx="8" fill="#1c2128" stroke="#30363d"/>
  <rect x="36" y="234" width="828" height="38" rx="8" fill="#1c2128" stroke="#30363d"/>

  <!-- ===== panel B: parallel ===== -->
  <rect x="24" y="318" width="852" height="286" rx="10" fill="#3fb950" fill-opacity=".04" stroke="#3fb950" stroke-opacity=".5"/>
  <text x="40" y="342" fill="#56d364" font-size="14" font-weight="700">✓ Parallel: start all, then await together</text>

  <rect x="36" y="354" width="828" height="80" rx="8" fill="#0d1117" stroke="#30363d"/>
  <g font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="12">
    <text x="52" y="378"><tspan fill="#ff7b72">const</tspan><tspan fill="#e6edf3">&#160;[user,&#160;orders,&#160;recs]&#160;=&#160;</tspan><tspan fill="#ff7b72">await</tspan><tspan fill="#e6edf3">&#160;Promise.</tspan><tspan fill="#d2a8ff">all</tspan><tspan fill="#e6edf3">([</tspan></text>
    <text x="52" y="400"><tspan fill="#e6edf3">&#160;&#160;</tspan><tspan fill="#d2a8ff">getUser</tspan><tspan fill="#e6edf3">(),&#160;</tspan><tspan fill="#d2a8ff">getOrders</tspan><tspan fill="#e6edf3">(),&#160;</tspan><tspan fill="#d2a8ff">getRecs</tspan><tspan fill="#e6edf3">()</tspan></text>
    <text x="52" y="422"><tspan fill="#e6edf3">])</tspan></text>
  </g>

  <rect x="36" y="444" width="828" height="38" rx="8" fill="#1c2128" stroke="#30363d"/>
  <rect x="36" y="488" width="828" height="38" rx="8" fill="#1c2128" stroke="#30363d"/>
  <rect x="36" y="532" width="828" height="38" rx="8" fill="#1c2128" stroke="#30363d"/>

  <!-- guides at 500 ms and 1200 ms -->
  <g stroke="#8b949e" stroke-opacity=".35" stroke-dasharray="3 4">
    <line x1="459" y1="146" x2="459" y2="620"/>
    <line x1="844" y1="146" x2="844" y2="620"/>
  </g>

  <!-- panel A lanes -->
  <g font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="12.5" fill="#e6edf3">
    <text x="50" y="170">getUser()</text>
    <text x="50" y="214">getOrders()</text>
    <text x="50" y="258">getRecs()</text>
  </g>
  <rect x="184" y="153" width="165" height="24" rx="6" fill="#58a6ff" fill-opacity=".16" stroke="#58a6ff" stroke-opacity=".85"/>
  <text x="266" y="170" fill="#79c0ff" font-size="12.5" font-weight="600" text-anchor="middle">300 ms</text>

  <rect x="184" y="197" width="159" height="24" rx="6" fill="none" stroke="#484f58" stroke-dasharray="5 4"/>
  <text x="263" y="214" fill="#8b949e" font-size="12" text-anchor="middle">not started yet</text>
  <rect x="349" y="197" width="275" height="24" rx="6" fill="#58a6ff" fill-opacity=".16" stroke="#58a6ff" stroke-opacity=".85"/>
  <text x="486" y="214" fill="#79c0ff" font-size="12.5" font-weight="600" text-anchor="middle">500 ms</text>

  <rect x="184" y="241" width="434" height="24" rx="6" fill="none" stroke="#484f58" stroke-dasharray="5 4"/>
  <text x="401" y="258" fill="#8b949e" font-size="12" text-anchor="middle">not started yet: waiting for the two calls above</text>
  <rect x="624" y="241" width="220" height="24" rx="6" fill="#58a6ff" fill-opacity=".16" stroke="#58a6ff" stroke-opacity=".85"/>
  <text x="734" y="258" fill="#79c0ff" font-size="12.5" font-weight="600" text-anchor="middle">400 ms</text>

  <!-- panel A total -->
  <text x="50" y="292" fill="#e6edf3" font-size="13" font-weight="600">Total</text>
  <line x1="186" y1="288" x2="842" y2="288" stroke="#f85149" stroke-width="1.6" marker-start="url(#arrR)" marker-end="url(#arrR)"/>
  <rect x="452" y="278" width="124" height="20" fill="#191b20"/>
  <text x="514" y="293" fill="#ff7b72" font-size="13" font-weight="700" text-anchor="middle">≈ 1200 ms</text>

  <!-- panel B lanes -->
  <g font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="12.5" fill="#e6edf3">
    <text x="50" y="468">getUser()</text>
    <text x="50" y="512">getOrders()</text>
    <text x="50" y="556">getRecs()</text>
  </g>
  <rect x="184" y="451" width="165" height="24" rx="6" fill="#58a6ff" fill-opacity=".16" stroke="#58a6ff" stroke-opacity=".85"/>
  <text x="266" y="468" fill="#79c0ff" font-size="12.5" font-weight="600" text-anchor="middle">300 ms</text>
  <rect x="184" y="495" width="275" height="24" rx="6" fill="#58a6ff" fill-opacity=".16" stroke="#58a6ff" stroke-opacity=".85"/>
  <text x="321" y="512" fill="#79c0ff" font-size="12.5" font-weight="600" text-anchor="middle">500 ms</text>
  <rect x="184" y="539" width="220" height="24" rx="6" fill="#58a6ff" fill-opacity=".16" stroke="#58a6ff" stroke-opacity=".85"/>
  <text x="294" y="556" fill="#79c0ff" font-size="12.5" font-weight="600" text-anchor="middle">400 ms</text>

  <!-- panel B total -->
  <text x="50" y="590" fill="#e6edf3" font-size="13" font-weight="600">Total</text>
  <line x1="186" y1="586" x2="457" y2="586" stroke="#3fb950" stroke-width="1.6" marker-start="url(#arrG)" marker-end="url(#arrG)"/>
  <text x="472" y="591" fill="#56d364" font-size="13" font-weight="700">≈ 500 ms <tspan font-weight="400" fill="#c9d1d9">(the slowest one)</tspan></text>

  <!-- axis -->
  <line x1="184" y1="626" x2="868" y2="626" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <g stroke="#8b949e" stroke-width="1.5">
    <line x1="184" y1="621" x2="184" y2="631"/>
    <line x1="349" y1="621" x2="349" y2="631"/>
    <line x1="459" y1="621" x2="459" y2="631"/>
    <line x1="624" y1="621" x2="624" y2="631"/>
    <line x1="844" y1="621" x2="844" y2="631"/>
  </g>
  <g fill="#8b949e" font-size="12" text-anchor="middle">
    <text x="184" y="648">0 ms</text>
    <text x="349" y="648">300</text>
    <text x="459" y="648">500</text>
    <text x="624" y="648">800</text>
    <text x="844" y="648">1200 ms</text>
  </g>

  <text x="24" y="680" fill="#c9d1d9" font-size="13"><tspan fill="#e3b341" font-weight="700">Rule: </tspan>if the calls don't depend on each other, start them together.</text>
  <text x="24" y="700" fill="#c9d1d9" font-size="13">Use sequential <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" fill="#ff7b72">await</tspan> only when step 2 needs step 1's result.</text>
</svg>
