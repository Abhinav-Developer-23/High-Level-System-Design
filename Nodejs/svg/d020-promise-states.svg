<svg xmlns="http://www.w3.org/2000/svg" width="900" height="524" viewBox="0 0 900 524" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Promise states</title>
  <desc>A promise starts pending. resolve(value) moves it to fulfilled, reject(error) to rejected. Fulfilled and rejected are settled states that never change again. .then handles fulfilled, .catch handles rejected, .finally runs for both, and handlers always run later as microtasks.</desc>
  <defs>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
    <marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker>
    <marker id="aD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="523" rx="14" fill="#161b22" stroke="#30363d"/>

  <!-- settled group -->
  <rect x="344" y="26" width="232" height="226" rx="12" fill="none" stroke="#484f58" stroke-dasharray="6 5"/>
  <rect x="368" y="240" width="184" height="24" rx="12" fill="#161b22" stroke="#484f58"/>
  <text x="460" y="256" fill="#c9d1d9" font-size="12" font-weight="700" letter-spacing="1" text-anchor="middle" data-nocheck="1">SETTLED · FINAL</text>

  <!-- pending -->
  <rect x="40" y="108" width="200" height="64" rx="10" fill="#d29922" fill-opacity=".14" stroke="#d29922" stroke-opacity=".85"/>
  <text x="140" y="135" fill="#e3b341" font-size="16" font-weight="700" text-anchor="middle">pending</text>
  <text x="140" y="157" fill="#c9d1d9" font-size="12.5" text-anchor="middle">waiting, no value yet</text>
  <text x="140" y="96" fill="#8b949e" font-size="12" text-anchor="middle">every promise starts here</text>

  <!-- fulfilled / rejected -->
  <rect x="360" y="42" width="200" height="64" rx="10" fill="#3fb950" fill-opacity=".14" stroke="#3fb950" stroke-opacity=".85"/>
  <text x="460" y="69" fill="#56d364" font-size="16" font-weight="700" text-anchor="middle">✓ fulfilled</text>
  <text x="460" y="91" fill="#c9d1d9" font-size="12.5" text-anchor="middle">has a value</text>
  <rect x="360" y="170" width="200" height="64" rx="10" fill="#f85149" fill-opacity=".14" stroke="#f85149" stroke-opacity=".85"/>
  <text x="460" y="197" fill="#ff7b72" font-size="16" font-weight="700" text-anchor="middle">✗ rejected</text>
  <text x="460" y="219" fill="#c9d1d9" font-size="12.5" text-anchor="middle">has a reason (an error)</text>

  <line x1="240" y1="128" x2="356" y2="78" stroke="#3fb950" stroke-width="2" marker-end="url(#aG)"/>
  <line x1="240" y1="152" x2="356" y2="202" stroke="#f85149" stroke-width="2" marker-end="url(#aR)"/>
  <text x="286" y="88" fill="#56d364" font-size="12" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">resolve(value)</text>
  <text x="286" y="202" fill="#ff7b72" font-size="12" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">reject(error)</text>

  <!-- handlers -->
  <text x="736" y="36" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">HANDLERS</text>
  <rect x="640" y="58" width="192" height="30" rx="7" fill="#3fb950" fill-opacity=".12" stroke="#3fb950" stroke-opacity=".7"/>
  <text x="736" y="78" fill="#56d364" font-size="12" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">.then(onFulfilled)</text>
  <rect x="640" y="125" width="192" height="30" rx="7" fill="#21262d" stroke="#8b949e" stroke-opacity=".7"/>
  <text x="736" y="145" fill="#e6edf3" font-size="12" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">.finally(fn)</text>
  <rect x="640" y="190" width="192" height="30" rx="7" fill="#f85149" fill-opacity=".12" stroke="#f85149" stroke-opacity=".7"/>
  <text x="736" y="210" fill="#ff7b72" font-size="12" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">.catch(onRejected)</text>
  <line x1="560" y1="73" x2="636" y2="73" stroke="#3fb950" stroke-width="1.6" marker-end="url(#aG)"/>
  <line x1="560" y1="202" x2="636" y2="205" stroke="#f85149" stroke-width="1.6" marker-end="url(#aR)"/>
  <line x1="560" y1="90" x2="636" y2="134" stroke="#8b949e" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#aD)"/>
  <line x1="560" y1="186" x2="636" y2="146" stroke="#8b949e" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#aD)"/>
  <text x="736" y="242" fill="#d2a8ff" font-size="12" text-anchor="middle">handlers always run later, as microtasks,</text>
  <text x="736" y="259" fill="#d2a8ff" font-size="12" text-anchor="middle">even if the promise already settled</text>

  <!-- code -->
  <line x1="24" y1="278" x2="876" y2="278" stroke="#21262d"/>
  <rect x="24" y="292" width="500" height="178" rx="10" fill="#0d1117" stroke="#30363d"/>
  <text x="40" y="318" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace"><tspan fill="#ff7b72">const</tspan><tspan fill="#e6edf3">&#160;</tspan><tspan fill="#e6edf3">p</tspan><tspan fill="#e6edf3">&#160;</tspan><tspan fill="#e6edf3">=</tspan><tspan fill="#e6edf3">&#160;</tspan><tspan fill="#ff7b72">new</tspan><tspan fill="#e6edf3">&#160;</tspan><tspan fill="#d2a8ff">Promise</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#e6edf3">resolve</tspan><tspan fill="#e6edf3">,</tspan><tspan fill="#e6edf3">&#160;</tspan><tspan fill="#e6edf3">reject</tspan><tspan fill="#e6edf3">)</tspan><tspan fill="#e6edf3">&#160;</tspan><tspan fill="#ff7b72">=></tspan><tspan fill="#e6edf3">&#160;</tspan><tspan fill="#e6edf3">{</tspan></text>
  <text x="40" y="338" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace"><tspan fill="#e6edf3">&#160;&#160;</tspan><tspan fill="#e6edf3">fs</tspan><tspan fill="#e6edf3">.</tspan><tspan fill="#d2a8ff">readFile</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#a5d6ff">'a.txt'</tspan><tspan fill="#e6edf3">,</tspan><tspan fill="#e6edf3">&#160;</tspan><tspan fill="#a5d6ff">'utf8'</tspan><tspan fill="#e6edf3">,</tspan><tspan fill="#e6edf3">&#160;</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#e6edf3">err</tspan><tspan fill="#e6edf3">,</tspan><tspan fill="#e6edf3">&#160;</tspan><tspan fill="#e6edf3">data</tspan><tspan fill="#e6edf3">)</tspan><tspan fill="#e6edf3">&#160;</tspan><tspan fill="#ff7b72">=></tspan><tspan fill="#e6edf3">&#160;</tspan><tspan fill="#e6edf3">{</tspan></text>
  <text x="40" y="358" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace"><tspan fill="#e6edf3">&#160;&#160;&#160;&#160;</tspan><tspan fill="#ff7b72">if</tspan><tspan fill="#e6edf3">&#160;</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#e6edf3">err</tspan><tspan fill="#e6edf3">)</tspan><tspan fill="#e6edf3">&#160;</tspan><tspan fill="#d2a8ff">reject</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#e6edf3">err</tspan><tspan fill="#e6edf3">)</tspan><tspan fill="#e6edf3">&#160;&#160;&#160;&#160;&#160;&#160;</tspan><tspan fill="#8b949e">//&#160;→&#160;rejected</tspan></text>
  <text x="40" y="378" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace"><tspan fill="#e6edf3">&#160;&#160;&#160;&#160;</tspan><tspan fill="#ff7b72">else</tspan><tspan fill="#e6edf3">&#160;</tspan><tspan fill="#d2a8ff">resolve</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#e6edf3">data</tspan><tspan fill="#e6edf3">)</tspan><tspan fill="#e6edf3">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</tspan><tspan fill="#8b949e">//&#160;→&#160;fulfilled</tspan></text>
  <text x="40" y="398" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace"><tspan fill="#e6edf3">&#160;&#160;</tspan><tspan fill="#e6edf3">}</tspan><tspan fill="#e6edf3">)</tspan></text>
  <text x="40" y="418" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace"><tspan fill="#e6edf3">}</tspan><tspan fill="#e6edf3">)</tspan></text>
  <text x="40" y="438" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace"><tspan fill="#e6edf3">p</tspan><tspan fill="#e6edf3">.</tspan><tspan fill="#d2a8ff">then</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#e6edf3">data</tspan><tspan fill="#e6edf3">&#160;</tspan><tspan fill="#ff7b72">=></tspan><tspan fill="#e6edf3">&#160;</tspan><tspan fill="#e6edf3">console</tspan><tspan fill="#e6edf3">.</tspan><tspan fill="#d2a8ff">log</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#e6edf3">data</tspan><tspan fill="#e6edf3">)</tspan><tspan fill="#e6edf3">)</tspan></text>
  <text x="40" y="458" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace"><tspan fill="#e6edf3">&#160;</tspan><tspan fill="#e6edf3">.</tspan><tspan fill="#d2a8ff">catch</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#e6edf3">err</tspan><tspan fill="#e6edf3">&#160;</tspan><tspan fill="#ff7b72">=></tspan><tspan fill="#e6edf3">&#160;</tspan><tspan fill="#e6edf3">console</tspan><tspan fill="#e6edf3">.</tspan><tspan fill="#d2a8ff">error</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#e6edf3">err</tspan><tspan fill="#e6edf3">)</tspan><tspan fill="#e6edf3">)</tspan></text>

  <!-- rules -->
  <text x="548" y="318" fill="#56d364" font-size="13" font-weight="600">✓ settles at most once</text>
  <text x="566" y="337" fill="#c9d1d9" font-size="12.5">a 2nd resolve / reject is ignored</text>
  <text x="548" y="372" fill="#56d364" font-size="13" font-weight="600">✓ .then returns a NEW promise</text>
  <text x="566" y="391" fill="#c9d1d9" font-size="12.5">so steps chain flat</text>
  <text x="548" y="426" fill="#56d364" font-size="13" font-weight="600">✓ an error anywhere skips ahead</text>
  <text x="566" y="445" fill="#c9d1d9" font-size="12.5">to the next .catch</text>

  <text x="24" y="504" fill="#c9d1d9" font-size="13"><tspan fill="#e3b341" font-weight="700">Key point: </tspan>a Promise is an object for a value that isn't ready yet. It stays pending until it settles once: fulfilled or rejected.</text>
</svg>
