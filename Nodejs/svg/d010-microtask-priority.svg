<svg xmlns="http://www.w3.org/2000/svg" width="900" height="424" viewBox="0 0 900 424" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Microtask priority</title>
  <desc>Sync code runs first (A, E), then the process.nextTick queue (D), then the Promise microtask queue (C), then event loop phases such as timers (B). Output: A E D C B.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="423" rx="14" fill="#161b22" stroke="#30363d"/>

  <text x="24" y="38" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">CODE</text>
  <text x="448" y="38" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">WHO RUNS FIRST (highest priority on top)</text>

  <!-- code -->
  <rect x="24" y="52" width="400" height="228" rx="10" fill="#0d1117" stroke="#30363d"/>
  <g font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="12">
    <g fill="#6e7681" text-anchor="end">
      <text x="52" y="80">1</text><text x="52" y="102">2</text><text x="52" y="124">3</text><text x="52" y="146">4</text><text x="52" y="168">5</text><text x="52" y="190">6</text><text x="52" y="212">7</text><text x="52" y="234">8</text><text x="52" y="256">9</text>
    </g>
    <rect x="25" y="66" width="3" height="20" fill="#58a6ff"/>
    <rect x="25" y="110" width="3" height="20" fill="#d29922"/>
    <rect x="25" y="154" width="3" height="20" fill="#39c5cf"/>
    <rect x="25" y="198" width="3" height="20" fill="#bc8cff"/>
    <rect x="25" y="242" width="3" height="20" fill="#58a6ff"/>
    <text x="64" y="80"><tspan fill="#e6edf3">console.</tspan><tspan fill="#d2a8ff">log</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#a5d6ff">'A'</tspan><tspan fill="#e6edf3">)</tspan></text>
    <text x="64" y="124"><tspan fill="#d2a8ff">setTimeout</tspan><tspan fill="#e6edf3">(()&#160;</tspan><tspan fill="#ff7b72">=&gt;</tspan><tspan fill="#e6edf3">&#160;console.</tspan><tspan fill="#d2a8ff">log</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#a5d6ff">'B'</tspan><tspan fill="#e6edf3">),&#160;</tspan><tspan fill="#79c0ff">0</tspan><tspan fill="#e6edf3">)</tspan></text>
    <text x="64" y="168"><tspan fill="#e6edf3">Promise.</tspan><tspan fill="#d2a8ff">resolve</tspan><tspan fill="#e6edf3">().</tspan><tspan fill="#d2a8ff">then</tspan><tspan fill="#e6edf3">(()&#160;</tspan><tspan fill="#ff7b72">=&gt;</tspan><tspan fill="#e6edf3">&#160;console.</tspan><tspan fill="#d2a8ff">log</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#a5d6ff">'C'</tspan><tspan fill="#e6edf3">))</tspan></text>
    <text x="64" y="212"><tspan fill="#e6edf3">process.</tspan><tspan fill="#d2a8ff">nextTick</tspan><tspan fill="#e6edf3">(()&#160;</tspan><tspan fill="#ff7b72">=&gt;</tspan><tspan fill="#e6edf3">&#160;console.</tspan><tspan fill="#d2a8ff">log</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#a5d6ff">'D'</tspan><tspan fill="#e6edf3">))</tspan></text>
    <text x="64" y="256"><tspan fill="#e6edf3">console.</tspan><tspan fill="#d2a8ff">log</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#a5d6ff">'E'</tspan><tspan fill="#e6edf3">)</tspan></text>
  </g>

  <!-- ladder -->
  <g>
    <rect x="448" y="52" width="428" height="48" rx="10" fill="#58a6ff" fill-opacity=".10" stroke="#58a6ff" stroke-opacity=".7"/>
    <text x="464" y="73" fill="#e6edf3" font-size="14" font-weight="600"><tspan fill="#79c0ff" font-family="Cascadia Code, Consolas, monospace">1 </tspan> Call stack (sync code)</text>
    <text x="464" y="91" fill="#8b949e" font-size="12">runs to completion, nothing can interrupt it</text>
    <rect x="796" y="63" width="26" height="26" rx="6" fill="#58a6ff" fill-opacity=".2" stroke="#58a6ff"/><text x="809" y="81" fill="#79c0ff" font-size="14" font-weight="700" text-anchor="middle" font-family="Cascadia Code, Consolas, monospace">A</text>
    <rect x="830" y="63" width="26" height="26" rx="6" fill="#58a6ff" fill-opacity=".2" stroke="#58a6ff"/><text x="843" y="81" fill="#79c0ff" font-size="14" font-weight="700" text-anchor="middle" font-family="Cascadia Code, Consolas, monospace">E</text>
  </g>
  <line x1="560" y1="100" x2="560" y2="110" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <g>
    <rect x="448" y="112" width="428" height="48" rx="10" fill="#bc8cff" fill-opacity=".10" stroke="#bc8cff" stroke-opacity=".7"/>
    <text x="464" y="133" fill="#e6edf3" font-size="14" font-weight="600"><tspan fill="#d2a8ff" font-family="Cascadia Code, Consolas, monospace">2 </tspan> process.nextTick queue</text>
    <text x="464" y="151" fill="#8b949e" font-size="12">microtask · Node-only · emptied completely first</text>
    <rect x="830" y="123" width="26" height="26" rx="6" fill="#bc8cff" fill-opacity=".2" stroke="#bc8cff"/><text x="843" y="141" fill="#d2a8ff" font-size="14" font-weight="700" text-anchor="middle" font-family="Cascadia Code, Consolas, monospace">D</text>
  </g>
  <line x1="560" y1="160" x2="560" y2="170" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <g>
    <rect x="448" y="172" width="428" height="48" rx="10" fill="#39c5cf" fill-opacity=".10" stroke="#39c5cf" stroke-opacity=".7"/>
    <text x="464" y="193" fill="#e6edf3" font-size="14" font-weight="600"><tspan fill="#56d4dd" font-family="Cascadia Code, Consolas, monospace">3 </tspan> Promise microtask queue</text>
    <text x="464" y="211" fill="#8b949e" font-size="12">microtask · .then / .catch / code after await</text>
    <rect x="830" y="183" width="26" height="26" rx="6" fill="#39c5cf" fill-opacity=".2" stroke="#39c5cf"/><text x="843" y="201" fill="#56d4dd" font-size="14" font-weight="700" text-anchor="middle" font-family="Cascadia Code, Consolas, monospace">C</text>
  </g>
  <line x1="560" y1="220" x2="560" y2="230" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <g>
    <rect x="448" y="232" width="428" height="48" rx="10" fill="#d29922" fill-opacity=".10" stroke="#d29922" stroke-opacity=".7"/>
    <text x="464" y="253" fill="#e6edf3" font-size="14" font-weight="600"><tspan fill="#e3b341" font-family="Cascadia Code, Consolas, monospace">4 </tspan> Event loop phases (macrotasks)</text>
    <text x="464" y="271" fill="#8b949e" font-size="12">timers · I/O poll · setImmediate · close</text>
    <rect x="830" y="243" width="26" height="26" rx="6" fill="#d29922" fill-opacity=".2" stroke="#d29922"/><text x="843" y="261" fill="#e3b341" font-size="14" font-weight="700" text-anchor="middle" font-family="Cascadia Code, Consolas, monospace">B</text>
  </g>

  <!-- output -->
  <line x1="24" y1="300" x2="876" y2="300" stroke="#21262d"/>
  <text x="24" y="336" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">OUTPUT</text>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle">
    <rect x="120" y="316" width="34" height="30" rx="7" fill="#58a6ff" fill-opacity=".2" stroke="#58a6ff"/><text x="137" y="336" fill="#79c0ff">A</text>
    <rect x="220" y="316" width="34" height="30" rx="7" fill="#58a6ff" fill-opacity=".2" stroke="#58a6ff"/><text x="237" y="336" fill="#79c0ff">E</text>
    <rect x="320" y="316" width="34" height="30" rx="7" fill="#bc8cff" fill-opacity=".2" stroke="#bc8cff"/><text x="337" y="336" fill="#d2a8ff">D</text>
    <rect x="420" y="316" width="34" height="30" rx="7" fill="#39c5cf" fill-opacity=".2" stroke="#39c5cf"/><text x="437" y="336" fill="#56d4dd">C</text>
    <rect x="520" y="316" width="34" height="30" rx="7" fill="#d29922" fill-opacity=".2" stroke="#d29922"/><text x="537" y="336" fill="#e3b341">B</text>
  </g>
  <g stroke="#8b949e" stroke-width="1.5">
    <line x1="158" y1="331" x2="214" y2="331" marker-end="url(#arr)"/>
    <line x1="258" y1="331" x2="314" y2="331" marker-end="url(#arr)"/>
    <line x1="358" y1="331" x2="414" y2="331" marker-end="url(#arr)"/>
    <line x1="458" y1="331" x2="514" y2="331" marker-end="url(#arr)"/>
  </g>
  <g font-size="12" fill="#8b949e" text-anchor="middle">
    <text x="137" y="366">sync</text><text x="237" y="366">sync</text><text x="337" y="366">nextTick</text><text x="437" y="366">promise</text><text x="537" y="366">timer</text>
  </g>
  <text x="600" y="336" fill="#c9d1d9" font-size="13">Code order: A B C D E</text>
  <text x="600" y="356" fill="#c9d1d9" font-size="13">Print order: <tspan font-weight="700" fill="#56d364">A E D C B</tspan></text>

  <text x="24" y="402" fill="#c9d1d9" font-size="13"><tspan fill="#d2a8ff" font-weight="700">Rule: </tspan>after sync code and after <tspan font-weight="700" fill="#e6edf3">every</tspan> macrotask callback, Node empties nextTick, then promises, before the loop moves on.</text>
</svg>
