<svg xmlns="http://www.w3.org/2000/svg" width="900" height="436" viewBox="0 0 900 436" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <rect x="0.5" y="0.5" width="899" height="435" rx="14" fill="#161b22" stroke="#30363d"/>
  <title>How async JS evolved</title>
  <desc>Three stages: callbacks (Node 0.x, 2009), Promises (ES2015) and async/await (ES2017, Node 7.6+), each with a code snippet, strengths and weaknesses. A bracket under Promises and async/await shows that async/await is syntax over Promises: the same Promise is underneath.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker>
  </defs>
  <!-- Callbacks -->
  <rect x="24" y="24" width="256" height="290" rx="10" fill="#d29922" fill-opacity=".07" stroke="#d29922" stroke-opacity=".75"/>
  <text x="40" y="54" fill="#e3b341" font-size="15" font-weight="600">Callbacks</text>
  <text x="40" y="74" fill="#8b949e" font-size="12">Node 0.x · 2009</text>
  <rect x="36" y="86" width="232" height="74" rx="8" fill="#0d1117" stroke="#30363d"/>
  <g font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="12">
    <text x="48.0" y="108"><tspan fill="#e6edf3">fs.</tspan><tspan fill="#d2a8ff">readFile</tspan><tspan fill="#e6edf3">(f,</tspan></text>
    <text x="62.1" y="128"><tspan fill="#e6edf3">(err,&#160;data)&#160;</tspan><tspan fill="#ff7b72">=&gt;</tspan><tspan fill="#e6edf3">&#160;{...})</tspan></text>
    <text x="48.0" y="148"><tspan fill="#8b949e">//&#160;error&#160;first,&#160;then&#160;data</tspan></text>
  </g>
  <text x="40" y="188" font-size="13"><tspan fill="#56d364" font-weight="700">✓ </tspan><tspan fill="#c9d1d9">simple</tspan></text>
  <text x="40" y="209" font-size="13"><tspan fill="#56d364" font-weight="700">✓ </tspan><tspan fill="#c9d1d9">built into every Node API</tspan></text>
  <text x="40" y="230" font-size="13"><tspan fill="#ff7b72" font-weight="700">✗ </tspan><tspan fill="#c9d1d9">callback hell</tspan></text>
  <text x="40" y="251" font-size="13"><tspan fill="#ff7b72" font-weight="700">✗ </tspan><tspan fill="#c9d1d9">error check everywhere</tspan></text>
  <text x="40" y="272" font-size="13"><tspan fill="#ff7b72" font-weight="700">✗ </tspan><tspan fill="#c9d1d9">inversion of control</tspan></text>
  <!-- Promises -->
  <rect x="322" y="24" width="256" height="290" rx="10" fill="#58a6ff" fill-opacity=".07" stroke="#58a6ff" stroke-opacity=".75"/>
  <text x="338" y="54" fill="#79c0ff" font-size="15" font-weight="600">Promises</text>
  <text x="338" y="74" fill="#8b949e" font-size="12">ES2015 / ES6</text>
  <rect x="334" y="86" width="232" height="74" rx="8" fill="#0d1117" stroke="#30363d"/>
  <g font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="12">
    <text x="346.0" y="108"><tspan fill="#d2a8ff">readFile</tspan><tspan fill="#e6edf3">(f)</tspan></text>
    <text x="360.1" y="128"><tspan fill="#e6edf3">.</tspan><tspan fill="#d2a8ff">then</tspan><tspan fill="#e6edf3">(parse)</tspan></text>
    <text x="360.1" y="148"><tspan fill="#e6edf3">.</tspan><tspan fill="#d2a8ff">catch</tspan><tspan fill="#e6edf3">(handle)</tspan></text>
  </g>
  <text x="338" y="188" font-size="13"><tspan fill="#56d364" font-weight="700">✓ </tspan><tspan fill="#c9d1d9">flat chains</tspan></text>
  <text x="338" y="209" font-size="13"><tspan fill="#56d364" font-weight="700">✓ </tspan><tspan fill="#c9d1d9">one .catch for errors</tspan></text>
  <text x="338" y="230" font-size="13"><tspan fill="#56d364" font-weight="700">✓ </tspan><tspan fill="#c9d1d9">settle exactly once</tspan></text>
  <text x="338" y="251" font-size="13"><tspan fill="#56d364" font-weight="700">✓ </tspan><tspan fill="#c9d1d9">combinators (Promise.all…)</tspan></text>
  <text x="338" y="272" font-size="13"><tspan fill="#ff7b72" font-weight="700">✗ </tspan><tspan fill="#c9d1d9">still .then chains</tspan></text>
  <text x="338" y="293" font-size="13"><tspan fill="#ff7b72" font-weight="700">✗ </tspan><tspan fill="#c9d1d9">harder to read with branches / loops</tspan></text>
  <!-- async / await -->
  <rect x="620" y="24" width="256" height="290" rx="10" fill="#3fb950" fill-opacity=".07" stroke="#3fb950" stroke-opacity=".75"/>
  <text x="636" y="54" fill="#56d364" font-size="15" font-weight="600">async / await</text>
  <text x="636" y="74" fill="#8b949e" font-size="12">ES2017 · Node 7.6+</text>
  <rect x="632" y="86" width="232" height="74" rx="8" fill="#0d1117" stroke="#30363d"/>
  <g font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="12">
    <text x="644.0" y="108"><tspan fill="#ff7b72">const</tspan><tspan fill="#e6edf3">&#160;data&#160;=</tspan></text>
    <text x="658.1" y="128"><tspan fill="#ff7b72">await</tspan><tspan fill="#e6edf3">&#160;</tspan><tspan fill="#d2a8ff">readFile</tspan><tspan fill="#e6edf3">(f)</tspan></text>
    <text x="644.0" y="148"><tspan fill="#8b949e">//&#160;pauses&#160;only&#160;this&#160;function</tspan></text>
  </g>
  <text x="636" y="188" font-size="13"><tspan fill="#56d364" font-weight="700">✓ </tspan><tspan fill="#c9d1d9">reads like sync code</tspan></text>
  <text x="636" y="209" font-size="13"><tspan fill="#56d364" font-weight="700">✓ </tspan><tspan fill="#c9d1d9">normal try / catch</tspan></text>
  <text x="636" y="230" font-size="13"><tspan fill="#56d364" font-weight="700">✓ </tspan><tspan fill="#c9d1d9">works with loops / if</tspan></text>
  <text x="636" y="251" font-size="13"><tspan fill="#e3b341" font-weight="700">⚠ </tspan><tspan fill="#c9d1d9">still Promises underneath</tspan></text>
  <text x="636" y="272" font-size="13"><tspan fill="#e3b341" font-weight="700">⚠ </tspan><tspan fill="#c9d1d9">easy to run things one by one</tspan></text>
  <text x="649" y="291" font-size="13" fill="#c9d1d9">by accident</text>
  <line x1="284" y1="124" x2="318" y2="124" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="582" y1="124" x2="616" y2="124" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="616" y1="150" x2="582" y2="150" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrB)"/>
  <path d="M322,332 L322,342 L876,342 L876,332" fill="none" stroke="#58a6ff" stroke-width="1.5"/>
  <line x1="599.0" y1="342" x2="599.0" y2="350" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="599.0" y="368" fill="#79c0ff" font-size="13.5" font-weight="700" text-anchor="middle">async/await = syntax over Promises</text>
  <text x="599.0" y="386" fill="#8b949e" font-size="12" text-anchor="middle">same Promise underneath</text>
  <text x="24" y="414" fill="#c9d1d9" font-size="13"><tspan fill="#e3b341" font-weight="700">Key point: </tspan>async/await didn't replace Promises: every async function returns a Promise and every await waits on one.</text>
</svg>
