<svg xmlns="http://www.w3.org/2000/svg" width="900" height="344" viewBox="0 0 900 344" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Example on a timeline</title>
  <desc>Main thread runs the sync script first (Starting up, Finishing up). The 0 ms timer expires after at least 1 ms but its callback waits until the stack is empty, then prints Zero seconds. The thread idles until the 2000 ms timer fires and prints Two seconds.</desc>
  <defs>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="343" rx="14" fill="#161b22" stroke="#30363d"/>

  <text x="24" y="38" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">WHO IS BUSY</text>
  <text x="876" y="38" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="end">TIME →</text>

  <!-- lane 1: main thread -->
  <rect x="24" y="52" width="852" height="68" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="38" y="80" fill="#e6edf3" font-size="14" font-weight="600">Main thread</text>
  <text x="38" y="99" fill="#8b949e" font-size="12">call stack</text>

  <rect x="184" y="62" width="208" height="30" rx="6" fill="#58a6ff" fill-opacity=".16" stroke="#58a6ff" stroke-opacity=".8"/>
  <text x="288" y="82" fill="#79c0ff" font-size="13" font-weight="600" text-anchor="middle">app.js sync code</text>
  <text x="288" y="111" fill="#56d364" font-size="11.5" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">Starting up · Finishing up</text>

  <rect x="404" y="62" width="116" height="30" rx="6" fill="#3fb950" fill-opacity=".16" stroke="#3fb950" stroke-opacity=".8"/>
  <text x="462" y="82" fill="#56d364" font-size="13" font-weight="600" text-anchor="middle">0 ms cb</text>
  <text x="462" y="111" fill="#56d364" font-size="11.5" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">Zero seconds!</text>

  <rect x="526" y="62" width="168" height="30" rx="6" fill="none" stroke="#484f58" stroke-dasharray="5 4"/>
  <text x="610" y="82" fill="#8b949e" font-size="12.5" text-anchor="middle">idle (loop sleeps in poll)</text>

  <rect x="700" y="62" width="160" height="30" rx="6" fill="#3fb950" fill-opacity=".16" stroke="#3fb950" stroke-opacity=".8"/>
  <text x="780" y="82" fill="#56d364" font-size="13" font-weight="600" text-anchor="middle">2000 ms cb</text>
  <text x="780" y="111" fill="#56d364" font-size="11.5" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">Two seconds!</text>

  <!-- lane 2: 0 ms timer -->
  <rect x="24" y="132" width="852" height="50" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="38" y="162" fill="#e6edf3" font-size="14" font-weight="600">Timer · 0 ms</text>
  <rect x="184" y="144" width="72" height="26" rx="6" fill="#d29922" fill-opacity=".18" stroke="#d29922" stroke-opacity=".8"/>
  <text x="220" y="162" fill="#e3b341" font-size="12.5" font-weight="600" text-anchor="middle">≥ 1 ms</text>
  <rect x="262" y="144" width="136" height="26" rx="6" fill="none" stroke="#d29922" stroke-dasharray="5 4"/>
  <text x="330" y="162" fill="#e3b341" font-size="12" text-anchor="middle">ready, stack busy</text>
  <line x1="410" y1="156" x2="410" y2="96" stroke="#3fb950" stroke-width="1.8" marker-end="url(#arrG)"/>

  <!-- lane 3: 2000 ms timer -->
  <rect x="24" y="194" width="852" height="50" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="38" y="224" fill="#e6edf3" font-size="14" font-weight="600">Timer · 2000 ms</text>
  <rect x="184" y="206" width="510" height="26" rx="6" fill="#d29922" fill-opacity=".12" stroke="#d29922" stroke-opacity=".7"/>
  <text x="360" y="224" fill="#e3b341" font-size="12.5" text-anchor="middle">counting down outside JS (libuv)</text>
  <rect x="544" y="204" width="14" height="30" fill="#1c2128"/>
  <line x1="540" y1="236" x2="550" y2="202" stroke="#8b949e" stroke-width="1.5"/>
  <line x1="552" y1="236" x2="562" y2="202" stroke="#8b949e" stroke-width="1.5"/>
  <line x1="706" y1="218" x2="706" y2="96" stroke="#3fb950" stroke-width="1.8" marker-end="url(#arrG)"/>

  <!-- axis -->
  <line x1="184" y1="266" x2="866" y2="266" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="544" y="258" width="14" height="16" fill="#161b22"/>
  <line x1="540" y1="274" x2="550" y2="258" stroke="#8b949e" stroke-width="1.5"/>
  <line x1="552" y1="274" x2="562" y2="258" stroke="#8b949e" stroke-width="1.5"/>
  <line x1="184" y1="261" x2="184" y2="271" stroke="#8b949e" stroke-width="1.5"/>
  <line x1="404" y1="261" x2="404" y2="271" stroke="#8b949e" stroke-width="1.5"/>
  <line x1="700" y1="261" x2="700" y2="271" stroke="#8b949e" stroke-width="1.5"/>
  <text x="184" y="288" fill="#8b949e" font-size="12" text-anchor="middle">0 ms</text>
  <text x="404" y="288" fill="#8b949e" font-size="12" text-anchor="middle">stack empty</text>
  <text x="700" y="288" fill="#8b949e" font-size="12" text-anchor="middle">≈ 2000 ms</text>

  <text x="24" y="322" fill="#c9d1d9" font-size="13"><tspan fill="#e3b341" font-weight="700">setTimeout(fn, 0)</tspan> = "run fn after ≥ 1 ms <tspan font-weight="700" fill="#e6edf3">and</tspan> after the current call stack is empty". Never "run it now".</text>
</svg>
