<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Blocking the event loop</title>
  <desc>A 3 second synchronous while loop holds the call stack. The 0 ms timer has expired but cannot run, and incoming HTTP requests wait in the poll queue. Everything runs only after the loop finishes at about 3000 ms.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="399" rx="14" fill="#161b22" stroke="#30363d"/>

  <!-- code -->
  <rect x="24" y="24" width="852" height="104" rx="10" fill="#0d1117" stroke="#30363d"/>
  <g font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="12">
    <text x="40" y="50"><tspan fill="#d2a8ff">setTimeout</tspan><tspan fill="#e6edf3">(()&#160;</tspan><tspan fill="#ff7b72">=&gt;</tspan><tspan fill="#e6edf3">&#160;console.</tspan><tspan fill="#d2a8ff">log</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#a5d6ff">'timer'</tspan><tspan fill="#e6edf3">),&#160;</tspan><tspan fill="#79c0ff">0</tspan><tspan fill="#e6edf3">)</tspan></text>
    <text x="40" y="72"><tspan fill="#ff7b72">const</tspan><tspan fill="#e6edf3">&#160;end&#160;=&#160;Date.</tspan><tspan fill="#d2a8ff">now</tspan><tspan fill="#e6edf3">()&#160;+&#160;</tspan><tspan fill="#79c0ff">3000</tspan></text>
    <rect x="25" y="80" width="851" height="20" fill="#f85149" fill-opacity=".12"/>
    <rect x="25" y="80" width="3" height="20" fill="#f85149"/>
    <text x="40" y="94"><tspan fill="#ff7b72">while</tspan><tspan fill="#e6edf3">&#160;(Date.</tspan><tspan fill="#d2a8ff">now</tspan><tspan fill="#e6edf3">()&#160;&lt;&#160;end)&#160;{}</tspan><tspan fill="#8b949e">&#160;&#160;&#160;//&#160;3&#160;s&#160;of&#160;pure&#160;CPU,&#160;e.g.&#160;a&#160;huge&#160;JSON.parse&#160;or&#160;a&#160;tight&#160;loop</tspan></text>
    <text x="40" y="116"><tspan fill="#e6edf3">console.</tspan><tspan fill="#d2a8ff">log</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#a5d6ff">'loop done'</tspan><tspan fill="#e6edf3">)</tspan></text>
  </g>

  <!-- lane main -->
  <rect x="24" y="144" width="852" height="50" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="38" y="174" fill="#e6edf3" font-size="14" font-weight="600">Main thread</text>
  <rect x="184" y="155" width="576" height="28" rx="6" fill="#f85149" fill-opacity=".16" stroke="#f85149" stroke-opacity=".85"/>
  <text x="472" y="174" fill="#ff7b72" font-size="13" font-weight="600" text-anchor="middle">while loop: 3000 ms of CPU · nothing else can run</text>
  <rect x="766" y="155" width="98" height="28" rx="6" fill="#3fb950" fill-opacity=".16" stroke="#3fb950" stroke-opacity=".8"/>
  <text x="815" y="174" fill="#56d364" font-size="12.5" font-weight="600" text-anchor="middle">timer, reqs</text>

  <!-- lane timer -->
  <rect x="24" y="204" width="852" height="50" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="38" y="234" fill="#e6edf3" font-size="14" font-weight="600">Timer · 0 ms</text>
  <rect x="184" y="215" width="62" height="28" rx="6" fill="#d29922" fill-opacity=".18" stroke="#d29922" stroke-opacity=".8"/>
  <text x="215" y="234" fill="#e3b341" font-size="12.5" font-weight="600" text-anchor="middle">≥ 1 ms</text>
  <rect x="252" y="215" width="508" height="28" rx="6" fill="none" stroke="#f85149" stroke-dasharray="5 4"/>
  <text x="506" y="234" fill="#ff7b72" font-size="12.5" text-anchor="middle">expired, but stuck: the call stack is busy for 3 s</text>

  <!-- lane requests -->
  <rect x="24" y="264" width="852" height="50" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="38" y="294" fill="#e6edf3" font-size="14" font-weight="600">HTTP requests</text>
  <line x1="360" y1="289" x2="760" y2="289" stroke="#f85149" stroke-dasharray="4 4" stroke-opacity=".7"/>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="12" text-anchor="middle">
    <rect x="300" y="276" width="70" height="26" rx="6" fill="#161b22" stroke="#f85149"/><text x="335" y="294" fill="#ff7b72">GET /a</text>
    <rect x="450" y="276" width="70" height="26" rx="6" fill="#161b22" stroke="#f85149"/><text x="485" y="294" fill="#ff7b72">GET /b</text>
    <rect x="600" y="276" width="70" height="26" rx="6" fill="#161b22" stroke="#f85149"/><text x="635" y="294" fill="#ff7b72">GET /c</text>
  </g>
  <text x="768" y="294" fill="#ff7b72" font-size="12.5">served ~3 s late</text>

  <!-- arrows up at 3000 ms -->
  <line x1="772" y1="215" x2="772" y2="186" stroke="#3fb950" stroke-width="1.6" marker-end="url(#arrG)"/>

  <!-- axis -->
  <line x1="184" y1="334" x2="866" y2="334" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="184" y1="329" x2="184" y2="339" stroke="#8b949e" stroke-width="1.5"/>
  <line x1="760" y1="329" x2="760" y2="339" stroke="#8b949e" stroke-width="1.5"/>
  <text x="184" y="356" fill="#8b949e" font-size="12" text-anchor="middle">0 ms</text>
  <text x="760" y="356" fill="#8b949e" font-size="12" text-anchor="middle">≈ 3000 ms</text>

  <text x="24" y="384" fill="#c9d1d9" font-size="13"><tspan fill="#ff7b72" font-weight="700">✗ One slow sync task freezes the whole server.</tspan> The loop can't take the next callback while the stack is busy.</text>
</svg>
