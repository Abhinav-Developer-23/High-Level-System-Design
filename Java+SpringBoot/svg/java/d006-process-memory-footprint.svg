<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>JVM process memory footprint</title>
  <desc>Total process memory (RSS) is a stacked bar: heap (-Xmx), metaspace, code cache, thread stacks (threads × -Xss), direct buffers, GC / JIT internals. -Xmx controls only the heap part. With -Xmx2g in a 2 GB container the heap alone fills the limit and the other segments go past it: OOMKilled, exit 137, no OutOfMemoryError and no heap dump. With -XX:MaxRAMPercentage=75 the heap is about 1.5 GB and everything fits under the limit with headroom.</desc>
  <rect x="0.5" y="0.5" width="879" height="419" rx="14" fill="#161b22" stroke="#30363d"/>

  <text x="40" y="46" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">TOTAL PROCESS MEMORY (RSS)</text>

  <!-- legend -->
  <g font-size="12.5" fill="#c9d1d9">
    <rect x="40" y="62" width="14" height="14" rx="3" fill="#bc8cff" fill-opacity=".45" stroke="#bc8cff"/>
    <text x="60" y="74">Heap (<tspan fill="#79c0ff" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="12">-Xmx</tspan>)</text>
    <rect x="300" y="62" width="14" height="14" rx="3" fill="#39c5cf" fill-opacity=".45" stroke="#39c5cf"/>
    <text x="320" y="74">Metaspace</text>
    <rect x="540" y="62" width="14" height="14" rx="3" fill="#58a6ff" fill-opacity=".45" stroke="#58a6ff"/>
    <text x="560" y="74">Code cache</text>
    <rect x="40" y="86" width="14" height="14" rx="3" fill="#f0883e" fill-opacity=".45" stroke="#f0883e"/>
    <text x="60" y="98">Thread stacks (threads × <tspan fill="#79c0ff" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="12">-Xss</tspan>)</text>
    <rect x="300" y="86" width="14" height="14" rx="3" fill="#d29922" fill-opacity=".45" stroke="#d29922"/>
    <text x="320" y="98">Direct buffers</text>
    <rect x="540" y="86" width="14" height="14" rx="3" fill="#8b949e" fill-opacity=".45" stroke="#8b949e"/>
    <text x="560" y="98">GC / JIT internals</text>
  </g>

  <!-- container limit line (2 GB at x=640; 300 px per GB) -->
  <line x1="640" y1="136" x2="640" y2="376" stroke="#f85149" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="640" y="128" fill="#ff7b72" font-size="12" font-weight="600" text-anchor="middle">container limit 2 GB</text>

  <!-- ===== Scenario 1 ===== -->
  <text x="40" y="150" fill="#ff7b72" font-size="13.5" font-weight="700">1 · <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="13">-Xmx2g</tspan> in a 2 GB container</text>
  <!-- bracket over heap -->
  <text x="340" y="174" fill="#e6edf3" font-size="12.5" text-anchor="middle"><tspan fill="#79c0ff" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="12">-Xmx</tspan> controls only this part</text>
  <path d="M41,190 v-6 h598 v6" fill="none" stroke="#8b949e" stroke-width="1.2"/>
  <text x="700" y="186" fill="#ff7b72" font-size="12" text-anchor="middle">past the limit</text>

  <rect x="40" y="196" width="600" height="38" rx="4" fill="#bc8cff" fill-opacity=".30" stroke="#bc8cff"/>
  <text x="340" y="220" fill="#e6edf3" font-size="13" font-weight="600" text-anchor="middle">Heap · <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="12.5">-Xmx2g</tspan> = 2 GB</text>
  <rect x="640" y="196" width="34" height="38" fill="#39c5cf" fill-opacity=".30" stroke="#39c5cf"/>
  <rect x="674" y="196" width="18" height="38" fill="#58a6ff" fill-opacity=".30" stroke="#58a6ff"/>
  <rect x="692" y="196" width="30" height="38" fill="#f0883e" fill-opacity=".30" stroke="#f0883e"/>
  <rect x="722" y="196" width="22" height="38" fill="#d29922" fill-opacity=".30" stroke="#d29922"/>
  <rect x="744" y="196" width="16" height="38" fill="#8b949e" fill-opacity=".30" stroke="#8b949e"/>
  <rect x="640" y="191" width="120" height="48" rx="4" fill="#f85149" fill-opacity=".10" stroke="#f85149" stroke-width="1.5" stroke-dasharray="4 3"/>

  <text x="40" y="262" fill="#ff7b72" font-size="13" font-weight="600">✗ OOMKilled · exit 137 <tspan fill="#c9d1d9" font-weight="400">· no OutOfMemoryError, no heap dump</tspan></text>

  <line x1="40" y1="284" x2="600" y2="284" stroke="#21262d"/>
  <line x1="680" y1="284" x2="840" y2="284" stroke="#21262d"/>

  <!-- ===== Scenario 2 ===== -->
  <text x="40" y="310" fill="#56d364" font-size="13.5" font-weight="700">2 · <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="13">-XX:MaxRAMPercentage=75</tspan></text>
  <rect x="40" y="322" width="450" height="38" rx="4" fill="#bc8cff" fill-opacity=".30" stroke="#bc8cff"/>
  <text x="265" y="346" fill="#e6edf3" font-size="13" font-weight="600" text-anchor="middle">Heap ≈ 1.5 GB</text>
  <rect x="490" y="322" width="34" height="38" fill="#39c5cf" fill-opacity=".30" stroke="#39c5cf"/>
  <rect x="524" y="322" width="18" height="38" fill="#58a6ff" fill-opacity=".30" stroke="#58a6ff"/>
  <rect x="542" y="322" width="30" height="38" fill="#f0883e" fill-opacity=".30" stroke="#f0883e"/>
  <rect x="572" y="322" width="22" height="38" fill="#d29922" fill-opacity=".30" stroke="#d29922"/>
  <rect x="594" y="322" width="16" height="38" fill="#8b949e" fill-opacity=".30" stroke="#8b949e"/>
  <rect x="610" y="322" width="30" height="38" fill="#3fb950" fill-opacity=".10" stroke="#3fb950" stroke-opacity=".7" stroke-dasharray="3 3"/>
  <text x="656" y="346" fill="#56d364" font-size="13" font-weight="600">✓ fits, with headroom</text>

  <!-- axis -->
  <line x1="40" y1="376" x2="640" y2="376" stroke="#484f58"/>
  <g stroke="#484f58"><line x1="40" y1="376" x2="40" y2="382"/><line x1="340" y1="376" x2="340" y2="382"/><line x1="640" y1="376" x2="640" y2="382"/></g>
  <g fill="#8b949e" font-size="12" text-anchor="middle">
    <text x="40" y="397">0</text><text x="340" y="397">1 GB</text><text x="640" y="397">2 GB</text>
  </g>
</svg>
