<svg xmlns="http://www.w3.org/2000/svg" width="930" height="440" viewBox="0 0 930 440" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>CompletableFuture exception flow</title>
  <desc>The chain supplyAsync(loadCount), thenApply(c + 1), thenApply(c * 2), exceptionally(ex → 0), thenAccept(print). Success: 5 becomes 6 then 12, exceptionally is skipped because there is no error, and thenAccept prints count = 12. Failure: supplyAsync throws (database down), both thenApply stages are skipped, the exception jumps straight to exceptionally, which returns the fallback 0, and thenAccept prints count = 0. Legend: exceptionally runs only on failure and returns a fallback; handle always runs and can change the result; whenComplete always runs, side effect only. ex is usually a CompletionException, and ex.getCause() is the real error.</desc>
  <defs>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="929" height="439" rx="14" fill="#161b22" stroke="#30363d"/>

  <!-- ===== success lane ===== -->
  <text x="24" y="40" fill="#56d364" font-size="14" font-weight="700">✓ Success <tspan fill="#8b949e" font-size="12" font-weight="400">the value flows through every stage</tspan></text>

  <g font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="12">
    <rect x="24" y="70" width="182" height="60" rx="9" fill="#3fb950" fill-opacity=".10" stroke="#3fb950"/>
    <text x="115" y="94" fill="#e6edf3" text-anchor="middle">supplyAsync(loadCount)</text>
    <text x="115" y="116" fill="#56d364" text-anchor="middle">returns 5</text>

    <rect x="230" y="70" width="140" height="60" rx="9" fill="#3fb950" fill-opacity=".10" stroke="#3fb950"/>
    <text x="300" y="94" fill="#e6edf3" text-anchor="middle">thenApply(c + 1)</text>
    <text x="300" y="116" fill="#56d364" text-anchor="middle">5 + 1 = 6</text>

    <rect x="394" y="70" width="140" height="60" rx="9" fill="#3fb950" fill-opacity=".10" stroke="#3fb950"/>
    <text x="464" y="94" fill="#e6edf3" text-anchor="middle">thenApply(c * 2)</text>
    <text x="464" y="116" fill="#56d364" text-anchor="middle">6 * 2 = 12</text>

    <rect x="558" y="70" width="176" height="60" rx="9" fill="#1c2128" fill-opacity=".5" stroke="#484f58" stroke-dasharray="5 4"/>
    <text x="646" y="94" fill="#8b949e" text-anchor="middle">exceptionally(ex → 0)</text>

    <rect x="758" y="70" width="148" height="60" rx="9" fill="#3fb950" fill-opacity=".10" stroke="#3fb950"/>
    <text x="832" y="94" fill="#e6edf3" text-anchor="middle">thenAccept(print)</text>
    <text x="832" y="116" fill="#56d364" text-anchor="middle">count = 12</text>
  </g>
  <text x="646" y="116" fill="#8b949e" font-size="12.5" font-style="italic" text-anchor="middle">skipped: no error</text>

  <line x1="206" y1="100" x2="228" y2="100" stroke="#3fb950" stroke-width="1.8" marker-end="url(#arrG)"/>
  <line x1="370" y1="100" x2="392" y2="100" stroke="#3fb950" stroke-width="1.8" marker-end="url(#arrG)"/>
  <!-- value goes around exceptionally -->
  <path d="M534,84 L546,84 Q546,56 560,56 L732,56 Q746,56 746,70 L746,84 L756,84" fill="none" stroke="#3fb950" stroke-width="1.8" marker-end="url(#arrG)"/>
  <text x="646" y="50" fill="#56d364" font-size="12" font-weight="600" text-anchor="middle" data-nocheck="1">12 passes straight through</text>

  <line x1="24" y1="160" x2="906" y2="160" stroke="#21262d"/>

  <!-- ===== failure lane ===== -->
  <text x="24" y="190" fill="#ff7b72" font-size="14" font-weight="700">✗ Failure <tspan fill="#8b949e" font-size="12" font-weight="400">the exception skips ahead to the first error handler</tspan></text>

  <!-- dim chain links (not travelled) -->
  <g stroke="#30363d" stroke-width="1.5">
    <line x1="206" y1="234" x2="230" y2="234"/>
    <line x1="370" y1="234" x2="394" y2="234"/>
    <line x1="534" y1="234" x2="558" y2="234"/>
  </g>

  <g font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="12">
    <rect x="24" y="204" width="182" height="60" rx="9" fill="#f85149" fill-opacity=".14" stroke="#f85149"/>
    <text x="115" y="228" fill="#e6edf3" text-anchor="middle">supplyAsync(loadCount)</text>

    <rect x="230" y="204" width="140" height="60" rx="9" fill="#1c2128" fill-opacity=".5" stroke="#484f58" stroke-dasharray="5 4"/>
    <text x="300" y="228" fill="#8b949e" text-anchor="middle">thenApply(c + 1)</text>

    <rect x="394" y="204" width="140" height="60" rx="9" fill="#1c2128" fill-opacity=".5" stroke="#484f58" stroke-dasharray="5 4"/>
    <text x="464" y="228" fill="#8b949e" text-anchor="middle">thenApply(c * 2)</text>

    <rect x="558" y="204" width="176" height="60" rx="9" fill="#3fb950" fill-opacity=".10" stroke="#3fb950"/>
    <text x="646" y="228" fill="#e6edf3" text-anchor="middle">exceptionally(ex → 0)</text>

    <rect x="758" y="204" width="148" height="60" rx="9" fill="#3fb950" fill-opacity=".10" stroke="#3fb950"/>
    <text x="832" y="228" fill="#e6edf3" text-anchor="middle">thenAccept(print)</text>
    <text x="832" y="250" fill="#56d364" text-anchor="middle">count = 0</text>
  </g>
  <text x="115" y="250" fill="#ff7b72" font-size="12.5" font-weight="600" text-anchor="middle">throws: "database down"</text>
  <text x="300" y="250" fill="#8b949e" font-size="12.5" font-style="italic" text-anchor="middle">skipped</text>
  <text x="464" y="250" fill="#8b949e" font-size="12.5" font-style="italic" text-anchor="middle">skipped</text>
  <text x="646" y="250" fill="#56d364" font-size="12.5" font-weight="600" text-anchor="middle">returns fallback 0</text>

  <line x1="734" y1="234" x2="756" y2="234" stroke="#3fb950" stroke-width="1.8" marker-end="url(#arrG)"/>
  <!-- exception jumps over both thenApply stages -->
  <path d="M115,264 L115,276 Q115,288 129,288 L632,288 Q646,288 646,276 L646,266" fill="none" stroke="#f85149" stroke-width="1.8" marker-end="url(#arrR)"/>
  <text x="380" y="306" fill="#ff7b72" font-size="12" font-weight="600" text-anchor="middle">exception jumps over both thenApply stages</text>

  <!-- ===== legend ===== -->
  <rect x="24" y="324" width="540" height="92" rx="9" fill="#1c2128" stroke="#30363d"/>
  <text x="40" y="346" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">ERROR HANDLERS</text>
  <g font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="12.5" fill="#79c0ff">
    <text x="40" y="370">exceptionally</text>
    <text x="40" y="390">handle</text>
    <text x="40" y="410">whenComplete</text>
  </g>
  <g font-size="13" fill="#c9d1d9">
    <text x="156" y="370"><tspan fill="#e3b341" font-weight="600">only on failure</tspan> · returns a fallback</text>
    <text x="156" y="390"><tspan fill="#56d364" font-weight="600">always</tspan> · can change the result</text>
    <text x="156" y="410"><tspan fill="#56d364" font-weight="600">always</tspan> · side effect only (result passes on)</text>
  </g>

  <rect x="580" y="324" width="326" height="92" rx="9" fill="#58a6ff" fill-opacity=".08" stroke="#58a6ff" stroke-opacity=".6"/>
  <text x="596" y="346" fill="#79c0ff" font-size="12" font-weight="700" letter-spacing="1.5">NOTE</text>
  <text x="596" y="370" fill="#c9d1d9" font-size="13"><tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="12.5" fill="#79c0ff">ex</tspan> is usually a <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="12.5" fill="#79c0ff">CompletionException</tspan></text>
  <text x="596" y="392" fill="#c9d1d9" font-size="13">→ <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="12.5" fill="#79c0ff">ex.getCause()</tspan> is the real error</text>
</svg>
