<svg xmlns="http://www.w3.org/2000/svg" width="900" height="662" viewBox="0 0 900 662" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>HashMap internal structure</title>
  <desc>The put pipeline: put("apple", 10) calls key.hashCode() (93029210), spreads the high bits with h ^ (h &gt;&gt;&gt; 16) (93030097), picks the bucket index with (n - 1) &amp; hash (93030097 &amp; 15 = 1), and since bucket 1 is empty a new Node goes there. Below, a table of 16 buckets, most empty. Bucket 0 holds a linked list of three colliding nodes "Aa" = 1, "BB" = 2, "C#" = 7, all with hashCode 2112, told apart with equals(). Bucket 1 holds the single node "apple" = 10. Bucket 9 is a red-black tree of 9 nodes: a bucket with more than 8 entries in a table of at least 64 buckets becomes a tree, O(log n); at 6 or fewer entries after a resize it turns back into a list. A zoomed node shows its fields hash, key, value, next. Footer: capacity 16, load factor 0.75, resize after 12 entries.</desc>
