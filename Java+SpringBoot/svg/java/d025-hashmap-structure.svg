  <rect x="708" y="50" width="168" height="34" rx="8" fill="#3fb950" fill-opacity=".12" stroke="#3fb950"/>
  <text x="792.0" y="72" text-anchor="middle" fill="#56d364" font-size="14" font-weight="600">bucket 1 <tspan fill="#8b949e" font-weight="400" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">table[1]</tspan></text>
  <text x="273" y="104" text-anchor="middle" fill="#8b949e" font-size="12">String hash</text>
  <text x="273" y="122" text-anchor="middle" fill="#79c0ff" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">93029210</text>
