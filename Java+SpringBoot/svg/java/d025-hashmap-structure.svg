  <line x1="512" y1="67" x2="542" y2="67" stroke="#8b949e" stroke-width="1.6" marker-end="url(#m-g)"/>
  <rect x="544" y="50" width="130" height="34" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="609.0" y="72" text-anchor="middle" fill="#e6edf3" font-size="12.5" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">(n - 1) &amp; hash</text>
