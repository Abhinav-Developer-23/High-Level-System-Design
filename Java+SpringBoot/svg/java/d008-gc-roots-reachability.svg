<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>GC roots and reachability</title>
  <desc>GC roots: local variables in stack frames, static fields, active threads, JNI references. Live objects reachable from a root: local variable order points to Order, which points to Customer and to a List of two Items; static CACHE points to Map, Entry, Product; an active thread points to its Runnable. Unreachable island: A and B reference each other but no path from a root reaches them, so they are garbage; object C became garbage when its variable was set to null.</desc>
  <defs>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="819" height="399" rx="14" fill="#161b22" stroke="#30363d"/>

  <text x="40" y="52" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">GC ROOTS</text>
  <text x="286" y="52" fill="#56d364" font-size="12" font-weight="700" letter-spacing="1.5">LIVE · REACHABLE FROM A ROOT</text>

  <!-- roots -->
  <g>
    <rect x="40" y="84" width="196" height="50" rx="8" fill="#58a6ff" fill-opacity=".10" stroke="#58a6ff" stroke-opacity=".7"/>
    <text x="54" y="105" fill="#e6edf3" font-size="13.5" font-weight="600">Local variables</text>
    <text x="54" y="124" fill="#8b949e" font-size="12">(stack frames) · <tspan fill="#79c0ff" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">order</tspan></text>

    <rect x="40" y="154" width="196" height="50" rx="8" fill="#58a6ff" fill-opacity=".10" stroke="#58a6ff" stroke-opacity=".7"/>
    <text x="54" y="175" fill="#e6edf3" font-size="13.5" font-weight="600">Static fields</text>
    <text x="54" y="194" fill="#79c0ff" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">static CACHE</text>

    <rect x="40" y="224" width="196" height="50" rx="8" fill="#58a6ff" fill-opacity=".10" stroke="#58a6ff" stroke-opacity=".7"/>
    <text x="54" y="245" fill="#e6edf3" font-size="13.5" font-weight="600">Active threads</text>
    <text x="54" y="264" fill="#8b949e" font-size="12">a running <tspan fill="#79c0ff" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">Thread</tspan></text>

    <rect x="40" y="294" width="196" height="50" rx="8" fill="#58a6ff" fill-opacity=".10" stroke="#58a6ff" stroke-opacity=".7"/>
    <text x="54" y="315" fill="#e6edf3" font-size="13.5" font-weight="600">JNI references</text>
    <text x="54" y="334" fill="#8b949e" font-size="12">held by native code</text>
  </g>

  <!-- live edges -->
  <g stroke="#3fb950" stroke-width="1.6" marker-end="url(#arr-green)" fill="none">
    <line x1="236" y1="109" x2="285" y2="109"/>
    <line x1="386" y1="109" x2="435" y2="84"/>
    <line x1="386" y1="109" x2="435" y2="124"/>
    <line x1="548" y1="125" x2="597" y2="104"/>
    <line x1="548" y1="125" x2="597" y2="140"/>
    <line x1="236" y1="179" x2="285" y2="179"/>
    <line x1="386" y1="179" x2="435" y2="179"/>
    <line x1="548" y1="179" x2="597" y2="179"/>
    <line x1="236" y1="249" x2="285" y2="249"/>
  </g>

  <!-- live objects -->
  <g font-size="12" fill="#e6edf3" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">
    <rect x="286" y="94" width="100" height="30" rx="6" fill="#3fb950" fill-opacity=".12" stroke="#3fb950" stroke-opacity=".75"/><text x="336" y="113">Order</text>
    <rect x="436" y="68" width="112" height="30" rx="6" fill="#3fb950" fill-opacity=".12" stroke="#3fb950" stroke-opacity=".75"/><text x="492" y="87">Customer</text>
    <rect x="436" y="110" width="112" height="30" rx="6" fill="#3fb950" fill-opacity=".12" stroke="#3fb950" stroke-opacity=".75"/><text x="492" y="129">List&lt;Item&gt;</text>
    <rect x="598" y="88" width="100" height="30" rx="6" fill="#3fb950" fill-opacity=".12" stroke="#3fb950" stroke-opacity=".75"/><text x="648" y="107">Item</text>
    <rect x="598" y="125" width="100" height="30" rx="6" fill="#3fb950" fill-opacity=".12" stroke="#3fb950" stroke-opacity=".75"/><text x="648" y="144">Item</text>
    <rect x="286" y="164" width="100" height="30" rx="6" fill="#3fb950" fill-opacity=".12" stroke="#3fb950" stroke-opacity=".75"/><text x="336" y="183">Map</text>
    <rect x="436" y="164" width="112" height="30" rx="6" fill="#3fb950" fill-opacity=".12" stroke="#3fb950" stroke-opacity=".75"/><text x="492" y="183">Entry</text>
    <rect x="598" y="164" width="100" height="30" rx="6" fill="#3fb950" fill-opacity=".12" stroke="#3fb950" stroke-opacity=".75"/><text x="648" y="183">Product</text>
    <rect x="286" y="234" width="100" height="30" rx="6" fill="#3fb950" fill-opacity=".12" stroke="#3fb950" stroke-opacity=".75"/><text x="336" y="253">Runnable</text>
  </g>

  <!-- unreachable island -->
  <rect x="436" y="220" width="360" height="132" rx="10" fill="#f85149" fill-opacity=".05" stroke="#f85149" stroke-opacity=".8" stroke-dasharray="6 4"/>
  <text x="452" y="241" fill="#ff7b72" font-size="12" font-weight="700" letter-spacing="1.5">UNREACHABLE · GARBAGE</text>
  <line x1="640" y1="252" x2="640" y2="340" stroke="#f85149" stroke-opacity=".3" stroke-dasharray="3 3"/>

  <g font-size="12" fill="#ff7b72" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">
    <rect x="466" y="254" width="56" height="30" rx="6" fill="#f85149" fill-opacity=".12" stroke="#f85149" stroke-opacity=".8" stroke-dasharray="4 3"/><text x="494" y="273">A</text>
    <rect x="566" y="254" width="56" height="30" rx="6" fill="#f85149" fill-opacity=".12" stroke="#f85149" stroke-opacity=".8" stroke-dasharray="4 3"/><text x="594" y="273">B</text>
    <rect x="690" y="254" width="56" height="30" rx="6" fill="#f85149" fill-opacity=".12" stroke="#f85149" stroke-opacity=".8" stroke-dasharray="4 3"/><text x="718" y="273">C</text>
  </g>
  <g stroke="#f85149" stroke-width="1.5" marker-end="url(#arr-red)">
    <line x1="522" y1="263" x2="565" y2="263"/>
    <line x1="566" y1="276" x2="523" y2="276"/>
  </g>
  <g font-size="12" text-anchor="middle">
    <text x="544" y="304" fill="#c9d1d9">reference each other,</text>
    <text x="544" y="320" fill="#c9d1d9">but no path from a root</text>
    <text x="544" y="337" fill="#ff7b72" font-weight="700">→ garbage</text>
    <text x="718" y="304" fill="#c9d1d9">variable set to null</text>
    <text x="718" y="321" fill="#ff7b72" font-weight="700">→ garbage</text>
  </g>

  <!-- legend -->
  <rect x="40" y="365" width="14" height="14" rx="3" fill="#3fb950" fill-opacity=".14" stroke="#3fb950"/>
  <text x="62" y="377" fill="#c9d1d9" font-size="12.5">live (reachable from a root)</text>
  <rect x="260" y="365" width="14" height="14" rx="3" fill="#f85149" fill-opacity=".14" stroke="#f85149" stroke-dasharray="3 2"/>
  <text x="282" y="377" fill="#c9d1d9" font-size="12.5">garbage (unreachable)</text>
</svg>
