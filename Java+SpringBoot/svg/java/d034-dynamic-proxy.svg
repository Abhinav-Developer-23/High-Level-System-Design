<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>JDK dynamic proxy</title>
  <desc>How a JDK dynamic proxy works. The caller holds a PaymentService svc and thinks it has the real service. It actually holds $Proxy12 implements PaymentService, created at runtime by Proxy.newProxyInstance. Every method call goes to InvocationHandler.invoke(proxy, method, args), which runs three steps: before (start timer / begin transaction), method.invoke(target, args) which calls the real StripePaymentService object, and after (log time / commit). The return value flows back to the caller. JDK proxies need an interface; Spring uses CGLIB subclasses for classes without one; this is how @Transactional, @Async and Spring Data repositories work.</desc>
  <defs>
    <marker id="a_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker>
    <marker id="a_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
    <marker id="a_gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="919" height="419" rx="14" fill="#161b22" stroke="#30363d"/>

  <!-- Caller -->
  <rect x="24" y="24" width="224" height="100" rx="10" fill="#1c2128" stroke="#30363d"/>
  <text x="136" y="50" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle">Caller</text>
  <text x="136" y="74" fill="#79c0ff" font-size="12.5" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">PaymentService svc</text>
  <text x="136" y="102" fill="#8b949e" font-size="12" font-style="italic" text-anchor="middle">thinks it has the real service</text>

  <!-- caller <-> proxy -->
  <line x1="74" y1="124" x2="74" y2="174" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a_gray)"/>
  <text x="84" y="154" fill="#8b949e" font-size="12">call</text>
  <line x1="200" y1="176" x2="200" y2="126" stroke="#3fb950" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a_green)"/>
  <text x="190" y="154" fill="#56d364" font-size="12" text-anchor="end">return value</text>

  <!-- Proxy -->
  <rect x="24" y="176" width="224" height="126" rx="10" fill="#58a6ff" fill-opacity="0.05" stroke="#58a6ff" stroke-opacity="0.7" stroke-dasharray="6 4"/>
  <text x="40" y="202" fill="#e6edf3" font-size="14" font-weight="600">Proxy</text>
  <rect x="148" y="187" width="86" height="22" rx="11" fill="#58a6ff" fill-opacity="0.12" stroke="#58a6ff" stroke-opacity="0.6"/>
  <text x="191" y="202" fill="#79c0ff" font-size="12" text-anchor="middle">generated</text>
  <text x="40" y="228" fill="#e6edf3" font-size="13" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">$Proxy12</text>
  <text x="40" y="247" fill="#79c0ff" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">implements PaymentService</text>
  <line x1="40" y1="260" x2="232" y2="260" stroke="#21262d"/>
  <text x="40" y="277" fill="#8b949e" font-size="12">created at runtime by</text>
  <text x="40" y="294" fill="#79c0ff" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">Proxy.newProxyInstance</text>

  <!-- proxy <-> handler -->
  <line x1="248" y1="206" x2="366" y2="206" stroke="#58a6ff" stroke-width="1.8" marker-end="url(#a_blue)"/>
  <text x="307" y="197" fill="#79c0ff" font-size="12" text-anchor="middle">every method call</text>
  <line x1="368" y1="270" x2="250" y2="270" stroke="#3fb950" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a_green)"/>
  <text x="307" y="261" fill="#56d364" font-size="12" text-anchor="middle">return value</text>

  <!-- InvocationHandler -->
  <rect x="368" y="24" width="290" height="278" rx="10" fill="#1c2128" stroke="#58a6ff" stroke-opacity="0.7"/>
  <text x="386" y="51" fill="#e6edf3" font-size="14" font-weight="600" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">InvocationHandler</text>
  <text x="386" y="72" fill="#79c0ff" font-size="12.5" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">.invoke(proxy, method, args)</text>

  <rect x="386" y="90" width="254" height="54" rx="8" fill="#58a6ff" fill-opacity="0.10" stroke="#58a6ff" stroke-opacity="0.6"/>
  <text x="400" y="111" fill="#79c0ff" font-size="13" font-weight="600">before</text>
  <text x="400" y="131" fill="#c9d1d9" font-size="13">start timer / begin transaction</text>
  <line x1="513" y1="144" x2="513" y2="162" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a_gray)"/>

  <rect x="386" y="164" width="254" height="44" rx="8" fill="#3fb950" fill-opacity="0.10" stroke="#3fb950" stroke-opacity="0.7"/>
  <text x="400" y="191" fill="#e6edf3" font-size="12.5" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">method.invoke(target, args)</text>
  <line x1="513" y1="208" x2="513" y2="226" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a_gray)"/>

  <rect x="386" y="228" width="254" height="54" rx="8" fill="#58a6ff" fill-opacity="0.10" stroke="#58a6ff" stroke-opacity="0.6"/>
  <text x="400" y="249" fill="#79c0ff" font-size="13" font-weight="600">after</text>
  <text x="400" y="269" fill="#c9d1d9" font-size="13">log time / commit</text>

  <!-- handler -> target -->
  <line x1="640" y1="186" x2="716" y2="186" stroke="#3fb950" stroke-width="1.8" marker-end="url(#a_green)"/>

  <!-- Target -->
  <rect x="718" y="137" width="178" height="98" rx="10" fill="#3fb950" fill-opacity="0.10" stroke="#3fb950" stroke-opacity="0.8"/>
  <text x="807" y="163" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle">Target</text>
  <text x="807" y="183" fill="#8b949e" font-size="12" text-anchor="middle">real object</text>
  <text x="807" y="211" fill="#56d364" font-size="12" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">StripePaymentService</text>

  <!-- Footer -->
  <rect x="24" y="324" width="872" height="74" rx="10" fill="#1c2128" stroke="#30363d"/>
  <text x="40" y="351" fill="#c9d1d9" font-size="13">JDK proxies need an <tspan fill="#e3b341" font-weight="600">interface</tspan>&#160; · &#160;Spring uses CGLIB subclasses for classes without one</text>
  <line x1="40" y1="361" x2="880" y2="361" stroke="#30363d"/>
  <text x="40" y="381" fill="#8b949e" font-size="13">this is how <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" fill="#79c0ff" font-size="12.5">@Transactional</tspan>, <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" fill="#79c0ff" font-size="12.5">@Async</tspan> and Spring Data repositories work</text>
</svg>
