<svg xmlns="http://www.w3.org/2000/svg" width="900" height="454" viewBox="0 0 900 454" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Stop-the-world timelines</title>
  <desc>Four collectors on a time axis. Serial stops the app for one long pause with 1 GC thread. Parallel stops it for a shorter pause with N GC threads. G1 takes short young, remark and mixed pauses and marks concurrently alongside the app. ZGC pauses for under 1 ms and does mark and relocate concurrently.</desc>
  <rect x="0.5" y="0.5" width="899" height="453" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="24" y="36" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">COLLECTOR</text>
  <text x="876" y="36" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="end">TIME →</text>
  <rect x="24" y="50" width="852" height="58" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="40" y="77.0" fill="#e6edf3" font-size="15" font-weight="600">Serial</text>
  <text x="40" y="95.0" fill="#8b949e" font-size="12">one long pause</text>
  <rect x="176" y="66" width="154" height="26" rx="5" fill="#58a6ff" fill-opacity=".16" stroke="#58a6ff" stroke-opacity=".8"/>
  <text x="253.0" y="83.5" fill="#79c0ff" font-size="12.5" text-anchor="middle">app</text>
  <rect x="334" y="66" width="306" height="26" rx="4" fill="#f85149" fill-opacity=".30" stroke="#f85149"/>
  <text x="487.0" y="83.5" fill="#ff7b72" font-size="12.5" font-weight="700" text-anchor="middle">STW · 1 GC thread</text>
  <rect x="644" y="66" width="216" height="26" rx="5" fill="#58a6ff" fill-opacity=".16" stroke="#58a6ff" stroke-opacity=".8"/>
  <text x="752.0" y="83.5" fill="#79c0ff" font-size="12.5" text-anchor="middle">app</text>
  <rect x="24" y="120" width="852" height="58" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="40" y="147.0" fill="#e6edf3" font-size="15" font-weight="600">Parallel</text>
  <text x="40" y="165.0" fill="#8b949e" font-size="12">shorter pause</text>
  <rect x="176" y="136" width="154" height="26" rx="5" fill="#58a6ff" fill-opacity=".16" stroke="#58a6ff" stroke-opacity=".8"/>
  <text x="253.0" y="153.5" fill="#79c0ff" font-size="12.5" text-anchor="middle">app</text>
  <rect x="334" y="136" width="140" height="26" rx="4" fill="#f85149" fill-opacity=".30" stroke="#f85149"/>
  <text x="404.0" y="153.5" fill="#ff7b72" font-size="12.5" font-weight="700" text-anchor="middle">STW · N GC threads</text>
  <rect x="478" y="136" width="382" height="26" rx="5" fill="#58a6ff" fill-opacity=".16" stroke="#58a6ff" stroke-opacity=".8"/>
  <text x="669.0" y="153.5" fill="#79c0ff" font-size="12.5" text-anchor="middle">app</text>
  <rect x="24" y="190" width="852" height="96" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="40" y="236.0" fill="#e6edf3" font-size="15" font-weight="600">G1</text>
  <text x="40" y="254.0" fill="#8b949e" font-size="12">short pauses</text>
  <rect x="176" y="218" width="684" height="26" rx="5" fill="#58a6ff" fill-opacity=".16" stroke="#58a6ff" stroke-opacity=".8"/>
  <rect x="262" y="216" width="14" height="30" rx="4" fill="#f85149" fill-opacity=".30" stroke="#f85149"/>
  <text x="269" y="210" fill="#ff7b72" font-size="12" font-weight="600" text-anchor="middle">young</text>
  <rect x="560" y="216" width="14" height="30" rx="4" fill="#f85149" fill-opacity=".30" stroke="#f85149"/>
  <text x="567" y="210" fill="#ff7b72" font-size="12" font-weight="600" text-anchor="middle">remark</text>
  <rect x="700" y="216" width="14" height="30" rx="4" fill="#f85149" fill-opacity=".30" stroke="#f85149"/>
  <text x="707" y="210" fill="#ff7b72" font-size="12" font-weight="600" text-anchor="middle">mixed</text>
  <text x="418.0" y="235" fill="#79c0ff" font-size="12.5" text-anchor="middle">app</text>
  <text x="219.0" y="235" fill="#79c0ff" font-size="12.5" text-anchor="middle">app</text>
  <text x="787.0" y="235" fill="#79c0ff" font-size="12.5" text-anchor="middle">app</text>
  <rect x="290" y="252" width="284" height="22" rx="5" fill="#39c5cf" fill-opacity=".12" stroke="#39c5cf" stroke-opacity=".8" stroke-dasharray="5 3"/>
