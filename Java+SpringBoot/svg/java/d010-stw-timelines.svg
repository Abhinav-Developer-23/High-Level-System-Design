  <text x="40" y="344.0" fill="#e6edf3" font-size="15" font-weight="600">ZGC</text>
  <text x="40" y="362.0" fill="#8b949e" font-size="12">pauses &lt; 1 ms</text>
  <rect x="176" y="326" width="684" height="26" rx="5" fill="#58a6ff" fill-opacity=".16" stroke="#58a6ff" stroke-opacity=".8"/>
  <rect x="300" y="324" width="4" height="30" rx="4" fill="#f85149" fill-opacity=".30" stroke="#f85149"/>
  <text x="302" y="318" fill="#ff7b72" font-size="12" font-weight="600" text-anchor="middle">&lt; 1 ms</text>
  <rect x="520" y="324" width="4" height="30" rx="4" fill="#f85149" fill-opacity=".30" stroke="#f85149"/>
  <text x="522" y="318" fill="#ff7b72" font-size="12" font-weight="600" text-anchor="middle">&lt; 1 ms</text>
  <rect x="740" y="324" width="4" height="30" rx="4" fill="#f85149" fill-opacity=".30" stroke="#f85149"/>
  <text x="742" y="318" fill="#ff7b72" font-size="12" font-weight="600" text-anchor="middle">&lt; 1 ms</text>
  <text x="238.0" y="343" fill="#79c0ff" font-size="12.5" text-anchor="middle">app</text>
  <text x="412.0" y="343" fill="#79c0ff" font-size="12.5" text-anchor="middle">app</text>
  <text x="632.0" y="343" fill="#79c0ff" font-size="12.5" text-anchor="middle">app</text>
  <text x="802.0" y="343" fill="#79c0ff" font-size="12.5" text-anchor="middle">app</text>
  <rect x="304" y="360" width="436" height="22" rx="5" fill="#39c5cf" fill-opacity=".12" stroke="#39c5cf" stroke-opacity=".8" stroke-dasharray="5 3"/>
  <text x="522.0" y="375.5" fill="#56d4dd" font-size="12.5" text-anchor="middle">concurrent mark + relocate</text>
  <rect x="24" y="414" width="22" height="16" rx="4" fill="#58a6ff" fill-opacity=".16" stroke="#58a6ff" stroke-opacity=".8"/>
  <text x="54" y="426.5" fill="#c9d1d9" font-size="13">app threads running</text>
  <rect x="210" y="414" width="22" height="16" rx="4" fill="#f85149" fill-opacity=".30" stroke="#f85149"/>
  <text x="240" y="426.5" fill="#c9d1d9" font-size="13">stop-the-world pause</text>
  <rect x="406" y="414" width="22" height="16" rx="4" fill="#39c5cf" fill-opacity=".12" stroke="#39c5cf" stroke-opacity=".8" stroke-dasharray="5 3"/>
  <text x="436" y="426.5" fill="#c9d1d9" font-size="13">concurrent GC work (alongside the app)</text>
  <text x="876" y="426.5" fill="#8b949e" font-size="12" font-style="italic" text-anchor="end">lengths are illustrative</text>
</svg>
