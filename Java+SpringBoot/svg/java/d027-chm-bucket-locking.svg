<svg xmlns="http://www.w3.org/2000/svg" width="900" height="612" viewBox="0 0 900 612" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
<title>ConcurrentHashMap bucket locking</title>
<desc>A ConcurrentHashMap table of 12 bucket slots with four threads acting at once. Thread A puts into empty bucket 2 with a CAS, lock-free. Thread B puts into bucket 5, which already has nodes, and takes synchronized on that bucket's first node only. Thread C puts into bucket 9 at the same time with its own lock: a different bucket, so it runs in parallel. Thread D gets from bucket 5 while B holds the lock: no lock, volatile reads. Bucket 11 holds a ForwardingNode (hash = MOVED) pointing to the new table while a resize is in progress: writers help move buckets and reads are forwarded. Side box: size() is baseCount plus a CounterCell array, like LongAdder. Footer: no null keys or values; iterators are weakly consistent, no ConcurrentModificationException.</desc>
<defs>
<marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
<marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d29922"/></marker>
<marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker>
<marker id="mt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39c5cf"/></marker>
<marker id="mn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
</defs>
