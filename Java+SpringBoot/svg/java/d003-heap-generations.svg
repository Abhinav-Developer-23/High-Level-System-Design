<svg xmlns="http://www.w3.org/2000/svg" width="900" height="372" viewBox="0 0 900 372" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Heap generations</title>
  <desc>The heap (-Xmx) is split into a Young Generation (about one third: Eden 8/10, survivor spaces S0 and S1 1/10 each, one always empty) and an Old Generation (about two thirds) for long-lived objects. Minor GC covers young, major GC covers old, full GC covers the whole heap plus metaspace. Metaspace is outside the heap in native memory and is not part of -Xmx.</desc>
  <rect x="0.5" y="0.5" width="899" height="371" rx="14" fill="#161b22" stroke="#30363d"/>

  <!-- titles -->
  <text x="40" y="38" fill="#d2a8ff" font-size="15" font-weight="600">HEAP <tspan fill="#79c0ff" font-weight="400" font-size="13" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">(-Xmx)</tspan></text>
  <text x="40" y="64" fill="#e6edf3" font-size="13" font-weight="600">Young Generation</text>
  <text x="285" y="64" fill="#e6edf3" font-size="13" font-weight="600">Old Generation (Tenured)</text>

  <!-- heap bar -->
  <rect x="40" y="74" width="700" height="60" rx="8" fill="#bc8cff" fill-opacity=".06" stroke="#bc8cff" stroke-opacity=".8"/>
  <rect x="42" y="76" width="183" height="56" rx="6" fill="#58a6ff" fill-opacity=".14"/>
  <text x="133" y="109" fill="#79c0ff" font-size="14" font-weight="600" text-anchor="middle">Eden</text>
  <rect x="227" y="76" width="22" height="56" fill="#d29922" fill-opacity=".18"/>
  <text x="238" y="109" fill="#e3b341" font-size="12" font-weight="700" text-anchor="middle">S0</text>
  <rect x="251" y="77" width="22" height="54" fill="none" stroke="#d29922" stroke-opacity=".8" stroke-dasharray="3 3"/>
  <text x="262" y="109" fill="#e3b341" font-size="12" font-weight="700" text-anchor="middle">S1</text>
  <rect x="277" y="76" width="461" height="56" rx="6" fill="#bc8cff" fill-opacity=".16"/>
  <text x="507" y="109" fill="#d2a8ff" font-size="14" font-weight="600" text-anchor="middle">Old</text>
  <line x1="226" y1="74" x2="226" y2="134" stroke="#484f58"/>
  <line x1="250" y1="74" x2="250" y2="134" stroke="#484f58"/>
  <line x1="275" y1="74" x2="275" y2="134" stroke="#bc8cff" stroke-opacity=".8" stroke-width="2"/>

  <!-- metaspace -->
  <rect x="762" y="74" width="114" height="60" rx="8" fill="#39c5cf" fill-opacity=".10" stroke="#39c5cf" stroke-opacity=".8" stroke-dasharray="5 4"/>
  <text x="819" y="99" fill="#56d4dd" font-size="14" font-weight="600" text-anchor="middle">Metaspace</text>
  <text x="819" y="118" fill="#8b949e" font-size="12" text-anchor="middle">native memory</text>

  <!-- under labels -->
  <text x="133" y="156" fill="#c9d1d9" font-size="12" text-anchor="middle">new objects</text>
  <line x1="250" y1="136" x2="250" y2="146" stroke="#d29922" stroke-opacity=".8"/>
  <line x1="238" y1="146" x2="262" y2="146" stroke="#d29922" stroke-opacity=".8"/>
  <text x="250" y="162" fill="#e3b341" font-size="12" text-anchor="middle">survivors of minor GC</text>
  <text x="250" y="178" fill="#e3b341" font-size="12" text-anchor="middle">one always empty</text>
  <text x="507" y="156" fill="#c9d1d9" font-size="12" text-anchor="middle">long-lived objects</text>
  <text x="819" y="156" fill="#56d4dd" font-size="12" text-anchor="middle">not part of -Xmx</text>

  <!-- GC brackets -->
  <path d="M40,196 v10 H274 v-10" fill="none" stroke="#3fb950" stroke-width="1.6"/>
  <text x="157" y="226" fill="#56d364" font-size="13" font-weight="600" text-anchor="middle">Minor GC <tspan fill="#8b949e" font-weight="400" font-size="12">young only · frequent, fast</tspan></text>
  <path d="M278,196 v10 H740 v-10" fill="none" stroke="#d29922" stroke-width="1.6"/>
  <text x="509" y="226" fill="#e3b341" font-size="13" font-weight="600" text-anchor="middle">Major GC <tspan fill="#8b949e" font-weight="400" font-size="12">old only · rare, slower</tspan></text>
  <path d="M40,240 v10 H876 v-10" fill="none" stroke="#f85149" stroke-width="1.6"/>
  <text x="458" y="270" fill="#ff7b72" font-size="13" font-weight="600" text-anchor="middle">Full GC <tspan fill="#8b949e" font-weight="400" font-size="12">whole heap + metaspace</tspan></text>

  <!-- ratios -->
  <rect x="24" y="290" width="852" height="58" rx="10" fill="#1c2128" stroke="#30363d"/>
  <text x="40" y="310" fill="#8b949e" font-size="12">Default proportions (Serial / Parallel GC)</text>
  <g font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="12.5" fill="#c9d1d9">
    <text x="40" y="333"><tspan fill="#79c0ff">NewRatio=2</tspan> → Young ≈ 1/3, Old ≈ 2/3</text>
    <text x="400" y="333"><tspan fill="#79c0ff">SurvivorRatio=8</tspan> → Eden : S0 : S1 = 8 : 1 : 1</text>
  </g>
</svg>
