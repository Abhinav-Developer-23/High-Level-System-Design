  <text x="449.0" y="139.0" fill="#56d364" font-size="13" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">L</text>
  <text x="480" y="139" fill="#e3b341" font-size="12.5">⚠ 4 free slots, but split into 3 holes</text>
  <text x="196" y="176" fill="#c9d1d9" font-size="13"><tspan fill="#56d364" font-weight="700">✓ </tspan>objects don't move</text>
  <text x="196" y="196" fill="#c9d1d9" font-size="13"><tspan fill="#ff7b72" font-weight="700">✗ </tspan>fragmentation: free space split into holes, a big object may not fit</text>
  <text x="196" y="216" fill="#8b949e" font-size="12"><tspan font-weight="700" letter-spacing="1">USED FOR </tspan><tspan fill="#c9d1d9">CMS old gen</tspan></text>
