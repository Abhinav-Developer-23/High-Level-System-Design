<svg xmlns="http://www.w3.org/2000/svg" width="900" height="614" viewBox="0 0 900 614" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Mark-sweep, mark-compact and copying</title>
  <desc>The same heap of live (L) and dead (D) blocks after three GC algorithms. Mark-sweep frees dead blocks in place and leaves holes (fragmentation). Mark-compact slides live objects together so free space is one block. Copying moves live objects to an empty to-space and wipes the from-space.</desc>
