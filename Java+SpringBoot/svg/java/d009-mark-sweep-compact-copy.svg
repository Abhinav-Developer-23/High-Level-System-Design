  <text x="279.0" y="283.0" fill="#56d364" font-size="13" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">L</text>
  <rect x="298" y="262" width="30" height="32" rx="5" fill="#3fb950" fill-opacity=".22" stroke="#3fb950"/>
  <text x="313.0" y="283.0" fill="#56d364" font-size="13" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">L</text>
  <rect x="332" y="262" width="132" height="32" rx="5" fill="none" stroke="#484f58" stroke-dasharray="4 3"/>
  <text x="398.0" y="282.0" fill="#8b949e" font-size="12" text-anchor="middle">one free block</text>
  <text x="480" y="283" fill="#8b949e" font-size="12.5">next allocation: bump the pointer</text>
  <text x="196" y="320" fill="#c9d1d9" font-size="13"><tspan fill="#56d364" font-weight="700">✓ </tspan>one free block, bump-pointer allocation</text>
  <text x="196" y="340" fill="#c9d1d9" font-size="13"><tspan fill="#ff7b72" font-weight="700">✗ </tspan>moving objects + fixing references is slow</text>
  <text x="196" y="360" fill="#8b949e" font-size="12"><tspan font-weight="700" letter-spacing="1">USED FOR </tspan><tspan fill="#c9d1d9">Serial / Parallel old gen, full GC</tspan></text>
