<svg xmlns="http://www.w3.org/2000/svg" width="900" height="536" viewBox="0 0 900 536" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
<title>String pool and immutability</title>
<desc>Code: String s1 = "hello"; String s2 = "hello"; String s3 = new String("hello"); String s4 = s1.toUpperCase();. The stack holds four references s1, s2, s3, s4. In the heap, a dashed String pool holds one "hello" object; s1 and s2 both point to it, so s1 == s2 is true: one shared object. s3 points to a separate String "hello" outside the pool: s1 == s3 is false, s1.equals(s3) is true. s4 points to a new "HELLO" object: toUpperCase() returns a NEW String and "hello" is unchanged. Callout: sharing is only safe because no one can change "hello"; if s2 could modify it, s1 would silently change too.</desc>
<defs><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d29922"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/></marker><marker id="m-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39c5cf"/></marker><marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs>
<rect x="0.5" y="0.5" width="899" height="535" rx="14" fill="#161b22" stroke="#30363d"/>
<rect x="24" y="24" width="852" height="64" rx="10" fill="#0d1117" stroke="#30363d"/>
<text x="44" y="50" fill="#e6edf3" font-size="13" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace"><tspan fill="#ff7b72">String</tspan> s1 = <tspan fill="#a5d6ff">"hello";</tspan></text>
<text x="44" y="72" fill="#e6edf3" font-size="13" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace"><tspan fill="#ff7b72">String</tspan> s2 = <tspan fill="#a5d6ff">"hello";</tspan></text>
<text x="440" y="50" fill="#e6edf3" font-size="13" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace"><tspan fill="#ff7b72">String</tspan> s3 = <tspan fill="#a5d6ff">new String("hello");</tspan></text>
<text x="440" y="72" fill="#e6edf3" font-size="13" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace"><tspan fill="#ff7b72">String</tspan> s4 = <tspan fill="#a5d6ff">s1.toUpperCase();</tspan></text>
<rect x="24" y="104" width="180" height="316" rx="10" fill="#1c2128" fill-opacity=".55" stroke="#30363d"/>
<text x="40" y="130" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">STACK</text>
<rect x="228" y="104" width="648" height="316" rx="10" fill="#1c2128" fill-opacity=".55" stroke="#30363d"/>
<text x="244" y="130" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">HEAP</text>
<rect x="300" y="138" width="190" height="124" rx="10" fill="#bc8cff" fill-opacity=".06" stroke="#bc8cff" stroke-opacity=".8" stroke-dasharray="6 4"/>
<text x="316" y="160" fill="#d2a8ff" font-size="12.5" font-weight="600">String pool</text>
<rect x="330" y="194" width="130" height="36" rx="8" fill="#bc8cff" fill-opacity=".12" stroke="#bc8cff"/>
<text x="342" y="217" fill="#8b949e" font-size="11.5" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">String</text>
<text x="448" y="217" fill="#d2a8ff" font-size="13.5" font-weight="700" text-anchor="end" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">"hello"</text>
<rect x="330" y="290" width="130" height="36" rx="8" fill="#58a6ff" fill-opacity=".12" stroke="#58a6ff"/>
<text x="342" y="313" fill="#8b949e" font-size="11.5" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">String</text>
<text x="448" y="313" fill="#79c0ff" font-size="13.5" font-weight="700" text-anchor="end" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">"hello"</text>
<rect x="330" y="354" width="130" height="36" rx="8" fill="#d29922" fill-opacity=".12" stroke="#d29922"/>
<text x="342" y="377" fill="#8b949e" font-size="11.5" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">String</text>
<text x="448" y="377" fill="#e3b341" font-size="13.5" font-weight="700" text-anchor="end" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">"HELLO"</text>
<rect x="40" y="154" width="148" height="36" rx="8" fill="#1c2128" stroke="#8b949e" stroke-opacity=".9"/>
<text x="56" y="177" fill="#e6edf3" font-size="14" font-weight="700" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">s1</text>
<text x="84" y="177" fill="#8b949e" font-size="11.5">String ref</text>
<circle cx="172" cy="172" r="3.5" fill="#c9d1d9"/>
<rect x="40" y="218" width="148" height="36" rx="8" fill="#1c2128" stroke="#8b949e" stroke-opacity=".9"/>
<text x="56" y="241" fill="#e6edf3" font-size="14" font-weight="700" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">s2</text>
<text x="84" y="241" fill="#8b949e" font-size="11.5">String ref</text>
<circle cx="172" cy="236" r="3.5" fill="#c9d1d9"/>
<rect x="40" y="290" width="148" height="36" rx="8" fill="#1c2128" stroke="#8b949e" stroke-opacity=".9"/>
<text x="56" y="313" fill="#e6edf3" font-size="14" font-weight="700" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">s3</text>
<text x="84" y="313" fill="#8b949e" font-size="11.5">String ref</text>
<circle cx="172" cy="308" r="3.5" fill="#c9d1d9"/>
<rect x="40" y="354" width="148" height="36" rx="8" fill="#1c2128" stroke="#8b949e" stroke-opacity=".9"/>
<text x="56" y="377" fill="#e6edf3" font-size="14" font-weight="700" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">s4</text>
<text x="84" y="377" fill="#8b949e" font-size="11.5">String ref</text>
<circle cx="172" cy="372" r="3.5" fill="#c9d1d9"/>
<path d="M175,172 C250,172 260,204 327,206" fill="none" stroke="#3fb950" stroke-width="1.8" marker-end="url(#m-green)"/>
<path d="M175,236 C250,236 260,220 327,218" fill="none" stroke="#3fb950" stroke-width="1.8" marker-end="url(#m-green)"/>
<line x1="175" y1="308" x2="327" y2="308" stroke="#58a6ff" stroke-width="1.8" marker-end="url(#m-blue)"/>
<line x1="175" y1="372" x2="327" y2="372" stroke="#d29922" stroke-width="1.8" marker-end="url(#m-amber)"/>
<circle cx="521" cy="202" r="9" fill="#3fb950" fill-opacity=".14" stroke="#3fb950" stroke-opacity=".7"/>
<text x="521" y="206.5" fill="#56d364" font-size="11.5" font-weight="700" text-anchor="middle">✓</text>
<text x="538" y="206.5" fill="#56d364" font-size="13.5" font-weight="700" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">s1 == s2 → true</text>
<text x="538" y="226" fill="#56d364" font-size="12.5">one shared object</text>
<text x="538" y="304" font-size="13.5" font-weight="700" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace"><tspan fill="#ff7b72">s1 == s3 → false</tspan><tspan fill="#8b949e" font-weight="400"> · </tspan><tspan fill="#56d364">s1.equals(s3) → true</tspan></text>
<text x="538" y="323" fill="#8b949e" font-size="12">separate String object, outside the pool</text>
<circle cx="521" cy="299.5" r="9" fill="#f85149" fill-opacity=".14" stroke="#f85149" stroke-opacity=".7"/>
<text x="521" y="304.0" fill="#ff7b72" font-size="11.5" font-weight="700" text-anchor="middle">✗</text>
<text x="538" y="368" font-size="13" fill="#e3b341"><tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="12.5">toUpperCase()</tspan> returns a <tspan font-weight="700">NEW</tspan> String</text>
<text x="538" y="387" font-size="12.5" fill="#8b949e"><tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" fill="#d2a8ff">"hello"</tspan> is unchanged</text>
<rect x="24" y="440" width="852" height="72" rx="10" fill="#d29922" fill-opacity=".10" stroke="#d29922" stroke-opacity=".7"/>
<text x="44" y="466" fill="#e3b341" font-size="15" font-weight="700">⚠</text>
<text x="66" y="466" fill="#e3b341" font-size="13.5" font-weight="600">Sharing is only safe because no one can change <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">"hello"</tspan>.</text>
<text x="66" y="490" fill="#c9d1d9" font-size="13">If s2 could modify it, s1 would silently change too.</text>
</svg>
