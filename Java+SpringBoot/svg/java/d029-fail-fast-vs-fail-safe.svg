<svg xmlns="http://www.w3.org/2000/svg" width="900" height="604" viewBox="0 0 900 604" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
<title>Fail-fast vs snapshot vs weakly consistent iterators</title>
<desc>Three iterator kinds. 1, fail-fast (ArrayList, HashMap): the list [A, B, C, D] has modCount = 4 and the iterator remembers expectedModCount = 4; list.add(E) during the loop makes modCount = 5; the next call to next() checks 5 ≠ 4 and throws ConcurrentModificationException. 2, snapshot (CopyOnWriteArrayList): the iterator points at the old array [A, B, C, D]; the writer creates a new array [A, B, C, D, E] and the list now points to it; the iterator keeps reading the old one, so no exception, and it does not see E. 3, weakly consistent (ConcurrentHashMap): the iterator walks the live bucket table; buckets 0 to 2 are already visited; a concurrent put lands in bucket 6, which may or may not be seen; it never throws, and every element present at the start is visited exactly once. Footer: "fail-safe" is not an official Java term; the JDK docs say snapshot or weakly consistent.</desc>
