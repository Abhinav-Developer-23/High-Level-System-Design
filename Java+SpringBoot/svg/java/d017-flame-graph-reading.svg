<svg xmlns="http://www.w3.org/2000/svg" width="900" height="342" viewBox="0 0 900 342" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Reading a flame graph</title>
  <desc>Stylized allocation flame graph. Bottom row Thread.run, above it ThreadPoolExecutor.runWorker, then DispatcherServlet.doDispatch. Above that, sorted alphabetically: a narrow HealthController.check; a wide highlighted tower LoginController.login, SessionRegistry.register, ConcurrentHashMap.put at the top; and OrderController.list, ObjectMapper.writeValueAsString, byte[] alloc. The y axis is call stack depth, caller below and callee above. The width of a box is its share of samples (bytes allocated). The x order is alphabetical, not time. A wide box near the top is the hot spot: read down the tower to find your code.</desc>
  <defs><marker id="m17-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker><marker id="m17-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker></defs>
  <rect x="0.5" y="0.5" width="899" height="341" rx="14" fill="#161b22" stroke="#30363d"/>
  <rect x="200" y="254" width="640" height="26" rx="3" fill="#d29922" fill-opacity="0.16" stroke="#d29922" stroke-opacity=".7"/>
  <text x="208" y="271.5" fill="#e6edf3" font-size="11.5" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">Thread.run</text>
  <rect x="200" y="224" width="640" height="26" rx="3" fill="#d29922" fill-opacity="0.16" stroke="#d29922" stroke-opacity=".7"/>
  <text x="208" y="241.5" fill="#e6edf3" font-size="11.5" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">ThreadPoolExecutor.runWorker</text>
  <rect x="200" y="194" width="640" height="26" rx="3" fill="#d29922" fill-opacity="0.16" stroke="#d29922" stroke-opacity=".7"/>
  <text x="208" y="211.5" fill="#e6edf3" font-size="11.5" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">DispatcherServlet.doDispatch</text>
  <rect x="200" y="164" width="40" height="26" rx="3" fill="#f0883e" fill-opacity="0.2" stroke="#f0883e" stroke-opacity=".7"/>
  <rect x="242" y="164" width="368" height="26" rx="3" fill="#f0883e" fill-opacity="0.2" stroke="#f0883e" stroke-opacity=".7"/>
  <text x="250" y="181.5" fill="#e6edf3" font-size="11.5" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">LoginController.login</text>
  <rect x="612" y="164" width="228" height="26" rx="3" fill="#f0883e" fill-opacity="0.2" stroke="#f0883e" stroke-opacity=".7"/>
  <text x="620" y="181.5" fill="#e6edf3" font-size="11.5" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">OrderController.list</text>
  <rect x="242" y="134" width="358" height="26" rx="3" fill="#f0883e" fill-opacity="0.3" stroke="#f0883e" stroke-opacity=".7"/>
  <text x="250" y="151.5" fill="#e6edf3" font-size="11.5" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">SessionRegistry.register</text>
  <rect x="612" y="134" width="228" height="26" rx="3" fill="#f0883e" fill-opacity="0.2" stroke="#f0883e" stroke-opacity=".7"/>
  <text x="620" y="151.5" fill="#e6edf3" font-size="11.5" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">ObjectMapper.writeValueAsString</text>
  <rect x="242" y="104" width="346" height="26" rx="3" fill="#f85149" fill-opacity="0.34" stroke="#f85149" stroke-opacity=".7"/>
  <text x="250" y="121.5" fill="#e6edf3" font-size="11.5" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">ConcurrentHashMap.put</text>
  <rect x="612" y="104" width="100" height="26" rx="3" fill="#f0883e" fill-opacity="0.3" stroke="#f0883e" stroke-opacity=".7"/>
  <text x="620" y="121.5" fill="#e6edf3" font-size="11.5" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">byte[] alloc</text>
  <text x="230" y="151.5" fill="#e6edf3" font-size="11.5" text-anchor="end" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">HealthController.check</text>
  <line x1="220" y1="156" x2="220" y2="163" stroke="#8b949e" stroke-width="1.2"/>
  <rect x="238" y="100" width="376" height="94" rx="6" fill="none" stroke="#f85149" stroke-width="2"/>
  <line x1="44" y1="280" x2="44" y2="102" stroke="#8b949e" stroke-width="1.6" marker-end="url(#m17-g)"/>
  <text x="24" y="52" fill="#e6edf3" font-size="13" font-weight="600">y = call stack depth</text>
  <text x="24" y="71" fill="#8b949e" font-size="12">(caller below, callee above)</text>
  <text x="54" y="121" fill="#8b949e" font-size="12">callee</text>
  <text x="54" y="271" fill="#8b949e" font-size="12">caller</text>
  <path d="M242,93 V86 H588 V93" fill="none" stroke="#e3b341" stroke-width="1.5"/>
  <text x="415.0" y="78" fill="#e3b341" font-size="13" font-weight="600" text-anchor="middle">width = share of samples (bytes allocated)</text>
  <text x="628" y="44" fill="#ff7b72" font-size="13" font-weight="700">wide box near the top = hot spot</text>
  <text x="628" y="63" fill="#c9d1d9" font-size="12.5">→ read down to your code</text>
  <path d="M640,70 Q628,96 594,110" fill="none" stroke="#f85149" stroke-width="1.6" marker-end="url(#m17-r)"/>
  <line x1="200" y1="298" x2="840" y2="298" stroke="#8b949e" stroke-width="1.4" marker-end="url(#m17-g)"/>
  <text x="520.0" y="320" fill="#c9d1d9" font-size="13" text-anchor="middle">x order is alphabetical, <tspan fill="#ff7b72" font-weight="700">NOT</tspan> time</text>
</svg>
