<svg xmlns="http://www.w3.org/2000/svg" width="860" height="560" viewBox="0 0 860 560" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Heap: healthy vs leak</title>
  <desc>Two charts of heap used over time (hours or days). Healthy: a sawtooth that rises as objects are allocated and drops at every GC; its floor, the heap after GC, is flat. Leak: the sawtooth floor keeps rising, GCs get more and more frequent as the free space shrinks, and the heap finally hits max heap (-Xmx) and the app dies with OutOfMemoryError. Judge by the floor (heap after GC), not the peaks.</desc>
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="859" height="559" rx="14" fill="#161b22" stroke="#30363d"/>
  <rect x="24" y="24" width="812" height="226" rx="10" fill="#1c2128" stroke="#30363d"/>
  <rect x="40" y="38" width="82" height="24" rx="12" fill="#3fb950" fill-opacity=".16" stroke="#3fb950"/>
  <text x="81.0" y="55" fill="#56d364" font-size="13.5" font-weight="700" text-anchor="middle">✓ Healthy</text>
  <line x1="96" y1="76" x2="96" y2="220" stroke="#8b949e" stroke-width="1.3" marker-start="url(#ax)"/>
  <line x1="96" y1="220" x2="816" y2="220" stroke="#8b949e" stroke-width="1.3" marker-end="url(#ax)"/>
  <text x="84" y="154.0" fill="#8b949e" font-size="12" text-anchor="middle" transform="rotate(-90 84 154.0)" data-nocheck="1">heap used</text>
  <text x="816" y="240" fill="#8b949e" font-size="12" text-anchor="end">time (hours / days) →</text>
  <polyline fill="none" stroke="#3fb950" stroke-width="1.8" stroke-linejoin="round" points="96.0,180.4 156.6,122.3 156.6,180.4 217.2,122.3 217.2,180.4 277.9,122.3 277.9,180.4 338.5,122.3 338.5,180.4 399.1,122.3 399.1,180.4 459.7,122.3 459.7,180.4 520.4,122.3 520.4,180.4 581.0,122.3 581.0,180.4 641.6,122.3 641.6,180.4 702.2,122.3 702.2,180.4 762.8,122.3 762.8,180.4 800.0,144.8"/>
  <line x1="96" y1="180.4" x2="800" y2="180.4" stroke="#56d364" stroke-width="1.6" stroke-dasharray="6 4"/>
  <rect x="582" y="188.4" width="214" height="22" rx="11" fill="#161b22" stroke="#3fb950" stroke-opacity=".6"/>
  <text x="689" y="203.4" fill="#56d364" font-size="12.5" font-weight="600" text-anchor="middle">heap after GC: flat</text>
  <text x="582" y="55" fill="#8b949e" font-size="12">rises as objects are allocated, drops at every GC</text>
  <rect x="24" y="262" width="812" height="226" rx="10" fill="#1c2128" stroke="#30363d"/>
  <rect x="40" y="276" width="62" height="24" rx="12" fill="#f85149" fill-opacity=".16" stroke="#f85149"/>
  <text x="71.0" y="293" fill="#ff7b72" font-size="13.5" font-weight="700" text-anchor="middle">✗ Leak</text>
  <line x1="96" y1="314" x2="96" y2="458" stroke="#8b949e" stroke-width="1.3" marker-start="url(#ax)"/>
  <line x1="96" y1="458" x2="816" y2="458" stroke="#8b949e" stroke-width="1.3" marker-end="url(#ax)"/>
  <text x="84" y="392.0" fill="#8b949e" font-size="12" text-anchor="middle" transform="rotate(-90 84 392.0)" data-nocheck="1">heap used</text>
  <text x="816" y="478" fill="#8b949e" font-size="12" text-anchor="end">time (hours / days) →</text>
  <line x1="96" y1="326" x2="810" y2="326" stroke="#8b949e" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="104" y="319" fill="#8b949e" font-size="12" font-family="Segoe UI, Inter, system-ui, sans-serif">max heap (<tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" fill="#79c0ff">-Xmx</tspan>)</text>
  <polyline fill="none" stroke="#f85149" stroke-width="1.8" stroke-linejoin="round" points="96.0,436.9 198.0,339.2 198.0,423.3 285.7,339.2 285.7,411.6 361.3,339.2 361.3,401.5 426.4,339.2 426.4,392.9 482.4,339.2 482.4,385.4 530.6,339.2 530.6,379.0 572.2,339.2 572.2,373.5 607.9,339.2 607.9,368.7 638.7,339.2 638.7,364.6 665.2,339.2 665.2,361.1 688.0,339.2 688.0,358.0 707.7,339.2 707.7,355.4 724.6,339.2 724.6,353.2 739.2,339.2 739.2,351.2 765.5,326.0"/>
  <line x1="96" y1="436.9" x2="765.5" y2="347.7" stroke="#ff7b72" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="346" y="427.6" fill="#ff7b72" font-size="12.5" font-weight="600" transform="rotate(-11.5 346 427.6)" data-nocheck="1">heap after GC keeps rising</text>
  <circle cx="765.5" cy="326.0" r="5" fill="#f85149"/>
  <rect x="690" y="276" width="142" height="24" rx="12" fill="#f85149" fill-opacity=".22" stroke="#f85149"/>
  <text x="761" y="293" fill="#ff7b72" font-size="12.5" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">OutOfMemoryError</text>
  <line x1="765.5" y1="320.0" x2="765.5" y2="302" stroke="#f85149" stroke-width="1.4"/>
  <path d="M566,377.30702758386855 V383.30702758386855 H753.5 V377.30702758386855" fill="none" stroke="#d29922" stroke-width="1.3"/>
  <text x="659.7" y="399.30702758386855" fill="#e3b341" font-size="12.5" text-anchor="middle">GCs more and more frequent</text>
  <rect x="24" y="502" width="812" height="34" rx="8" fill="#d29922" fill-opacity=".10" stroke="#d29922" stroke-opacity=".6"/>
  <text x="430" y="524" fill="#c9d1d9" font-size="13" text-anchor="middle"><tspan fill="#e3b341" font-weight="700">⚠ </tspan>judge by the <tspan fill="#e6edf3" font-weight="700">floor (heap after GC)</tspan>, not the peaks</text>
</svg>
