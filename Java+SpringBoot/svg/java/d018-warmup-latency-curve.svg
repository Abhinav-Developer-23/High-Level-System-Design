<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Warm-up and p99 latency</title>
  <desc>Two charts of p99 latency over time since start. No warm-up: the pod is ready and receives traffic immediately, latency starts very high and decays over about 2 to 5 minutes (class loading and interpreter, then C1 compiled with pools filling, then C2 compiled and warm) to a flat steady state; users feel the area above steady state. Warm-up before ready: the same spike happens during a warm-up window driven by synthetic calls while the pod is not in the load balancer; after the ready line real users see flat steady-state latency.</desc>
