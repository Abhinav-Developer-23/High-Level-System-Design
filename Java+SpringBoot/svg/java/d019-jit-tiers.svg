<svg xmlns="http://www.w3.org/2000/svg" width="900" height="374" viewBox="0 0 900 374" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>JIT compilation tiers</title>
  <desc>A method starts in tier 0, the interpreter, which runs bytecode directly: slow, but it starts immediately. After about 200 calls tier 3, C1 with profiling, compiles it quickly and records branches and types (fast). After about 5,000 calls tier 4, C2, recompiles it with heavy optimizations from the profile such as inlining and escape analysis (fastest). A red dashed arrow from C2 back to the interpreter: deoptimize when an assumption breaks, e.g. a new subclass. Note: compiler threads use CPU while the app is starting.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="373" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="24" y="38" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">A METHOD'S LIFE · TIERED COMPILATION</text>
  <text x="876" y="38" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="end">CALLS →</text>
  <rect x="24" y="58" width="225" height="186" rx="10" fill="#8b949e" fill-opacity=".06" stroke="#8b949e"/>
  <rect x="40" y="74" width="62" height="22" rx="11" fill="#8b949e" fill-opacity=".18" stroke="#8b949e" stroke-opacity=".7"/>
  <text x="71" y="89" fill="#c9d1d9" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">TIER 0</text>
  <text x="40" y="122" fill="#e6edf3" font-size="16" font-weight="600">Interpreter</text>
  <text x="40" y="148" fill="#c9d1d9" font-size="13">runs bytecode directly</text>
  <text x="40" y="167" fill="#c9d1d9" font-size="13">starts immediately</text>
  <line x1="36" y1="200" x2="237" y2="200" stroke="#30363d"/>
  <text x="40" y="224" fill="#8b949e" font-size="12">speed</text>
  <rect x="86" y="214" width="15" height="12" rx="2" fill="#f85149" fill-opacity=".85"/>
  <rect x="105" y="214" width="15" height="12" rx="2" fill="#30363d" fill-opacity=".6"/>
  <rect x="124" y="214" width="15" height="12" rx="2" fill="#30363d" fill-opacity=".6"/>
  <rect x="143" y="214" width="15" height="12" rx="2" fill="#30363d" fill-opacity=".6"/>
  <rect x="162" y="214" width="15" height="12" rx="2" fill="#30363d" fill-opacity=".6"/>
  <text x="233" y="224" fill="#ff7b72" font-size="12" font-weight="700" text-anchor="end">slow</text>
  <rect x="337" y="58" width="225" height="186" rx="10" fill="#58a6ff" fill-opacity=".10" stroke="#58a6ff"/>
  <rect x="353" y="74" width="62" height="22" rx="11" fill="#58a6ff" fill-opacity=".18" stroke="#58a6ff" stroke-opacity=".7"/>
  <text x="384" y="89" fill="#79c0ff" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">TIER 3</text>
  <text x="353" y="122" fill="#e6edf3" font-size="16" font-weight="600">C1 + profiling</text>
  <text x="353" y="148" fill="#c9d1d9" font-size="13">quick compile</text>
  <text x="353" y="167" fill="#c9d1d9" font-size="13">records branches and types</text>
  <line x1="349" y1="200" x2="550" y2="200" stroke="#30363d"/>
  <text x="353" y="224" fill="#8b949e" font-size="12">speed</text>
  <rect x="399" y="214" width="15" height="12" rx="2" fill="#d29922" fill-opacity=".85"/>
  <rect x="418" y="214" width="15" height="12" rx="2" fill="#d29922" fill-opacity=".85"/>
  <rect x="437" y="214" width="15" height="12" rx="2" fill="#d29922" fill-opacity=".85"/>
  <rect x="456" y="214" width="15" height="12" rx="2" fill="#30363d" fill-opacity=".6"/>
  <rect x="475" y="214" width="15" height="12" rx="2" fill="#30363d" fill-opacity=".6"/>
  <text x="546" y="224" fill="#e3b341" font-size="12" font-weight="700" text-anchor="end">fast</text>
  <rect x="650" y="58" width="225" height="186" rx="10" fill="#3fb950" fill-opacity=".10" stroke="#3fb950"/>
  <rect x="666" y="74" width="62" height="22" rx="11" fill="#3fb950" fill-opacity=".18" stroke="#3fb950" stroke-opacity=".7"/>
  <text x="697" y="89" fill="#56d364" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">TIER 4</text>
  <text x="666" y="122" fill="#e6edf3" font-size="16" font-weight="600">C2</text>
  <text x="666" y="148" fill="#c9d1d9" font-size="13">heavy optimizations from</text>
  <text x="666" y="167" fill="#c9d1d9" font-size="13">the profile (inlining,</text>
  <text x="666" y="186" fill="#c9d1d9" font-size="13">escape analysis)</text>
  <line x1="662" y1="200" x2="863" y2="200" stroke="#30363d"/>
  <text x="666" y="224" fill="#8b949e" font-size="12">speed</text>
  <rect x="712" y="214" width="15" height="12" rx="2" fill="#3fb950" fill-opacity=".85"/>
  <rect x="731" y="214" width="15" height="12" rx="2" fill="#3fb950" fill-opacity=".85"/>
  <rect x="750" y="214" width="15" height="12" rx="2" fill="#3fb950" fill-opacity=".85"/>
  <rect x="769" y="214" width="15" height="12" rx="2" fill="#3fb950" fill-opacity=".85"/>
  <rect x="788" y="214" width="15" height="12" rx="2" fill="#3fb950" fill-opacity=".85"/>
  <text x="859" y="224" fill="#56d364" font-size="12" font-weight="700" text-anchor="end">fastest</text>
  <line x1="253" y1="128" x2="333" y2="128" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="293.0" y="118" fill="#e6edf3" font-size="12" font-weight="600" text-anchor="middle">~200 calls</text>
  <line x1="566" y1="128" x2="646" y2="128" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="606.0" y="118" fill="#e6edf3" font-size="12" font-weight="600" text-anchor="middle">~5,000 calls</text>
  <path d="M762.5,244 L762.5,292 L136.5,292 L136.5,248" fill="none" stroke="#f85149" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrR)"/>
  <text x="449.5" y="282" fill="#ff7b72" font-size="13" font-weight="600" text-anchor="middle">deoptimize when an assumption breaks (e.g. new subclass)</text>
  <rect x="24" y="314" width="852" height="36" rx="8" fill="#d29922" fill-opacity=".10" stroke="#d29922" stroke-opacity=".7"/>
  <text x="44" y="337" fill="#e3b341" font-size="13"><tspan font-weight="700">⚠ </tspan>compiler threads use CPU while the app is starting</text>
</svg>
