<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Java LTS timeline</title>
  <desc>Java release timeline from 2014 to 2025. LTS releases: Java 8 (Mar 2014): lambdas, Streams, Optional, java.time, default methods. Java 11 (Sep 2018): var (from 10), List.of (from 9), modules (from 9), HttpClient, new String methods. Java 17 (Sep 2021): records, sealed classes, switch expressions, text blocks, pattern matching for instanceof. Java 21 (Sep 2023): virtual threads, pattern matching for switch, record patterns, sequenced collections, generational ZGC. Java 25 (Sep 2025): scoped values, compact source files, flexible constructor bodies, compact object headers. Non-LTS releases 9, 10, 12 to 16, 18 to 20 and 22 to 24 are small ticks. A new release ships every 6 months since Java 10; an LTS every 2 years since Java 17.</desc>
