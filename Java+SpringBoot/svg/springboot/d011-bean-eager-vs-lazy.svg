<svg xmlns="http://www.w3.org/2000/svg" width="920" height="630" viewBox="0 0 920 630" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Eager vs lazy bean initialization</title>
  <desc>Two timelines. Eager, the default for singletons: app starts, refresh() creates ALL singletons (orderService, paymentClient, pdfReportService), Ready, and the 1st request is fast. Config errors fail at startup, before any traffic; but startup is slower and unused beans are built anyway. Lazy (@Lazy or spring.main.lazy-initialization=true): app starts, refresh() creates only non-lazy beans (orderService, paymentClient; pdfReportService not yet), Ready sooner, the 1st request that uses PdfReportService creates the bean now (slow first call), later calls are normal. A broken bean only fails when first used, in production. Inset: @Lazy on an injection point injects a proxy now; a lazy bean is then created on the first method call.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="919" height="629" rx="14" fill="#161b22" stroke="#30363d"/>

  <!-- time axis -->
  <text x="24" y="35" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">TIME</text>
  <line x1="74" y1="30" x2="894" y2="30" stroke="#484f58" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ===== EAGER lane ===== -->
  <rect x="24" y="50" width="872" height="242" rx="10" fill="#1c2128" stroke="#30363d"/>
  <path d="M34,50 H886 A10,10 0 0 1 896,60 V84 H24 V60 A10,10 0 0 1 34,50 Z" fill="#58a6ff" fill-opacity=".14" stroke="#58a6ff" stroke-opacity=".6"/>
  <text x="42" y="72" fill="#79c0ff" font-size="14" font-weight="700">EAGER <tspan font-size="13" font-weight="400" fill="#8b949e">(default for singletons)</tspan></text>

  <rect x="40" y="142" width="92" height="44" rx="8" fill="#161b22" stroke="#484f58"/>
  <text x="86" y="168.5" fill="#e6edf3" font-size="13" font-weight="600" text-anchor="middle">app starts</text>
  <line x1="132" y1="164" x2="158" y2="164" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="158" y="100" width="320" height="128" rx="10" fill="#58a6ff" fill-opacity=".08" stroke="#58a6ff" stroke-opacity=".75"/>
  <text x="172" y="122" fill="#79c0ff" font-size="13" font-weight="600" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">refresh()</text>
  <text x="172" y="141" fill="#c9d1d9" font-size="13">create <tspan font-weight="700" fill="#e6edf3">ALL</tspan> singletons</text>
  <rect x="172" y="154" width="108" height="26" rx="13" fill="#58a6ff" fill-opacity=".14" stroke="#58a6ff" stroke-opacity=".8"/>
  <text x="226" y="171.5" fill="#79c0ff" font-size="12" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">orderService</text>
  <rect x="288" y="154" width="116" height="26" rx="13" fill="#58a6ff" fill-opacity=".14" stroke="#58a6ff" stroke-opacity=".8"/>
  <text x="346" y="171.5" fill="#79c0ff" font-size="12" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">paymentClient</text>
  <rect x="172" y="188" width="142" height="26" rx="13" fill="#58a6ff" fill-opacity=".14" stroke="#58a6ff" stroke-opacity=".8"/>
  <text x="243" y="205.5" fill="#79c0ff" font-size="12" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">pdfReportService</text>
  <line x1="478" y1="164" x2="504" y2="164" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="504" y="142" width="96" height="44" rx="8" fill="#161b22" stroke="#484f58"/>
  <text x="552" y="168.5" fill="#e6edf3" font-size="13" font-weight="600" text-anchor="middle">Ready</text>
  <line x1="600" y1="164" x2="626" y2="164" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="626" y="142" width="160" height="44" rx="8" fill="#3fb950" fill-opacity=".12" stroke="#3fb950" stroke-opacity=".8"/>
  <text x="706" y="168.5" fill="#56d364" font-size="13" font-weight="600" text-anchor="middle">1st request: fast</text>

  <rect x="40" y="244" width="400" height="32" rx="8" fill="#3fb950" fill-opacity=".10" stroke="#3fb950" stroke-opacity=".7"/>
  <text x="54" y="265" fill="#56d364" font-size="13">✓  config errors fail at startup, before any traffic</text>
  <rect x="452" y="244" width="380" height="32" rx="8" fill="#d29922" fill-opacity=".10" stroke="#d29922" stroke-opacity=".7"/>
  <text x="466" y="265" fill="#e3b341" font-size="13">⚠  slower startup · unused beans are built anyway</text>

  <!-- ===== LAZY lane ===== -->
  <rect x="24" y="308" width="872" height="242" rx="10" fill="#1c2128" stroke="#30363d"/>
  <path d="M34,308 H886 A10,10 0 0 1 896,318 V342 H24 V318 A10,10 0 0 1 34,308 Z" fill="#bc8cff" fill-opacity=".14" stroke="#bc8cff" stroke-opacity=".6"/>
  <text x="42" y="330" fill="#d2a8ff" font-size="14" font-weight="700">LAZY <tspan font-size="13" font-weight="400" fill="#8b949e">(</tspan><tspan font-size="12.5" font-weight="400" fill="#d2a8ff" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">@Lazy</tspan><tspan font-size="13" font-weight="400" fill="#8b949e"> or </tspan><tspan font-size="12.5" font-weight="400" fill="#d2a8ff" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">spring.main.lazy-initialization=true</tspan><tspan font-size="13" font-weight="400" fill="#8b949e">)</tspan></text>

  <rect x="40" y="400" width="92" height="44" rx="8" fill="#161b22" stroke="#484f58"/>
  <text x="86" y="426.5" fill="#e6edf3" font-size="13" font-weight="600" text-anchor="middle">app starts</text>
  <line x1="132" y1="422" x2="158" y2="422" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="158" y="358" width="260" height="128" rx="10" fill="#58a6ff" fill-opacity=".08" stroke="#58a6ff" stroke-opacity=".75"/>
  <text x="172" y="380" fill="#79c0ff" font-size="13" font-weight="600" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">refresh()</text>
  <text x="172" y="399" fill="#c9d1d9" font-size="13">create only <tspan font-weight="700" fill="#e6edf3">non-lazy</tspan> beans</text>
  <rect x="172" y="412" width="108" height="26" rx="13" fill="#58a6ff" fill-opacity=".14" stroke="#58a6ff" stroke-opacity=".8"/>
  <text x="226" y="429.5" fill="#79c0ff" font-size="12" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">orderService</text>
  <rect x="288" y="412" width="116" height="26" rx="13" fill="#58a6ff" fill-opacity=".14" stroke="#58a6ff" stroke-opacity=".8"/>
  <text x="346" y="429.5" fill="#79c0ff" font-size="12" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">paymentClient</text>
  <rect x="172" y="446" width="142" height="26" rx="13" fill="none" stroke="#484f58" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="243" y="463.5" fill="#8b949e" font-size="12" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">pdfReportService</text>
  <text x="324" y="463.5" fill="#8b949e" font-size="12" font-style="italic">not yet</text>
  <line x1="418" y1="422" x2="444" y2="422" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="444" y="396" width="96" height="52" rx="8" fill="#3fb950" fill-opacity=".12" stroke="#3fb950" stroke-opacity=".8"/>
  <text x="492" y="418" fill="#56d364" font-size="13" font-weight="700" text-anchor="middle">Ready</text>
  <text x="492" y="436" fill="#56d364" font-size="12" text-anchor="middle">(sooner)</text>
  <line x1="540" y1="422" x2="566" y2="422" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="566" y="368" width="180" height="108" rx="9" fill="#d29922" fill-opacity=".10" stroke="#d29922" stroke-opacity=".8"/>
  <text x="656" y="390" fill="#c9d1d9" font-size="13" text-anchor="middle">1st request that uses</text>
  <text x="656" y="408" fill="#e3b341" font-size="12.5" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">PdfReportService:</text>
  <text x="656" y="426" fill="#e6edf3" font-size="13" font-weight="600" text-anchor="middle">bean created now</text>
  <rect x="598" y="438" width="116" height="22" rx="11" fill="#d29922" fill-opacity=".18" stroke="#d29922" stroke-opacity=".85"/>
  <text x="656" y="453" fill="#e3b341" font-size="12" text-anchor="middle">slow first call</text>
  <line x1="746" y1="422" x2="772" y2="422" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="772" y="396" width="108" height="52" rx="8" fill="#161b22" stroke="#484f58"/>
  <text x="826" y="418" fill="#e6edf3" font-size="13" font-weight="600" text-anchor="middle">later calls:</text>
  <text x="826" y="436" fill="#c9d1d9" font-size="13" text-anchor="middle">normal</text>

  <rect x="40" y="502" width="446" height="32" rx="8" fill="#f85149" fill-opacity=".10" stroke="#f85149" stroke-opacity=".7"/>
  <text x="54" y="523" fill="#ff7b72" font-size="13">✗  a broken bean only fails when first used — in production</text>

  <!-- inset -->
  <rect x="24" y="566" width="872" height="40" rx="8" fill="#58a6ff" fill-opacity=".06" stroke="#58a6ff" stroke-opacity=".7" stroke-dasharray="5 3"/>
  <text x="40" y="591" fill="#c9d1d9" font-size="13"><tspan fill="#79c0ff" font-size="12.5" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">@Lazy</tspan> on an injection point → a proxy is injected now; a lazy bean is then created on the first method call</text>
</svg>
