<svg xmlns="http://www.w3.org/2000/svg" width="900" height="552" viewBox="0 0 900 552" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>DispatcherServlet request flow</title>
  <desc>Request flow in Spring MVC. Client sends the request through the Filters (servlet level: security, CORS, logging) to the DispatcherServlet, the front controller. The DispatcherServlet: 1 asks HandlerMapping which method handles POST /orders; 2 calls HandlerInterceptor.preHandle(); 3 calls the HandlerAdapter, which binds @RequestBody / @PathVariable and validates @Valid; 4 the adapter invokes the @RestController method, which returns an object; 5 HttpMessageConverter (Jackson) turns it into JSON; 6 postHandle / afterCompletion run; the response goes back through the filters to the client. Exception branch: if the controller throws, the @RestControllerAdvice @ExceptionHandler produces an error JSON. Legend: Filter = servlet container, sees every request; Interceptor = Spring MVC, knows the handler method.</desc>
  <defs>
    <marker id="a_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker>
    <marker id="a_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
    <marker id="a_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker>
    <marker id="a_amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d29922"/></marker>
    <marker id="a_purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/></marker>
    <marker id="a_teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39c5cf"/></marker>
    <marker id="a_orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker>
    <marker id="a_gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="551" rx="14" fill="#161b22" stroke="#30363d"/>
  <rect x="24" y="24" width="78" height="438" rx="10" fill="#161b22" stroke="#484f58"/>
  <text x="63" y="60" fill="#79c0ff" font-size="12" text-anchor="middle">request</text>
  <text x="63" y="410" fill="#56d364" font-size="12" text-anchor="middle">response</text>
  <text x="63" y="248.0" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle">Client</text>
  <rect x="132" y="24" width="130" height="438" rx="10" fill="#f0883e" fill-opacity="0.06" stroke="#f0883e" stroke-opacity="0.6"/>
  <text x="197.0" y="193.0" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle">Filters</text>
  <text x="197.0" y="212.0" fill="#8b949e" font-size="12" text-anchor="middle">(servlet level)</text>
  <rect x="151.0" y="227.0" width="92" height="24" rx="12" fill="#f0883e" fill-opacity="0.1" stroke="#f0883e" stroke-opacity="0.6"/>
  <text x="197.0" y="243.5" fill="#ffa657" font-size="12" text-anchor="middle">security</text>
  <rect x="151.0" y="259.0" width="92" height="24" rx="12" fill="#f0883e" fill-opacity="0.1" stroke="#f0883e" stroke-opacity="0.6"/>
  <text x="197.0" y="275.5" fill="#ffa657" font-size="12" text-anchor="middle">CORS</text>
  <rect x="151.0" y="291.0" width="92" height="24" rx="12" fill="#f0883e" fill-opacity="0.1" stroke="#f0883e" stroke-opacity="0.6"/>
  <text x="197.0" y="307.5" fill="#ffa657" font-size="12" text-anchor="middle">logging</text>
  <rect x="292" y="24" width="164" height="438" rx="10" fill="#58a6ff" fill-opacity="0.14" stroke="#58a6ff" stroke-opacity="0.9"/>
  <text x="374.0" y="239.0" fill="#79c0ff" font-size="13.5" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">DispatcherServlet</text>
  <text x="374.0" y="259.0" fill="#c9d1d9" font-size="12.5" text-anchor="middle">front controller</text>
  <line x1="102" y1="70" x2="130" y2="70" stroke="#58a6ff" stroke-width="1.8" marker-end="url(#a_blue)"/>
  <line x1="262" y1="70" x2="290" y2="70" stroke="#58a6ff" stroke-width="1.8" marker-end="url(#a_blue)"/>
  <line x1="132" y1="420" x2="104" y2="420" stroke="#3fb950" stroke-width="1.8" marker-end="url(#a_green)"/>
  <line x1="292" y1="420" x2="264" y2="420" stroke="#3fb950" stroke-width="1.8" marker-end="url(#a_green)"/>
  <rect x="488" y="24" width="388" height="56" rx="9" fill="#1c2128" stroke="#30363d"/>
  <circle cx="508" cy="52.0" r="9" fill="#d29922" fill-opacity=".22" stroke="#d29922"/>
  <text x="508" y="56.0" fill="#e3b341" font-size="11" font-weight="700" text-anchor="middle">1</text>
  <text x="528" y="47" fill="#e6edf3" font-size="13" font-weight="600" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">HandlerMapping</text>
  <text x="528" y="67" fill="#8b949e" font-size="12.5">which method handles POST /orders?</text>
  <rect x="488" y="94" width="388" height="40" rx="9" fill="#bc8cff" fill-opacity="0.08" stroke="#bc8cff" stroke-opacity="0.6"/>
  <circle cx="508" cy="114.0" r="9" fill="#d29922" fill-opacity=".22" stroke="#d29922"/>
  <text x="508" y="118.0" fill="#e3b341" font-size="11" font-weight="700" text-anchor="middle">2</text>
  <text x="528" y="119" fill="#d2a8ff" font-size="13" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">HandlerInterceptor.preHandle()</text>
  <rect x="488" y="148" width="388" height="76" rx="9" fill="#1c2128" stroke="#30363d"/>
  <circle cx="508" cy="186.0" r="9" fill="#d29922" fill-opacity=".22" stroke="#d29922"/>
  <text x="508" y="190.0" fill="#e3b341" font-size="11" font-weight="700" text-anchor="middle">3</text>
  <text x="528" y="172" fill="#e6edf3" font-size="13" font-weight="600" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">HandlerAdapter</text>
  <text x="528" y="192" fill="#c9d1d9" font-size="12.5">binds @RequestBody / @PathVariable</text>
  <text x="528" y="211" fill="#c9d1d9" font-size="12.5">validates @Valid</text>
  <rect x="488" y="254" width="156" height="80" rx="9" fill="#3fb950" fill-opacity="0.08" stroke="#3fb950" stroke-opacity="0.6"/>
  <circle cx="508" cy="294.0" r="9" fill="#d29922" fill-opacity=".22" stroke="#d29922"/>
  <text x="508" y="298.0" fill="#e3b341" font-size="11" font-weight="700" text-anchor="middle">4</text>
  <text x="528" y="289" fill="#56d364" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">@RestController</text>
  <text x="528" y="308" fill="#c9d1d9" font-size="13">method</text>
  <rect x="694" y="254" width="182" height="80" rx="9" fill="#f85149" fill-opacity="0.1" stroke="#f85149" stroke-opacity="0.75"/>
  <text x="706" y="278" fill="#ff7b72" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">@RestControllerAdvice</text>
  <text x="706" y="298" fill="#ff7b72" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">@ExceptionHandler</text>
  <text x="706" y="320" fill="#e6edf3" font-size="13" font-weight="600">→ error JSON</text>
  <line x1="644" y1="294.0" x2="692" y2="294.0" stroke="#f85149" stroke-width="1.8" marker-end="url(#a_red)"/>
  <text x="669.0" y="286.0" fill="#ff7b72" font-size="12" font-weight="600" text-anchor="middle">throws</text>
  <line x1="528" y1="224" x2="528" y2="252" stroke="#8b949e" stroke-width="1.8" marker-end="url(#a_gray)"/>
  <line x1="528" y1="334" x2="528" y2="362" stroke="#8b949e" stroke-width="1.8" marker-end="url(#a_gray)"/>
  <text x="538" y="354" fill="#8b949e" font-size="12">returns object</text>
  <rect x="488" y="364" width="388" height="44" rx="9" fill="#1c2128" stroke="#30363d"/>
  <circle cx="508" cy="386.0" r="9" fill="#d29922" fill-opacity=".22" stroke="#d29922"/>
  <text x="508" y="390.0" fill="#e3b341" font-size="11" font-weight="700" text-anchor="middle">5</text>
  <text x="528" y="391" fill="#c9d1d9" font-size="13"><tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" fill="#e6edf3" font-weight="600">HttpMessageConverter</tspan> (Jackson) → JSON</text>
  <rect x="488" y="422" width="388" height="40" rx="9" fill="#bc8cff" fill-opacity="0.08" stroke="#bc8cff" stroke-opacity="0.6"/>
  <circle cx="508" cy="442.0" r="9" fill="#d29922" fill-opacity=".22" stroke="#d29922"/>
  <text x="508" y="446.0" fill="#e3b341" font-size="11" font-weight="700" text-anchor="middle">6</text>
  <text x="528" y="447" fill="#d2a8ff" font-size="13" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">postHandle / afterCompletion</text>
  <line x1="456" y1="52" x2="486" y2="52" stroke="#8b949e" stroke-width="1.8" marker-end="url(#a_gray)"/>
  <line x1="456" y1="114" x2="486" y2="114" stroke="#8b949e" stroke-width="1.8" marker-end="url(#a_gray)"/>
  <line x1="456" y1="186" x2="486" y2="186" stroke="#8b949e" stroke-width="1.8" marker-end="url(#a_gray)"/>
  <line x1="456" y1="442" x2="486" y2="442" stroke="#8b949e" stroke-width="1.8" marker-end="url(#a_gray)"/>
  <text x="472.0" y="44" fill="#8b949e" font-size="11.5" text-anchor="middle">asks</text>
  <rect x="24" y="486" width="852" height="42" rx="9" fill="#1c2128" stroke="#30363d"/>
  <rect x="40" y="501" width="12" height="12" rx="3" fill="#f0883e" fill-opacity="0.2" stroke="#f0883e" stroke-opacity="0.8"/>
  <text x="60" y="512" fill="#c9d1d9" font-size="12.5"><tspan fill="#e6edf3" font-weight="600">Filter</tspan> = servlet container, sees every request</text>
  <rect x="452" y="501" width="12" height="12" rx="3" fill="#bc8cff" fill-opacity="0.2" stroke="#bc8cff" stroke-opacity="0.8"/>
  <text x="472" y="512" fill="#c9d1d9" font-size="12.5"><tspan fill="#e6edf3" font-weight="600">Interceptor</tspan> = Spring MVC, knows the handler method</text>
</svg>
