<svg xmlns="http://www.w3.org/2000/svg" width="920" height="736" viewBox="0 0 920 736" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Spring Boot startup sequence</title>
  <desc>Timeline of SpringApplication.run(ShopApplication.class, args). 1: main() calls SpringApplication.run(): detect app type (servlet, reactive or none) from the classpath, load initializers and listeners; event ApplicationStartingEvent. 2: Prepare the Environment: command-line args, env vars, application.yml, active profiles; event ApplicationEnvironmentPreparedEvent. 3: Print the banner. 4: Create the ApplicationContext: servlet app gets a web server application context; events ApplicationContextInitializedEvent and ApplicationPreparedEvent. 5: refresh(), the big step: a, read config classes (component scan, @Bean methods, auto-configuration conditions) into bean definitions; b, create the embedded web server (Tomcat); c, create all singleton beans: constructor, inject, @PostConstruct, AOP proxies; d, start the web server (port opens); event ContextRefreshedEvent. Any failure: ApplicationFailedEvent, a failure analyzer prints the cause, and the app exits. 6: Log 'Started ShopApplication in 2.1 seconds'; event ApplicationStartedEvent. 7: Run ApplicationRunner / CommandLineRunner beans. 8: Ready, readiness = ACCEPTING_TRAFFIC; event ApplicationReadyEvent.</desc>
  <defs>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="919" height="735" rx="14" fill="#161b22" stroke="#30363d"/>

  <rect x="24" y="20" width="460" height="34" rx="17" fill="#58a6ff" fill-opacity=".10" stroke="#58a6ff" stroke-opacity=".7"/>
  <text x="254" y="42" fill="#79c0ff" font-size="14" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">SpringApplication.run(ShopApplication.class, args)</text>
  <text x="24" y="84" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">STEPS</text>
  <text x="608" y="84" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">EVENTS PUBLISHED</text>

  <!-- spine -->
  <line x1="40" y1="106" x2="40" y2="668" stroke="#30363d" stroke-width="2"/>

  <!-- event guides -->
  <g stroke="#484f58" stroke-width="1.2" stroke-dasharray="2 4" fill="none">
    <line x1="336" y1="106" x2="604" y2="106"/>
    <line x1="262" y1="186" x2="604" y2="186"/>
    <path d="M308,290 H604 M592,290 V320 H604"/>
    <line x1="346" y1="525" x2="604" y2="525"/>
    <line x1="430" y1="584" x2="604" y2="584"/>
    <line x1="430" y1="668" x2="604" y2="668"/>
  </g>

  <!-- 1 -->
  <circle cx="40" cy="106" r="12" fill="#1c2128" stroke="#8b949e"/>
  <text x="40" y="110.5" fill="#e6edf3" font-size="12" font-weight="700" text-anchor="middle">1</text>
  <text x="70" y="111" fill="#e6edf3" font-size="13" font-weight="600" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">main() → SpringApplication.run()</text>
  <text x="70" y="131" fill="#c9d1d9" font-size="13">detect app type (servlet / reactive / none) from the classpath,</text>
  <text x="70" y="149" fill="#c9d1d9" font-size="13">load initializers and listeners</text>
  <rect x="608" y="95" width="288" height="22" rx="11" fill="#d29922" fill-opacity=".12" stroke="#d29922" stroke-opacity=".75"/>
  <text x="752" y="110.5" fill="#e3b341" font-size="12" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">ApplicationStartingEvent</text>

  <!-- 2 -->
  <circle cx="40" cy="186" r="12" fill="#1c2128" stroke="#8b949e"/>
  <text x="40" y="190.5" fill="#e6edf3" font-size="12" font-weight="700" text-anchor="middle">2</text>
  <text x="70" y="191" fill="#e6edf3" font-size="14" font-weight="600">Prepare the Environment</text>
  <text x="70" y="211" fill="#c9d1d9" font-size="13">command-line args, env vars, <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="12.5" fill="#79c0ff">application.yml</tspan>, active profiles</text>
  <rect x="608" y="175" width="288" height="22" rx="11" fill="#d29922" fill-opacity=".12" stroke="#d29922" stroke-opacity=".75"/>
  <text x="752" y="190.5" fill="#e3b341" font-size="12" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">ApplicationEnvironmentPreparedEvent</text>

  <!-- 3 -->
  <circle cx="40" cy="244" r="12" fill="#1c2128" stroke="#8b949e"/>
  <text x="40" y="248.5" fill="#e6edf3" font-size="12" font-weight="700" text-anchor="middle">3</text>
  <text x="70" y="249" fill="#e6edf3" font-size="14" font-weight="600">Print the banner</text>

  <!-- 4 -->
  <circle cx="40" cy="290" r="12" fill="#1c2128" stroke="#8b949e"/>
  <text x="40" y="294.5" fill="#e6edf3" font-size="12" font-weight="700" text-anchor="middle">4</text>
  <text x="70" y="295" fill="#e6edf3" font-size="14" font-weight="600">Create the ApplicationContext</text>
  <text x="70" y="315" fill="#c9d1d9" font-size="13">servlet app → web server application context</text>
  <rect x="608" y="279" width="288" height="22" rx="11" fill="#d29922" fill-opacity=".12" stroke="#d29922" stroke-opacity=".75"/>
  <text x="752" y="294.5" fill="#e3b341" font-size="12" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">ApplicationContextInitializedEvent</text>
  <rect x="608" y="309" width="288" height="22" rx="11" fill="#d29922" fill-opacity=".12" stroke="#d29922" stroke-opacity=".75"/>
  <text x="752" y="324.5" fill="#e3b341" font-size="12" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">ApplicationPreparedEvent</text>

  <!-- 5 refresh -->
  <rect x="64" y="352" width="524" height="196" rx="10" fill="#58a6ff" fill-opacity=".10" stroke="#58a6ff" stroke-opacity=".75"/>
  <circle cx="40" cy="376" r="12" fill="#1f3a5f" stroke="#58a6ff"/>
  <text x="40" y="380.5" fill="#79c0ff" font-size="12" font-weight="700" text-anchor="middle">5</text>
  <text x="80" y="381" fill="#e6edf3" font-size="14.5" font-weight="700"><tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" fill="#79c0ff">refresh()</tspan> — the big step</text>
  <line x1="64" y1="392" x2="588" y2="392" stroke="#58a6ff" stroke-opacity=".3"/>
  <text x="82" y="413" fill="#79c0ff" font-size="13" font-weight="700">a</text>
  <text x="102" y="413" fill="#c9d1d9" font-size="13">read config classes: component scan, <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="12.5" fill="#79c0ff">@Bean</tspan> methods,</text>
  <text x="102" y="431" fill="#c9d1d9" font-size="13">auto-configuration conditions → <tspan font-weight="700" fill="#e6edf3">bean definitions</tspan></text>
  <text x="82" y="459" fill="#79c0ff" font-size="13" font-weight="700">b</text>
  <text x="102" y="459" fill="#c9d1d9" font-size="13">create the embedded web server (Tomcat)</text>
  <text x="82" y="487" fill="#79c0ff" font-size="13" font-weight="700">c</text>
  <text x="102" y="487" fill="#c9d1d9" font-size="13">create all singleton beans: constructor → inject →</text>
  <text x="102" y="505" fill="#c9d1d9" font-size="13"><tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="12.5" fill="#79c0ff">@PostConstruct</tspan> → AOP proxies</text>
  <text x="82" y="530" fill="#79c0ff" font-size="13" font-weight="700">d</text>
  <text x="102" y="530" fill="#c9d1d9" font-size="13">start the web server (port opens)</text>
  <rect x="608" y="514" width="288" height="22" rx="11" fill="#58a6ff" fill-opacity=".14" stroke="#58a6ff" stroke-opacity=".8"/>
  <text x="752" y="529.5" fill="#79c0ff" font-size="12" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">ContextRefreshedEvent</text>

  <!-- failure branch -->
  <line x1="588" y1="376" x2="606" y2="376" stroke="#f85149" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrR)"/>
  <rect x="608" y="352" width="288" height="98" rx="9" fill="#f85149" fill-opacity=".10" stroke="#f85149" stroke-opacity=".8" stroke-dasharray="5 3"/>
  <text x="622" y="374" fill="#ff7b72" font-size="13" font-weight="700">✗ any failure →</text>
  <text x="622" y="395" fill="#ff7b72" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">ApplicationFailedEvent</text>
  <text x="622" y="415" fill="#c9d1d9" font-size="13">failure analyzer prints the cause,</text>
  <text x="622" y="434" fill="#c9d1d9" font-size="13">app exits</text>

  <!-- 6 -->
  <circle cx="40" cy="584" r="12" fill="#1c2128" stroke="#8b949e"/>
  <text x="40" y="588.5" fill="#e6edf3" font-size="12" font-weight="700" text-anchor="middle">6</text>
  <text x="70" y="589" fill="#e6edf3" font-size="14" font-weight="600">Log <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="12.5" font-weight="400" fill="#79c0ff">'Started ShopApplication in 2.1 seconds'</tspan></text>
  <rect x="608" y="573" width="288" height="22" rx="11" fill="#d29922" fill-opacity=".12" stroke="#d29922" stroke-opacity=".75"/>
  <text x="752" y="588.5" fill="#e3b341" font-size="12" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">ApplicationStartedEvent</text>

  <!-- 7 -->
  <circle cx="40" cy="626" r="12" fill="#1c2128" stroke="#8b949e"/>
  <text x="40" y="630.5" fill="#e6edf3" font-size="12" font-weight="700" text-anchor="middle">7</text>
  <text x="70" y="631" fill="#e6edf3" font-size="14" font-weight="600">Run <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="12.5" font-weight="400" fill="#79c0ff">ApplicationRunner</tspan> / <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="12.5" font-weight="400" fill="#79c0ff">CommandLineRunner</tspan> beans</text>

  <!-- 8 -->
  <circle cx="40" cy="668" r="12" fill="#12361f" stroke="#3fb950"/>
  <text x="40" y="672.5" fill="#56d364" font-size="12" font-weight="700" text-anchor="middle">8</text>
  <rect x="64" y="652" width="356" height="32" rx="8" fill="#3fb950" fill-opacity=".12" stroke="#3fb950" stroke-opacity=".8"/>
  <text x="80" y="673" fill="#56d364" font-size="14" font-weight="700">✓ Ready: <tspan font-weight="400" fill="#c9d1d9">readiness = </tspan><tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="12.5" fill="#56d364">ACCEPTING_TRAFFIC</tspan></text>
  <rect x="608" y="657" width="288" height="22" rx="11" fill="#d29922" fill-opacity=".12" stroke="#d29922" stroke-opacity=".75"/>
  <text x="752" y="672.5" fill="#e3b341" font-size="12" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">ApplicationReadyEvent</text>

  <!-- legend -->
  <line x1="24" y1="700" x2="896" y2="700" stroke="#21262d"/>
  <rect x="24" y="711" width="26" height="12" rx="6" fill="#d29922" fill-opacity=".12" stroke="#d29922" stroke-opacity=".75"/>
  <text x="58" y="721.5" fill="#8b949e" font-size="12">Spring Boot event (SpringApplicationEvent)</text>
  <rect x="330" y="711" width="26" height="12" rx="6" fill="#58a6ff" fill-opacity=".14" stroke="#58a6ff" stroke-opacity=".8"/>
  <text x="364" y="721.5" fill="#8b949e" font-size="12">Spring Framework context event</text>
</svg>
