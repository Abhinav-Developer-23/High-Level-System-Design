<svg xmlns="http://www.w3.org/2000/svg" width="920" height="528" viewBox="0 0 920 528" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Anatomy of @SpringBootApplication</title>
  <desc>@SpringBootApplication on class ShopApplication is one annotation that equals three. 1: @SpringBootConfiguration is a @Configuration, so this class can hold @Bean methods; chain @SpringBootConfiguration to @Configuration to @Component. 2: @EnableAutoConfiguration loads auto-configurations listed by starters and keeps those whose conditions match; it is meta-annotated with @AutoConfigurationPackage and @Import(AutoConfigurationImportSelector.class). 3: @ComponentScan scans com.example.shop and sub-packages for @Component classes. Plus plain Java meta-annotations: @Target, @Retention, @Documented, @Inherited. Attributes: exclude, scanBasePackages, proxyBeanMethods.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="919" height="527" rx="14" fill="#161b22" stroke="#30363d"/>

  <!-- top -->
  <text x="24" y="40" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">YOUR MAIN CLASS</text>
  <rect x="270" y="24" width="380" height="70" rx="10" fill="#58a6ff" fill-opacity=".12" stroke="#58a6ff" stroke-opacity=".75"/>
  <text x="460" y="53" fill="#79c0ff" font-size="16" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">@SpringBootApplication</text>
  <text x="460" y="78" fill="#c9d1d9" font-size="13" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">public class ShopApplication { … }</text>
  <rect x="668" y="48" width="140" height="22" rx="11" fill="#d29922" fill-opacity=".14" stroke="#d29922" stroke-opacity=".8"/>
  <text x="738" y="63.5" fill="#e3b341" font-size="12" font-weight="700" text-anchor="middle">1 annotation = 3</text>

  <!-- connectors -->
  <line x1="460" y1="94" x2="460" y2="114" stroke="#8b949e" stroke-width="1.8"/>
  <line x1="152" y1="114" x2="768" y2="114" stroke="#8b949e" stroke-width="1.8"/>
  <line x1="152" y1="114" x2="152" y2="138" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="460" y1="114" x2="460" y2="138" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="768" y1="114" x2="768" y2="138" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- child 1 -->
  <rect x="24" y="140" width="256" height="256" rx="10" fill="#1c2128" stroke="#bc8cff" stroke-opacity=".6"/>
  <circle cx="48" cy="166" r="11" fill="#bc8cff" fill-opacity=".2" stroke="#bc8cff"/>
  <text x="48" y="170.5" fill="#d2a8ff" font-size="12" font-weight="700" text-anchor="middle">1</text>
  <text x="66" y="171" fill="#d2a8ff" font-size="13" font-weight="700" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">@SpringBootConfiguration</text>
  <line x1="24" y1="188" x2="280" y2="188" stroke="#30363d"/>
  <text x="38" y="212" fill="#c9d1d9" font-size="13">is a <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="12.5" fill="#79c0ff">@Configuration</tspan></text>
  <text x="38" y="231" fill="#c9d1d9" font-size="13">→ this class can hold</text>
  <text x="38" y="250" fill="#c9d1d9" font-size="13"><tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="12.5" fill="#79c0ff">@Bean</tspan> methods</text>
  <rect x="54" y="270" width="196" height="24" rx="6" fill="#bc8cff" fill-opacity=".12" stroke="#bc8cff" stroke-opacity=".7"/>
  <text x="152" y="286.5" fill="#d2a8ff" font-size="12" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">@SpringBootConfiguration</text>
  <line x1="152" y1="294" x2="152" y2="312" stroke="#bc8cff" stroke-width="1.6" marker-end="url(#arrP)"/>
  <rect x="91" y="314" width="122" height="24" rx="6" fill="#bc8cff" fill-opacity=".12" stroke="#bc8cff" stroke-opacity=".7"/>
  <text x="152" y="330.5" fill="#d2a8ff" font-size="12" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">@Configuration</text>
  <line x1="152" y1="338" x2="152" y2="356" stroke="#bc8cff" stroke-width="1.6" marker-end="url(#arrP)"/>
  <rect x="105" y="358" width="94" height="24" rx="6" fill="#bc8cff" fill-opacity=".12" stroke="#bc8cff" stroke-opacity=".7"/>
  <text x="152" y="374.5" fill="#d2a8ff" font-size="12" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">@Component</text>

  <!-- child 2 -->
  <rect x="292" y="140" width="336" height="256" rx="10" fill="#1c2128" stroke="#3fb950" stroke-opacity=".6"/>
  <circle cx="316" cy="166" r="11" fill="#3fb950" fill-opacity=".2" stroke="#3fb950"/>
  <text x="316" y="170.5" fill="#56d364" font-size="12" font-weight="700" text-anchor="middle">2</text>
  <text x="334" y="171" fill="#56d364" font-size="13" font-weight="700" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">@EnableAutoConfiguration</text>
  <line x1="292" y1="188" x2="628" y2="188" stroke="#30363d"/>
  <text x="306" y="212" fill="#c9d1d9" font-size="13">loads auto-configurations listed by</text>
  <text x="306" y="231" fill="#c9d1d9" font-size="13">starters, keeps those whose</text>
  <text x="306" y="250" fill="#c9d1d9" font-size="13">conditions match</text>
  <rect x="306" y="266" width="308" height="116" rx="8" fill="#161b22" stroke="#3fb950" stroke-opacity=".4"/>
  <text x="320" y="286" fill="#8b949e" font-size="11" font-weight="700" letter-spacing="1.2">META-ANNOTATED WITH</text>
  <text x="320" y="308" fill="#79c0ff" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">@AutoConfigurationPackage</text>
  <text x="320" y="330" fill="#79c0ff" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">@Import(</text>
  <text x="336" y="348" fill="#79c0ff" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">AutoConfigurationImportSelector</text>
  <text x="336" y="366" fill="#79c0ff" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">.class)</text>

  <!-- child 3 -->
  <rect x="640" y="140" width="256" height="256" rx="10" fill="#1c2128" stroke="#39c5cf" stroke-opacity=".6"/>
  <circle cx="664" cy="166" r="11" fill="#39c5cf" fill-opacity=".2" stroke="#39c5cf"/>
  <text x="664" y="170.5" fill="#56d4dd" font-size="12" font-weight="700" text-anchor="middle">3</text>
  <text x="682" y="171" fill="#56d4dd" font-size="13" font-weight="700" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">@ComponentScan</text>
  <line x1="640" y1="188" x2="896" y2="188" stroke="#30363d"/>
  <text x="654" y="212" fill="#c9d1d9" font-size="13">scans <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="12.5" fill="#79c0ff">com.example.shop</tspan></text>
  <text x="654" y="231" fill="#c9d1d9" font-size="13">and sub-packages for</text>
  <text x="654" y="250" fill="#c9d1d9" font-size="13"><tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="12.5" fill="#79c0ff">@Component</tspan> classes</text>
  <text x="654" y="276" fill="#8b949e" font-size="12">(the package of ShopApplication)</text>

  <!-- footer -->
  <rect x="24" y="414" width="872" height="34" rx="8" fill="none" stroke="#484f58" stroke-dasharray="4 3"/>
  <text x="40" y="436" fill="#8b949e" font-size="13">+ plain Java meta-annotations:  <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="12.5">@Target · @Retention · @Documented · @Inherited</tspan></text>
  <text x="24" y="489" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">ATTRIBUTES</text>
  <rect x="134" y="472" width="78" height="24" rx="6" fill="#1c2128" stroke="#30363d"/>
  <text x="173" y="488.5" fill="#79c0ff" font-size="12" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">exclude</text>
  <text x="224" y="488.5" fill="#8b949e" font-size="13" text-anchor="middle">·</text>
  <rect x="236" y="472" width="140" height="24" rx="6" fill="#1c2128" stroke="#30363d"/>
  <text x="306" y="488.5" fill="#79c0ff" font-size="12" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">scanBasePackages</text>
  <text x="388" y="488.5" fill="#8b949e" font-size="13" text-anchor="middle">·</text>
  <rect x="400" y="472" width="140" height="24" rx="6" fill="#1c2128" stroke="#30363d"/>
  <text x="470" y="488.5" fill="#79c0ff" font-size="12" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">proxyBeanMethods</text>
</svg>
