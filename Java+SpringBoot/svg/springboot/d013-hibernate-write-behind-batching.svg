<svg xmlns="http://www.w3.org/2000/svg" width="920" height="604" viewBox="0 0 920 604" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Hibernate write-behind and JDBC batching in one request</title>
  <desc>One API call is one transaction. POST /orders with 100 line items calls repo.save(item) 100 times inside @Transactional. The persistence context queues INSERT × 100 and sends no SQL yet. At commit Hibernate flushes and the statements go to the database; 200 OK is returned only after commit. Left: default, batch_size not set: 100 separate inserts, each its own round trip, about 100 ms of network wait at 1 ms RTT. Right: hibernate.jdbc.batch_size=50: two executeBatch calls of 50 inserts each, 2 round trips, about 2 ms plus DB work. Write-behind is always on; JDBC batching is off until you set hibernate.jdbc.batch_size. MySQL needs rewriteBatchedStatements=true so each batch becomes one multi-row insert. No waiting: a batch holds only this transaction's statements and is sent before commit, before the response.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="919" height="603" rx="14" fill="#161b22" stroke="#30363d"/>

  <!-- ===== top flow ===== -->
  <text x="24" y="40" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">ONE API CALL = ONE TRANSACTION</text>

  <rect x="24" y="56" width="136" height="68" rx="9" fill="#1c2128" stroke="#30363d"/>
  <text x="92" y="84" fill="#e6edf3" font-size="13" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">POST /orders</text>
  <text x="92" y="106" fill="#8b949e" font-size="12" text-anchor="middle">100 line items</text>

  <rect x="188" y="56" width="180" height="68" rx="9" fill="#1c2128" stroke="#30363d"/>
  <text x="278" y="84" fill="#d2a8ff" font-size="13" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">@Transactional</text>
  <text x="278" y="106" fill="#e6edf3" font-size="12" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">repo.save(item) ×100</text>

  <rect x="396" y="56" width="200" height="68" rx="9" fill="#bc8cff" fill-opacity=".12" stroke="#bc8cff" stroke-opacity=".7"/>
  <text x="496" y="78" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle">persistence context</text>
  <text x="496" y="97" fill="#d2a8ff" font-size="12" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">INSERT ×100 queued</text>
  <text x="496" y="115" fill="#8b949e" font-size="12" text-anchor="middle">no SQL sent yet</text>

  <rect x="624" y="56" width="120" height="68" rx="9" fill="#1c2128" stroke="#30363d"/>
  <text x="684" y="84" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle">commit</text>
  <text x="684" y="106" fill="#79c0ff" font-size="12" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">→ flush</text>

  <rect x="772" y="56" width="124" height="68" rx="9" fill="#39c5cf" fill-opacity=".12" stroke="#39c5cf" stroke-opacity=".7"/>
  <text x="834" y="84" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle">database</text>
  <text x="834" y="106" fill="#56d4dd" font-size="12" text-anchor="middle">MySQL</text>

  <g stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)">
    <line x1="160" y1="90" x2="186" y2="90"/>
    <line x1="368" y1="90" x2="394" y2="90"/>
    <line x1="596" y1="90" x2="622" y2="90"/>
    <line x1="744" y1="90" x2="770" y2="90"/>
  </g>
  <path d="M834,124 V156 H92 V128" fill="none" stroke="#3fb950" stroke-width="1.6" marker-end="url(#arrG)"/>
  <rect x="352" y="146" width="216" height="20" rx="4" fill="#161b22"/>
  <text x="460" y="161" fill="#56d364" font-size="13" font-weight="600" text-anchor="middle">200 OK only after commit</text>

  <!-- ===== LEFT: default ===== -->
  <rect x="24" y="190" width="430" height="316" rx="10" fill="#1c2128" stroke="#30363d"/>
  <path d="M34,190 H444 A10,10 0 0 1 454,200 V224 H24 V200 A10,10 0 0 1 34,190 Z" fill="#f85149" fill-opacity=".14" stroke="#f85149" stroke-opacity=".6"/>
  <text x="42" y="212" fill="#ff7b72" font-size="14" font-weight="700">Default: batch_size not set</text>

  <text x="70" y="254" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">APP</text>
  <text x="408" y="254" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">DB</text>
  <line x1="70" y1="262" x2="70" y2="410" stroke="#484f58" stroke-dasharray="4 3"/>
  <line x1="408" y1="262" x2="408" y2="410" stroke="#484f58" stroke-dasharray="4 3"/>
  <g font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" fill="#e6edf3" text-anchor="middle">
    <text x="239" y="280">insert into order_item … (1)</text>
    <text x="239" y="310">insert into order_item … (2)</text>
    <text x="239" y="340">insert into order_item … (3)</text>
    <text x="239" y="372" fill="#8b949e">⋮</text>
    <text x="239" y="394">insert into order_item … (100)</text>
  </g>
  <g stroke="#f85149" stroke-opacity=".8" stroke-width="1.4" marker-end="url(#arrR)">
    <line x1="72" y1="288" x2="404" y2="288"/>
    <line x1="72" y1="318" x2="404" y2="318"/>
    <line x1="72" y1="348" x2="404" y2="348"/>
    <line x1="72" y1="402" x2="404" y2="402"/>
  </g>
  <rect x="40" y="428" width="398" height="34" rx="8" fill="#f85149" fill-opacity=".10" stroke="#f85149" stroke-opacity=".7"/>
  <text x="54" y="450" fill="#ff7b72" font-size="13">✗  100 round trips ≈ 100 ms of network wait</text>
  <text x="40" y="488" fill="#8b949e" font-size="12.5">at 1 ms RTT, each statement waits for its reply</text>

  <!-- ===== RIGHT: batched ===== -->
  <rect x="466" y="190" width="430" height="316" rx="10" fill="#1c2128" stroke="#30363d"/>
  <path d="M476,190 H886 A10,10 0 0 1 896,200 V224 H466 V200 A10,10 0 0 1 476,190 Z" fill="#3fb950" fill-opacity=".14" stroke="#3fb950" stroke-opacity=".6"/>
  <text x="484" y="212" fill="#56d364" font-size="14" font-weight="700" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">hibernate.jdbc.batch_size=50</text>

  <text x="512" y="254" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">APP</text>
  <text x="850" y="254" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">DB</text>
  <line x1="512" y1="262" x2="512" y2="410" stroke="#484f58" stroke-dasharray="4 3"/>
  <line x1="850" y1="262" x2="850" y2="410" stroke="#484f58" stroke-dasharray="4 3"/>
  <g font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" text-anchor="middle">
    <text x="681" y="284" fill="#e6edf3">executeBatch() · 50 inserts</text>
    <text x="681" y="322" fill="#8b949e">50 results</text>
    <text x="681" y="358" fill="#e6edf3">executeBatch() · 50 inserts</text>
    <text x="681" y="396" fill="#8b949e">50 results</text>
  </g>
  <g stroke="#3fb950" stroke-width="3" marker-end="url(#arrG)">
    <line x1="514" y1="294" x2="842" y2="294"/>
    <line x1="514" y1="368" x2="842" y2="368"/>
  </g>
  <g stroke="#8b949e" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arr)">
    <line x1="848" y1="330" x2="516" y2="330"/>
    <line x1="848" y1="404" x2="516" y2="404"/>
  </g>
  <rect x="482" y="428" width="398" height="34" rx="8" fill="#3fb950" fill-opacity=".10" stroke="#3fb950" stroke-opacity=".7"/>
  <text x="496" y="450" fill="#56d364" font-size="13">✓  2 round trips ≈ 2 ms + DB work</text>
  <text x="482" y="488" fill="#8b949e" font-size="12.5">same rows, same transaction, far less waiting</text>

  <!-- footer -->
  <text x="24" y="538" fill="#c9d1d9" font-size="12.5"><tspan fill="#d2a8ff" font-weight="600">Write-behind</tspan> is always on. <tspan fill="#56d364" font-weight="600">JDBC batching</tspan> is off until you set <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="12" fill="#79c0ff">hibernate.jdbc.batch_size</tspan>.</text>
  <text x="24" y="562" fill="#c9d1d9" font-size="12.5">MySQL: add <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="12" fill="#79c0ff">rewriteBatchedStatements=true</tspan> so each batch becomes one <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="12" fill="#79c0ff">insert … values (…),(…),(…)</tspan></text>
  <text x="24" y="586" fill="#8b949e" font-size="12.5">No waiting: a batch holds only this transaction's statements and is sent before commit, before the response.</text>
</svg>
