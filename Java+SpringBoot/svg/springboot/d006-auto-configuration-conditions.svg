<svg xmlns="http://www.w3.org/2000/svg" width="900" height="742" viewBox="0 0 900 742" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Auto-configuration conditions</title>
  <desc>How one auto-configuration decides, with DataSource as the example. A starter is on the classpath: spring-boot-starter-data-jpa. Auto-configuration candidates are listed in META-INF/spring/…AutoConfiguration.imports. Take one candidate, DataSourceAutoConfiguration. Check 1, @ConditionalOnClass(DataSource.class): class on the classpath? No: skipped. Check 2, @ConditionalOnMissingBean(DataSource.class): did you define your own DataSource? Yes: Boot backs off and your bean wins. Check 3: spring.datasource.url set, or an embedded DB like H2 on the classpath? No: startup fails with "Failed to configure a DataSource". All pass: creates HikariDataSource from spring.datasource.* properties. See every decision: run with --debug (CONDITIONS EVALUATION REPORT) or /actuator/conditions.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d29922"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="741" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="24" y="40" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">ONE AUTO-CONFIGURATION DECIDES · DATASOURCE EXAMPLE</text>

  <!-- start row -->
  <rect x="24" y="54" width="300" height="50" rx="9" fill="#1c2128" stroke="#30363d"/>
  <text x="174" y="74" fill="#c9d1d9" font-size="13" text-anchor="middle">Starter on the classpath:</text>
  <text x="174" y="94" fill="#79c0ff" font-size="13" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">spring-boot-starter-data-jpa</text>
  <line x1="324" y1="79" x2="362" y2="79" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="364" y="54" width="512" height="50" rx="9" fill="#1c2128" stroke="#30363d"/>
  <text x="620" y="74" fill="#c9d1d9" font-size="13" text-anchor="middle">auto-configuration candidates listed in</text>
  <text x="620" y="94" fill="#79c0ff" font-size="12.5" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">META-INF/spring/…AutoConfiguration.imports</text>
  <path d="M620,104 V124 H284 V146" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="300" y="141" fill="#8b949e" font-size="12">take one candidate</text>

  <!-- candidate -->
  <rect x="157" y="148" width="254" height="32" rx="16" fill="#bc8cff" fill-opacity=".12" stroke="#bc8cff" stroke-opacity=".8"/>
  <text x="284" y="169" fill="#d2a8ff" font-size="13" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">DataSourceAutoConfiguration</text>
  <line x1="284" y1="180" x2="284" y2="204" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- D1 -->
  <polygon points="284,206 534,258 284,310 34,258" fill="#1c2128" stroke="#8b949e" stroke-opacity=".8"/>
  <text x="284" y="252" fill="#79c0ff" font-size="12" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">@ConditionalOnClass(DataSource.class)</text>
  <text x="284" y="274" fill="#e6edf3" font-size="13" text-anchor="middle">class on the classpath?</text>
  <line x1="534" y1="258" x2="568" y2="258" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="551" y="250" fill="#8b949e" font-size="12" font-weight="700" text-anchor="middle">no</text>
  <rect x="570" y="238" width="170" height="40" rx="9" fill="#21262d" stroke="#484f58" stroke-dasharray="4 3"/>
  <text x="655" y="263" fill="#8b949e" font-size="13.5" font-weight="600" text-anchor="middle">skipped</text>
  <line x1="284" y1="310" x2="284" y2="336" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="294" y="328" fill="#8b949e" font-size="12" font-weight="700">yes</text>

  <!-- D2 -->
  <polygon points="284,338 534,390 284,442 34,390" fill="#1c2128" stroke="#8b949e" stroke-opacity=".8"/>
  <text x="284" y="384" fill="#79c0ff" font-size="12" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">@ConditionalOnMissingBean(DataSource.class)</text>
  <text x="284" y="406" fill="#e6edf3" font-size="13" text-anchor="middle">did you define your own DataSource?</text>
  <line x1="534" y1="390" x2="568" y2="390" stroke="#d29922" stroke-width="1.8" marker-end="url(#arrA)"/>
  <text x="551" y="382" fill="#e3b341" font-size="12" font-weight="700" text-anchor="middle">yes</text>
  <rect x="570" y="366" width="306" height="48" rx="9" fill="#d29922" fill-opacity=".12" stroke="#d29922" stroke-opacity=".8"/>
  <text x="723" y="395" fill="#e3b341" font-size="13.5" font-weight="700" text-anchor="middle">Boot backs off · your bean wins</text>
  <line x1="284" y1="442" x2="284" y2="468" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="294" y="460" fill="#8b949e" font-size="12" font-weight="700">no</text>

  <!-- D3 -->
  <polygon points="284,470 534,526 284,582 34,526" fill="#1c2128" stroke="#8b949e" stroke-opacity=".8"/>
  <text x="284" y="519" fill="#e6edf3" font-size="13" text-anchor="middle"><tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="12" fill="#79c0ff">spring.datasource.url</tspan> set</text>
  <text x="284" y="541" fill="#e6edf3" font-size="13" text-anchor="middle">(or an embedded DB like H2 on the classpath)?</text>
  <line x1="534" y1="526" x2="568" y2="526" stroke="#f85149" stroke-width="1.8" marker-end="url(#arrR)"/>
  <text x="551" y="518" fill="#ff7b72" font-size="12" font-weight="700" text-anchor="middle">no</text>
  <rect x="570" y="498" width="306" height="56" rx="9" fill="#f85149" fill-opacity=".12" stroke="#f85149" stroke-opacity=".8"/>
  <text x="586" y="520" fill="#ff7b72" font-size="13.5" font-weight="700">✗ startup fails:</text>
  <text x="586" y="541" fill="#c9d1d9" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">Failed to configure a DataSource</text>
  <line x1="284" y1="582" x2="284" y2="608" stroke="#3fb950" stroke-width="1.8" marker-end="url(#arrG)"/>
  <text x="294" y="600" fill="#56d364" font-size="12" font-weight="700">yes · all pass</text>

  <!-- success -->
  <rect x="74" y="610" width="420" height="54" rx="9" fill="#3fb950" fill-opacity=".12" stroke="#3fb950" stroke-opacity=".8"/>
  <text x="284" y="632" fill="#56d364" font-size="13.5" font-weight="700" text-anchor="middle">✓ creates <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="13">HikariDataSource</tspan></text>
  <text x="284" y="652" fill="#c9d1d9" font-size="13" text-anchor="middle">from <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="12.5" fill="#79c0ff">spring.datasource.*</tspan> properties</text>

  <!-- footer -->
  <rect x="24" y="684" width="852" height="34" rx="8" fill="none" stroke="#484f58" stroke-dasharray="4 3"/>
  <text x="40" y="706" fill="#8b949e" font-size="13">see every decision: run with <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="12.5" fill="#79c0ff">--debug</tspan> (CONDITIONS EVALUATION REPORT) or <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="12.5" fill="#79c0ff">/actuator/conditions</tspan></text>
</svg>
