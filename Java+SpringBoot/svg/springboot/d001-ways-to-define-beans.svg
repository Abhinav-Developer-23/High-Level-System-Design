<svg xmlns="http://www.w3.org/2000/svg" width="900" height="514" viewBox="0 0 900 514" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>How beans get into the container</title>
  <desc>Three sources of beans. 1, your stereotype classes (@Component, @Service, @Repository, @Controller), found by component scan in the main class's package and below. 2, your @Configuration class with @Bean methods, where you write the construction code (third-party classes, custom setup). 3, auto-configuration from starters (@AutoConfiguration plus @ConditionalOn… conditions): Boot's own @Bean methods, which back off if you defined one. All three produce bean definitions, the recipe: class, name, scope, dependencies. The ApplicationContext (IoC container) turns them into beans such as orderController, orderService, orderRepository, paymentsClient and dataSource. It creates singletons at startup and injects dependencies through constructors.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="513" rx="14" fill="#161b22" stroke="#30363d"/>

  <!-- column headers -->
  <text x="24" y="38" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">WHERE BEANS COME FROM</text>
  <text x="489" y="174" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">RECIPE</text>

  <!-- card 1: stereotypes -->
  <rect x="24" y="52" width="350" height="156" rx="10" fill="#1c2128" stroke="#30363d"/>
  <circle cx="46" cy="78" r="11" fill="#58a6ff" fill-opacity=".16" stroke="#58a6ff" stroke-opacity=".8"/>
  <text x="46" y="82.5" fill="#79c0ff" font-size="12" font-weight="700" text-anchor="middle">1</text>
  <text x="66" y="83" fill="#e6edf3" font-size="14.5" font-weight="600">Your stereotype classes</text>
  <rect x="40" y="98" width="96" height="24" rx="12" fill="#58a6ff" fill-opacity=".10" stroke="#58a6ff" stroke-opacity=".55"/>
  <text x="88" y="114.5" fill="#79c0ff" font-size="12" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">@Component</text>
  <rect x="144" y="98" width="82" height="24" rx="12" fill="#58a6ff" fill-opacity=".10" stroke="#58a6ff" stroke-opacity=".55"/>
  <text x="185" y="114.5" fill="#79c0ff" font-size="12" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">@Service</text>
  <rect x="40" y="128" width="104" height="24" rx="12" fill="#58a6ff" fill-opacity=".10" stroke="#58a6ff" stroke-opacity=".55"/>
  <text x="92" y="144.5" fill="#79c0ff" font-size="12" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">@Repository</text>
  <rect x="152" y="128" width="104" height="24" rx="12" fill="#58a6ff" fill-opacity=".10" stroke="#58a6ff" stroke-opacity=".55"/>
  <text x="204" y="144.5" fill="#79c0ff" font-size="12" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">@Controller</text>
  <text x="40" y="176" fill="#8b949e" font-size="12.5">found by component scan</text>
  <text x="40" y="194" fill="#8b949e" font-size="12.5">(main class's package and below)</text>

  <!-- card 2: @Configuration -->
  <rect x="24" y="224" width="350" height="124" rx="10" fill="#1c2128" stroke="#30363d"/>
  <circle cx="46" cy="250" r="11" fill="#58a6ff" fill-opacity=".16" stroke="#58a6ff" stroke-opacity=".8"/>
  <text x="46" y="254.5" fill="#79c0ff" font-size="12" font-weight="700" text-anchor="middle">2</text>
  <text x="66" y="255" fill="#e6edf3" font-size="14.5" font-weight="600">Your <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="13.5" fill="#79c0ff">@Configuration</tspan> class</text>
  <rect x="40" y="270" width="58" height="24" rx="12" fill="#58a6ff" fill-opacity=".10" stroke="#58a6ff" stroke-opacity=".55"/>
  <text x="69" y="286.5" fill="#79c0ff" font-size="12" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">@Bean</text>
  <text x="106" y="286.5" fill="#c9d1d9" font-size="13">methods</text>
  <text x="40" y="318" fill="#8b949e" font-size="12.5">you write the construction code</text>
  <text x="40" y="336" fill="#8b949e" font-size="12.5">(third-party classes, custom setup)</text>

  <!-- card 3: auto-configuration -->
  <rect x="24" y="364" width="350" height="126" rx="10" fill="#1c2128" stroke="#30363d"/>
  <circle cx="46" cy="390" r="11" fill="#58a6ff" fill-opacity=".16" stroke="#58a6ff" stroke-opacity=".8"/>
  <text x="46" y="394.5" fill="#79c0ff" font-size="12" font-weight="700" text-anchor="middle">3</text>
  <text x="66" y="395" fill="#e6edf3" font-size="14.5" font-weight="600">Auto-configuration (starters)</text>
  <rect x="40" y="410" width="150" height="24" rx="12" fill="#58a6ff" fill-opacity=".10" stroke="#58a6ff" stroke-opacity=".55"/>
  <text x="115" y="426.5" fill="#79c0ff" font-size="12" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">@AutoConfiguration</text>
  <text x="202" y="427" fill="#8b949e" font-size="14" font-weight="700" text-anchor="middle">+</text>
  <rect x="214" y="410" width="130" height="24" rx="12" fill="#58a6ff" fill-opacity=".10" stroke="#58a6ff" stroke-opacity=".55"/>
  <text x="279" y="426.5" fill="#79c0ff" font-size="12" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">@ConditionalOn…</text>
  <text x="40" y="458" fill="#8b949e" font-size="12.5">Boot's own @Bean methods;</text>
  <text x="40" y="476" fill="#8b949e" font-size="12.5">back off if you defined one</text>

  <!-- arrows into the recipe -->
  <path d="M374,130 C396,130 392,232 412,232" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M374,286 C394,286 392,271 412,271" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M374,427 C396,427 392,310 412,310" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- bean definitions -->
  <rect x="414" y="186" width="150" height="170" rx="10" fill="#1c2128" stroke="#8b949e" stroke-opacity=".8"/>
  <text x="489" y="212" fill="#e6edf3" font-size="14.5" font-weight="600" text-anchor="middle">Bean definitions</text>
  <text x="489" y="230" fill="#8b949e" font-size="12" text-anchor="middle">(the recipe)</text>
  <line x1="428" y1="242" x2="550" y2="242" stroke="#30363d"/>
  <circle cx="436" cy="262" r="3" fill="#8b949e"/>
  <text x="446" y="266.5" fill="#c9d1d9" font-size="13">class</text>
  <circle cx="436" cy="286" r="3" fill="#8b949e"/>
  <text x="446" y="290.5" fill="#c9d1d9" font-size="13">name</text>
  <circle cx="436" cy="310" r="3" fill="#8b949e"/>
  <text x="446" y="314.5" fill="#c9d1d9" font-size="13">scope</text>
  <circle cx="436" cy="334" r="3" fill="#8b949e"/>
  <text x="446" y="338.5" fill="#c9d1d9" font-size="13">dependencies</text>

  <line x1="564" y1="271" x2="598" y2="271" stroke="#3fb950" stroke-width="1.8" marker-end="url(#arrG)"/>

  <!-- ApplicationContext -->
  <rect x="600" y="52" width="276" height="438" rx="10" fill="#1c2128" stroke="#3fb950" stroke-opacity=".6"/>
  <path d="M610,52 H866 A10,10 0 0 1 876,62 V106 H600 V62 A10,10 0 0 1 610,52 Z" fill="#3fb950" fill-opacity=".14" stroke="#3fb950" stroke-opacity=".6"/>
  <text x="738" y="78" fill="#56d364" font-size="15" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">ApplicationContext</text>
  <text x="738" y="97" fill="#c9d1d9" font-size="12.5" text-anchor="middle">(IoC container)</text>
  <rect x="648" y="124" width="180" height="28" rx="14" fill="#3fb950" fill-opacity=".12" stroke="#3fb950" stroke-opacity=".7"/>
  <text x="738" y="142.5" fill="#e6edf3" font-size="12.5" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">orderController</text>
  <rect x="648" y="170" width="180" height="28" rx="14" fill="#3fb950" fill-opacity=".12" stroke="#3fb950" stroke-opacity=".7"/>
  <text x="738" y="188.5" fill="#e6edf3" font-size="12.5" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">orderService</text>
  <rect x="648" y="216" width="180" height="28" rx="14" fill="#3fb950" fill-opacity=".12" stroke="#3fb950" stroke-opacity=".7"/>
  <text x="738" y="234.5" fill="#e6edf3" font-size="12.5" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">orderRepository</text>
  <rect x="648" y="262" width="180" height="28" rx="14" fill="#3fb950" fill-opacity=".12" stroke="#3fb950" stroke-opacity=".7"/>
  <text x="738" y="280.5" fill="#e6edf3" font-size="12.5" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">paymentsClient</text>
  <rect x="648" y="308" width="180" height="28" rx="14" fill="#3fb950" fill-opacity=".12" stroke="#3fb950" stroke-opacity=".7"/>
  <text x="738" y="326.5" fill="#e6edf3" font-size="12.5" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">dataSource</text>
  <line x1="616" y1="362" x2="860" y2="362" stroke="#30363d"/>
  <circle cx="628" cy="388.5" r="9" fill="#3fb950" fill-opacity=".14" stroke="#3fb950" stroke-opacity=".7"/>
  <text x="628" y="393" fill="#56d364" font-size="11.5" font-weight="700" text-anchor="middle">✓</text>
  <text x="646" y="393" fill="#c9d1d9" font-size="13">creates singletons at startup</text>
  <circle cx="628" cy="420.5" r="9" fill="#3fb950" fill-opacity=".14" stroke="#3fb950" stroke-opacity=".7"/>
  <text x="628" y="425" fill="#56d364" font-size="11.5" font-weight="700" text-anchor="middle">✓</text>
  <text x="646" y="425" fill="#c9d1d9" font-size="13">injects dependencies</text>
  <text x="646" y="444" fill="#c9d1d9" font-size="13">through constructors</text>
</svg>
