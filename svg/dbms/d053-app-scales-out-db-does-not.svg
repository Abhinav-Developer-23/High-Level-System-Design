<svg xmlns="http://www.w3.org/2000/svg" width="840" height="246" viewBox="0 0 840 246" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>App tier scales out, database does not</title>
  <desc>Application servers #1 to #4 and more can be added anytime (cheap, stateless). The database PRIMARY is usually ONE writer and supports vertical scaling only (expensive, hits a ceiling).</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs>
  <rect x="0.5" y="0.5" width="839" height="245" rx="14" fill="#161b22" stroke="#30363d"/>
  <rect x="24" y="24" width="420" height="198" rx="10" fill="#1c2128" stroke="#3fb950" stroke-opacity=".5"/>
  <text x="44" y="52" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">APPLICATION SERVERS</text>
  <rect x="464" y="24" width="352" height="198" rx="10" fill="#1c2128" stroke="#f85149" stroke-opacity=".5"/>
  <text x="484" y="52" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">DATABASE</text>
  <rect x="48" y="72" width="66" height="54" rx="8" fill="#58a6ff" fill-opacity=".10" stroke="#58a6ff" stroke-opacity=".6"/>
  <text x="81" y="104" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle">#1</text>
  <rect x="128" y="72" width="66" height="54" rx="8" fill="#58a6ff" fill-opacity=".10" stroke="#58a6ff" stroke-opacity=".6"/>
  <text x="161" y="104" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle">#2</text>
  <rect x="208" y="72" width="66" height="54" rx="8" fill="#58a6ff" fill-opacity=".10" stroke="#58a6ff" stroke-opacity=".6"/>
  <text x="241" y="104" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle">#3</text>
  <rect x="288" y="72" width="66" height="54" rx="8" fill="#58a6ff" fill-opacity=".10" stroke="#58a6ff" stroke-opacity=".6"/>
  <text x="321" y="104" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle">#4</text>
  <rect x="368" y="72" width="54" height="54" rx="8" fill="none" stroke="#484f58" stroke-dasharray="5 4"/>
  <text x="395" y="104" fill="#8b949e" font-size="16" font-weight="700" text-anchor="middle">...</text>
  <rect x="134" y="148" width="200" height="26" rx="13" fill="#3fb950" fill-opacity=".14" stroke="#3fb950" stroke-opacity=".7"/>
  <text x="234" y="166" fill="#56d364" font-size="13" font-weight="700" text-anchor="middle">✓ Add more anytime</text>
  <text x="234" y="198" fill="#8b949e" font-size="12.5" text-anchor="middle">(cheap, stateless)</text>
  <rect x="484" y="72" width="150" height="54" rx="8" fill="#39c5cf" fill-opacity=".12" stroke="#39c5cf" stroke-opacity=".7"/>
  <text x="559" y="104" fill="#56d4dd" font-size="14" font-weight="700" letter-spacing="1" text-anchor="middle">PRIMARY</text>
  <line x1="670" y1="99" x2="640" y2="99" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="678" y="95" fill="#c9d1d9" font-size="13">usually</text>
  <text x="678" y="113" fill="#c9d1d9" font-size="13"><tspan font-weight="700" fill="#e3b341">ONE</tspan> writer</text>
  <rect x="540" y="148" width="200" height="26" rx="13" fill="#f85149" fill-opacity=".14" stroke="#f85149" stroke-opacity=".7"/>
  <text x="640" y="166" fill="#ff7b72" font-size="13" font-weight="700" text-anchor="middle">✗ Vertical scaling only</text>
  <text x="640" y="198" fill="#8b949e" font-size="12.5" text-anchor="middle">(expensive, hits a ceiling)</text>
</svg>
