<svg xmlns="http://www.w3.org/2000/svg" width="860" height="272" viewBox="0 0 860 272" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>WITH CHECK OPTION</title>
  <desc>Without WITH CHECK OPTION, inserting a 'Mumbai' row through the view is silently inserted into the base table but won't appear in the view (confusing). With WITH CHECK OPTION, the insert is rejected with an error, guaranteeing that if you can insert it, you can see it in the view.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="859" height="271" rx="14" fill="#161b22" stroke="#30363d"/>

  <!-- WITHOUT -->
  <rect x="24" y="24" width="396" height="224" rx="10" fill="#1c2128" stroke="#d29922" stroke-opacity=".6"/>
  <path d="M24,64 V34 a10,10 0 0 1 10,-10 H410 a10,10 0 0 1 10,10 V64 z" fill="#d29922" fill-opacity=".14"/>
  <line x1="24" y1="64" x2="420" y2="64" stroke="#d29922" stroke-opacity=".5"/>
  <text x="222" y="49" fill="#e3b341" font-size="14" font-weight="700" text-anchor="middle">Without <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">WITH CHECK OPTION</tspan></text>

  <rect x="122" y="84" width="200" height="34" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="222" y="106" fill="#79c0ff" font-size="13" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">INSERT 'Mumbai' row</text>
  <line x1="222" y1="118" x2="222" y2="148" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="62" y="152" width="320" height="38" rx="8" fill="#3fb950" fill-opacity=".10" stroke="#3fb950" stroke-opacity=".6"/>
  <text x="222" y="176" fill="#56d364" font-size="13.5" font-weight="600" text-anchor="middle">✓ Silently inserted into base table</text>
  <text x="222" y="222" fill="#e3b341" font-size="13" text-anchor="middle">⚠ But it won't appear in the view <tspan font-weight="700">(confusing!)</tspan></text>

  <!-- WITH -->
  <rect x="440" y="24" width="396" height="224" rx="10" fill="#1c2128" stroke="#3fb950" stroke-opacity=".6"/>
  <path d="M440,64 V34 a10,10 0 0 1 10,-10 H826 a10,10 0 0 1 10,10 V64 z" fill="#3fb950" fill-opacity=".14"/>
  <line x1="440" y1="64" x2="836" y2="64" stroke="#3fb950" stroke-opacity=".5"/>
  <text x="638" y="49" fill="#56d364" font-size="14" font-weight="700" text-anchor="middle">With <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">WITH CHECK OPTION</tspan></text>

  <rect x="538" y="84" width="200" height="34" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="638" y="106" fill="#79c0ff" font-size="13" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">INSERT 'Mumbai' row</text>
  <line x1="638" y1="118" x2="638" y2="148" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="478" y="152" width="320" height="38" rx="8" fill="#f85149" fill-opacity=".10" stroke="#f85149" stroke-opacity=".6"/>
  <text x="638" y="176" fill="#ff7b72" font-size="13.5" font-weight="600" text-anchor="middle">✗ Rejected with error</text>
  <text x="638" y="214" fill="#c9d1d9" font-size="13" text-anchor="middle"><tspan font-weight="700" fill="#56d364">Guarantees:</tspan> if you can insert it,</text>
  <text x="638" y="233" fill="#c9d1d9" font-size="13" text-anchor="middle">you can see it in the view</text>
</svg>
