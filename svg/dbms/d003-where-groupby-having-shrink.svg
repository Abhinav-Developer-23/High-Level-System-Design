<svg xmlns="http://www.w3.org/2000/svg" width="520" height="470" viewBox="0 0 520 470" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>WHERE, GROUP BY, HAVING data shrink</title>
  <desc>8 rows filtered by WHERE salary &gt; 40000 to 5 rows (Chen, Eli, Fay out), grouped by GROUP BY into 3 groups (blue 2, green 1, amber 2), filtered by HAVING COUNT(*) &gt;= 2 to 2 groups (green Sales out: only 1).</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="519" height="469" rx="14" fill="#161b22" stroke="#30363d"/>

  <!-- stage boxes -->
  <rect x="40" y="28" width="170" height="46" rx="10" fill="#1c2128" stroke="#30363d"/>
  <text x="125" y="57" fill="#e6edf3" font-size="15" font-weight="600" text-anchor="middle">8 rows</text>

  <rect x="40" y="152" width="170" height="46" rx="10" fill="#1c2128" stroke="#30363d"/>
  <text x="125" y="181" fill="#e6edf3" font-size="15" font-weight="600" text-anchor="middle">5 rows</text>

  <rect x="40" y="276" width="170" height="46" rx="10" fill="#1c2128" stroke="#30363d"/>
  <text x="125" y="305" fill="#e6edf3" font-size="15" font-weight="600" text-anchor="middle">3 groups</text>

  <rect x="40" y="400" width="170" height="46" rx="10" fill="#3fb950" fill-opacity=".12" stroke="#3fb950"/>
  <text x="125" y="429" fill="#56d364" font-size="15" font-weight="700" text-anchor="middle">2 groups</text>

  <!-- arrows -->
  <line x1="125" y1="74" x2="125" y2="148" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="125" y1="198" x2="125" y2="272" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="125" y1="322" x2="125" y2="396" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- operator 1 -->
  <rect x="146" y="88" width="168" height="24" rx="12" fill="#58a6ff" fill-opacity=".12" stroke="#58a6ff" stroke-opacity=".6"/>
  <text x="230" y="104" fill="#79c0ff" font-size="12" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">WHERE salary &gt; 40000</text>
  <text x="330" y="105" fill="#ff7b72" font-size="13">✗ (Chen, Eli, Fay out)</text>

  <!-- operator 2 -->
  <rect x="146" y="223" width="88" height="24" rx="12" fill="#58a6ff" fill-opacity=".12" stroke="#58a6ff" stroke-opacity=".6"/>
  <text x="190" y="239" fill="#79c0ff" font-size="12" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">GROUP BY</text>

  <!-- group breakdown next to 3 groups -->
  <text x="230" y="304" fill="#c9d1d9" font-size="13">(</text>
  <rect x="240" y="292" width="14" height="14" rx="3" fill="#58a6ff"/>
  <text x="260" y="304" fill="#c9d1d9" font-size="13">2  ·</text>
  <rect x="286" y="292" width="14" height="14" rx="3" fill="#3fb950"/>
  <text x="306" y="304" fill="#c9d1d9" font-size="13">1  ·</text>
  <rect x="332" y="292" width="14" height="14" rx="3" fill="#d29922"/>
  <text x="352" y="304" fill="#c9d1d9" font-size="13">2 )</text>

  <!-- operator 3 -->
  <rect x="146" y="347" width="168" height="24" rx="12" fill="#58a6ff" fill-opacity=".12" stroke="#58a6ff" stroke-opacity=".6"/>
  <text x="230" y="363" fill="#79c0ff" font-size="12" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">HAVING COUNT(*) &gt;= 2</text>
  <text x="330" y="364" fill="#ff7b72" font-size="13">✗ (</text>
  <rect x="352" y="352" width="14" height="14" rx="3" fill="#3fb950"/>
  <text x="372" y="364" fill="#ff7b72" font-size="13">Sales out: only 1)</text>
</svg>
