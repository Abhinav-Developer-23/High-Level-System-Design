<svg xmlns="http://www.w3.org/2000/svg" width="860" height="292" viewBox="0 0 860 292" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Sequential vs random primary key inserts</title>
  <desc>Sequential PK (AUTO_INCREMENT or UUIDv7): new keys 97, 98, 99 append to the rightmost leaf; pages fill to about 100%, one hot page stays in the buffer pool, and there are no mid-tree splits. Random PK (UUID v4): keys land mid-tree in a leaf like 12, 44, 91; when the page is full it splits; pages settle at about 50% fill, random pages are pulled from disk, and there are constant splits and fragmentation.</desc>
  <defs>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f85149"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="859" height="291" rx="14" fill="#161b22" stroke="#30363d"/>

  <!-- ===== Sequential ===== -->
  <rect x="24" y="24" width="396" height="244" rx="10" fill="#1c2128" stroke="#3fb950" stroke-opacity=".5"/>
  <path d="M24,58 V34 a10,10 0 0 1 10,-10 H410 a10,10 0 0 1 10,10 V58 z" fill="#3fb950" fill-opacity=".14"/>
  <text x="42" y="46" fill="#56d364" font-size="13" font-weight="700">Sequential PK <tspan font-weight="400" fill="#8b949e">(<tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" fill="#79c0ff">AUTO_INCREMENT</tspan> / UUIDv7)</tspan></text>
  <line x1="24" y1="58" x2="420" y2="58" stroke="#3fb950" stroke-opacity=".4"/>

  <rect x="48" y="80" width="176" height="36" rx="7" fill="#39c5cf" fill-opacity=".08" stroke="#39c5cf" stroke-opacity=".6"/>
  <rect x="181" y="83" width="40" height="30" rx="5" fill="#3fb950" fill-opacity=".35"/>
  <g stroke="#39c5cf" stroke-opacity=".4"><line x1="92" y1="80" x2="92" y2="116"/><line x1="136" y1="80" x2="136" y2="116"/><line x1="180" y1="80" x2="180" y2="116"/></g>
  <g font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle">
    <text x="70" y="103" fill="#8b949e">...</text><text x="114" y="103" fill="#e6edf3">97</text><text x="158" y="103" fill="#e6edf3">98</text><text x="202" y="103" fill="#ffffff">99</text>
  </g>
  <line x1="286" y1="98" x2="232" y2="98" stroke="#3fb950" stroke-width="1.8" marker-end="url(#arrG)"/>
  <text x="294" y="103" fill="#56d364" font-size="13" font-weight="600">append</text>
  <text x="136" y="138" fill="#8b949e" font-size="12.5" text-anchor="middle">rightmost leaf</text>

  <g font-size="13">
    <text x="42" y="196" fill="#56d364" font-weight="700">✓  <tspan fill="#c9d1d9" font-weight="400">pages fill to ~100%</tspan></text>
    <text x="42" y="222" fill="#56d364" font-weight="700">✓  <tspan fill="#c9d1d9" font-weight="400">one hot page stays in the buffer pool</tspan></text>
    <text x="42" y="248" fill="#56d364" font-weight="700">✓  <tspan fill="#c9d1d9" font-weight="400">no mid-tree splits</tspan></text>
  </g>

  <!-- ===== Random ===== -->
  <rect x="440" y="24" width="396" height="244" rx="10" fill="#1c2128" stroke="#f85149" stroke-opacity=".5"/>
  <path d="M440,58 V34 a10,10 0 0 1 10,-10 H826 a10,10 0 0 1 10,10 V58 z" fill="#f85149" fill-opacity=".14"/>
  <text x="458" y="46" fill="#ff7b72" font-size="13" font-weight="700">Random PK <tspan font-weight="400" fill="#8b949e">(UUID v4)</tspan></text>
  <line x1="440" y1="58" x2="836" y2="58" stroke="#f85149" stroke-opacity=".4"/>

  <rect x="480" y="80" width="132" height="36" rx="7" fill="#f85149" fill-opacity=".10" stroke="#f85149" stroke-opacity=".7"/>
  <g stroke="#f85149" stroke-opacity=".4"><line x1="524" y1="80" x2="524" y2="116"/><line x1="568" y1="80" x2="568" y2="116"/></g>
  <g font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="middle">
    <text x="502" y="103">12</text><text x="546" y="103">44</text><text x="590" y="103">91</text>
  </g>
  <line x1="674" y1="98" x2="620" y2="98" stroke="#f85149" stroke-width="1.8" marker-end="url(#arrR)"/>
  <text x="682" y="103" fill="#ff7b72" font-size="13" font-weight="600">lands mid-tree</text>
  <line x1="546" y1="118" x2="546" y2="138" stroke="#f85149" stroke-width="1.5" marker-end="url(#arrR)"/>
  <rect x="461" y="142" width="170" height="26" rx="13" fill="#f85149" fill-opacity=".16" stroke="#f85149"/>
  <text x="546" y="160" fill="#ff7b72" font-size="12.5" font-weight="600" text-anchor="middle">page is full <tspan fill="#8b949e">→</tspan> SPLIT</text>

  <g font-size="13">
    <text x="458" y="196" fill="#ff7b72" font-weight="700">✗  <tspan fill="#c9d1d9" font-weight="400">pages settle at ~50% fill</tspan></text>
    <text x="458" y="222" fill="#ff7b72" font-weight="700">✗  <tspan fill="#c9d1d9" font-weight="400">random pages pulled from disk</tspan></text>
    <text x="458" y="248" fill="#ff7b72" font-weight="700">✗  <tspan fill="#c9d1d9" font-weight="400">constant splits + fragmentation</tspan></text>
  </g>
</svg>
