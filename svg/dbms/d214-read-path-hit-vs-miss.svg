<svg xmlns="http://www.w3.org/2000/svg" width="820" height="404" viewBox="0 0 820 404" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Read path: page hit vs miss</title>
  <desc>For SELECT * FROM users WHERE id = 42, if the page is already in the buffer pool it is a page hit, read from RAM in about 100 ns. Otherwise it is a page miss (hard fault): find a free frame (evicting a victim if full), read the 16 KB page from disk, place it in the pool, then serve the row from RAM, costing about 100 µs on SSD or 10 ms on HDD.</desc>
  <defs>
    <marker id="d214a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
    <marker id="d214g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
    <marker id="d214r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="819" height="403" rx="14" fill="#161b22" stroke="#30363d"/>

  <!-- query -->
  <rect x="245" y="20" width="330" height="30" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="410" y="40" fill="#79c0ff" font-size="13" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">SELECT * FROM users WHERE id = 42;</text>
  <line x1="410" y1="50" x2="410" y2="72" stroke="#8b949e" stroke-width="1.5" marker-end="url(#d214a)"/>

  <!-- decision -->
  <rect x="290" y="76" width="240" height="54" rx="10" fill="#1c2128" stroke="#58a6ff" stroke-opacity=".6"/>
  <text x="410" y="99" fill="#e6edf3" font-size="13.5" font-weight="600" text-anchor="middle">Is the page already</text>
  <text x="410" y="119" fill="#e6edf3" font-size="13.5" font-weight="600" text-anchor="middle">in the buffer pool?</text>

  <!-- branches -->
  <path d="M360,130 V152 H170 V176" fill="none" stroke="#3fb950" stroke-width="1.6" marker-end="url(#d214g)"/>
  <text x="264" y="146" fill="#56d364" font-size="12.5" font-weight="700" text-anchor="middle" letter-spacing="1">YES</text>
  <path d="M460,130 V152 H563 V176" fill="none" stroke="#f85149" stroke-width="1.6" marker-end="url(#d214r)"/>
  <text x="512" y="146" fill="#ff7b72" font-size="12.5" font-weight="700" text-anchor="middle" letter-spacing="1">NO</text>

  <!-- hit -->
  <rect x="40" y="180" width="260" height="98" rx="10" fill="#3fb950" fill-opacity=".12" stroke="#3fb950" stroke-opacity=".8"/>
  <text x="170" y="207" fill="#56d364" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="1">PAGE HIT</text>
  <text x="170" y="234" fill="#e6edf3" font-size="13" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">~100 ns</text>
  <text x="170" y="259" fill="#c9d1d9" font-size="13" text-anchor="middle">read from RAM <tspan fill="#56d364" font-weight="700">✓</tspan></text>

  <!-- miss -->
  <rect x="330" y="180" width="466" height="202" rx="10" fill="#f85149" fill-opacity=".08" stroke="#f85149" stroke-opacity=".7"/>
  <text x="350" y="207" fill="#ff7b72" font-size="15" font-weight="700" letter-spacing="1">PAGE MISS <tspan fill="#8b949e" font-size="13" font-weight="400" letter-spacing="0">(or "hard fault")</tspan></text>
  <text x="350" y="236" fill="#c9d1d9" font-size="13"><tspan fill="#8b949e" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">1.</tspan> Find a free frame in the pool</text>
  <text x="370" y="255" fill="#8b949e" font-size="12.5">(evict a victim page if full)</text>
  <text x="350" y="278" fill="#c9d1d9" font-size="13"><tspan fill="#8b949e" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">2.</tspan> Read the 16 KB page from disk</text>
  <text x="350" y="300" fill="#c9d1d9" font-size="13"><tspan fill="#8b949e" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">3.</tspan> Place it in the buffer pool</text>
  <text x="350" y="322" fill="#c9d1d9" font-size="13"><tspan fill="#8b949e" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">4.</tspan> Now serve the row from RAM</text>
  <line x1="346" y1="338" x2="780" y2="338" stroke="#f85149" stroke-opacity=".3"/>
  <text x="350" y="364" fill="#e3b341" font-size="13" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">~100 µs on SSD / ~10 ms on HDD</text>
  <rect x="640" y="350" width="64" height="22" rx="11" fill="#d29922" fill-opacity=".16" stroke="#d29922" stroke-opacity=".7"/>
  <text x="672" y="365.5" fill="#e3b341" font-size="11.5" font-weight="700" text-anchor="middle" letter-spacing="1">SLOW</text>
</svg>
