<svg xmlns="http://www.w3.org/2000/svg" width="720" height="312" viewBox="0 0 720 312" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>BEFORE vs AFTER triggers</title>
  <desc>BEFORE trigger: user runs INSERT, the BEFORE trigger validates or modifies the row, then the row is saved. AFTER trigger: user runs INSERT, the row is saved, then the AFTER trigger logs or cascades.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs>
  <rect x="0.5" y="0.5" width="719" height="311" rx="14" fill="#161b22" stroke="#30363d"/>
  <line x1="360" y1="24" x2="360" y2="288" stroke="#21262d"/>
  <text x="190" y="44" fill="#e6edf3" font-size="15" font-weight="700" text-anchor="middle">BEFORE Trigger</text>
  <line x1="80" y1="56" x2="300" y2="56" stroke="#30363d"/>
  <text x="530" y="44" fill="#e6edf3" font-size="15" font-weight="700" text-anchor="middle">AFTER Trigger</text>
  <line x1="420" y1="56" x2="640" y2="56" stroke="#30363d"/>
  <rect x="80" y="76" width="220" height="40" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="190" y="101" fill="#e6edf3" font-size="13.5" font-weight="600" text-anchor="middle">User → <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" fill="#79c0ff">INSERT</tspan></text>
  <line x1="190" y1="116" x2="190" y2="144" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="80" y="148" width="220" height="56" rx="10" fill="#f0883e" fill-opacity=".12" stroke="#f0883e" stroke-opacity=".75"/>
  <text x="190" y="172" fill="#ffa657" font-size="14" font-weight="700" text-anchor="middle">BEFORE trigger</text>
  <text x="190" y="192" fill="#c9d1d9" font-size="12.5" text-anchor="middle">(validate / modify)</text>
  <line x1="190" y1="204" x2="190" y2="228" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="80" y="232" width="220" height="56" rx="10" fill="#39c5cf" fill-opacity=".10" stroke="#39c5cf" stroke-opacity=".7"/>
  <text x="190" y="265" fill="#56d4dd" font-size="14" font-weight="600" text-anchor="middle">Row is saved</text>
  <rect x="420" y="76" width="220" height="40" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="530" y="101" fill="#e6edf3" font-size="13.5" font-weight="600" text-anchor="middle">User → <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" fill="#79c0ff">INSERT</tspan></text>
  <line x1="530" y1="116" x2="530" y2="144" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="420" y="148" width="220" height="56" rx="10" fill="#39c5cf" fill-opacity=".10" stroke="#39c5cf" stroke-opacity=".7"/>
  <text x="530" y="181" fill="#56d4dd" font-size="14" font-weight="600" text-anchor="middle">Row is saved</text>
  <line x1="530" y1="204" x2="530" y2="228" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="420" y="232" width="220" height="56" rx="10" fill="#f0883e" fill-opacity=".12" stroke="#f0883e" stroke-opacity=".75"/>
  <text x="530" y="256" fill="#ffa657" font-size="14" font-weight="700" text-anchor="middle">AFTER trigger</text>
  <text x="530" y="276" fill="#c9d1d9" font-size="12.5" text-anchor="middle">(log / cascade)</text>
</svg>
