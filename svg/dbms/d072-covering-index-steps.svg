<svg xmlns="http://www.w3.org/2000/svg" width="764" height="242" viewBox="0 0 764 242" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Covering index vs regular index</title>
  <desc>Without a covering index: index lookup, find pointer, go to data row, read name and salary, which takes two steps. With a covering index: index lookup, name and salary are in the index, done, which takes one step and is faster.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="763" height="241" rx="14" fill="#161b22" stroke="#30363d"/>

  <!-- Without -->
  <text x="32" y="42" fill="#e3b341" font-size="12" font-weight="700" letter-spacing="1.5">WITHOUT COVERING INDEX</text>
  <rect x="644" y="28" width="96" height="22" rx="11" fill="#d29922" fill-opacity=".14" stroke="#d29922" stroke-opacity=".6"/>
  <text x="692" y="43" fill="#e3b341" font-size="12" font-weight="600" text-anchor="middle">two steps</text>
  <g font-size="13" text-anchor="middle">
    <rect x="32" y="60" width="120" height="40" rx="8" fill="#58a6ff" fill-opacity=".10" stroke="#58a6ff" stroke-opacity=".6"/>
    <text x="92" y="85" fill="#e6edf3">Index lookup</text>
    <rect x="186" y="60" width="120" height="40" rx="8" fill="#1c2128" stroke="#30363d"/>
    <text x="246" y="85" fill="#e6edf3">find pointer</text>
    <rect x="340" y="60" width="150" height="40" rx="8" fill="#d29922" fill-opacity=".10" stroke="#d29922" stroke-opacity=".6"/>
    <text x="415" y="85" fill="#e6edf3">go to data row</text>
    <rect x="524" y="60" width="216" height="40" rx="8" fill="#1c2128" stroke="#30363d"/>
    <text x="632" y="85" fill="#e6edf3">read <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" fill="#79c0ff">name</tspan>, <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" fill="#79c0ff">salary</tspan></text>
  </g>
  <g stroke="#8b949e" stroke-width="1.5">
    <line x1="152" y1="80" x2="182" y2="80" marker-end="url(#arr)"/>
    <line x1="306" y1="80" x2="336" y2="80" marker-end="url(#arr)"/>
    <line x1="490" y1="80" x2="520" y2="80" marker-end="url(#arr)"/>
  </g>

  <line x1="24" y1="124" x2="740" y2="124" stroke="#21262d"/>

  <!-- With -->
  <text x="32" y="158" fill="#56d364" font-size="12" font-weight="700" letter-spacing="1.5">WITH COVERING INDEX</text>
  <rect x="560" y="144" width="180" height="22" rx="11" fill="#3fb950" fill-opacity=".14" stroke="#3fb950" stroke-opacity=".6"/>
  <text x="650" y="159" fill="#56d364" font-size="12" font-weight="600" text-anchor="middle">one step — faster</text>
  <g font-size="13" text-anchor="middle">
    <rect x="32" y="176" width="120" height="40" rx="8" fill="#58a6ff" fill-opacity=".10" stroke="#58a6ff" stroke-opacity=".6"/>
    <text x="92" y="201" fill="#e6edf3">Index lookup</text>
    <rect x="186" y="176" width="320" height="40" rx="8" fill="#3fb950" fill-opacity=".10" stroke="#3fb950" stroke-opacity=".6"/>
    <text x="346" y="201" fill="#e6edf3"><tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" fill="#79c0ff">name</tspan> and <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" fill="#79c0ff">salary</tspan> are <tspan font-weight="700" fill="#56d364">IN</tspan> the index</text>
  </g>
  <line x1="152" y1="196" x2="182" y2="196" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="506" y1="196" x2="536" y2="196" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrG)"/>
  <text x="546" y="201" fill="#56d364" font-size="14" font-weight="700">done!</text>
</svg>
