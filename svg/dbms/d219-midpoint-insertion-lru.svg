<svg xmlns="http://www.w3.org/2000/svg" width="780" height="378" viewBox="0 0 780 378" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Midpoint-insertion LRU</title>
  <desc>InnoDB's LRU list is split into a young sublist (about 5/8, hot frequently accessed pages) and an old sublist (about 3/8, newly read pages). New pages enter at the midpoint, not the head, and are evicted from the tail. A page is promoted to young only if it is accessed again while in the old sublist.</desc>
  <defs>
    <marker id="d219b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker>
    <marker id="d219r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker>
    <marker id="d219o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker>
    <clipPath id="d219clip"><rect x="60" y="96" width="660" height="80" rx="10"/></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="779" height="377" rx="14" fill="#161b22" stroke="#30363d"/>

  <text x="60" y="32" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">LRU LIST</text>

  <!-- promotion curve -->
  <path d="M596,94 Q431,30 270,92" fill="none" stroke="#f0883e" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#d219o)"/>
  <text x="433" y="54" fill="#ffa657" font-size="12.5" text-anchor="middle">accessed <tspan font-weight="700">AGAIN</tspan> → promoted</text>

  <!-- bar -->
  <g clip-path="url(#d219clip)">
    <rect x="60" y="96" width="412" height="80" fill="#f0883e" fill-opacity=".12"/>
    <rect x="472" y="96" width="248" height="80" fill="#58a6ff" fill-opacity=".10"/>
  </g>
  <line x1="472" y1="96" x2="472" y2="176" stroke="#8b949e" stroke-width="1.5"/>
  <rect x="60" y="96" width="660" height="80" rx="10" fill="none" stroke="#484f58" stroke-width="1.5"/>

  <text x="266" y="122" fill="#ffa657" font-size="14" font-weight="700" text-anchor="middle">YOUNG <tspan fill="#8b949e" font-weight="400" font-size="13">(~5/8)</tspan></text>
  <text x="266" y="143" fill="#c9d1d9" font-size="13" text-anchor="middle">hot, frequently</text>
  <text x="266" y="161" fill="#c9d1d9" font-size="13" text-anchor="middle">accessed pages</text>

  <text x="596" y="122" fill="#79c0ff" font-size="14" font-weight="700" text-anchor="middle">OLD <tspan fill="#8b949e" font-weight="400" font-size="13">(~3/8)</tspan></text>
  <text x="596" y="143" fill="#c9d1d9" font-size="13" text-anchor="middle">newly read</text>
  <text x="596" y="161" fill="#c9d1d9" font-size="13" text-anchor="middle">pages</text>

  <text x="64" y="194" fill="#8b949e" font-size="12">head</text>

  <!-- insert at midpoint -->
  <line x1="472" y1="236" x2="472" y2="180" stroke="#58a6ff" stroke-width="1.8" marker-end="url(#d219b)"/>
  <text x="472" y="256" fill="#79c0ff" font-size="13" text-anchor="middle">new page enters <tspan font-weight="700">HERE</tspan></text>
  <text x="472" y="274" fill="#8b949e" font-size="12.5" text-anchor="middle">(the midpoint, not the head)</text>

  <!-- evict from tail -->
  <line x1="700" y1="178" x2="700" y2="234" stroke="#f85149" stroke-width="1.8" marker-end="url(#d219r)"/>
  <text x="756" y="256" fill="#ff7b72" font-size="13" text-anchor="end">evicted from the tail</text>

  <!-- note -->
  <rect x="60" y="298" width="660" height="56" rx="10" fill="#1c2128" stroke="#30363d"/>
  <text x="390" y="321" fill="#c9d1d9" font-size="13" text-anchor="middle">A page is promoted to <tspan fill="#ffa657" font-weight="700">YOUNG</tspan> only if it is accessed <tspan font-weight="700" fill="#e6edf3">AGAIN</tspan></text>
  <text x="390" y="341" fill="#c9d1d9" font-size="13" text-anchor="middle">while sitting in the <tspan fill="#79c0ff" font-weight="700">OLD</tspan> sublist.</text>
</svg>
