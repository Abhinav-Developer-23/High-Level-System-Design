<svg xmlns="http://www.w3.org/2000/svg" width="520" height="264" viewBox="0 0 520 264" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Employee-manager hierarchy</title>
  <desc>Alice (CEO) manages Bob and Carol; Bob manages Dave.</desc>

  <rect x="0.5" y="0.5" width="519" height="263" rx="14" fill="#161b22" stroke="#30363d"/>

  <!-- edges -->
  <path d="M260,70 V100 M150,100 H370 M150,100 V130 M370,100 V130" fill="none" stroke="#8b949e" stroke-width="1.6"/>
  <path d="M150,170 V200" fill="none" stroke="#8b949e" stroke-width="1.6"/>

  <!-- Alice -->
  <rect x="190" y="28" width="140" height="42" rx="10" fill="#bc8cff" fill-opacity=".12" stroke="#bc8cff" stroke-opacity=".7"/>
  <text x="260" y="54" fill="#e6edf3" font-size="14.5" font-weight="600" text-anchor="middle">Alice <tspan fill="#d2a8ff" font-weight="400" font-size="13">(CEO)</tspan></text>

  <!-- Bob -->
  <rect x="90" y="130" width="120" height="40" rx="10" fill="#1c2128" stroke="#30363d"/>
  <text x="150" y="155" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle">Bob</text>

  <!-- Carol -->
  <rect x="310" y="130" width="120" height="40" rx="10" fill="#1c2128" stroke="#30363d"/>
  <text x="370" y="155" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle">Carol</text>

  <!-- Dave -->
  <rect x="90" y="200" width="120" height="40" rx="10" fill="#1c2128" stroke="#30363d"/>
  <text x="150" y="225" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle">Dave</text>
</svg>
