<svg xmlns="http://www.w3.org/2000/svg" width="860" height="732" viewBox="0 0 860 732" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Commit without vs with fsync</title>
  <desc>Without fsync: T1 writes the log to the OS page cache and COMMIT OK is returned; a power loss before the kernel flushed loses the log record, so the user was told committed but the change vanished (durability violated). With fsync: T1 writes the log, fsyncs it to persistent media, the call returns 0.1–10 ms later, COMMIT OK is returned; after a power loss, recovery finds the log record and replays it (durability held).</desc>
  <defs>
    <marker id="d217a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
    <marker id="d217g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
    <marker id="d217r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="859" height="731" rx="14" fill="#161b22" stroke="#30363d"/>

  <!-- ================= WITHOUT fsync ================= -->
  <rect x="24" y="20" width="812" height="300" rx="12" fill="#1c2128" fill-opacity=".5" stroke="#f85149" stroke-opacity=".55"/>
  <path d="M36,20 H824 A12,12 0 0 1 836,32 V54 H24 V32 A12,12 0 0 1 36,20 Z" fill="#f85149" fill-opacity=".12"/>
  <text x="44" y="43" fill="#ff7b72" font-size="14" font-weight="700" letter-spacing="1.2">WITHOUT <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" letter-spacing="0">fsync</tspan></text>

  <text x="110" y="80" fill="#d2a8ff" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">T1</text>
  <text x="430" y="80" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">OS PAGE CACHE</text>
  <text x="730" y="80" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">PERSISTENT MEDIA</text>
  <line x1="110" y1="90" x2="110" y2="250" stroke="#bc8cff" stroke-opacity=".6" stroke-width="2" stroke-dasharray="4 5"/>
  <line x1="430" y1="90" x2="430" y2="220" stroke="#30363d" stroke-width="2" stroke-dasharray="4 5"/>
  <line x1="730" y1="90" x2="730" y2="250" stroke="#30363d" stroke-width="2" stroke-dasharray="4 5"/>

  <line x1="110" y1="120" x2="426" y2="120" stroke="#8b949e" stroke-width="1.6" marker-end="url(#d217a)"/>
  <text x="270" y="112" fill="#79c0ff" font-size="12.5" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">write(log)</text>

  <line x1="430" y1="160" x2="114" y2="160" stroke="#3fb950" stroke-width="1.6" marker-end="url(#d217g)"/>
  <text x="270" y="152" fill="#56d364" font-size="13" font-weight="600" text-anchor="middle">"COMMIT OK" returned to user ✓</text>

  <line x1="44" y1="198" x2="816" y2="198" stroke="#f85149" stroke-width="1.5" stroke-dasharray="7 5"/>
  <rect x="280" y="185" width="300" height="26" rx="13" fill="#161b22" stroke="#f85149"/>
  <text x="430" y="202.5" fill="#ff7b72" font-size="12.5" text-anchor="middle"><tspan font-weight="700" letter-spacing="1">POWER LOSS</tspan>  (before the kernel flushed)</text>

  <line x1="430" y1="211" x2="430" y2="226" stroke="#f85149" stroke-width="1.5" marker-end="url(#d217r)"/>
  <rect x="350" y="228" width="160" height="32" rx="8" fill="#f85149" fill-opacity=".14" stroke="#f85149" stroke-opacity=".8"/>
  <text x="430" y="249" fill="#ff7b72" font-size="13" font-weight="700" text-anchor="middle">Log record GONE.</text>

  <text x="44" y="296" fill="#c9d1d9" font-size="13">The user was told "committed" but the change vanished.</text>
  <rect x="600" y="280" width="216" height="26" rx="13" fill="#f85149" fill-opacity=".16" stroke="#f85149" stroke-opacity=".8"/>
  <text x="708" y="297.5" fill="#ff7b72" font-size="12.5" font-weight="700" text-anchor="middle" letter-spacing="1">✗ DURABILITY VIOLATED</text>

  <!-- ================= WITH fsync ================= -->
  <rect x="24" y="340" width="812" height="372" rx="12" fill="#1c2128" fill-opacity=".5" stroke="#3fb950" stroke-opacity=".55"/>
  <path d="M36,340 H824 A12,12 0 0 1 836,352 V374 H24 V352 A12,12 0 0 1 36,340 Z" fill="#3fb950" fill-opacity=".12"/>
  <text x="44" y="363" fill="#56d364" font-size="14" font-weight="700" letter-spacing="1.2">WITH <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" letter-spacing="0">fsync</tspan></text>

  <text x="110" y="400" fill="#d2a8ff" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">T1</text>
  <text x="430" y="400" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">OS PAGE CACHE</text>
  <text x="730" y="400" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">PERSISTENT MEDIA</text>
  <line x1="110" y1="410" x2="110" y2="580" stroke="#bc8cff" stroke-opacity=".6" stroke-width="2" stroke-dasharray="4 5"/>
  <line x1="430" y1="410" x2="430" y2="580" stroke="#30363d" stroke-width="2" stroke-dasharray="4 5"/>
  <line x1="730" y1="410" x2="730" y2="580" stroke="#30363d" stroke-width="2" stroke-dasharray="4 5"/>

  <line x1="110" y1="438" x2="426" y2="438" stroke="#8b949e" stroke-width="1.6" marker-end="url(#d217a)"/>
  <text x="270" y="430" fill="#79c0ff" font-size="12.5" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">write(log)</text>

  <line x1="110" y1="478" x2="726" y2="478" stroke="#3fb950" stroke-width="1.8" marker-end="url(#d217g)"/>
  <text x="270" y="470" fill="#56d364" font-size="12.5" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">fsync(log)</text>
  <circle cx="752" cy="478" r="9" fill="#3fb950" fill-opacity=".18" stroke="#3fb950"/>
  <text x="752" y="482.5" fill="#56d364" font-size="12" font-weight="700" text-anchor="middle">✓</text>

  <line x1="730" y1="518" x2="114" y2="518" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#d217a)"/>
  <text x="580" y="510" fill="#c9d1d9" font-size="12.5" text-anchor="middle">returns  <tspan fill="#e3b341">(0.1–10 ms later)</tspan></text>

  <rect x="96" y="540" width="270" height="26" rx="13" fill="#3fb950" fill-opacity=".16" stroke="#3fb950" stroke-opacity=".8"/>
  <text x="231" y="557.5" fill="#56d364" font-size="13" font-weight="600" text-anchor="middle">"COMMIT OK" returned to user ✓</text>

  <line x1="44" y1="602" x2="816" y2="602" stroke="#f85149" stroke-width="1.5" stroke-dasharray="7 5"/>
  <rect x="370" y="589" width="120" height="26" rx="13" fill="#161b22" stroke="#f85149"/>
  <text x="430" y="606.5" fill="#ff7b72" font-size="12.5" font-weight="700" letter-spacing="1" text-anchor="middle">POWER LOSS</text>

  <line x1="430" y1="615" x2="430" y2="630" stroke="#3fb950" stroke-width="1.5" marker-end="url(#d217g)"/>
  <rect x="44" y="632" width="772" height="34" rx="8" fill="#3fb950" fill-opacity=".10" stroke="#3fb950" stroke-opacity=".6"/>
  <text x="430" y="654" fill="#c9d1d9" font-size="13" text-anchor="middle">On restart, recovery finds the log record and <tspan fill="#56d364" font-weight="700">REPLAYS</tspan> it.</text>

  <rect x="340" y="676" width="180" height="26" rx="13" fill="#3fb950" fill-opacity=".18" stroke="#3fb950" stroke-opacity=".85"/>
  <text x="430" y="693.5" fill="#56d364" font-size="12.5" font-weight="700" text-anchor="middle" letter-spacing="1">✓ DURABILITY HELD</text>
</svg>
