  <text x="482.0" y="233.5" fill="#c9d1d9" font-size="13.5">Assert by querying tables afterwards</text>
  <line x1="454.0" y1="246" x2="822.0" y2="246" stroke="#21262d"/>
  <text x="460.0" y="267.5" fill="#ff7b72" font-size="14" font-weight="700">✗</text>
  <text x="482.0" y="267.5" fill="#c9d1d9" font-size="13.5">Very limited debugging tools</text>
</svg>
