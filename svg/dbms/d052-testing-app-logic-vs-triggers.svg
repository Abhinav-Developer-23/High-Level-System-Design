  <text x="482.0" y="97.5" fill="#c9d1d9" font-size="13.5">Needs a running database</text>
  <line x1="454.0" y1="110" x2="822.0" y2="110" stroke="#21262d"/>
  <text x="460.0" y="131.5" fill="#ff7b72" font-size="14" font-weight="700">✗</text>
  <text x="482.0" y="131.5" fill="#c9d1d9" font-size="13.5">Must set up real tables + data</text>
  <line x1="454.0" y1="144" x2="822.0" y2="144" stroke="#21262d"/>
  <text x="460.0" y="165.5" fill="#ff7b72" font-size="14" font-weight="700">✗</text>
  <text x="482.0" y="165.5" fill="#c9d1d9" font-size="13.5">Slow integration test</text>
  <line x1="454.0" y1="178" x2="822.0" y2="178" stroke="#21262d"/>
  <text x="460.0" y="199.5" fill="#ff7b72" font-size="14" font-weight="700">✗</text>
  <text x="482.0" y="199.5" fill="#c9d1d9" font-size="13.5">Needs DB container in CI</text>
