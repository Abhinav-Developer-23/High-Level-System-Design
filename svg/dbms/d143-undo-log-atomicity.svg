<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Undo log for atomicity</title>
  <desc>Transaction T transfers 500 from A to B. The undo log records (T, A, old_value = 1000) and (T, B, old_value = 2000) while the database holds the modified A = 500 and B = 2500. If T fails the undo log is read in reverse, A = 1000 and B = 2000 are restored, and the transaction never happened.</desc>
  <defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d29922"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39c5cf"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs>
  <rect x="0.5" y="0.5" width="799" height="359" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="24" y="42" font-size="14.5" fill="#8b949e">Transaction T: <tspan fill="#e6edf3" font-weight="600">Transfer ₹500 from A to B</tspan></text>
  <text x="24" y="78" font-size="12" fill="#e3b341" font-weight="700" letter-spacing="1.5">UNDO LOG</text>
  <rect x="24" y="90" width="330" height="90" rx="10" fill="#d29922" fill-opacity="0.08" stroke="#d29922" stroke-opacity="0.6"/>
  <text x="42" y="124" font-size="13" fill="#e6edf3" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">(T, A, old_value = 1000)</text>
  <text x="42" y="156" font-size="13" fill="#e6edf3" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">(T, B, old_value = 2000)</text>
  <text x="480" y="78" font-size="12" fill="#56d4dd" font-weight="700" letter-spacing="1.5">DATABASE</text>
  <rect x="480" y="90" width="170" height="90" rx="10" fill="#39c5cf" fill-opacity="0.1" stroke="#39c5cf" stroke-opacity="0.6"/>
  <text x="498" y="124" font-size="13" fill="#e6edf3" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">A = 500</text>
  <text x="498" y="156" font-size="13" fill="#e6edf3" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">B = 2500</text>
  <line x1="474" y1="120" x2="362" y2="120" stroke="#d29922" stroke-width="1.6" marker-end="url(#a-amber)"/>
  <line x1="474" y1="152" x2="362" y2="152" stroke="#d29922" stroke-width="1.6" marker-end="url(#a-amber)"/>
  <text x="664" y="124" font-size="12.5" fill="#8b949e">(modified)</text>
  <text x="664" y="156" font-size="12.5" fill="#8b949e">(modified)</text>
  <rect x="24" y="204" width="752" height="132" rx="10" fill="#f85149" fill-opacity="0.07" stroke="#f85149" stroke-opacity="0.5"/>
  <text x="42" y="232" font-size="14" fill="#ff7b72" font-weight="600">If T fails:</text>
  <rect x="42" y="254" width="216" height="56" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="56" y="287" font-size="13" fill="#e6edf3">Read undo log in <tspan fill="#e3b341" font-weight="700">REVERSE</tspan></text>
  <line x1="262" y1="282" x2="286" y2="282" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <rect x="290" y="254" width="232" height="56" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="304" y="287" font-size="13" fill="#e6edf3">Restore <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">A = 1000, B = 2000</tspan></text>
  <line x1="526" y1="282" x2="550" y2="282" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <rect x="554" y="254" width="216" height="56" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="568" y="287" font-size="13" fill="#e6edf3">Transaction “never happened”</text>
</svg>
