<svg xmlns="http://www.w3.org/2000/svg" width="880" height="172" viewBox="0 0 880 172" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Doublewrite buffer steps</title>
  <desc>Step 1: write dirty pages to the doublewrite area (sequential, safe). Step 2: confirm the doublewrite area is on disk. Step 3: write dirty pages to their actual data file locations.</desc>
  <defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d29922"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39c5cf"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs>
  <rect x="0.5" y="0.5" width="879" height="171" rx="14" fill="#161b22" stroke="#30363d"/>
  <rect x="24" y="24" width="256" height="124" rx="10" fill="#39c5cf" fill-opacity="0.1" stroke="#39c5cf" stroke-opacity="0.6"/>
  <rect x="36.0" y="38" width="64" height="22" rx="11.0" fill="#39c5cf" fill-opacity="0.14" stroke="#39c5cf" stroke-opacity="0.6"/>
  <text x="68" y="53.14" fill="#56d4dd" font-size="11.5" font-weight="700" text-anchor="middle">STEP 1</text>
  <text x="42" y="88" fill="#e6edf3" font-size="14" font-weight="600">Write dirty pages →</text>
  <text x="42" y="108" fill="#e6edf3" font-size="14" font-weight="600">doublewrite area</text>
  <text x="42" y="130" fill="#56d4dd" font-size="13">(sequential, safe)</text>
  <line x1="282" y1="86" x2="308" y2="86" stroke="#8b949e" stroke-width="1.8" marker-end="url(#a-gray)"/>
  <rect x="312" y="24" width="256" height="124" rx="10" fill="#3fb950" fill-opacity="0.1" stroke="#3fb950" stroke-opacity="0.6"/>
  <rect x="324.0" y="38" width="64" height="22" rx="11.0" fill="#3fb950" fill-opacity="0.14" stroke="#3fb950" stroke-opacity="0.6"/>
  <text x="356" y="53.14" fill="#56d364" font-size="11.5" font-weight="700" text-anchor="middle">STEP 2</text>
  <text x="330" y="88" fill="#e6edf3" font-size="14" font-weight="600">Confirm doublewrite area</text>
  <text x="330" y="108" fill="#e6edf3" font-size="14" font-weight="600">is on disk ✓</text>
  <line x1="570" y1="86" x2="596" y2="86" stroke="#8b949e" stroke-width="1.8" marker-end="url(#a-gray)"/>
  <rect x="600" y="24" width="256" height="124" rx="10" fill="#39c5cf" fill-opacity="0.1" stroke="#39c5cf" stroke-opacity="0.6"/>
  <rect x="612.0" y="38" width="64" height="22" rx="11.0" fill="#39c5cf" fill-opacity="0.14" stroke="#39c5cf" stroke-opacity="0.6"/>
  <text x="644" y="53.14" fill="#56d4dd" font-size="11.5" font-weight="700" text-anchor="middle">STEP 3</text>
  <text x="618" y="88" fill="#e6edf3" font-size="14" font-weight="600">Write dirty pages →</text>
  <text x="618" y="108" fill="#e6edf3" font-size="14" font-weight="600">actual data file locations</text>
</svg>
