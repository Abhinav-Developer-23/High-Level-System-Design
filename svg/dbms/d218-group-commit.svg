<svg xmlns="http://www.w3.org/2000/svg" width="820" height="292" viewBox="0 0 820 292" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Group commit</title>
  <desc>Without group commit, T1, T2 and T3 each do their own fsync: 3 fsyncs, 3 × 1 ms = 3 ms. With group commit, T1–T3 share one fsync to disk: 1 × 1 ms = 1 ms, and all 3 commits become durable together.</desc>
  <defs>
    <marker id="d218a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
    <marker id="d218g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="819" height="291" rx="14" fill="#161b22" stroke="#30363d"/>

  <!-- ===== Without ===== -->
  <rect x="24" y="24" width="374" height="244" rx="12" fill="#1c2128" fill-opacity=".5" stroke="#d29922" stroke-opacity=".5"/>
  <path d="M36,24 H386 A12,12 0 0 1 398,36 V56 H24 V36 A12,12 0 0 1 36,24 Z" fill="#d29922" fill-opacity=".12"/>
  <text x="42" y="45" fill="#e3b341" font-size="14" font-weight="700">Without group commit:</text>

  <text x="56" y="101" fill="#d2a8ff" font-size="13.5" font-weight="700" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">T1</text>
  <text x="56" y="141" fill="#56d4dd" font-size="13.5" font-weight="700" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">T2</text>
  <text x="56" y="181" fill="#ffa657" font-size="13.5" font-weight="700" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">T3</text>
  <g stroke="#484f58" stroke-width="1.5">
    <line x1="82" y1="96" x2="112" y2="96"/><line x1="182" y1="96" x2="214" y2="96"/>
    <line x1="82" y1="136" x2="112" y2="136"/><line x1="182" y1="136" x2="214" y2="136"/>
    <line x1="82" y1="176" x2="112" y2="176"/><line x1="182" y1="176" x2="214" y2="176"/>
    <line x1="214" y1="96" x2="214" y2="176"/>
  </g>
  <rect x="112" y="84" width="70" height="24" rx="12" fill="#d29922" fill-opacity=".14" stroke="#d29922" stroke-opacity=".7"/>
  <text x="147" y="100.5" fill="#e3b341" font-size="12.5" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">fsync</text>
  <rect x="112" y="124" width="70" height="24" rx="12" fill="#d29922" fill-opacity=".14" stroke="#d29922" stroke-opacity=".7"/>
  <text x="147" y="140.5" fill="#e3b341" font-size="12.5" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">fsync</text>
  <rect x="112" y="164" width="70" height="24" rx="12" fill="#d29922" fill-opacity=".14" stroke="#d29922" stroke-opacity=".7"/>
  <text x="147" y="180.5" fill="#e3b341" font-size="12.5" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">fsync</text>
  <text x="232" y="141" fill="#e3b341" font-size="14" font-weight="700">3 fsyncs</text>

  <line x1="44" y1="208" x2="378" y2="208" stroke="#21262d"/>
  <text x="211" y="238" fill="#e6edf3" font-size="14" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">3 × 1 ms = <tspan fill="#e3b341" font-weight="700">3 ms</tspan></text>

  <!-- ===== With ===== -->
  <rect x="422" y="24" width="374" height="244" rx="12" fill="#1c2128" fill-opacity=".5" stroke="#3fb950" stroke-opacity=".55"/>
  <path d="M434,24 H784 A12,12 0 0 1 796,36 V56 H422 V36 A12,12 0 0 1 434,24 Z" fill="#3fb950" fill-opacity=".12"/>
  <text x="440" y="45" fill="#56d364" font-size="14" font-weight="700">With group commit:</text>

  <text x="452" y="101" fill="#d2a8ff" font-size="13.5" font-weight="700" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">T1</text>
  <text x="452" y="141" fill="#56d4dd" font-size="13.5" font-weight="700" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">T2</text>
  <text x="452" y="181" fill="#ffa657" font-size="13.5" font-weight="700" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">T3</text>
  <g fill="none" stroke="#484f58" stroke-width="1.5">
    <path d="M478,96 H498 Q516,96 516,114 V122 Q516,136 530,136"/>
    <path d="M478,176 H498 Q516,176 516,158 V150 Q516,136 530,136"/>
    <line x1="478" y1="136" x2="530" y2="136"/>
  </g>
  <line x1="530" y1="136" x2="542" y2="136" stroke="#3fb950" stroke-width="1.6"/>
  <rect x="542" y="122" width="96" height="28" rx="14" fill="#3fb950" fill-opacity=".16" stroke="#3fb950" stroke-opacity=".8"/>
  <text x="590" y="140.5" fill="#56d364" font-size="13" font-weight="700" text-anchor="middle">one <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">fsync</tspan></text>
  <line x1="638" y1="136" x2="682" y2="136" stroke="#3fb950" stroke-width="1.6" marker-end="url(#d218g)"/>
  <rect x="686" y="118" width="88" height="36" rx="8" fill="#39c5cf" fill-opacity=".12" stroke="#39c5cf" stroke-opacity=".7"/>
  <text x="730" y="141" fill="#56d4dd" font-size="13.5" font-weight="600" text-anchor="middle">disk</text>

  <line x1="442" y1="208" x2="776" y2="208" stroke="#21262d"/>
  <text x="609" y="234" fill="#e6edf3" font-size="14" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">1 × 1 ms = <tspan fill="#56d364" font-weight="700">1 ms</tspan></text>
  <text x="609" y="255" fill="#56d364" font-size="12.5" text-anchor="middle">(all 3 commits durable together)</text>
</svg>
