<svg xmlns="http://www.w3.org/2000/svg" width="840" height="440" viewBox="0 0 840 440" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>B-Tree structure and lookup</title>
  <desc>B-Tree for a clustered index on emp_id. Root [50] has children [10, 30] and [70, 90]. The left child points to leaves 1-9, 10-29 and 30-49, each holding DATA; the right child points to further leaf nodes. In a clustered index leaves hold actual data rows; in a non-clustered index they hold key plus pointer. Lookup for emp_id = 25: Root(50), go left, Node(10,30), middle, Leaf(10-29), found. Only 3 steps instead of scanning all rows.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="839" height="439" rx="14" fill="#161b22" stroke="#30363d"/>

  <text x="32" y="42" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">B-TREE STRUCTURE <tspan letter-spacing="0" font-weight="400">(Clustered Index on <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" fill="#79c0ff">emp_id</tspan>)</tspan></text>

  <!-- edges -->
  <g stroke-width="1.5" fill="none">
    <line x1="290" y1="116" x2="170" y2="150" stroke="#3fb950" stroke-width="2" marker-end="url(#arrG)"/>
    <line x1="350" y1="116" x2="470" y2="150" stroke="#8b949e" marker-end="url(#arr)"/>
    <line x1="140" y1="190" x2="80" y2="238" stroke="#8b949e" marker-end="url(#arr)"/>
    <line x1="170" y1="190" x2="170" y2="238" stroke="#3fb950" stroke-width="2" marker-end="url(#arrG)"/>
    <line x1="200" y1="190" x2="260" y2="238" stroke="#8b949e" marker-end="url(#arr)"/>
    <line x1="440" y1="190" x2="400" y2="238" stroke="#8b949e" marker-end="url(#arr)"/>
    <line x1="470" y1="190" x2="470" y2="238" stroke="#8b949e" marker-end="url(#arr)"/>
    <line x1="500" y1="190" x2="540" y2="238" stroke="#8b949e" marker-end="url(#arr)"/>
  </g>

  <!-- root -->
  <rect x="260" y="60" width="120" height="56" rx="10" fill="#1c2128" stroke="#3fb950" stroke-opacity=".8"/>
  <text x="320" y="82" fill="#8b949e" font-size="12" text-anchor="middle">Root</text>
  <text x="320" y="104" fill="#e6edf3" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="15" font-weight="600" text-anchor="middle">[50]</text>

  <!-- internal -->
  <rect x="110" y="150" width="120" height="40" rx="8" fill="#1c2128" stroke="#3fb950" stroke-opacity=".8"/>
  <text x="170" y="175" fill="#e6edf3" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle">[10, 30]</text>
  <rect x="410" y="150" width="120" height="40" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="470" y="175" fill="#e6edf3" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle">[70, 90]</text>

  <!-- leaves -->
  <g font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" text-anchor="middle">
    <rect x="44" y="242" width="72" height="56" rx="8" fill="#39c5cf" fill-opacity=".08" stroke="#39c5cf" stroke-opacity=".5"/>
    <text x="80" y="264" fill="#e6edf3" font-size="13" font-weight="600">1-9</text>
    <text x="80" y="286" fill="#56d4dd" font-size="12">DATA</text>
    <rect x="134" y="242" width="72" height="56" rx="8" fill="#3fb950" fill-opacity=".14" stroke="#3fb950" stroke-width="1.5"/>
    <text x="170" y="264" fill="#e6edf3" font-size="13" font-weight="600">10-29</text>
    <text x="170" y="286" fill="#56d364" font-size="12">DATA</text>
    <rect x="224" y="242" width="72" height="56" rx="8" fill="#39c5cf" fill-opacity=".08" stroke="#39c5cf" stroke-opacity=".5"/>
    <text x="260" y="264" fill="#e6edf3" font-size="13" font-weight="600">30-49</text>
    <text x="260" y="286" fill="#56d4dd" font-size="12">DATA</text>
  </g>
  <rect x="360" y="242" width="220" height="56" rx="8" fill="#1c2128" stroke="#484f58" stroke-dasharray="6 5"/>
  <text x="470" y="275" fill="#8b949e" font-size="13" text-anchor="middle">(leaf nodes)</text>

  <!-- leaf legend -->
  <line x1="596" y1="270" x2="612" y2="270" stroke="#484f58" stroke-width="1.5"/>
  <line x1="612" y1="246" x2="612" y2="294" stroke="#484f58" stroke-width="1.5"/>
  <text x="626" y="263" fill="#c9d1d9" font-size="13"><tspan font-weight="600" fill="#e6edf3">Clustered:</tspan> actual data rows</text>
  <text x="626" y="287" fill="#c9d1d9" font-size="13"><tspan font-weight="600" fill="#e6edf3">Non-clustered:</tspan> key + pointer</text>

  <!-- lookup -->
  <line x1="24" y1="322" x2="816" y2="322" stroke="#21262d"/>
  <text x="32" y="350" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">LOOKUP FOR <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" letter-spacing="0" font-weight="400" fill="#79c0ff">emp_id = 25</tspan></text>
  <g font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="13" text-anchor="middle">
    <rect x="32" y="364" width="92" height="28" rx="14" fill="#1c2128" stroke="#3fb950" stroke-opacity=".7"/>
    <text x="78" y="383" fill="#e6edf3">Root(50)</text>
    <rect x="230" y="364" width="118" height="28" rx="14" fill="#1c2128" stroke="#3fb950" stroke-opacity=".7"/>
    <text x="289" y="383" fill="#e6edf3">Node(10,30)</text>
    <rect x="446" y="364" width="118" height="28" rx="14" fill="#3fb950" fill-opacity=".14" stroke="#3fb950"/>
    <text x="505" y="383" fill="#e6edf3">Leaf(10-29)</text>
  </g>
  <line x1="128" y1="378" x2="224" y2="378" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrG)"/>
  <text x="176" y="371" fill="#c9d1d9" font-size="12" text-anchor="middle" data-nocheck="1">go left</text>
  <line x1="352" y1="378" x2="440" y2="378" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrG)"/>
  <text x="396" y="371" fill="#c9d1d9" font-size="12" text-anchor="middle" data-nocheck="1">middle</text>
  <line x1="568" y1="378" x2="600" y2="378" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrG)"/>
  <text x="608" y="383" fill="#56d364" font-size="14" font-weight="700">found!</text>
  <text x="32" y="418" fill="#56d364" font-size="13" font-weight="600">Only 3 steps instead of scanning all rows!</text>
</svg>
