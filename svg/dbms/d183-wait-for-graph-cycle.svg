<svg xmlns="http://www.w3.org/2000/svg" width="760" height="316" viewBox="0 0 760 316" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Wait-for graph cycle</title>
  <desc>T1 holds A wants B, T2 holds B wants C, T3 holds C wants A. Wait-for graph T1 to T2 to T3 to T1 is a cycle, so deadlock.</desc>
  <defs>
    <marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker>
    <marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker>
    <marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d29922"/></marker>
    <marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/></marker>
    <marker id="m-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39c5cf"/></marker>
    <marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker>
    <marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="759" height="315" rx="14" fill="#161b22" stroke="#30363d"/>
  <rect x="24" y="52" width="270" height="44" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="42" y="79" font-size="14" fill="#c9d1d9"><tspan fill="#d2a8ff" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-weight="700">T1</tspan>  holds <tspan fill="#56d364" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-weight="700">A</tspan>,  wants <tspan fill="#e3b341" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-weight="700">B</tspan></text>
  <rect x="24" y="110" width="270" height="44" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="42" y="137" font-size="14" fill="#c9d1d9"><tspan fill="#56d4dd" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-weight="700">T2</tspan>  holds <tspan fill="#56d364" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-weight="700">B</tspan>,  wants <tspan fill="#e3b341" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-weight="700">C</tspan></text>
  <rect x="24" y="168" width="270" height="44" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="42" y="195" font-size="14" fill="#c9d1d9"><tspan fill="#ffa657" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-weight="700">T3</tspan>  holds <tspan fill="#56d364" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-weight="700">C</tspan>,  wants <tspan fill="#e3b341" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-weight="700">A</tspan></text>
  <text x="360" y="40" font-size="12" fill="#8b949e" font-weight="700" letter-spacing="1.5">WAIT-FOR GRAPH</text>
  <line x1="446" y1="96" x2="590" y2="96" stroke="#f85149" stroke-width="1.8" marker-end="url(#m-red)"/>
  <line x1="620" y1="122" x2="620" y2="186" stroke="#f85149" stroke-width="1.8" marker-end="url(#m-red)"/>
  <path d="M594,216 H420 V126" stroke="#f85149" stroke-width="1.8" fill="none" marker-end="url(#m-red)"/>
  <text x="518" y="86" font-size="12" fill="#8b949e" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" data-nocheck="1">B</text>
  <text x="634" y="160" font-size="12" fill="#8b949e" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" data-nocheck="1">C</text>
  <text x="512" y="236" font-size="12" fill="#8b949e" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" data-nocheck="1">A</text>
  <circle cx="420" cy="96" r="26" fill="#bc8cff" fill-opacity=".16" stroke="#bc8cff" stroke-width="1.6"/>
  <text x="420" y="101" font-size="15" fill="#d2a8ff" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">T1</text>
  <circle cx="620" cy="96" r="26" fill="#39c5cf" fill-opacity=".16" stroke="#39c5cf" stroke-width="1.6"/>
  <text x="620" y="101" font-size="15" fill="#56d4dd" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">T2</text>
  <circle cx="620" cy="216" r="26" fill="#f0883e" fill-opacity=".16" stroke="#f0883e" stroke-width="1.6"/>
  <text x="620" y="221" font-size="15" fill="#ffa657" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">T3</text>
  <line x1="24" y1="256" x2="736" y2="256" stroke="#21262d"/>
  <text x="24" y="290" font-size="14" fill="#e6edf3" font-weight="600">Cycle  <tspan fill="#d2a8ff" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-weight="600">T1</tspan><tspan fill="#8b949e"> → </tspan><tspan fill="#56d4dd" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-weight="600">T2</tspan><tspan fill="#8b949e"> → </tspan><tspan fill="#ffa657" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-weight="600">T3</tspan><tspan fill="#8b949e"> → </tspan><tspan fill="#d2a8ff" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-weight="600">T1</tspan><tspan fill="#8b949e">   →   </tspan></text>
  <rect x="227.0" y="274.0" width="110" height="22" rx="11.0" fill="#f85149" fill-opacity="0.15" stroke="#f85149" stroke-opacity="0.6"/>
  <text x="282" y="289.3" font-size="12" fill="#ff7b72" font-weight="700" text-anchor="middle">DEADLOCK</text>
</svg>
