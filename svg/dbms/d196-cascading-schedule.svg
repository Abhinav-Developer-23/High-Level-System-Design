<svg xmlns="http://www.w3.org/2000/svg" width="780" height="402" viewBox="0 0 780 402" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Cascading schedule</title>
  <desc>T2 reads T1's uncommitted A, T3 reads T2's uncommitted A. When T1 aborts, T2 and then T3 must abort: T1 fails, T2 fails, T3 fails.</desc>
  <defs>
    <marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker>
    <marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker>
    <marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d29922"/></marker>
    <marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/></marker>
    <marker id="m-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39c5cf"/></marker>
    <marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker>
    <marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="779" height="401" rx="14" fill="#161b22" stroke="#30363d"/>
  <rect x="82" y="24" width="146" height="320" rx="6" fill="#bc8cff" fill-opacity="0.05" stroke="none"/>
  <rect x="232" y="24" width="146" height="320" rx="6" fill="#39c5cf" fill-opacity="0.05" stroke="none"/>
  <rect x="382" y="24" width="146" height="320" rx="6" fill="#f0883e" fill-opacity="0.05" stroke="none"/>
  <text x="52.0" y="45" font-size="12" fill="#8b949e" font-weight="700" text-anchor="middle" letter-spacing="1.5">TIME</text>
  <text x="155.0" y="45" font-size="14" fill="#d2a8ff" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">T1</text>
  <text x="305.0" y="45" font-size="14" fill="#56d4dd" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">T2</text>
  <text x="455.0" y="45" font-size="14" fill="#ffa657" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">T3</text>
  <line x1="24" y1="56" x2="530" y2="56" stroke="#30363d"/>
  <text x="52.0" y="78.5" font-size="13" fill="#8b949e" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">1</text>
  <rect x="128.5" y="62.0" width="53" height="24" rx="6" fill="#bc8cff" fill-opacity="0.14" stroke="#bc8cff" stroke-opacity="0.55"/>
  <text x="155.0" y="78.5" font-size="13" fill="#d2a8ff" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">R(A)</text>
  <line x1="24" y1="92" x2="530" y2="92" stroke="#21262d"/>
  <text x="52.0" y="114.5" font-size="13" fill="#8b949e" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">2</text>
  <rect x="108.5" y="98.0" width="93" height="24" rx="6" fill="#bc8cff" fill-opacity="0.14" stroke="#bc8cff" stroke-opacity="0.55"/>
  <text x="155.0" y="114.5" font-size="13" fill="#d2a8ff" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">W(A) = 50</text>
  <line x1="24" y1="128" x2="530" y2="128" stroke="#21262d"/>
  <text x="52.0" y="150.5" font-size="13" fill="#8b949e" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">3</text>
  <rect x="258.5" y="134.0" width="93" height="24" rx="6" fill="#39c5cf" fill-opacity="0.14" stroke="#39c5cf" stroke-opacity="0.55"/>
  <text x="305.0" y="150.5" font-size="13" fill="#56d4dd" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">R(A) = 50</text>
  <text x="546" y="150.5" font-size="13" fill="#c9d1d9"><tspan fill="#8b949e">← </tspan>reads T1's <tspan fill="#e3b341" font-weight="700">uncommitted</tspan> data</text>
  <line x1="24" y1="164" x2="530" y2="164" stroke="#21262d"/>
  <text x="52.0" y="186.5" font-size="13" fill="#8b949e" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">4</text>
  <rect x="258.5" y="170.0" width="93" height="24" rx="6" fill="#39c5cf" fill-opacity="0.14" stroke="#39c5cf" stroke-opacity="0.55"/>
  <text x="305.0" y="186.5" font-size="13" fill="#56d4dd" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">W(A) = 70</text>
  <line x1="24" y1="200" x2="530" y2="200" stroke="#21262d"/>
  <text x="52.0" y="222.5" font-size="13" fill="#8b949e" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">5</text>
  <rect x="408.5" y="206.0" width="93" height="24" rx="6" fill="#f0883e" fill-opacity="0.14" stroke="#f0883e" stroke-opacity="0.55"/>
  <text x="455.0" y="222.5" font-size="13" fill="#ffa657" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">R(A) = 70</text>
  <text x="546" y="222.5" font-size="13" fill="#c9d1d9"><tspan fill="#8b949e">← </tspan>reads T2's <tspan fill="#e3b341" font-weight="700">uncommitted</tspan> data</text>
  <line x1="24" y1="236" x2="530" y2="236" stroke="#21262d"/>
  <rect x="24" y="238" width="506" height="32" rx="6" fill="#f85149" fill-opacity="0.1" stroke="#f85149" stroke-opacity="0.45"/>
  <text x="52.0" y="258.5" font-size="13" fill="#8b949e" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">6</text>
  <rect x="116.5" y="242.0" width="77" height="24" rx="6" fill="#f85149" fill-opacity="0.14" stroke="#f85149" stroke-opacity="0.55"/>
  <text x="155.0" y="258.5" font-size="13" fill="#ff7b72" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">ABORT ✗</text>
  <line x1="24" y1="272" x2="530" y2="272" stroke="#21262d"/>
  <rect x="24" y="274" width="506" height="32" rx="6" fill="#f85149" fill-opacity="0.1" stroke="#f85149" stroke-opacity="0.45"/>
  <text x="52.0" y="294.5" font-size="13" fill="#8b949e" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">7</text>
  <rect x="266.5" y="278.0" width="77" height="24" rx="6" fill="#f85149" fill-opacity="0.14" stroke="#f85149" stroke-opacity="0.55"/>
  <text x="305.0" y="294.5" font-size="13" fill="#ff7b72" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">ABORT ✗</text>
  <text x="546" y="294.5" font-size="13" fill="#c9d1d9"><tspan fill="#8b949e">← </tspan>must abort (read from T1)</text>
  <line x1="24" y1="308" x2="530" y2="308" stroke="#21262d"/>
  <rect x="24" y="310" width="506" height="32" rx="6" fill="#f85149" fill-opacity="0.1" stroke="#f85149" stroke-opacity="0.45"/>
  <text x="52.0" y="330.5" font-size="13" fill="#8b949e" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">8</text>
  <rect x="416.5" y="314.0" width="77" height="24" rx="6" fill="#f85149" fill-opacity="0.14" stroke="#f85149" stroke-opacity="0.55"/>
  <text x="455.0" y="330.5" font-size="13" fill="#ff7b72" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">ABORT ✗</text>
  <text x="546" y="330.5" font-size="13" fill="#c9d1d9"><tspan fill="#8b949e">← </tspan>must abort (read from T2)</text>
  <path d="M155.0,122.0 V146.0 H255.0" stroke="#d29922" stroke-width="1.4" fill="none" stroke-dasharray="4 4" marker-end="url(#m-amber)"/>
  <path d="M305.0,194.0 V218.0 H405.0" stroke="#d29922" stroke-width="1.4" fill="none" stroke-dasharray="4 4" marker-end="url(#m-amber)"/>
  <path d="M155.0,266.0 V290.0 H261.0" stroke="#f85149" stroke-width="1.6" fill="none" marker-end="url(#m-red)"/>
  <path d="M305.0,302.0 V326.0 H411.0" stroke="#f85149" stroke-width="1.6" fill="none" marker-end="url(#m-red)"/>
  <text x="24" y="378" font-size="14" fill="#c9d1d9">Cascade:  <tspan fill="#d2a8ff" font-weight="600">T1</tspan> fails<tspan fill="#ff7b72">  →  </tspan><tspan fill="#56d4dd" font-weight="600">T2</tspan> fails<tspan fill="#ff7b72">  →  </tspan><tspan fill="#ffa657" font-weight="600">T3</tspan> fails<tspan fill="#ff7b72" font-weight="700">  →  ...</tspan></text>
</svg>
