<svg xmlns="http://www.w3.org/2000/svg" width="700" height="588" viewBox="0 0 700 588" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Transaction state diagram</title>
  <desc>Active (initial, executing ops) goes to Partially Committed when the last operation is done. On success it becomes Committed (permanent); on failure it becomes Failed, then after rollback all it is Aborted (rolled back), from where it is either restarted (retry) or killed (cancel).</desc>
  <defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d29922"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39c5cf"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs>
  <rect x="0.5" y="0.5" width="699" height="587" rx="14" fill="#161b22" stroke="#30363d"/>
  <rect x="190.0" y="24" width="200" height="60" rx="10" fill="#58a6ff" fill-opacity="0.12" stroke="#58a6ff" stroke-opacity="0.7"/>
  <text x="290" y="50" font-size="14.5" fill="#79c0ff" font-weight="600" text-anchor="middle">Active</text>
  <text x="290" y="70" font-size="12.5" fill="#8b949e" text-anchor="middle">(executing ops)</text>
  <text x="404" y="59" font-size="13" fill="#79c0ff" font-weight="600">← Initial state</text>
  <line x1="290" y1="84" x2="290" y2="146" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <text x="302" y="120" font-size="12.5" fill="#8b949e">(last operation done)</text>
  <rect x="180.0" y="150" width="220" height="60" rx="10" fill="#d29922" fill-opacity="0.12" stroke="#d29922" stroke-opacity="0.7"/>
  <text x="290" y="176" font-size="14.5" fill="#e3b341" font-weight="600" text-anchor="middle">Partially Committed</text>
  <text x="290" y="196" font-size="12.5" fill="#8b949e" text-anchor="middle">(awaiting commit)</text>
  <text x="414" y="175" font-size="13" fill="#e3b341" font-weight="600">← All ops done,</text>
  <text x="432" y="194" font-size="13" fill="#e3b341" font-weight="600">not yet permanent</text>
  <line x1="290" y1="210" x2="290" y2="236" stroke="#8b949e" stroke-width="1.6"/>
  <line x1="170" y1="236" x2="440" y2="236" stroke="#8b949e" stroke-width="1.6"/>
  <line x1="170" y1="236" x2="170" y2="290" stroke="#3fb950" stroke-width="1.6" marker-end="url(#a-green)"/>
  <line x1="440" y1="236" x2="440" y2="290" stroke="#f85149" stroke-width="1.6" marker-end="url(#a-red)"/>
  <text x="160" y="268" font-size="12.5" fill="#56d364" font-weight="600" text-anchor="end">(success)</text>
  <text x="452" y="268" font-size="12.5" fill="#ff7b72" font-weight="600">(failure)</text>
  <rect x="80.0" y="294" width="180" height="60" rx="10" fill="#3fb950" fill-opacity="0.12" stroke="#3fb950" stroke-opacity="0.7"/>
  <text x="170" y="320" font-size="14.5" fill="#56d364" font-weight="600" text-anchor="middle">Committed</text>
  <text x="170" y="340" font-size="12.5" fill="#8b949e" text-anchor="middle">(permanent)</text>
  <rect x="350.0" y="294" width="180" height="60" rx="10" fill="#f85149" fill-opacity="0.12" stroke="#f85149" stroke-opacity="0.7"/>
  <text x="440" y="320" font-size="14.5" fill="#ff7b72" font-weight="600" text-anchor="middle">Failed</text>
  <text x="440" y="340" font-size="12.5" fill="#8b949e" text-anchor="middle">(cannot proceed)</text>
  <line x1="440" y1="354" x2="440" y2="416" stroke="#f85149" stroke-width="1.6" marker-end="url(#a-red)"/>
  <text x="452" y="390" font-size="12.5" fill="#8b949e">(rollback all)</text>
  <rect x="350.0" y="420" width="180" height="60" rx="10" fill="#f0883e" fill-opacity="0.12" stroke="#f0883e" stroke-opacity="0.7"/>
  <text x="440" y="446" font-size="14.5" fill="#ffa657" font-weight="600" text-anchor="middle">Aborted</text>
  <text x="440" y="466" font-size="12.5" fill="#8b949e" text-anchor="middle">(rolled back)</text>
  <line x1="440" y1="480" x2="440" y2="500" stroke="#8b949e" stroke-width="1.6"/>
  <line x1="370" y1="500" x2="510" y2="500" stroke="#8b949e" stroke-width="1.6"/>
  <line x1="370" y1="500" x2="370" y2="518" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <line x1="510" y1="500" x2="510" y2="518" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <rect x="308.0" y="522" width="124" height="54" rx="10" fill="#1c2128" stroke="#30363d" stroke-dasharray="6 5"/>
  <text x="370" y="548" font-size="14.5" fill="#e6edf3" font-weight="600" text-anchor="middle">Restart</text>
  <text x="370" y="568" font-size="12.5" fill="#8b949e" text-anchor="middle">(retry)</text>
  <rect x="448.0" y="522" width="124" height="54" rx="10" fill="#1c2128" stroke="#30363d"/>
  <text x="510" y="548" font-size="14.5" fill="#e6edf3" font-weight="600" text-anchor="middle">Kill</text>
  <text x="510" y="568" font-size="12.5" fill="#8b949e" text-anchor="middle">(cancel)</text>
</svg>
