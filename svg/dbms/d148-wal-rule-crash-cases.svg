<svg xmlns="http://www.w3.org/2000/svg" width="860" height="404" viewBox="0 0 860 404" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>WAL rule</title>
  <desc>WAL rule: write the log before writing the data. Step 1 writes to the log on disk (T1: A changed from 1000 to 500); step 2 writes A = 500 to the database. A crash after step 1 but before step 2 is fixed on restart by reading the log and redoing the change (A = 500). A crash before step 1 leaves no log entry, the change was never applied and A remains 1000.</desc>
  <defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d29922"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39c5cf"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs>
  <rect x="0.5" y="0.5" width="859" height="403" rx="14" fill="#161b22" stroke="#30363d"/>
  <rect x="24" y="24" width="812" height="46" rx="10" fill="#58a6ff" fill-opacity="0.1" stroke="#58a6ff" stroke-opacity="0.7"/>
  <text x="430" y="53" font-size="15" fill="#79c0ff" font-weight="700" text-anchor="middle">WAL Rule:  <tspan fill="#e6edf3" font-weight="600">“Write the LOG before writing the DATA”</tspan></text>
  <rect x="24.0" y="97.0" width="60" height="22" rx="11.0" fill="#39c5cf" fill-opacity=".16" stroke="#39c5cf" stroke-opacity=".6"/>
  <text x="54" y="112.32" font-size="12" fill="#56d4dd" font-weight="600" text-anchor="middle">Step 1</text>
  <rect x="96" y="90" width="230" height="36" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="112" y="113" font-size="13.5" fill="#e6edf3" font-weight="600">Write to LOG (on disk)</text>
  <line x1="330" y1="108" x2="384" y2="108" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="388" y="90" width="290" height="36" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="404" y="113" font-size="12.5" fill="#79c0ff" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">T1: A changed from 1000 to 500</text>
  <rect x="24.0" y="149.0" width="60" height="22" rx="11.0" fill="#58a6ff" fill-opacity=".16" stroke="#58a6ff" stroke-opacity=".6"/>
  <text x="54" y="164.32" font-size="12" fill="#79c0ff" font-weight="600" text-anchor="middle">Step 2</text>
  <rect x="96" y="142" width="230" height="36" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="112" y="165" font-size="13.5" fill="#e6edf3" font-weight="600">Write to DATABASE</text>
  <line x1="330" y1="160" x2="384" y2="160" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="388" y="142" width="290" height="36" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="404" y="165" font-size="12.5" fill="#79c0ff" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">A = 500</text>
  <rect x="24" y="210" width="398" height="170" rx="10" fill="#3fb950" fill-opacity="0.06" stroke="#3fb950" stroke-opacity="0.45"/>
  <text x="42" y="238" font-size="13.5" fill="#e3b341" font-weight="600">⚠ If crash after Step 1 but before Step 2:</text>
  <rect x="42" y="254" width="362" height="30" rx="7" fill="#1c2128" stroke="#30363d"/>
  <text x="58" y="274" font-size="13" fill="#e6edf3">→  On restart, READ the log</text>
  <rect x="42" y="296" width="362" height="30" rx="7" fill="#1c2128" stroke="#30363d"/>
  <text x="58" y="316" font-size="13" fill="#e6edf3">→  REDO the change</text>
  <rect x="42" y="338" width="362" height="30" rx="7" fill="#3fb950" fill-opacity="0.12" stroke="#3fb950" stroke-opacity="0.6"/>
  <text x="58" y="358" font-size="13" fill="#56d364" font-weight="600">→  A = 500  ✓</text>
  <rect x="438" y="210" width="398" height="170" rx="10" fill="#3fb950" fill-opacity="0.06" stroke="#3fb950" stroke-opacity="0.45"/>
  <text x="456" y="238" font-size="13.5" fill="#e3b341" font-weight="600">⚠ If crash before Step 1:</text>
  <rect x="456" y="254" width="362" height="30" rx="7" fill="#1c2128" stroke="#30363d"/>
  <text x="472" y="274" font-size="13" fill="#e6edf3">→  No log entry</text>
  <rect x="456" y="296" width="362" height="30" rx="7" fill="#1c2128" stroke="#30363d"/>
  <text x="472" y="316" font-size="13" fill="#e6edf3">→  change was never applied</text>
  <rect x="456" y="338" width="362" height="30" rx="7" fill="#3fb950" fill-opacity="0.12" stroke="#3fb950" stroke-opacity="0.6"/>
  <text x="472" y="358" font-size="13" fill="#56d364" font-weight="600">→  A remains 1000  ✓</text>
</svg>
