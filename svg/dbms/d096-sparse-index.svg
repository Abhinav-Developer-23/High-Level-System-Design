<svg xmlns="http://www.w3.org/2000/svg" width="780" height="340" viewBox="0 0 780 340" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Sparse index</title>
  <desc>A sparse index has one entry per block: ID=1 points to Block 1 (rows 1-3) and ID=4 points to Block 2 (rows 4-6).</desc>
  <defs>
    <marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d29922"/></marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/></marker>
    <marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39c5cf"/></marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker>
    </defs>
  <rect x="0.5" y="0.5" width="779" height="339" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="40" y="40" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">INDEX</text>
  <text x="380" y="40" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">DATA FILE (SORTED BY ID, 3 ROWS PER BLOCK)</text>
  <rect x="40" y="58" width="200" height="232" rx="8" fill="#58a6ff" fill-opacity="0.08" stroke="#58a6ff" stroke-opacity="0.5"/>
  <rect x="380" y="58" width="360" height="232" rx="8" fill="#39c5cf" fill-opacity="0.08" stroke="#39c5cf" stroke-opacity="0.5"/>
  <line x1="130" y1="58" x2="130" y2="290" stroke="#30363d" stroke-width="1"/>
  <text x="56" y="82" fill="#79c0ff" font-size="12.5" font-weight="600" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">ID=1</text>
  <text x="146" y="82" fill="#c9d1d9" font-size="12.5" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">→ ptr</text>
  <text x="396" y="82" fill="#56d4dd" font-size="13" font-weight="700">Block 1:</text>
  <text x="420" y="108" fill="#e6edf3" font-size="12.5" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">ID=1, Alice, Engineering</text>
  <text x="420" y="132" fill="#e6edf3" font-size="12.5" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">ID=2, Bob, Sales</text>
  <text x="420" y="156" fill="#e6edf3" font-size="12.5" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">ID=3, Carol, Marketing</text>
  <line x1="240" y1="78" x2="376" y2="78" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <line x1="41" y1="174" x2="239" y2="174" stroke="#30363d" stroke-width="1.5"/>
  <line x1="381" y1="174" x2="739" y2="174" stroke="#30363d" stroke-width="1.5"/>
  <text x="56" y="198" fill="#79c0ff" font-size="12.5" font-weight="600" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">ID=4</text>
  <text x="146" y="198" fill="#c9d1d9" font-size="12.5" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">→ ptr</text>
  <text x="396" y="198" fill="#56d4dd" font-size="13" font-weight="700">Block 2:</text>
  <text x="420" y="224" fill="#e6edf3" font-size="12.5" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">ID=4, Dave, Engineering</text>
  <text x="420" y="248" fill="#e6edf3" font-size="12.5" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">ID=5, Eve, Sales</text>
  <text x="420" y="272" fill="#e6edf3" font-size="12.5" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">ID=6, Frank, Marketing</text>
  <line x1="240" y1="194" x2="376" y2="194" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <text x="140" y="318" fill="#8b949e" font-size="12.5" font-weight="600" text-anchor="middle">2 index entries</text>
  <text x="560" y="318" fill="#8b949e" font-size="12.5" font-weight="600" text-anchor="middle">6 data rows (2 blocks)</text>
</svg>
