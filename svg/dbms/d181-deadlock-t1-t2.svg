<svg xmlns="http://www.w3.org/2000/svg" width="860" height="280" viewBox="0 0 860 280" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Deadlock between T1 and T2</title>
  <desc>T1 locks A, T2 locks B, then T1 waits for B held by T2 and T2 waits for A held by T1: a circular wait, deadlock.</desc>
  <defs>
    <marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker>
    <marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker>
    <marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d29922"/></marker>
    <marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/></marker>
    <marker id="m-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39c5cf"/></marker>
    <marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker>
    <marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="859" height="279" rx="14" fill="#161b22" stroke="#30363d"/>
  <rect x="26" y="24" width="146" height="192" rx="6" fill="#bc8cff" fill-opacity="0.05" stroke="none"/>
  <rect x="176" y="24" width="146" height="192" rx="6" fill="#39c5cf" fill-opacity="0.05" stroke="none"/>
  <text x="99.0" y="45" font-size="14" fill="#d2a8ff" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">T1</text>
  <text x="249.0" y="45" font-size="14" fill="#56d4dd" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">T2</text>
  <line x1="24" y1="56" x2="324" y2="56" stroke="#30363d"/>
  <rect x="45.0" y="64.0" width="108" height="24" rx="6" fill="#3fb950" fill-opacity="0.14" stroke="#3fb950" stroke-opacity="0.55"/>
  <text x="99.0" y="80.5" font-size="13" fill="#56d364" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">X-Lock(A) ✓</text>
  <line x1="24" y1="96" x2="324" y2="96" stroke="#21262d"/>
  <rect x="195.0" y="104.0" width="108" height="24" rx="6" fill="#3fb950" fill-opacity="0.14" stroke="#3fb950" stroke-opacity="0.55"/>
  <text x="249.0" y="120.5" font-size="13" fill="#56d364" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">X-Lock(B) ✓</text>
  <line x1="24" y1="136" x2="324" y2="136" stroke="#21262d"/>
  <rect x="45.0" y="144.0" width="108" height="24" rx="6" fill="#f85149" fill-opacity="0.14" stroke="#f85149" stroke-opacity="0.55"/>
  <text x="99.0" y="160.5" font-size="13" fill="#ff7b72" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">X-Lock(B) ✗</text>
  <text x="340" y="160.5" font-size="13" fill="#c9d1d9"><tspan fill="#e3b341" font-weight="700">WAIT</tspan>  (T2 holds B)</text>
  <line x1="24" y1="176" x2="324" y2="176" stroke="#21262d"/>
  <rect x="195.0" y="184.0" width="108" height="24" rx="6" fill="#f85149" fill-opacity="0.14" stroke="#f85149" stroke-opacity="0.55"/>
  <text x="249.0" y="200.5" font-size="13" fill="#ff7b72" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">X-Lock(A) ✗</text>
  <text x="340" y="200.5" font-size="13" fill="#c9d1d9"><tspan fill="#e3b341" font-weight="700">WAIT</tspan>  (T1 holds A)</text>
  <text x="24" y="250" font-size="14" fill="#c9d1d9"><tspan fill="#d2a8ff" font-weight="600">T1</tspan> waits for <tspan fill="#56d4dd" font-weight="600">T2</tspan><tspan fill="#8b949e">  →  </tspan><tspan fill="#56d4dd" font-weight="600">T2</tspan> waits for <tspan fill="#d2a8ff" font-weight="600">T1</tspan><tspan fill="#8b949e">  →  </tspan><tspan fill="#ff7b72" font-weight="700">DEADLOCK!</tspan></text>
  <rect x="512" y="24" width="324" height="232" rx="10" fill="#f85149" fill-opacity="0.07" stroke="#f85149" stroke-opacity="0.6"/>
  <text x="674.0" y="54" font-size="13" fill="#ff7b72" font-weight="700" text-anchor="middle" letter-spacing="1.5">DEADLOCK</text>
  <circle cx="586" cy="152" r="26" fill="#bc8cff" fill-opacity=".16" stroke="#bc8cff" stroke-width="1.6"/>
  <text x="586" y="157" font-size="15" fill="#d2a8ff" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">T1</text>
  <circle cx="762" cy="152" r="26" fill="#39c5cf" fill-opacity=".16" stroke="#39c5cf" stroke-width="1.6"/>
  <text x="762" y="157" font-size="15" fill="#56d4dd" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">T2</text>
  <path d="M606,134 Q674.0,74 740,134" stroke="#f85149" stroke-width="1.8" fill="none" marker-end="url(#m-red)"/>
  <path d="M742,170 Q674.0,230 608,170" stroke="#f85149" stroke-width="1.8" fill="none" marker-end="url(#m-red)"/>
  <text x="674.0" y="96" font-size="12.5" fill="#ff7b72" text-anchor="middle" data-nocheck="1">waiting for B</text>
  <text x="674.0" y="218" font-size="12.5" fill="#ff7b72" text-anchor="middle" data-nocheck="1">waiting for A</text>
</svg>
