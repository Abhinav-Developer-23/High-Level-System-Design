<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Primary key vs unique key</title>
  <desc>Primary key emp_id accepts 1, 2, 3 but rejects NULL and a duplicate 1; it is a clustered index (physical order). Unique key email accepts alice@co, bob@co and one NULL, but rejects a second NULL and a duplicate alice@co; it is a non-clustered index (logical order).</desc>
  <rect x="0.5" y="0.5" width="759" height="339" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="200.0" y="40" fill="#e6edf3" font-size="13" font-weight="700" letter-spacing="1.5" text-anchor="middle">PRIMARY KEY</text>
  <rect x="80" y="56" width="240" height="182" rx="8" fill="#1c2128" stroke="#30363d"/>
  <path d="M80,88 V64 a8,8 0 0 1 8,-8 H312 a8,8 0 0 1 8,8 V88 z" fill="#21262d"/>
  <line x1="80" y1="88" x2="320" y2="88" stroke="#30363d"/>
  <text x="96" y="77" fill="#e3b341" font-size="13" font-weight="700" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">emp_id</text>
  <text x="96" y="108" fill="#e6edf3" font-size="13" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">1</text>
  <text x="192" y="108" fill="#56d364" font-size="14" font-weight="700">✓</text>
  <line x1="80" y1="118" x2="320" y2="118" stroke="#21262d"/>
  <text x="96" y="138" fill="#e6edf3" font-size="13" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">2</text>
  <text x="192" y="138" fill="#56d364" font-size="14" font-weight="700">✓</text>
  <line x1="80" y1="148" x2="320" y2="148" stroke="#21262d"/>
  <text x="96" y="168" fill="#e6edf3" font-size="13" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">3</text>
  <text x="192" y="168" fill="#56d364" font-size="14" font-weight="700">✓</text>
  <rect x="80" y="178" width="240" height="30" fill="#f85149" fill-opacity=".10"/>
  <line x1="80" y1="178" x2="320" y2="178" stroke="#21262d"/>
  <text x="96" y="198" fill="#ff7b72" font-size="13" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">NULL</text>
  <text x="192" y="198" fill="#ff7b72" font-size="14" font-weight="700">✗</text>
  <path d="M80,208 H320 V230 a8,8 0 0 1 -8,8 H88 a8,8 0 0 1 -8,-8 z" fill="#f85149" fill-opacity=".10"/>
  <line x1="80" y1="208" x2="320" y2="208" stroke="#21262d"/>
  <text x="96" y="228" fill="#ff7b72" font-size="13" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">1</text>
  <text x="192" y="228" fill="#ff7b72" font-size="14" font-weight="700">✗</text>
  <text x="212" y="228" fill="#8b949e" font-size="12">(dup)</text>
  <line x1="200.0" y1="238" x2="200.0" y2="260" stroke="#8b949e" stroke-width="1.6"/>
  <rect x="90" y="260" width="220" height="56" rx="10" fill="#39c5cf" fill-opacity=".10" stroke="#39c5cf" stroke-opacity=".7"/>
  <text x="200.0" y="283" fill="#56d4dd" font-size="14" font-weight="600" text-anchor="middle">Clustered Index</text>
  <text x="200.0" y="303" fill="#8b949e" font-size="12" text-anchor="middle">(physical order)</text>
  <text x="560.0" y="40" fill="#e6edf3" font-size="13" font-weight="700" letter-spacing="1.5" text-anchor="middle">UNIQUE KEY</text>
  <rect x="440" y="56" width="240" height="182" rx="8" fill="#1c2128" stroke="#30363d"/>
  <path d="M440,88 V64 a8,8 0 0 1 8,-8 H672 a8,8 0 0 1 8,8 V88 z" fill="#21262d"/>
  <line x1="440" y1="88" x2="680" y2="88" stroke="#30363d"/>
  <text x="456" y="77" fill="#e3b341" font-size="13" font-weight="700" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">email</text>
  <text x="456" y="108" fill="#e6edf3" font-size="13" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">alice@co</text>
  <text x="552" y="108" fill="#56d364" font-size="14" font-weight="700">✓</text>
  <line x1="440" y1="118" x2="680" y2="118" stroke="#21262d"/>
  <text x="456" y="138" fill="#e6edf3" font-size="13" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">bob@co</text>
  <text x="552" y="138" fill="#56d364" font-size="14" font-weight="700">✓</text>
  <line x1="440" y1="148" x2="680" y2="148" stroke="#21262d"/>
  <text x="456" y="168" fill="#e6edf3" font-size="13" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">NULL</text>
  <text x="552" y="168" fill="#56d364" font-size="14" font-weight="700">✓</text>
  <rect x="440" y="178" width="240" height="30" fill="#f85149" fill-opacity=".10"/>
  <line x1="440" y1="178" x2="680" y2="178" stroke="#21262d"/>
  <text x="456" y="198" fill="#ff7b72" font-size="13" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">NULL</text>
  <text x="552" y="198" fill="#ff7b72" font-size="14" font-weight="700">✗</text>
  <text x="572" y="198" fill="#8b949e" font-size="12">(second NULL)</text>
  <path d="M440,208 H680 V230 a8,8 0 0 1 -8,8 H448 a8,8 0 0 1 -8,-8 z" fill="#f85149" fill-opacity=".10"/>
  <line x1="440" y1="208" x2="680" y2="208" stroke="#21262d"/>
  <text x="456" y="228" fill="#ff7b72" font-size="13" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">alice@co</text>
  <text x="552" y="228" fill="#ff7b72" font-size="14" font-weight="700">✗</text>
  <text x="572" y="228" fill="#8b949e" font-size="12">(duplicate)</text>
  <line x1="560.0" y1="238" x2="560.0" y2="260" stroke="#8b949e" stroke-width="1.6"/>
  <rect x="450" y="260" width="220" height="56" rx="10" fill="#58a6ff" fill-opacity=".10" stroke="#58a6ff" stroke-opacity=".7"/>
  <text x="560.0" y="283" fill="#79c0ff" font-size="14" font-weight="600" text-anchor="middle">Non-Clustered Index</text>
  <text x="560.0" y="303" fill="#8b949e" font-size="12" text-anchor="middle">(logical order)</text>
</svg>
