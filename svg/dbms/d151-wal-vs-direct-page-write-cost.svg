  <path d="M440,36 a12,12 0 0 1 12,-12 h372 a12,12 0 0 1 12,12 v28 h-396 z" fill="#f85149" fill-opacity=".14" stroke="#f85149" stroke-opacity=".6"/>
  <text x="460" y="55" fill="#ff7b72" font-size="14.5" font-weight="600">Commit writing data pages directly</text>
