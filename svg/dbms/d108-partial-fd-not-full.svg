<svg xmlns="http://www.w3.org/2000/svg" width="620" height="212" viewBox="0 0 620 212" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Partial functional dependency (not full)</title>
  <desc>{roll_no, course_id} → name is not full: without course_id, roll_no → name still works, so the full PK isn't needed and it is a partial FD.</desc>
  <defs>
    <marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d29922"/></marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/></marker>
    <marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39c5cf"/></marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker>
    </defs>
  <rect x="0.5" y="0.5" width="619" height="211" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="32" y="38" fill="#e6edf3" font-size="15" font-weight="600">Partial (NOT Full):</text>
  <rect x="40" y="56" width="210" height="36" rx="8" fill="#58a6ff" fill-opacity="0.12" stroke="#58a6ff" stroke-opacity="0.65"/>
  <text x="145.0" y="78.68" fill="#e6edf3" font-size="13" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">{roll_no, course_id}</text>
  <line x1="250" y1="74" x2="306" y2="74" stroke="#f85149" stroke-width="1.6" marker-end="url(#a-red)"/>
  <rect x="312" y="56" width="62" height="36" rx="8" fill="#f85149" fill-opacity="0.12" stroke="#f85149" stroke-opacity="0.65"/>
  <text x="343.0" y="78.68" fill="#ff7b72" font-size="13" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">name</text>
  <rect x="40" y="112" width="548" height="76" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="56" y="140" fill="#c9d1d9" font-size="13">Remove <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none" fill="#79c0ff">course_id</tspan>?</text>
  <text x="232" y="140" fill="#56d364" font-size="13">→  <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">roll_no → name</tspan> still works</text>
  <text x="560" y="140" fill="#56d364" font-size="14" font-weight="700">✓</text>
  <text x="56" y="168" fill="#c9d1d9" font-size="13">Don't need full PK</text>
  <text x="232" y="168" fill="#ff7b72" font-size="13">→  Partial FD <tspan fill="#8b949e" font-weight="400">(not full)</tspan></text>
  <text x="560" y="168" fill="#ff7b72" font-size="14" font-weight="700">✗</text>
</svg>
