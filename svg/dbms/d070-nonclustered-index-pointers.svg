<svg xmlns="http://www.w3.org/2000/svg" width="700" height="290" viewBox="0 0 700 290" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Non-clustered index on email</title>
  <desc>A non-clustered index on email is sorted by email and maps alice@co to row 3, bob@co to row 1, carol@co to row 2, dave@co to row 4. The data table stays in original order: 1 Dave, 2 Carol, 3 Alice, 4 Bob, so the data is not sorted by email.</desc>
  <defs>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="699" height="289" rx="14" fill="#161b22" stroke="#30363d"/>

  <text x="32" y="42" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">NON-CLUSTERED INDEX ON <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" letter-spacing="0" font-weight="400" fill="#79c0ff">email</tspan></text>

  <!-- Index table -->
  <rect x="32" y="58" width="236" height="162" rx="8" fill="#1c2128" stroke="#3fb950" stroke-opacity=".7"/>
  <path d="M32,92 V66 a8,8 0 0 1 8,-8 H260 a8,8 0 0 1 8,8 V92 z" fill="#3fb950" fill-opacity=".12"/>
  <text x="46" y="80" fill="#e6edf3" font-size="13.5" font-weight="600">Index <tspan fill="#56d364" font-weight="400">(sorted)</tspan></text>
  <line x1="32" y1="92" x2="268" y2="92" stroke="#3fb950" stroke-opacity=".5"/>
  <line x1="166" y1="92" x2="166" y2="220" stroke="#30363d"/>
  <g stroke="#21262d"><line x1="32" y1="124" x2="268" y2="124"/><line x1="32" y1="156" x2="268" y2="156"/><line x1="32" y1="188" x2="268" y2="188"/></g>
  <g font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="13">
    <text x="46" y="113" fill="#56d364">alice@co</text>
    <text x="46" y="145" fill="#56d364">bob@co</text>
    <text x="46" y="177" fill="#56d364">carol@co</text>
    <text x="46" y="209" fill="#56d364">dave@co</text>
    <text x="178" y="113" fill="#e6edf3"><tspan fill="#8b949e">→</tspan> Row 3</text>
    <text x="178" y="145" fill="#e6edf3"><tspan fill="#8b949e">→</tspan> Row 1</text>
    <text x="178" y="177" fill="#e6edf3"><tspan fill="#8b949e">→</tspan> Row 2</text>
    <text x="178" y="209" fill="#e6edf3"><tspan fill="#8b949e">→</tspan> Row 4</text>
  </g>

  <!-- pointers -->
  <g stroke="#58a6ff" stroke-width="1.5" stroke-opacity=".8" fill="none">
    <line x1="274" y1="108" x2="418" y2="172" marker-end="url(#arrB)"/>
    <line x1="274" y1="140" x2="418" y2="108" marker-end="url(#arrB)"/>
    <line x1="274" y1="172" x2="418" y2="140" marker-end="url(#arrB)"/>
    <line x1="274" y1="204" x2="418" y2="204" marker-end="url(#arrB)"/>
  </g>

  <!-- Data table -->
  <rect x="424" y="58" width="244" height="162" rx="8" fill="#1c2128" stroke="#d29922" stroke-opacity=".7"/>
  <path d="M424,92 V66 a8,8 0 0 1 8,-8 H660 a8,8 0 0 1 8,8 V92 z" fill="#d29922" fill-opacity=".12"/>
  <text x="438" y="80" fill="#e6edf3" font-size="13.5" font-weight="600">Data <tspan fill="#e3b341" font-weight="400">(original order)</tspan></text>
  <line x1="424" y1="92" x2="668" y2="92" stroke="#d29922" stroke-opacity=".5"/>
  <line x1="470" y1="92" x2="470" y2="220" stroke="#30363d"/>
  <g stroke="#21262d"><line x1="424" y1="124" x2="668" y2="124"/><line x1="424" y1="156" x2="668" y2="156"/><line x1="424" y1="188" x2="668" y2="188"/></g>
  <g font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="13">
    <text x="447" y="113" fill="#8b949e" text-anchor="middle">1</text>
    <text x="447" y="145" fill="#8b949e" text-anchor="middle">2</text>
    <text x="447" y="177" fill="#8b949e" text-anchor="middle">3</text>
    <text x="447" y="209" fill="#8b949e" text-anchor="middle">4</text>
    <text x="484" y="113" fill="#c9d1d9">Dave, <tspan fill="#e3b341">dave@co</tspan></text>
    <text x="484" y="145" fill="#c9d1d9">Carol, <tspan fill="#e3b341">carol@co</tspan></text>
    <text x="484" y="177" fill="#c9d1d9">Alice, <tspan fill="#e3b341">alice@co</tspan></text>
    <text x="484" y="209" fill="#c9d1d9">Bob, <tspan fill="#e3b341">bob@co</tspan></text>
  </g>

  <!-- captions -->
  <text x="150" y="246" fill="#56d364" font-size="13" font-weight="600" text-anchor="middle">Index is sorted</text>
  <text x="150" y="264" fill="#8b949e" font-size="12" text-anchor="middle">by email</text>
  <text x="546" y="246" fill="#e3b341" font-size="13" font-weight="600" text-anchor="middle">Data is NOT sorted</text>
  <text x="546" y="264" fill="#8b949e" font-size="12" text-anchor="middle">by email</text>
</svg>
