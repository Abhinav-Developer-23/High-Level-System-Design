<svg xmlns="http://www.w3.org/2000/svg" width="900" height="388" viewBox="0 0 900 388" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Horizontal partitioning by year</title>
  <desc>Before: one orders table with all 500 million rows together. After: the same table partitioned by year into p2021 (~80M, date before 2022), p2022 (~90M), p2023 (~100M), p2024 (~110M) and p2025 (~120M, date before 2026), with MySQL managing the split internally.</desc>
  <rect x="0.5" y="0.5" width="899" height="387" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="24" y="36" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">BEFORE <tspan letter-spacing="0.5" font-weight="400">(one huge table — 500M rows)</tspan></text>
  <rect x="24" y="48" width="852" height="132" rx="10" fill="#d29922" fill-opacity=".06" stroke="#d29922" stroke-opacity=".55"/>
  <text x="450" y="72" fill="#e6edf3" font-size="14" font-weight="700" text-anchor="middle"><tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">orders</tspan> <tspan fill="#e3b341">(500M rows)</tspan></text>
  <line x1="40" y1="84" x2="860" y2="84" stroke="#30363d"/>
  <text x="44" y="106" fill="#c9d1d9" font-size="12.5" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">id=1,  date=2021-01-15, ...</text>
  <text x="44" y="126" fill="#c9d1d9" font-size="12.5" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">id=2,  date=2023-07-22, ...</text>
  <text x="44" y="146" fill="#c9d1d9" font-size="12.5" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">id=3,  date=2021-11-03, ...</text>
  <text x="44" y="166" fill="#8b949e" font-size="12.5" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">...</text>
  <text x="856" y="166" fill="#8b949e" font-size="12.5" text-anchor="end">(all 500 million rows together)</text>
  <text x="24" y="216" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">AFTER <tspan letter-spacing="0.5" font-weight="400">(same table, partitioned by year — MySQL manages the split internally)</tspan></text>
  <rect x="24" y="228" width="162" height="136" rx="10" fill="#1c2128" stroke="#39c5cf" stroke-opacity=".6"/>
  <path d="M34,228 H176 A10,10 0 0 1 186,238 V286 H24 V238 A10,10 0 0 1 34,228 Z" fill="#39c5cf" fill-opacity=".12"/>
  <text x="105.0" y="252" fill="#e6edf3" font-size="13.5" text-anchor="middle"><tspan font-weight="700" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">p2021</tspan> <tspan fill="#56d4dd">(~80M)</tspan></text>
  <text x="105.0" y="274" fill="#56d4dd" font-size="12" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">date &lt; 2022</text>
  <line x1="24" y1="286" x2="186" y2="286" stroke="#39c5cf" stroke-opacity=".35"/>
  <text x="36" y="310" fill="#c9d1d9" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">id=1, 2021-01-15</text>
  <text x="36" y="330" fill="#c9d1d9" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">id=3, 2021-11-03</text>
  <text x="36" y="350" fill="#8b949e" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">...</text>
  <rect x="196" y="228" width="162" height="136" rx="10" fill="#1c2128" stroke="#39c5cf" stroke-opacity=".6"/>
  <path d="M206,228 H348 A10,10 0 0 1 358,238 V286 H196 V238 A10,10 0 0 1 206,228 Z" fill="#39c5cf" fill-opacity=".12"/>
  <text x="277.0" y="252" fill="#e6edf3" font-size="13.5" text-anchor="middle"><tspan font-weight="700" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">p2022</tspan> <tspan fill="#56d4dd">(~90M)</tspan></text>
  <text x="277.0" y="274" fill="#56d4dd" font-size="12" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">date &lt; 2023</text>
  <line x1="196" y1="286" x2="358" y2="286" stroke="#39c5cf" stroke-opacity=".35"/>
  <text x="208" y="310" fill="#c9d1d9" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">id=5, 2022-03-10</text>
  <text x="208" y="330" fill="#c9d1d9" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">id=6, 2022-08-20</text>
  <text x="208" y="350" fill="#8b949e" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">...</text>
  <rect x="368" y="228" width="162" height="136" rx="10" fill="#1c2128" stroke="#39c5cf" stroke-opacity=".6"/>
  <path d="M378,228 H520 A10,10 0 0 1 530,238 V286 H368 V238 A10,10 0 0 1 378,228 Z" fill="#39c5cf" fill-opacity=".12"/>
  <text x="449.0" y="252" fill="#e6edf3" font-size="13.5" text-anchor="middle"><tspan font-weight="700" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">p2023</tspan> <tspan fill="#56d4dd">(~100M)</tspan></text>
  <text x="449.0" y="274" fill="#56d4dd" font-size="12" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">date &lt; 2024</text>
  <line x1="368" y1="286" x2="530" y2="286" stroke="#39c5cf" stroke-opacity=".35"/>
  <text x="380" y="310" fill="#c9d1d9" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">id=2, 2023-07-22</text>
  <text x="380" y="330" fill="#c9d1d9" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">id=7, 2023-12-01</text>
  <text x="380" y="350" fill="#8b949e" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">...</text>
  <rect x="540" y="228" width="162" height="136" rx="10" fill="#1c2128" stroke="#39c5cf" stroke-opacity=".6"/>
  <path d="M550,228 H692 A10,10 0 0 1 702,238 V286 H540 V238 A10,10 0 0 1 550,228 Z" fill="#39c5cf" fill-opacity=".12"/>
  <text x="621.0" y="252" fill="#e6edf3" font-size="13.5" text-anchor="middle"><tspan font-weight="700" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">p2024</tspan> <tspan fill="#56d4dd">(~110M)</tspan></text>
  <text x="621.0" y="274" fill="#56d4dd" font-size="12" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">date &lt; 2025</text>
  <line x1="540" y1="286" x2="702" y2="286" stroke="#39c5cf" stroke-opacity=".35"/>
  <text x="552" y="310" fill="#c9d1d9" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">id=8, 2024-01-05</text>
  <text x="552" y="330" fill="#8b949e" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">...</text>
  <rect x="712" y="228" width="162" height="136" rx="10" fill="#1c2128" stroke="#39c5cf" stroke-opacity=".6"/>
  <path d="M722,228 H864 A10,10 0 0 1 874,238 V286 H712 V238 A10,10 0 0 1 722,228 Z" fill="#39c5cf" fill-opacity=".12"/>
  <text x="793.0" y="252" fill="#e6edf3" font-size="13.5" text-anchor="middle"><tspan font-weight="700" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">p2025</tspan> <tspan fill="#56d4dd">(~120M)</tspan></text>
  <text x="793.0" y="274" fill="#56d4dd" font-size="12" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">date &lt; 2026</text>
  <line x1="712" y1="286" x2="874" y2="286" stroke="#39c5cf" stroke-opacity=".35"/>
  <text x="724" y="310" fill="#c9d1d9" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">id=9, 2025-02-14</text>
  <text x="724" y="330" fill="#8b949e" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">...</text>
</svg>
