  <rect x="410" y="250" width="150" height="34" rx="8" fill="#f85149" fill-opacity=".10" stroke="#f85149" stroke-opacity=".6" stroke-dasharray="5 4"/>
  <text x="424" y="271.5" fill="#ff7b72" font-size="13" font-weight="700" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">NULL</text>
  <line x1="210" y1="267.0" x2="406" y2="267.0" stroke="#f85149" stroke-width="1.6" marker-end="url(#arrR)"/>
  <text x="580" y="271.5" fill="#ff7b72" font-size="13" font-weight="600">✗ no course</text>
  <rect x="40" y="294" width="170" height="34" rx="8" fill="#f85149" fill-opacity=".10" stroke="#f85149" stroke-opacity=".6" stroke-dasharray="5 4"/>
  <text x="54" y="315.5" fill="#ff7b72" font-size="13" font-weight="700" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">NULL</text>
  <rect x="410" y="294" width="150" height="34" rx="8" fill="#1c2128" stroke="#58a6ff" stroke-opacity=".55"/>
  <text x="424" y="315.5" fill="#e6edf3" font-size="13" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">C104 (5)</text>
  <line x1="410" y1="311.0" x2="214" y2="311.0" stroke="#f85149" stroke-width="1.6" marker-end="url(#arrR)"/>
  <text x="580" y="315.5" fill="#ff7b72" font-size="13" font-weight="600">✗ no student</text>
