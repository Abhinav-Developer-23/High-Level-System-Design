<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Transactions quick summary</title>
  <desc>Transaction is a group of operations treated as one unit. ACID: atomicity, consistency, isolation, durability. States: success and failure paths. Schedules: serial, concurrent, serializable. Serializability: conflict is a subset of view; test with a precedence graph.</desc>
  <defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d29922"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39c5cf"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs>
  <rect x="0.5" y="0.5" width="899" height="469" rx="14" fill="#161b22" stroke="#30363d"/>
  <rect x="24" y="24" width="852" height="48" rx="10" fill="#58a6ff" fill-opacity="0.1" stroke="#58a6ff" stroke-opacity="0.7"/>
  <text x="450" y="54" font-size="15" fill="#e6edf3" font-weight="600" text-anchor="middle">Transaction = Group of operations treated as <tspan fill="#79c0ff" font-weight="700">ONE</tspan> unit</text>
  <rect x="24" y="88" width="418" height="182" rx="10" fill="#1c2128" stroke="#30363d"/>
  <text x="42" y="114" font-size="12" fill="#8b949e" font-weight="700" letter-spacing="1.5">ACID</text>
  <rect x="42" y="132" width="26" height="26" rx="6" fill="#58a6ff" fill-opacity="0.18" stroke="#58a6ff" stroke-opacity="0.7"/>
  <text x="55" y="150" font-size="14" fill="#79c0ff" font-weight="700" text-anchor="middle">A</text>
  <text x="80" y="150" font-size="13.5" fill="#e6edf3" font-weight="600">Atomicity</text>
  <text x="176" y="150" font-size="13" fill="#c9d1d9">→  All or Nothing</text>
  <rect x="42" y="166" width="26" height="26" rx="6" fill="#3fb950" fill-opacity="0.18" stroke="#3fb950" stroke-opacity="0.7"/>
  <text x="55" y="184" font-size="14" fill="#56d364" font-weight="700" text-anchor="middle">C</text>
  <text x="80" y="184" font-size="13.5" fill="#e6edf3" font-weight="600">Consistency</text>
  <text x="176" y="184" font-size="13" fill="#c9d1d9">→  Valid state → Valid state</text>
  <rect x="42" y="200" width="26" height="26" rx="6" fill="#bc8cff" fill-opacity="0.18" stroke="#bc8cff" stroke-opacity="0.7"/>
  <text x="55" y="218" font-size="14" fill="#d2a8ff" font-weight="700" text-anchor="middle">I</text>
  <text x="80" y="218" font-size="13.5" fill="#e6edf3" font-weight="600">Isolation</text>
  <text x="176" y="218" font-size="13" fill="#c9d1d9">→  Concurrent txns don't interfere</text>
  <rect x="42" y="234" width="26" height="26" rx="6" fill="#39c5cf" fill-opacity="0.18" stroke="#39c5cf" stroke-opacity="0.7"/>
  <text x="55" y="252" font-size="14" fill="#56d4dd" font-weight="700" text-anchor="middle">D</text>
  <text x="80" y="252" font-size="13.5" fill="#e6edf3" font-weight="600">Durability</text>
  <text x="176" y="252" font-size="13" fill="#c9d1d9">→  Committed data survives crashes</text>
  <rect x="458" y="88" width="418" height="182" rx="10" fill="#1c2128" stroke="#30363d"/>
  <text x="476" y="114" font-size="12" fill="#8b949e" font-weight="700" letter-spacing="1.5">STATES</text>
  <rect x="476" y="136" width="60" height="28" rx="7" fill="#58a6ff" fill-opacity="0.13" stroke="#58a6ff" stroke-opacity="0.7"/>
  <text x="506.0" y="155" font-size="12" fill="#79c0ff" font-weight="600" text-anchor="middle">Active</text>
  <line x1="539" y1="150" x2="557" y2="150" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <rect x="561" y="136" width="146" height="28" rx="7" fill="#d29922" fill-opacity="0.13" stroke="#d29922" stroke-opacity="0.7"/>
  <text x="634.0" y="155" font-size="12" fill="#e3b341" font-weight="600" text-anchor="middle">Partially Committed</text>
  <line x1="710" y1="150" x2="728" y2="150" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <rect x="732" y="136" width="102" height="28" rx="7" fill="#3fb950" fill-opacity="0.13" stroke="#3fb950" stroke-opacity="0.7"/>
  <text x="783.0" y="155" font-size="12" fill="#56d364" font-weight="600" text-anchor="middle">Committed ✓</text>
  <rect x="476" y="196" width="60" height="28" rx="7" fill="#58a6ff" fill-opacity="0.13" stroke="#58a6ff" stroke-opacity="0.7"/>
  <text x="506.0" y="215" font-size="12" fill="#79c0ff" font-weight="600" text-anchor="middle">Active</text>
  <line x1="539" y1="210" x2="557" y2="210" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <rect x="561" y="196" width="60" height="28" rx="7" fill="#f85149" fill-opacity="0.13" stroke="#f85149" stroke-opacity="0.7"/>
  <text x="591.0" y="215" font-size="12" fill="#ff7b72" font-weight="600" text-anchor="middle">Failed</text>
  <line x1="624" y1="210" x2="642" y2="210" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <rect x="646" y="196" width="72" height="28" rx="7" fill="#f0883e" fill-opacity="0.13" stroke="#f0883e" stroke-opacity="0.7"/>
  <text x="682.0" y="215" font-size="12" fill="#ffa657" font-weight="600" text-anchor="middle">Aborted</text>
  <text x="728" y="215" font-size="12.5" fill="#8b949e">(Restart/Kill)</text>
  <text x="810" y="216" font-size="16" fill="#ff7b72" font-weight="700">✗</text>
  <rect x="24" y="286" width="418" height="160" rx="10" fill="#1c2128" stroke="#30363d"/>
  <text x="42" y="312" font-size="12" fill="#8b949e" font-weight="700" letter-spacing="1.5">SCHEDULES</text>
  <rect x="44.0" y="329.0" width="104" height="24" rx="12.0" fill="#58a6ff" fill-opacity=".16" stroke="#58a6ff" stroke-opacity=".6"/>
  <text x="96" y="345.5" font-size="12.5" fill="#79c0ff" font-weight="600" text-anchor="middle">Serial</text>
  <text x="160" y="346" font-size="13" fill="#c9d1d9">→  One txn at a time  <tspan fill="#8b949e">(correct but slow)</tspan></text>
  <rect x="44.0" y="365.0" width="104" height="24" rx="12.0" fill="#d29922" fill-opacity=".16" stroke="#d29922" stroke-opacity=".6"/>
  <text x="96" y="381.5" font-size="12.5" fill="#e3b341" font-weight="600" text-anchor="middle">Concurrent</text>
  <text x="160" y="382" font-size="13" fill="#c9d1d9">→  Interleaved  <tspan fill="#8b949e">(fast but risky)</tspan></text>
  <rect x="44.0" y="401.0" width="104" height="24" rx="12.0" fill="#3fb950" fill-opacity=".16" stroke="#3fb950" stroke-opacity=".6"/>
  <text x="96" y="417.5" font-size="12.5" fill="#56d364" font-weight="600" text-anchor="middle">Serializable</text>
  <text x="160" y="418" font-size="13" fill="#c9d1d9">→  Concurrent but equivalent to serial</text>
  <text x="180" y="438" font-size="13" fill="#8b949e">(best of both)</text>
  <rect x="458" y="286" width="418" height="160" rx="10" fill="#1c2128" stroke="#30363d"/>
  <text x="476" y="312" font-size="12" fill="#8b949e" font-weight="700" letter-spacing="1.5">SERIALIZABILITY</text>
  <rect x="476" y="330" width="382" height="44" rx="8" fill="#58a6ff" fill-opacity="0.07" stroke="#58a6ff" stroke-opacity="0.5"/>
  <text x="667" y="357" font-size="13.5" fill="#e6edf3" text-anchor="middle"><tspan fill="#56d364" font-weight="600">Conflict Serializable</tspan>  ⊂  <tspan fill="#79c0ff" font-weight="600">View Serializable</tspan></text>
  <text x="476" y="404" font-size="13.5" fill="#e6edf3" font-weight="600"><tspan fill="#8b949e">Test:</tspan> Precedence Graph —</text>
  <text x="476" y="428" font-size="13.5" fill="#56d364">no cycle = conflict serializable</text>
</svg>
