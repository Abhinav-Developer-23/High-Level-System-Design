  <path d="M298,66 V86.0 H446 V103" stroke="#8b949e" stroke-width="1.5" fill="none" marker-end="url(#m-gray)"/>
  <path d="M446,160 V181.0 H250 V199" stroke="#8b949e" stroke-width="1.5" fill="none" marker-end="url(#m-gray)"/>
  <path d="M446,160 V181.0 H650 V199" stroke="#8b949e" stroke-width="1.5" fill="none" marker-end="url(#m-gray)"/>
  <path d="M250,244 V266.0 H140 V285" stroke="#8b949e" stroke-width="1.5" fill="none" marker-end="url(#m-gray)"/>
  <path d="M250,244 V266.0 H360 V285" stroke="#8b949e" stroke-width="1.5" fill="none" marker-end="url(#m-gray)"/>
  <line x1="650" y1="244" x2="650" y2="285" stroke="#8b949e" stroke-width="1.5" marker-end="url(#m-gray)"/>
</svg>
