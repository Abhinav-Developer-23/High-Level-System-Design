<svg xmlns="http://www.w3.org/2000/svg" width="700" height="230" viewBox="0 0 700 230" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>State after error and after rollback</title>
  <desc>After the error memory has Alice = 500 (warning) and Bob = ERROR: money seems lost. ROLLBACK restores Alice = 1000 and Bob = 2000: money restored.</desc>
  <defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d29922"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39c5cf"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs>
  <rect x="0.5" y="0.5" width="699" height="229" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="24" y="38" font-size="12" fill="#ff7b72" font-weight="700" letter-spacing="1.5">AFTER ERROR</text>
  <rect x="24" y="52" width="240" height="100" rx="10" fill="#f85149" fill-opacity="0.1" stroke="#f85149" stroke-opacity="0.6"/>
  <text x="40" y="78" font-size="14" fill="#e6edf3" font-weight="600">Memory (RAM)</text>
  <line x1="25" y1="90" x2="263" y2="90" stroke="#f85149" stroke-width="1"/>
  <text x="40" y="114" font-size="13" fill="#e6edf3" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">Alice = 500</text>
  <text x="170" y="114" font-size="14" fill="#e3b341" font-weight="700">⚠</text>
  <text x="40" y="136" font-size="13" fill="#e6edf3" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">Bob = <tspan fill="#ff7b72" font-weight="700">ERROR</tspan></text>
  <text x="24" y="182" font-size="14" fill="#ff7b72" font-weight="700">Money seems lost!</text>
  <line x1="276" y1="102" x2="418" y2="102" stroke="#d29922" stroke-width="2" marker-end="url(#a-amber)"/>
  <text x="347" y="92" font-size="12.5" fill="#e3b341" font-weight="700" text-anchor="middle" letter-spacing="1">ROLLBACK</text>
  <text x="436" y="38" font-size="12" fill="#56d364" font-weight="700" letter-spacing="1.5">AFTER ROLLBACK</text>
  <rect x="436" y="52" width="240" height="100" rx="10" fill="#3fb950" fill-opacity="0.1" stroke="#3fb950" stroke-opacity="0.6"/>
  <text x="452" y="78" font-size="14" fill="#e6edf3" font-weight="600">Memory (RAM)</text>
  <line x1="437" y1="90" x2="675" y2="90" stroke="#3fb950" stroke-width="1"/>
  <text x="452" y="114" font-size="13" fill="#e6edf3" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">Alice = 1000</text>
  <text x="452" y="136" font-size="13" fill="#e6edf3" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">Bob = 2000</text>
  <text x="590" y="114" font-size="14" fill="#56d364" font-weight="700">✓</text>
  <text x="590" y="136" font-size="14" fill="#56d364" font-weight="700">✓</text>
  <text x="436" y="182" font-size="14" fill="#56d364" font-weight="700">Money restored!</text>
</svg>
