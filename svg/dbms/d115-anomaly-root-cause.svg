<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Root cause of update anomalies</title>
  <desc>A non-key attribute depending on a non-key lets values repeat across rows; that redundancy produces insertion, modification and deletion anomalies.</desc>
  <defs>
    <marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d29922"/></marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/></marker>
    <marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39c5cf"/></marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker>
    </defs>
  <rect x="0.5" y="0.5" width="639" height="339" rx="14" fill="#161b22" stroke="#30363d"/>
  <rect x="90" y="24" width="460" height="40" rx="9" fill="#1c2128" stroke="#30363d"/>
  <text x="320" y="49" fill="#c9d1d9" font-size="13" text-anchor="middle">A non-key attribute depends on something that is NOT a key</text>
  <line x1="320" y1="64" x2="320" y2="86" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <rect x="90" y="90" width="460" height="40" rx="9" fill="#1c2128" stroke="#30363d"/>
  <text x="320" y="115" fill="#c9d1d9" font-size="13" text-anchor="middle">The DBMS cannot stop that value from repeating across rows</text>
  <line x1="320" y1="130" x2="320" y2="152" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <rect x="170" y="156" width="300" height="58" rx="10" fill="#d29922" fill-opacity="0.12" stroke="#d29922" stroke-opacity="0.7"/>
  <text x="320" y="180" fill="#e3b341" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="1.2">REDUNDANCY</text>
  <text x="320" y="201" fill="#c9d1d9" font-size="13" text-anchor="middle">(the same fact stored N times)</text>
  <line x1="320" y1="214" x2="320" y2="236" stroke="#f85149" stroke-width="1.6"/>
  <line x1="140" y1="236" x2="500" y2="236" stroke="#f85149" stroke-width="1.6"/>
  <line x1="140" y1="236" x2="140" y2="256" stroke="#f85149" stroke-width="1.6" marker-end="url(#a-red)"/>
  <rect x="65" y="260" width="150" height="56" rx="10" fill="#f85149" fill-opacity="0.1" stroke="#f85149" stroke-opacity="0.6"/>
  <text x="140" y="284" fill="#ff7b72" font-size="14" font-weight="700" text-anchor="middle">Insertion</text>
  <text x="140" y="303" fill="#c9d1d9" font-size="13" text-anchor="middle">anomaly</text>
  <line x1="320" y1="236" x2="320" y2="256" stroke="#f85149" stroke-width="1.6" marker-end="url(#a-red)"/>
  <rect x="245" y="260" width="150" height="56" rx="10" fill="#f85149" fill-opacity="0.1" stroke="#f85149" stroke-opacity="0.6"/>
  <text x="320" y="284" fill="#ff7b72" font-size="14" font-weight="700" text-anchor="middle">Modification</text>
  <text x="320" y="303" fill="#c9d1d9" font-size="13" text-anchor="middle">anomaly</text>
  <line x1="500" y1="236" x2="500" y2="256" stroke="#f85149" stroke-width="1.6" marker-end="url(#a-red)"/>
  <rect x="425" y="260" width="150" height="56" rx="10" fill="#f85149" fill-opacity="0.1" stroke="#f85149" stroke-opacity="0.6"/>
  <text x="500" y="284" fill="#ff7b72" font-size="14" font-weight="700" text-anchor="middle">Deletion</text>
  <text x="500" y="303" fill="#c9d1d9" font-size="13" text-anchor="middle">anomaly</text>
</svg>
