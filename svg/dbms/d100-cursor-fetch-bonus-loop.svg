<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Cursor processing the employees table</title>
  <desc>The cursor fetches each employee row, computes a 10% or 5% bonus and updates; when @@FETCH_STATUS = -1 there are no more rows and the loop exits.</desc>
