<svg xmlns="http://www.w3.org/2000/svg" width="760" height="364" viewBox="0 0 760 364" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Without vs with migrations</title>
  <desc>Without migrations: developer A added a phone column locally, developer B's app crashes, nobody remembers production ALTERs, staging state unknown. With migrations: every schema change is a timestamped migration file, every environment runs the same files in the same order, so Local DB = Staging DB = Production DB.</desc>
  <rect x="0.5" y="0.5" width="759" height="363" rx="14" fill="#161b22" stroke="#30363d"/>

  <!-- WITHOUT -->
  <rect x="24" y="24" width="712" height="154" rx="10" fill="#1c2128" stroke="#f85149" stroke-opacity=".7"/>
  <path d="M34,24 H726 A10,10 0 0 1 736,34 V56 H24 V34 A10,10 0 0 1 34,24 Z" fill="#f85149" fill-opacity=".14"/>
  <text x="44" y="45" fill="#ff7b72" font-size="13" font-weight="700" letter-spacing="1.2">✗  WITHOUT MIGRATIONS</text>
  <g font-size="13">
    <text x="44" y="82" fill="#e6edf3" font-weight="600">Developer A:</text>
    <text x="150" y="82" fill="#c9d1d9">"I added a 'phone' column to users table on my local DB"</text>
    <text x="44" y="108" fill="#e6edf3" font-weight="600">Developer B:</text>
    <text x="150" y="108" fill="#c9d1d9">"My local DB doesn't have that column... <tspan fill="#ff7b72" font-weight="600">app crashes</tspan>"</text>
    <text x="44" y="134" fill="#e6edf3" font-weight="600">Production:</text>
    <text x="150" y="134" fill="#c9d1d9">"Nobody remembers what ALTER statements were run last month"</text>
    <text x="44" y="160" fill="#e6edf3" font-weight="600">Staging:</text>
    <text x="150" y="160" fill="#c9d1d9">"Is this DB up to date? Who knows"</text>
  </g>
  <circle cx="376" cy="155" r="9" fill="#d29922" fill-opacity=".2" stroke="#d29922"/>
  <text x="376" y="159.5" fill="#e3b341" font-size="12" font-weight="700" text-anchor="middle">?</text>

  <!-- WITH -->
  <rect x="24" y="196" width="712" height="144" rx="10" fill="#1c2128" stroke="#3fb950" stroke-opacity=".7"/>
  <path d="M34,196 H726 A10,10 0 0 1 736,206 V228 H24 V206 A10,10 0 0 1 34,196 Z" fill="#3fb950" fill-opacity=".14"/>
  <text x="44" y="217" fill="#56d364" font-size="13" font-weight="700" letter-spacing="1.2">✓  WITH MIGRATIONS</text>
  <g font-size="13">
    <text x="44" y="254" fill="#e6edf3" font-weight="600">Every schema change</text>
    <text x="200" y="254" fill="#8b949e">→</text>
    <text x="222" y="254" fill="#c9d1d9">a migration file <tspan fill="#8b949e">(with timestamp)</tspan></text>
    <text x="44" y="280" fill="#e6edf3" font-weight="600">Every environment</text>
    <text x="200" y="280" fill="#8b949e">→</text>
    <text x="222" y="280" fill="#c9d1d9">runs the <tspan fill="#e6edf3" font-weight="700">SAME</tspan> migration files in the <tspan fill="#e6edf3" font-weight="700">SAME</tspan> order</text>
    <text x="44" y="314" fill="#e6edf3" font-weight="600">Result:</text>
  </g>
  <g font-size="12" font-weight="600" text-anchor="middle">
    <rect x="110" y="298" width="96" height="24" rx="12" fill="#3fb950" fill-opacity=".14" stroke="#3fb950" stroke-opacity=".6"/>
    <text x="158" y="314" fill="#56d364">Local DB</text>
    <text x="222" y="315" fill="#8b949e" font-size="14">=</text>
    <rect x="238" y="298" width="106" height="24" rx="12" fill="#3fb950" fill-opacity=".14" stroke="#3fb950" stroke-opacity=".6"/>
    <text x="291" y="314" fill="#56d364">Staging DB</text>
    <text x="360" y="315" fill="#8b949e" font-size="14">=</text>
    <rect x="376" y="298" width="122" height="24" rx="12" fill="#3fb950" fill-opacity=".14" stroke="#3fb950" stroke-opacity=".6"/>
    <text x="437" y="314" fill="#56d364">Production DB</text>
  </g>
  <text x="514" y="314" fill="#8b949e" font-size="13">(always in sync)</text>
</svg>
