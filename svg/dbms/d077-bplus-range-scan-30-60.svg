<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340" viewBox="0 0 820 340" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>B+ Tree range scan for id BETWEEN 30 AND 60</title>
  <desc>Step 1: start at root [40, 70]; 30 is less than 40, so follow the left pointer. Step 2: arrive at leaf [10, 20, 30], start from 30 and follow the linked list pointer. Step 3: arrive at leaf [40, 50, 60], read 40, 50, 60; 60 is the upper bound, so stop. Result: [30, 40, 50, 60], found by reading only 3 pages, with no need to go back to the root for each value.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#484f58"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="819" height="339" rx="14" fill="#161b22" stroke="#30363d"/>

  <text x="32" y="42" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">RANGE SCAN <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" letter-spacing="0" font-weight="400" fill="#79c0ff">WHERE id BETWEEN 30 AND 60</tspan></text>

  <!-- tree edges -->
  <g stroke-width="1.5">
    <line x1="177" y1="118" x2="87" y2="164" stroke="#3fb950" stroke-width="2" marker-end="url(#arrG)"/>
    <line x1="217" y1="118" x2="217" y2="164" stroke="#484f58" marker-end="url(#arr)"/>
    <line x1="257" y1="118" x2="347" y2="164" stroke="#484f58" marker-end="url(#arr)"/>
  </g>

  <!-- root -->
  <rect x="173" y="80" width="88" height="36" rx="8" fill="#3fb950" fill-opacity=".10" stroke="#3fb950"/>
  <line x1="217" y1="80" x2="217" y2="116" stroke="#3fb950" stroke-opacity=".5"/>
  <g font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" fill="#e6edf3">
    <text x="195" y="103">40</text><text x="239" y="103">70</text>
  </g>
  <circle cx="150" cy="98" r="11" fill="#3fb950" fill-opacity=".18" stroke="#3fb950"/>
  <text x="150" y="102.5" fill="#56d364" font-size="12" font-weight="700" text-anchor="middle">1</text>

  <!-- leaves -->
  <rect x="32" y="168" width="102" height="34" rx="7" fill="#3fb950" fill-opacity=".06" stroke="#3fb950" stroke-opacity=".8"/>
  <rect x="166" y="168" width="102" height="34" rx="7" fill="#3fb950" fill-opacity=".06" stroke="#3fb950" stroke-opacity=".8"/>
  <rect x="300" y="168" width="102" height="34" rx="7" fill="#1c2128" stroke="#30363d"/>
  <g fill="#3fb950" fill-opacity=".35">
    <rect x="101" y="171" width="30" height="28" rx="5"/>
    <rect x="169" y="171" width="30" height="28" rx="5"/>
    <rect x="203" y="171" width="30" height="28" rx="5"/>
    <rect x="237" y="171" width="28" height="28" rx="5"/>
  </g>
  <g stroke="#30363d"><line x1="66" y1="168" x2="66" y2="202"/><line x1="100" y1="168" x2="100" y2="202"/><line x1="200" y1="168" x2="200" y2="202"/><line x1="234" y1="168" x2="234" y2="202"/><line x1="334" y1="168" x2="334" y2="202"/><line x1="368" y1="168" x2="368" y2="202"/></g>
  <g font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="13" text-anchor="middle">
    <text x="49" y="190" fill="#8b949e">10</text><text x="83" y="190" fill="#8b949e">20</text><text x="117" y="190" fill="#ffffff" font-weight="700">30</text>
    <text x="183" y="190" fill="#ffffff" font-weight="700">40</text><text x="217" y="190" fill="#ffffff" font-weight="700">50</text><text x="251" y="190" fill="#ffffff" font-weight="700">60</text>
    <text x="317" y="190" fill="#8b949e">70</text><text x="351" y="190" fill="#8b949e">80</text><text x="385" y="190" fill="#8b949e">90</text>
  </g>
  <!-- linked list -->
  <line x1="134" y1="185" x2="162" y2="185" stroke="#3fb950" stroke-width="2" marker-end="url(#arrG)"/>
  <line x1="270" y1="185" x2="298" y2="185" stroke="#484f58" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>

  <circle cx="83" cy="226" r="11" fill="#3fb950" fill-opacity=".18" stroke="#3fb950"/>
  <text x="83" y="230.5" fill="#56d364" font-size="12" font-weight="700" text-anchor="middle">2</text>
  <circle cx="217" cy="226" r="11" fill="#3fb950" fill-opacity=".18" stroke="#3fb950"/>
  <text x="217" y="230.5" fill="#56d364" font-size="12" font-weight="700" text-anchor="middle">3</text>

  <!-- steps -->
  <line x1="424" y1="58" x2="424" y2="240" stroke="#21262d"/>
  <g font-size="13" fill="#c9d1d9">
    <text x="444" y="72" fill="#e6edf3" font-size="14" font-weight="600"><tspan fill="#56d364">Step 1:</tspan> Start at root <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">[40, 70]</tspan></text>
    <text x="460" y="94"><tspan fill="#8b949e">→</tspan> <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" fill="#79c0ff">30 &lt; 40</tspan> <tspan fill="#8b949e">→</tspan> Follow <tspan fill="#56d364" font-weight="700">LEFT</tspan> pointer</text>
    <text x="444" y="132" fill="#e6edf3" font-size="14" font-weight="600"><tspan fill="#56d364">Step 2:</tspan> Arrive at leaf <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">[10, 20, 30]</tspan></text>
    <text x="460" y="154"><tspan fill="#8b949e">→</tspan> Start from <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" fill="#79c0ff">30</tspan></text>
    <text x="460" y="176"><tspan fill="#8b949e">→</tspan> Follow linked list pointer <tspan fill="#56d364">→</tspan></text>
    <text x="444" y="214" fill="#e6edf3" font-size="14" font-weight="600"><tspan fill="#56d364">Step 3:</tspan> Arrive at leaf <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">[40, 50, 60]</tspan></text>
    <text x="460" y="236"><tspan fill="#8b949e">→</tspan> Read <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" fill="#79c0ff">40, 50, 60</tspan> <tspan fill="#8b949e">→</tspan> <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" fill="#79c0ff">60</tspan> is the upper bound, stop</text>
  </g>

  <!-- result -->
  <rect x="32" y="260" width="756" height="56" rx="10" fill="#3fb950" fill-opacity=".10" stroke="#3fb950" stroke-opacity=".7"/>
  <text x="50" y="284" fill="#e6edf3" font-size="14" font-weight="600"><tspan fill="#56d364">Result:</tspan> <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">[30, 40, 50, 60]</tspan> — found by reading only <tspan fill="#56d364">3 pages</tspan></text>
  <text x="50" y="305" fill="#8b949e" font-size="13">(No need to go back to the root for each value!)</text>
</svg>
