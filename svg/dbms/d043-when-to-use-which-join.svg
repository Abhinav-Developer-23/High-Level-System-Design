<svg xmlns="http://www.w3.org/2000/svg" width="720" height="328" viewBox="0 0 720 328" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>When to use which join</title>
  <desc>Only matches: INNER JOIN. All from left table: LEFT JOIN. All from right table: RIGHT JOIN. All from both tables: FULL JOIN. Every combination: CROSS JOIN. Rows related to other rows in the same table: SELF JOIN.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs>
  <rect x="0.5" y="0.5" width="719" height="327" rx="14" fill="#161b22" stroke="#30363d"/>
  <rect x="24" y="24" width="470" height="40" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="42" y="48.5" fill="#c9d1d9" font-size="13.5">Need <tspan font-weight="700" fill="#e6edf3">ONLY</tspan> matches?</text>
  <line x1="494" y1="44.0" x2="536" y2="44.0" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="540" y="28" width="156" height="32" rx="16.0" fill="#58a6ff" fill-opacity=".12" stroke="#58a6ff" stroke-opacity=".6"/>
  <text x="618" y="48.5" fill="#79c0ff" font-size="13" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">INNER JOIN</text>
  <rect x="24" y="72" width="470" height="40" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="42" y="96.5" fill="#c9d1d9" font-size="13.5">Need <tspan font-weight="700" fill="#e6edf3">ALL</tspan> from left table?</text>
  <line x1="494" y1="92.0" x2="536" y2="92.0" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="540" y="76" width="156" height="32" rx="16.0" fill="#58a6ff" fill-opacity=".12" stroke="#58a6ff" stroke-opacity=".6"/>
  <text x="618" y="96.5" fill="#79c0ff" font-size="13" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">LEFT JOIN</text>
  <rect x="24" y="120" width="470" height="40" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="42" y="144.5" fill="#c9d1d9" font-size="13.5">Need <tspan font-weight="700" fill="#e6edf3">ALL</tspan> from right table?</text>
  <line x1="494" y1="140.0" x2="536" y2="140.0" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="540" y="124" width="156" height="32" rx="16.0" fill="#58a6ff" fill-opacity=".12" stroke="#58a6ff" stroke-opacity=".6"/>
  <text x="618" y="144.5" fill="#79c0ff" font-size="13" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">RIGHT JOIN</text>
  <rect x="24" y="168" width="470" height="40" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="42" y="192.5" fill="#c9d1d9" font-size="13.5">Need <tspan font-weight="700" fill="#e6edf3">ALL</tspan> from both tables?</text>
  <line x1="494" y1="188.0" x2="536" y2="188.0" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="540" y="172" width="156" height="32" rx="16.0" fill="#58a6ff" fill-opacity=".12" stroke="#58a6ff" stroke-opacity=".6"/>
  <text x="618" y="192.5" fill="#79c0ff" font-size="13" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">FULL JOIN</text>
  <rect x="24" y="216" width="470" height="40" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="42" y="240.5" fill="#c9d1d9" font-size="13.5">Need every combination?</text>
  <line x1="494" y1="236.0" x2="536" y2="236.0" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="540" y="220" width="156" height="32" rx="16.0" fill="#58a6ff" fill-opacity=".12" stroke="#58a6ff" stroke-opacity=".6"/>
  <text x="618" y="240.5" fill="#79c0ff" font-size="13" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">CROSS JOIN</text>
  <rect x="24" y="264" width="470" height="40" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="42" y="288.5" fill="#c9d1d9" font-size="13.5">Need rows related to other rows in the <tspan font-weight="700" fill="#e6edf3">SAME</tspan> table?</text>
  <line x1="494" y1="284.0" x2="536" y2="284.0" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="540" y="268" width="156" height="32" rx="16.0" fill="#58a6ff" fill-opacity=".12" stroke="#58a6ff" stroke-opacity=".6"/>
  <text x="618" y="288.5" fill="#79c0ff" font-size="13" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">SELF JOIN</text>
</svg>
