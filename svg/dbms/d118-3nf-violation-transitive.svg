<svg xmlns="http://www.w3.org/2000/svg" width="620" height="134" viewBox="0 0 620 134" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>3NF violation: transitive dependency</title>
  <desc>roll_no → dept → dept_head where dept is not a candidate key, so roll_no → dept_head is a transitive dependency.</desc>
  <defs>
    <marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d29922"/></marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/></marker>
    <marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39c5cf"/></marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker>
    </defs>
  <rect x="0.5" y="0.5" width="619" height="133" rx="14" fill="#161b22" stroke="#30363d"/>
  <rect x="32" y="28" width="86" height="36" rx="8" fill="#58a6ff" fill-opacity="0.12" stroke="#58a6ff" stroke-opacity="0.65"/>
  <text x="75.0" y="50.68" fill="#79c0ff" font-size="13" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">roll_no</text>
  <line x1="121" y1="46" x2="154" y2="46" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <rect x="158" y="28" width="62" height="36" rx="8" fill="#bc8cff" fill-opacity="0.12" stroke="#bc8cff" stroke-opacity="0.65"/>
  <text x="189.0" y="50.68" fill="#d2a8ff" font-size="13" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">dept</text>
  <line x1="223" y1="46" x2="256" y2="46" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <rect x="260" y="28" width="101" height="36" rx="8" fill="#39c5cf" fill-opacity="0.12" stroke="#39c5cf" stroke-opacity="0.65"/>
  <text x="310.5" y="50.68" fill="#56d4dd" font-size="13" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">dept_head</text>
  <text x="385" y="51" fill="#8b949e" font-size="13">(dept is NOT a candidate key)</text>
  <path d="M75.0,64 V100 H310.5 V68" fill="none" stroke="#f85149" stroke-width="1.8" marker-end="url(#a-red)"/>
  <rect x="150" y="88" width="180" height="24" rx="12" fill="#161b22" stroke="#161b22"/>
  <text x="240" y="105" fill="#ff7b72" font-size="13" font-weight="700" text-anchor="middle">transitive dependency</text>
</svg>
