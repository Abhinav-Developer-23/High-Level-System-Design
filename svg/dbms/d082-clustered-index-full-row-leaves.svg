<svg xmlns="http://www.w3.org/2000/svg" width="744" height="280" viewBox="0 0 744 280" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Clustered index B+ Tree internals</title>
  <desc>Internal nodes such as [50, 100] contain only IDs and page pointers. Leaf nodes contain the full row: Page 1 holds id=1 Alice Eng 90000, id=2 Bob Sales 75000 and more; Page 2 holds id=51 Carol Eng 95000 and more.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="743" height="279" rx="14" fill="#161b22" stroke="#30363d"/>

  <text x="32" y="42" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">INTERNAL NODES</text>
  <text x="300" y="42" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">LEAF NODES <tspan letter-spacing="0" font-weight="600" fill="#56d364">(contain the FULL ROW)</tspan></text>

  <!-- internal node -->
  <rect x="32" y="128" width="112" height="40" rx="8" fill="#58a6ff" fill-opacity=".12" stroke="#58a6ff" stroke-opacity=".8"/>
  <line x1="84" y1="128" x2="84" y2="168" stroke="#58a6ff" stroke-opacity=".5"/>
  <g font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">
    <text x="58" y="153">50</text><text x="114" y="153">100</text>
  </g>
  <text x="32" y="194" fill="#c9d1d9" font-size="13">contain only IDs</text>
  <text x="32" y="213" fill="#c9d1d9" font-size="13">and page pointers</text>

  <g stroke="#8b949e" stroke-width="1.5">
    <line x1="150" y1="140" x2="294" y2="104" marker-end="url(#arr)"/>
    <line x1="150" y1="156" x2="294" y2="212" marker-end="url(#arr)"/>
  </g>

  <!-- page 1 -->
  <rect x="300" y="58" width="412" height="100" rx="10" fill="#3fb950" fill-opacity=".06" stroke="#3fb950" stroke-opacity=".6"/>
  <text x="316" y="81" fill="#e6edf3" font-size="13.5" font-weight="600">Page 1</text>
  <g font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="12" fill="#c9d1d9">
    <text x="316" y="105">[<tspan fill="#79c0ff">id=1</tspan>, name='Alice', dept='Eng', salary=90000]</text>
    <text x="316" y="125">[<tspan fill="#79c0ff">id=2</tspan>, name='Bob', dept='Sales', salary=75000]</text>
    <text x="316" y="145" fill="#8b949e">...</text>
  </g>

  <!-- page 2 -->
  <rect x="300" y="174" width="412" height="82" rx="10" fill="#3fb950" fill-opacity=".06" stroke="#3fb950" stroke-opacity=".6"/>
  <text x="316" y="197" fill="#e6edf3" font-size="13.5" font-weight="600">Page 2</text>
  <g font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="12" fill="#c9d1d9">
    <text x="316" y="221">[<tspan fill="#79c0ff">id=51</tspan>, name='Carol', dept='Eng', salary=95000]</text>
    <text x="316" y="241" fill="#8b949e">...</text>
  </g>
</svg>
