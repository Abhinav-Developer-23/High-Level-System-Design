<svg xmlns="http://www.w3.org/2000/svg" width="900" height="282" viewBox="0 0 900 282" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Database vs application responsibilities</title>
  <desc>Keep in the database: constraints (PK, FK, UNIQUE, NOT NULL, CHECK), indexes, transactions, and occasionally audit triggers. Keep in the application: business rules and workflows, validation, orchestration and external API calls, pricing, permissions and state machines, and anything that changes often.</desc>
  <rect x="0.5" y="0.5" width="899" height="281" rx="14" fill="#161b22" stroke="#30363d"/>
  <rect x="24.0" y="24" width="416.0" height="234" rx="10" fill="#1c2128" stroke="#3fb950" stroke-opacity=".55"/>
  <path d="M24.0,66 V34 a10,10 0 0 1 10,-10 H430.0 a10,10 0 0 1 10,10 V66 z" fill="#3fb950" fill-opacity=".14"/>
  <line x1="24.0" y1="66" x2="440.0" y2="66" stroke="#3fb950" stroke-opacity=".5"/>
  <text x="42.0" y="51" fill="#56d364" font-size="14" font-weight="700">Keep in the <tspan font-weight="800">DATABASE</tspan></text>
  <text x="44.0" y="97.5" fill="#56d364" font-size="14" font-weight="700">✓</text>
  <text x="66.0" y="97.5" fill="#c9d1d9" font-size="13.5">Constraints (<tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" fill="#79c0ff" font-size="12.5">PK, FK, UNIQUE, NOT NULL, CHECK</tspan>)</text>
  <line x1="38.0" y1="110" x2="426.0" y2="110" stroke="#21262d"/>
  <text x="44.0" y="131.5" fill="#56d364" font-size="14" font-weight="700">✓</text>
  <text x="66.0" y="131.5" fill="#c9d1d9" font-size="13.5">Indexes</text>
  <line x1="38.0" y1="144" x2="426.0" y2="144" stroke="#21262d"/>
  <text x="44.0" y="165.5" fill="#56d364" font-size="14" font-weight="700">✓</text>
  <text x="66.0" y="165.5" fill="#c9d1d9" font-size="13.5">Transactions</text>
  <line x1="38.0" y1="178" x2="426.0" y2="178" stroke="#21262d"/>
  <text x="44.0" y="199.5" fill="#56d364" font-size="14" font-weight="700">✓</text>
  <text x="66.0" y="199.5" fill="#c9d1d9" font-size="13.5">Occasionally: audit triggers</text>
  <rect x="460.0" y="24" width="416.0" height="234" rx="10" fill="#1c2128" stroke="#3fb950" stroke-opacity=".55"/>
  <path d="M460.0,66 V34 a10,10 0 0 1 10,-10 H866.0 a10,10 0 0 1 10,10 V66 z" fill="#3fb950" fill-opacity=".14"/>
  <line x1="460.0" y1="66" x2="876.0" y2="66" stroke="#3fb950" stroke-opacity=".5"/>
  <text x="478.0" y="51" fill="#56d364" font-size="14" font-weight="700">Keep in the <tspan font-weight="800">APPLICATION</tspan></text>
  <text x="480.0" y="97.5" fill="#56d364" font-size="14" font-weight="700">✓</text>
  <text x="502.0" y="97.5" fill="#c9d1d9" font-size="13.5">Business rules &amp; workflows</text>
  <line x1="474.0" y1="110" x2="862.0" y2="110" stroke="#21262d"/>
  <text x="480.0" y="131.5" fill="#56d364" font-size="14" font-weight="700">✓</text>
  <text x="502.0" y="131.5" fill="#c9d1d9" font-size="13.5">Validation</text>
  <line x1="474.0" y1="144" x2="862.0" y2="144" stroke="#21262d"/>
  <text x="480.0" y="165.5" fill="#56d364" font-size="14" font-weight="700">✓</text>
  <text x="502.0" y="165.5" fill="#c9d1d9" font-size="13.5">Orchestration / external API calls</text>
  <line x1="474.0" y1="178" x2="862.0" y2="178" stroke="#21262d"/>
  <text x="480.0" y="199.5" fill="#56d364" font-size="14" font-weight="700">✓</text>
  <text x="502.0" y="199.5" fill="#c9d1d9" font-size="13.5">Pricing, permissions, state machines</text>
  <line x1="474.0" y1="212" x2="862.0" y2="212" stroke="#21262d"/>
  <text x="480.0" y="233.5" fill="#56d364" font-size="14" font-weight="700">✓</text>
  <text x="502.0" y="233.5" fill="#c9d1d9" font-size="13.5">Anything that changes often</text>
</svg>
