<svg xmlns="http://www.w3.org/2000/svg" width="860" height="256" viewBox="0 0 860 256" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Junction table resolves M:N</title>
  <desc>The Enrollment associative table (student_id FK, course_id FK, grade, enrolled_on) breaks Student M:N Course into Student 1:N Enrollment and Enrollment N:1 Course.</desc>
  <defs>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/>
    </marker>
    <marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#39c5cf"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="859" height="255" rx="14" fill="#161b22" stroke="#30363d"/>

  <!-- Student -->
  <rect x="32" y="40" width="190" height="98" rx="10" fill="#1c2128" stroke="#bc8cff" stroke-opacity=".6"/>
  <path d="M32,74 V50 a10,10 0 0 1 10,-10 H212 a10,10 0 0 1 10,10 V74 z" fill="#bc8cff" fill-opacity=".13"/>
  <line x1="32" y1="74" x2="222" y2="74" stroke="#30363d"/>
  <text x="127" y="63" fill="#e6edf3" font-size="14.5" font-weight="600" text-anchor="middle">Student</text>
  <text x="48" y="99" fill="#e6edf3" font-size="13" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">student_id</text>
  <rect x="168" y="85" width="40" height="20" rx="10" fill="#d29922" fill-opacity=".16" stroke="#d29922" stroke-opacity=".6"/>
  <text x="188" y="99" fill="#e3b341" font-size="11" font-weight="700" text-anchor="middle">PK</text>
  <text x="48" y="125" fill="#c9d1d9" font-size="13" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">name</text>

  <!-- Enrollment -->
  <rect x="330" y="40" width="210" height="150" rx="10" fill="#1c2128" stroke="#d29922" stroke-opacity=".7"/>
  <path d="M330,74 V50 a10,10 0 0 1 10,-10 H530 a10,10 0 0 1 10,10 V74 z" fill="#d29922" fill-opacity=".14"/>
  <line x1="330" y1="74" x2="540" y2="74" stroke="#30363d"/>
  <text x="435" y="63" fill="#e6edf3" font-size="14.5" font-weight="600" text-anchor="middle">Enrollment</text>
  <text x="346" y="99" fill="#d2a8ff" font-size="13" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">student_id</text>
  <rect x="484" y="85" width="40" height="20" rx="10" fill="#58a6ff" fill-opacity=".16" stroke="#58a6ff" stroke-opacity=".6"/>
  <text x="504" y="99" fill="#79c0ff" font-size="11" font-weight="700" text-anchor="middle">FK</text>
  <text x="346" y="125" fill="#56d4dd" font-size="13" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">course_id</text>
  <rect x="484" y="111" width="40" height="20" rx="10" fill="#58a6ff" fill-opacity=".16" stroke="#58a6ff" stroke-opacity=".6"/>
  <text x="504" y="125" fill="#79c0ff" font-size="11" font-weight="700" text-anchor="middle">FK</text>
  <text x="346" y="151" fill="#c9d1d9" font-size="13" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">grade</text>
  <text x="346" y="177" fill="#c9d1d9" font-size="13" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">enrolled_on</text>
  <rect x="365" y="210" width="140" height="22" rx="11" fill="#d29922" fill-opacity=".12" stroke="#d29922" stroke-opacity=".5"/>
  <text x="435" y="225" fill="#e3b341" font-size="12" font-weight="600" text-anchor="middle">Associative Table</text>

  <!-- Course -->
  <rect x="642" y="66" width="186" height="98" rx="10" fill="#1c2128" stroke="#39c5cf" stroke-opacity=".6"/>
  <path d="M642,100 V76 a10,10 0 0 1 10,-10 H818 a10,10 0 0 1 10,10 V100 z" fill="#39c5cf" fill-opacity=".13"/>
  <line x1="642" y1="100" x2="828" y2="100" stroke="#30363d"/>
  <text x="735" y="89" fill="#e6edf3" font-size="14.5" font-weight="600" text-anchor="middle">Course</text>
  <text x="658" y="125" fill="#e6edf3" font-size="13" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">course_id</text>
  <rect x="774" y="111" width="40" height="20" rx="10" fill="#d29922" fill-opacity=".16" stroke="#d29922" stroke-opacity=".6"/>
  <text x="794" y="125" fill="#e3b341" font-size="11" font-weight="700" text-anchor="middle">PK</text>
  <text x="658" y="151" fill="#c9d1d9" font-size="13" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">course_name</text>

  <!-- Student 1 : N Enrollment -->
  <line x1="330" y1="95" x2="226" y2="95" stroke="#bc8cff" stroke-width="1.6" marker-end="url(#arrP)"/>
  <path d="M314,95 L330,87 M314,95 L330,103" stroke="#bc8cff" stroke-width="1.6" fill="none"/>
  <text x="234" y="88" fill="#d2a8ff" font-size="12" font-weight="700" data-nocheck="1">1</text>
  <text x="312" y="86" fill="#d2a8ff" font-size="12" font-weight="700" data-nocheck="1">N</text>
  <rect x="254" y="84" width="44" height="22" rx="11" fill="#161b22" stroke="#bc8cff"/>
  <text x="276" y="99" fill="#d2a8ff" font-size="12" font-weight="700" text-anchor="middle">1:N</text>

  <!-- Enrollment N : 1 Course -->
  <line x1="540" y1="121" x2="638" y2="121" stroke="#39c5cf" stroke-width="1.6" marker-end="url(#arrT)"/>
  <path d="M556,121 L540,113 M556,121 L540,129" stroke="#39c5cf" stroke-width="1.6" fill="none"/>
  <text x="546" y="110" fill="#56d4dd" font-size="12" font-weight="700" data-nocheck="1">N</text>
  <text x="624" y="113" fill="#56d4dd" font-size="12" font-weight="700" data-nocheck="1">1</text>
  <rect x="569" y="110" width="44" height="22" rx="11" fill="#161b22" stroke="#39c5cf"/>
  <text x="591" y="125" fill="#56d4dd" font-size="12" font-weight="700" text-anchor="middle">N:1</text>
</svg>
