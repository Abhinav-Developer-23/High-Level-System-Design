<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Key relationship chain</title>
  <desc>Super Key is a superset of Candidate Key, which equals Primary Key plus Alternate Key(s). The Primary Key is referenced by a Foreign Key in another table. Secondary Key is any frequently searched column, an orthogonal concept.</desc>
  <defs>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="799" height="299" rx="14" fill="#161b22" stroke="#30363d"/>

  <!-- chain -->
  <rect x="64" y="28" width="120" height="42" rx="10" fill="#1c2128" stroke="#30363d"/>
  <text x="124" y="54" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle">Super Key</text>
  <text x="206" y="56" fill="#8b949e" font-size="20" font-weight="600" text-anchor="middle">⊇</text>

  <rect x="228" y="28" width="140" height="42" rx="10" fill="#58a6ff" fill-opacity=".10" stroke="#58a6ff" stroke-opacity=".7"/>
  <text x="298" y="54" fill="#79c0ff" font-size="14" font-weight="600" text-anchor="middle">Candidate Key</text>
  <text x="390" y="56" fill="#8b949e" font-size="20" font-weight="600" text-anchor="middle">=</text>

  <rect x="412" y="28" width="130" height="42" rx="10" fill="#3fb950" fill-opacity=".10" stroke="#3fb950" stroke-opacity=".7"/>
  <text x="477" y="54" fill="#56d364" font-size="14" font-weight="600" text-anchor="middle">Primary Key</text>
  <text x="564" y="56" fill="#8b949e" font-size="20" font-weight="600" text-anchor="middle">+</text>

  <rect x="586" y="28" width="150" height="42" rx="10" fill="#bc8cff" fill-opacity=".10" stroke="#bc8cff" stroke-opacity=".7"/>
  <text x="661" y="54" fill="#d2a8ff" font-size="14" font-weight="600" text-anchor="middle">Alternate Key(s)</text>

  <!-- referenced by -->
  <line x1="477" y1="140" x2="477" y2="74" stroke="#f0883e" stroke-width="1.6" marker-end="url(#arrO)"/>
  <text x="489" y="110" fill="#c9d1d9" font-size="13">Referenced by</text>

  <rect x="387" y="144" width="180" height="56" rx="10" fill="#f0883e" fill-opacity=".10" stroke="#f0883e" stroke-opacity=".7"/>
  <text x="477" y="168" fill="#ffa657" font-size="14" font-weight="600" text-anchor="middle">Foreign Key</text>
  <text x="477" y="188" fill="#8b949e" font-size="12" text-anchor="middle">(in another table)</text>

  <!-- secondary key -->
  <line x1="24" y1="222" x2="776" y2="222" stroke="#21262d"/>
  <rect x="160" y="236" width="480" height="44" rx="10" fill="#1c2128" stroke="#484f58" stroke-dasharray="6 5"/>
  <text x="400" y="263" fill="#c9d1d9" font-size="13.5" text-anchor="middle"><tspan font-weight="600" fill="#e6edf3">Secondary Key</tspan> = any frequently searched column <tspan fill="#8b949e" font-size="12">(orthogonal concept)</tspan></text>
</svg>
