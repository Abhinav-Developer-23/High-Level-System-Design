<svg xmlns="http://www.w3.org/2000/svg" width="800" height="270" viewBox="0 0 800 270" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>B+ Tree lookup for employee_id = 50</title>
  <desc>Step 1: start at root [40, 70]; 50 is at least 40 and less than 70, so follow the middle pointer. Step 2: arrive at leaf [40, 50, 60] and scan within this small node to find 50. Total: 2 disk reads, 1 root page plus 1 leaf page.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#484f58"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="799" height="269" rx="14" fill="#161b22" stroke="#30363d"/>

  <text x="32" y="42" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">FIND <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" letter-spacing="0" font-weight="400" fill="#79c0ff">employee_id = 50</tspan></text>

  <!-- tree -->
  <g stroke-width="1.5">
    <line x1="161" y1="100" x2="85" y2="148" stroke="#484f58" marker-end="url(#arr)"/>
    <line x1="201" y1="100" x2="201" y2="148" stroke="#3fb950" stroke-width="2" marker-end="url(#arrG)"/>
    <line x1="241" y1="100" x2="317" y2="148" stroke="#484f58" marker-end="url(#arr)"/>
  </g>
  <rect x="157" y="62" width="88" height="36" rx="8" fill="#3fb950" fill-opacity=".10" stroke="#3fb950"/>
  <line x1="201" y1="62" x2="201" y2="98" stroke="#3fb950" stroke-opacity=".5"/>
  <g font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" fill="#e6edf3">
    <text x="179" y="85">40</text><text x="223" y="85">70</text>
  </g>
  <circle cx="134" cy="80" r="11" fill="#3fb950" fill-opacity=".18" stroke="#3fb950"/>
  <text x="134" y="84.5" fill="#56d364" font-size="12" font-weight="700" text-anchor="middle">1</text>

  <rect x="32" y="152" width="102" height="34" rx="7" fill="#1c2128" stroke="#30363d"/>
  <rect x="150" y="152" width="102" height="34" rx="7" fill="#3fb950" fill-opacity=".10" stroke="#3fb950"/>
  <rect x="268" y="152" width="102" height="34" rx="7" fill="#1c2128" stroke="#30363d"/>
  <rect x="185" y="155" width="32" height="28" rx="5" fill="#3fb950" fill-opacity=".35"/>
  <g stroke="#30363d"><line x1="66" y1="152" x2="66" y2="186"/><line x1="100" y1="152" x2="100" y2="186"/><line x1="302" y1="152" x2="302" y2="186"/><line x1="336" y1="152" x2="336" y2="186"/></g>
  <g stroke="#3fb950" stroke-opacity=".5"><line x1="184" y1="152" x2="184" y2="186"/><line x1="218" y1="152" x2="218" y2="186"/></g>
  <g font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="13" text-anchor="middle">
    <text x="49" y="174" fill="#8b949e">10</text><text x="83" y="174" fill="#8b949e">20</text><text x="117" y="174" fill="#8b949e">30</text>
    <text x="167" y="174" fill="#e6edf3">40</text><text x="201" y="174" fill="#ffffff" font-weight="700">50</text><text x="235" y="174" fill="#e6edf3">60</text>
    <text x="285" y="174" fill="#8b949e">70</text><text x="319" y="174" fill="#8b949e">80</text><text x="353" y="174" fill="#8b949e">90</text>
  </g>
  <circle cx="201" cy="208" r="11" fill="#3fb950" fill-opacity=".18" stroke="#3fb950"/>
  <text x="201" y="212.5" fill="#56d364" font-size="12" font-weight="700" text-anchor="middle">2</text>

  <!-- steps -->
  <line x1="400" y1="58" x2="400" y2="190" stroke="#21262d"/>
  <text x="424" y="72" fill="#e6edf3" font-size="14" font-weight="600"><tspan fill="#56d364">Step 1:</tspan> Start at root <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">[40, 70]</tspan></text>
  <text x="440" y="96" fill="#c9d1d9" font-size="13"><tspan fill="#8b949e">→</tspan> <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none" fill="#79c0ff">50 &gt;= 40</tspan> and <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" fill="#79c0ff">50 &lt; 70</tspan></text>
  <text x="440" y="118" fill="#c9d1d9" font-size="13"><tspan fill="#8b949e">→</tspan> Follow the <tspan fill="#56d364" font-weight="700">MIDDLE</tspan> pointer</text>
  <text x="424" y="156" fill="#e6edf3" font-size="14" font-weight="600"><tspan fill="#56d364">Step 2:</tspan> Arrive at leaf <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">[40, 50, 60]</tspan></text>
  <text x="440" y="180" fill="#c9d1d9" font-size="13"><tspan fill="#8b949e">→</tspan> Scan within this small node <tspan fill="#8b949e">→</tspan> <tspan fill="#56d364" font-weight="700">Found 50!</tspan></text>

  <!-- total -->
  <rect x="424" y="200" width="344" height="40" rx="10" fill="#58a6ff" fill-opacity=".10" stroke="#58a6ff" stroke-opacity=".6"/>
  <text x="440" y="225" fill="#e6edf3" font-size="13.5" font-weight="600">Total: <tspan fill="#79c0ff">2 disk reads</tspan> <tspan fill="#8b949e" font-weight="400">(1 root page + 1 leaf page)</tspan></text>
</svg>
