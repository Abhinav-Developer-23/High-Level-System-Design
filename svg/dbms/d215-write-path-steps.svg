<svg xmlns="http://www.w3.org/2000/svg" width="860" height="498" viewBox="0 0 860 498" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Write path steps</title>
  <desc>UPDATE users SET city = 'Pune' WHERE id = 42: load the page into the buffer pool, modify the row in memory (page becomes dirty), append the change to the WAL/redo log and fsync it (this makes COMMIT durable), return COMMIT while the data page is still only in RAM, later flush dirty pages to the table file, and the page is clean again.</desc>
  <defs>
    <marker id="d215a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
    <marker id="d215g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
    <marker id="d215y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d29922"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="859" height="497" rx="14" fill="#161b22" stroke="#30363d"/>

  <!-- query -->
  <rect x="24" y="20" width="392" height="30" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="38" y="40" fill="#79c0ff" font-size="13" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">UPDATE users SET city = 'Pune' WHERE id = 42;</text>

  <!-- rail -->
  <line x1="58" y1="90" x2="58" y2="454" stroke="#30363d" stroke-width="2"/>

  <!-- step 1 -->
  <rect x="24" y="78" width="68" height="24" rx="12" fill="#1c2128" stroke="#484f58"/>
  <text x="58" y="94.5" fill="#c9d1d9" font-size="12" font-weight="700" text-anchor="middle">Step 1</text>
  <rect x="108" y="70" width="496" height="40" rx="10" fill="#1c2128" stroke="#30363d"/>
  <text x="126" y="95" fill="#c9d1d9" font-size="13.5">Load the page into the buffer pool <tspan fill="#8b949e">(if not already there)</tspan></text>
  <line x1="356" y1="110" x2="356" y2="126" stroke="#8b949e" stroke-width="1.5" marker-end="url(#d215a)"/>

  <!-- step 2 -->
  <rect x="24" y="151" width="68" height="24" rx="12" fill="#1c2128" stroke="#484f58"/>
  <text x="58" y="167.5" fill="#c9d1d9" font-size="12" font-weight="700" text-anchor="middle">Step 2</text>
  <rect x="108" y="128" width="496" height="70" rx="10" fill="#d29922" fill-opacity=".10" stroke="#d29922" stroke-opacity=".7"/>
  <text x="126" y="151" fill="#e6edf3" font-size="13.5">Modify the row <tspan font-weight="700" fill="#e3b341">IN MEMORY</tspan></text>
  <text x="140" y="171" fill="#c9d1d9" font-size="13">→ the page is now a <tspan font-weight="700" fill="#e3b341">DIRTY PAGE</tspan></text>
  <text x="156" y="189" fill="#8b949e" font-size="12.5">(memory version ≠ disk version)</text>
  <line x1="356" y1="198" x2="356" y2="214" stroke="#8b949e" stroke-width="1.5" marker-end="url(#d215a)"/>

  <!-- step 3 -->
  <rect x="24" y="233" width="68" height="24" rx="12" fill="#1c2128" stroke="#484f58"/>
  <text x="58" y="249.5" fill="#c9d1d9" font-size="12" font-weight="700" text-anchor="middle">Step 3</text>
  <rect x="108" y="216" width="496" height="58" rx="10" fill="#3fb950" fill-opacity=".12" stroke="#3fb950" stroke-opacity=".8"/>
  <text x="126" y="240" fill="#e6edf3" font-size="13.5">Append the change to the <tspan font-weight="700">WAL / redo log</tspan></text>
  <text x="140" y="262" fill="#56d364" font-size="13" font-weight="700">THIS is what makes COMMIT durable</text>
  <line x1="604" y1="236" x2="646" y2="236" stroke="#3fb950" stroke-width="1.6" marker-end="url(#d215g)"/>
  <rect x="650" y="224" width="186" height="24" rx="12" fill="#3fb950" fill-opacity=".16" stroke="#3fb950" stroke-opacity=".75"/>
  <text x="743" y="240.5" fill="#56d364" font-size="12.5" font-weight="700" text-anchor="middle"><tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">fsync</tspan> to disk ✓</text>
  <line x1="356" y1="274" x2="356" y2="290" stroke="#8b949e" stroke-width="1.5" marker-end="url(#d215a)"/>

  <!-- step 4 -->
  <rect x="24" y="304" width="68" height="24" rx="12" fill="#1c2128" stroke="#484f58"/>
  <text x="58" y="320.5" fill="#c9d1d9" font-size="12" font-weight="700" text-anchor="middle">Step 4</text>
  <rect x="108" y="292" width="496" height="48" rx="10" fill="#1c2128" stroke="#58a6ff" stroke-opacity=".6"/>
  <text x="126" y="321" fill="#e6edf3" font-size="13.5"><tspan font-weight="700">COMMIT</tspan> returns to the client</text>
  <line x1="650" y1="316" x2="608" y2="316" stroke="#d29922" stroke-width="1.6" marker-end="url(#d215y)"/>
  <rect x="650" y="292" width="186" height="48" rx="10" fill="#d29922" fill-opacity=".10" stroke="#d29922" stroke-opacity=".7"/>
  <text x="743" y="311" fill="#c9d1d9" font-size="12.5" text-anchor="middle">the data page is</text>
  <text x="743" y="329" fill="#e3b341" font-size="12.5" font-weight="700" text-anchor="middle">STILL only in RAM</text>
  <line x1="356" y1="340" x2="356" y2="356" stroke="#8b949e" stroke-width="1.5" marker-end="url(#d215a)"/>

  <!-- step 5 -->
  <rect x="24" y="375" width="68" height="24" rx="12" fill="#1c2128" stroke="#484f58"/>
  <text x="58" y="391.5" fill="#c9d1d9" font-size="12" font-weight="700" text-anchor="middle">Step 5</text>
  <rect x="108" y="358" width="496" height="58" rx="10" fill="#1c2128" stroke="#484f58" stroke-dasharray="6 4"/>
  <text x="126" y="382" fill="#e6edf3" font-size="13.5"><tspan font-weight="700">Later</tspan>, a background thread flushes dirty pages to the table file</text>
  <text x="140" y="404" fill="#8b949e" font-size="12.5">(at a checkpoint, or under memory pressure)</text>
  <line x1="356" y1="416" x2="356" y2="432" stroke="#8b949e" stroke-width="1.5" marker-end="url(#d215a)"/>

  <!-- step 6 -->
  <rect x="24" y="442" width="68" height="24" rx="12" fill="#1c2128" stroke="#484f58"/>
  <text x="58" y="458.5" fill="#c9d1d9" font-size="12" font-weight="700" text-anchor="middle">Step 6</text>
  <rect x="108" y="434" width="496" height="40" rx="10" fill="#39c5cf" fill-opacity=".10" stroke="#39c5cf" stroke-opacity=".6"/>
  <text x="126" y="459" fill="#e6edf3" font-size="13.5">Page is <tspan font-weight="700" fill="#56d4dd">clean</tspan> again — memory matches disk</text>
</svg>
