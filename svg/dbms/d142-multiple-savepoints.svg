<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Multiple savepoints</title>
  <desc>Savepoints sp1, sp2 and sp3 sit before Laptop, Mouse and Keyboard. Laptop is kept; Mouse and Keyboard are undone. ROLLBACK TO sp1 undoes #2 and #3; ROLLBACK TO sp2 undoes #3 only.</desc>
  <defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d29922"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39c5cf"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs>
  <rect x="0.5" y="0.5" width="639" height="299" rx="14" fill="#161b22" stroke="#30363d"/>
  <rect x="88.0" y="25.0" width="64" height="22" rx="11.0" fill="#bc8cff" fill-opacity=".16" stroke="#bc8cff" stroke-opacity=".6"/>
  <text x="120" y="40.5" font-size="12.5" fill="#d2a8ff" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">sp1</text>
  <line x1="120" y1="48" x2="120" y2="76" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <rect x="54" y="80" width="132" height="38" rx="8" fill="#3fb950" fill-opacity="0.12" stroke="#3fb950" stroke-opacity="0.7"/>
  <text x="120" y="104" font-size="14" fill="#e6edf3" font-weight="600" text-anchor="middle">Laptop</text>
  <text x="120" y="146" font-size="17" fill="#56d364" font-weight="700" text-anchor="middle">✓</text>
  <rect x="288.0" y="25.0" width="64" height="22" rx="11.0" fill="#bc8cff" fill-opacity=".16" stroke="#bc8cff" stroke-opacity=".6"/>
  <text x="320" y="40.5" font-size="12.5" fill="#d2a8ff" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">sp2</text>
  <line x1="320" y1="48" x2="320" y2="76" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <rect x="254" y="80" width="132" height="38" rx="8" fill="#f85149" fill-opacity="0.12" stroke="#f85149" stroke-opacity="0.7"/>
  <text x="320" y="104" font-size="14" fill="#e6edf3" font-weight="600" text-anchor="middle">Mouse</text>
  <text x="320" y="146" font-size="17" fill="#ff7b72" font-weight="700" text-anchor="middle">✗</text>
  <rect x="488.0" y="25.0" width="64" height="22" rx="11.0" fill="#bc8cff" fill-opacity=".16" stroke="#bc8cff" stroke-opacity=".6"/>
  <text x="520" y="40.5" font-size="12.5" fill="#d2a8ff" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">sp3</text>
  <line x1="520" y1="48" x2="520" y2="76" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <rect x="454" y="80" width="132" height="38" rx="8" fill="#f85149" fill-opacity="0.12" stroke="#f85149" stroke-opacity="0.7"/>
  <text x="520" y="104" font-size="14" fill="#e6edf3" font-weight="600" text-anchor="middle">Keyboard</text>
  <text x="520" y="146" font-size="17" fill="#ff7b72" font-weight="700" text-anchor="middle">✗</text>
  <line x1="186" y1="99" x2="254" y2="99" stroke="#8b949e" stroke-width="1.6"/>
  <line x1="386" y1="99" x2="454" y2="99" stroke="#8b949e" stroke-width="1.6"/>
  <line x1="320" y1="214" x2="320" y2="160" stroke="#d29922" stroke-width="1.8" marker-end="url(#a-amber)"/>
  <rect x="232" y="218" width="176" height="56" rx="8" fill="#d29922" fill-opacity="0.12" stroke="#d29922" stroke-opacity="0.7"/>
  <text x="320" y="240" font-size="12.5" fill="#e3b341" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">ROLLBACK TO sp1</text>
  <text x="320" y="262" font-size="12.5" fill="#c9d1d9" text-anchor="middle">(undoes #2 &amp; #3)</text>
  <line x1="520" y1="214" x2="520" y2="160" stroke="#d29922" stroke-width="1.8" marker-end="url(#a-amber)"/>
  <rect x="432" y="218" width="176" height="56" rx="8" fill="#d29922" fill-opacity="0.12" stroke="#d29922" stroke-opacity="0.7"/>
  <text x="520" y="240" font-size="12.5" fill="#e3b341" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">ROLLBACK TO sp2</text>
  <text x="520" y="262" font-size="12.5" fill="#c9d1d9" text-anchor="middle">(undoes #3 only)</text>
</svg>
