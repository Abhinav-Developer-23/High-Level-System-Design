<svg xmlns="http://www.w3.org/2000/svg" width="820" height="404" viewBox="0 0 820 404" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>DELETE under the hood</title>
  <desc>DELETE FROM events WHERE created_at &lt; '2025-02-18': MySQL scans the index for all matching rows (millions); for each row it writes the old row to the undo log, marks it deleted in the clustered index and every secondary index, and writes all changes to the redo log; after commit a background purge thread removes the dead rows; the freed space is not returned to the OS and needs OPTIMIZE TABLE, which rebuilds the entire table, to reclaim.</desc>
  <defs>
    <marker id="d228a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="819" height="403" rx="14" fill="#161b22" stroke="#30363d"/>

  <!-- statement -->
  <rect x="24" y="20" width="436" height="30" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="38" y="40" fill="#79c0ff" font-size="13" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">DELETE FROM events WHERE created_at &lt; '2025-02-18';</text>

  <line x1="58" y1="86" x2="58" y2="348" stroke="#30363d" stroke-width="2"/>

  <!-- step 1 -->
  <rect x="24" y="74" width="68" height="24" rx="12" fill="#1c2128" stroke="#484f58"/>
  <text x="58" y="90.5" fill="#c9d1d9" font-size="12" font-weight="700" text-anchor="middle">Step 1</text>
  <rect x="108" y="66" width="688" height="40" rx="10" fill="#1c2128" stroke="#30363d"/>
  <text x="126" y="91" fill="#e6edf3" font-size="13.5">MySQL scans the index to find <tspan font-weight="700">ALL</tspan> matching rows <tspan fill="#e3b341" font-weight="600">(millions)</tspan></text>
  <line x1="452" y1="106" x2="452" y2="120" stroke="#8b949e" stroke-width="1.5" marker-end="url(#d228a)"/>

  <!-- step 2 -->
  <rect x="24" y="172" width="68" height="24" rx="12" fill="#1c2128" stroke="#484f58"/>
  <text x="58" y="188.5" fill="#c9d1d9" font-size="12" font-weight="700" text-anchor="middle">Step 2</text>
  <rect x="108" y="122" width="688" height="124" rx="10" fill="#d29922" fill-opacity=".08" stroke="#d29922" stroke-opacity=".65"/>
  <text x="126" y="146" fill="#e3b341" font-size="13.5" font-weight="700">For EACH row:</text>
  <text x="150" y="170" fill="#c9d1d9" font-size="13">→ Write the old row to the <tspan fill="#e6edf3" font-weight="700" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="12.5">UNDO LOG</tspan> <tspan fill="#8b949e">(for rollback safety)</tspan></text>
  <text x="150" y="190" fill="#c9d1d9" font-size="13">→ Mark the row as deleted in the clustered index</text>
  <text x="150" y="210" fill="#c9d1d9" font-size="13">→ Mark the row as deleted in <tspan font-weight="700" fill="#e6edf3">EVERY</tspan> secondary index</text>
  <text x="150" y="230" fill="#c9d1d9" font-size="13">→ Write all changes to the <tspan fill="#e6edf3" font-weight="700" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="12.5">REDO LOG</tspan> <tspan fill="#8b949e">(for crash recovery)</tspan></text>
  <line x1="452" y1="246" x2="452" y2="260" stroke="#8b949e" stroke-width="1.5" marker-end="url(#d228a)"/>

  <!-- step 3 -->
  <rect x="24" y="270" width="68" height="24" rx="12" fill="#1c2128" stroke="#484f58"/>
  <text x="58" y="286.5" fill="#c9d1d9" font-size="12" font-weight="700" text-anchor="middle">Step 3</text>
  <rect x="108" y="262" width="688" height="40" rx="10" fill="#1c2128" stroke="#484f58" stroke-dasharray="6 4"/>
  <text x="126" y="287" fill="#e6edf3" font-size="13.5">After commit, a background <tspan font-weight="700">PURGE</tspan> thread <tspan fill="#e3b341">eventually</tspan> removes the dead rows</text>
  <line x1="452" y1="302" x2="452" y2="316" stroke="#8b949e" stroke-width="1.5" marker-end="url(#d228a)"/>

  <!-- step 4 -->
  <rect x="24" y="336" width="68" height="24" rx="12" fill="#f85149" fill-opacity=".12" stroke="#f85149" stroke-opacity=".6"/>
  <text x="58" y="352.5" fill="#ff7b72" font-size="12" font-weight="700" text-anchor="middle">Step 4</text>
  <rect x="108" y="318" width="688" height="62" rx="10" fill="#f85149" fill-opacity=".08" stroke="#f85149" stroke-opacity=".6"/>
  <text x="126" y="342" fill="#e6edf3" font-size="13.5">The freed space is <tspan fill="#ff7b72" font-weight="700">NOT</tspan> returned to the OS — it becomes "free space within the tablespace"</text>
  <text x="140" y="365" fill="#c9d1d9" font-size="13">→ You need <tspan fill="#79c0ff" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="12.5">OPTIMIZE TABLE</tspan> to reclaim it <tspan fill="#8b949e">(which rebuilds the entire table)</tspan></text>
</svg>
