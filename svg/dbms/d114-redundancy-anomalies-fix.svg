<svg xmlns="http://www.w3.org/2000/svg" width="620" height="150" viewBox="0 0 620 150" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Redundancy causes anomalies</title>
  <desc>Redundancy leads to anomalies, which lead to inconsistent data; the fix is to decompose so every fact is stored exactly once.</desc>
  <defs>
    <marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d29922"/></marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/></marker>
    <marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39c5cf"/></marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker>
    </defs>
  <rect x="0.5" y="0.5" width="619" height="149" rx="14" fill="#161b22" stroke="#30363d"/>
  <rect x="32" y="24" width="130" height="36" rx="8" fill="#d29922" fill-opacity="0.12" stroke="#d29922" stroke-opacity="0.65"/>
  <text x="97.0" y="46.68" fill="#e3b341" font-size="13" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">Redundancy</text>
  <line x1="166" y1="44" x2="204" y2="44" stroke="#f85149" stroke-width="1.6" marker-end="url(#a-red)"/>
  <rect x="210" y="24" width="126" height="36" rx="8" fill="#f85149" fill-opacity="0.12" stroke="#f85149" stroke-opacity="0.65"/>
  <text x="273.0" y="46.68" fill="#ff7b72" font-size="13" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">Anomalies</text>
  <line x1="340" y1="44" x2="378" y2="44" stroke="#f85149" stroke-width="1.6" marker-end="url(#a-red)"/>
  <rect x="384" y="24" width="200" height="36" rx="8" fill="#f85149" fill-opacity="0.12" stroke="#f85149" stroke-opacity="0.65"/>
  <text x="484.0" y="46.68" fill="#ff7b72" font-size="13" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">Inconsistent data</text>
  <path d="M97,64 V104 H150" fill="none" stroke="#3fb950" stroke-width="1.6" marker-end="url(#a-green)"/>
  <rect x="156" y="84" width="428" height="40" rx="9" fill="#3fb950" fill-opacity="0.12" stroke="#3fb950" stroke-opacity="0.65"/>
  <text x="176" y="109" fill="#c9d1d9" font-size="13.5"><tspan font-weight="700" fill="#56d364">Fix:</tspan> decompose so every fact is stored <tspan font-weight="700" fill="#56d364">EXACTLY ONCE</tspan></text>
