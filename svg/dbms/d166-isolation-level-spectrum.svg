<svg xmlns="http://www.w3.org/2000/svg" width="880" height="268" viewBox="0 0 880 268" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Isolation level spectrum</title>
  <desc>From READ UNCOMMITTED (fastest, least safe) to READ COMMITTED (default in Oracle/SQL Server) to REPEATABLE READ (default in MySQL/PostgreSQL) to SERIALIZABLE (slowest, safest). Left means more performance and less isolation; right means more safety and more isolation.</desc>
  <defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d29922"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39c5cf"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs>
  <rect x="0.5" y="0.5" width="879" height="267" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="24" y="40" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">ISOLATION LEVEL SPECTRUM</text>
  <linearGradient id="g166" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#f85149"/><stop offset=".35" stop-color="#d29922"/><stop offset=".65" stop-color="#58a6ff"/><stop offset="1" stop-color="#3fb950"/></linearGradient>
  <rect x="24" y="58" width="816" height="6" rx="3" fill="url(#g166)"/>
  <path d="M840,52 L856,61 L840,70 z" fill="#3fb950"/>
  <rect x="24" y="84" width="199" height="92" rx="10" fill="#f85149" fill-opacity="0.1" stroke="#f85149" stroke-opacity="0.6"/>
  <text x="123.5" y="112" fill="#ff7b72" font-size="13.5" font-weight="700" text-anchor="middle">READ UNCOMMITTED</text>
  <text x="123.5" y="138" fill="#c9d1d9" font-size="12.5" text-anchor="middle">(fastest,</text>
  <text x="123.5" y="156" fill="#c9d1d9" font-size="12.5" text-anchor="middle">least safe)</text>
  <rect x="235" y="84" width="199" height="92" rx="10" fill="#d29922" fill-opacity="0.1" stroke="#d29922" stroke-opacity="0.6"/>
  <text x="334.5" y="112" fill="#e3b341" font-size="13.5" font-weight="700" text-anchor="middle">READ COMMITTED</text>
  <text x="334.5" y="138" fill="#c9d1d9" font-size="12.5" text-anchor="middle">(default in</text>
  <text x="334.5" y="156" fill="#c9d1d9" font-size="12.5" text-anchor="middle">Oracle/SQL Srvr)</text>
  <rect x="446" y="84" width="199" height="92" rx="10" fill="#58a6ff" fill-opacity="0.1" stroke="#58a6ff" stroke-opacity="0.6"/>
  <text x="545.5" y="112" fill="#79c0ff" font-size="13.5" font-weight="700" text-anchor="middle">REPEATABLE READ</text>
  <text x="545.5" y="138" fill="#c9d1d9" font-size="12.5" text-anchor="middle">(default in</text>
  <text x="545.5" y="156" fill="#c9d1d9" font-size="12.5" text-anchor="middle">MySQL/PostgreSQL)</text>
  <rect x="657" y="84" width="199" height="92" rx="10" fill="#3fb950" fill-opacity="0.1" stroke="#3fb950" stroke-opacity="0.6"/>
  <text x="756.5" y="112" fill="#56d364" font-size="13.5" font-weight="700" text-anchor="middle">SERIALIZABLE</text>
  <text x="756.5" y="138" fill="#c9d1d9" font-size="12.5" text-anchor="middle">(slowest,</text>
  <text x="756.5" y="156" fill="#c9d1d9" font-size="12.5" text-anchor="middle">safest)</text>
  <line x1="110" y1="208" x2="30" y2="208" stroke="#d29922" stroke-width="1.6" marker-end="url(#a-amber)"/>
  <text x="118" y="213" fill="#e3b341" font-size="13" font-weight="600">More performance</text>
  <line x1="770" y1="208" x2="850" y2="208" stroke="#3fb950" stroke-width="1.6" marker-end="url(#a-green)"/>
  <text x="762" y="213" fill="#56d364" font-size="13" font-weight="600" text-anchor="end">More safety</text>
  <line x1="110" y1="236" x2="30" y2="236" stroke="#d29922" stroke-width="1.6" marker-end="url(#a-amber)"/>
  <text x="118" y="241" fill="#e3b341" font-size="13" font-weight="600">Less isolation</text>
  <line x1="770" y1="236" x2="850" y2="236" stroke="#3fb950" stroke-width="1.6" marker-end="url(#a-green)"/>
  <text x="762" y="241" fill="#56d364" font-size="13" font-weight="600" text-anchor="end">More isolation</text>
</svg>
