<svg xmlns="http://www.w3.org/2000/svg" width="820" height="344" viewBox="0 0 820 344" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>How the server builds a cursor</title>
  <desc>The server runs SELECT ... ORDER BY message_id DESC LIMIT 50, gets msg_200 down to msg_151, takes the last item msg_151, base64-encodes {"msg_id":"msg_151"} into eyJtc2dfaWQiOiJtc2dfMTUxIn0=, and returns data, next_cursor and has_more true to the client.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="819" height="343" rx="14" fill="#161b22" stroke="#30363d"/>

  <line x1="44" y1="44" x2="44" y2="236" stroke="#30363d" stroke-width="2"/>

  <!-- 1 -->
  <circle cx="44" cy="44" r="12" fill="#1c2128" stroke="#58a6ff"/>
  <text x="44" y="48" fill="#79c0ff" font-size="12" font-weight="700" text-anchor="middle">1</text>
  <text x="70" y="49" fill="#e6edf3" font-size="13.5" font-weight="600">Server runs:</text>
  <rect x="236" y="29" width="372" height="30" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="250" y="49" fill="#e6edf3" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">SELECT ... ORDER BY message_id DESC LIMIT 50</text>

  <!-- 2 -->
  <circle cx="44" cy="92" r="12" fill="#1c2128" stroke="#58a6ff"/>
  <text x="44" y="96" fill="#79c0ff" font-size="12" font-weight="700" text-anchor="middle">2</text>
  <text x="70" y="97" fill="#e6edf3" font-size="13.5" font-weight="600">Gets back:</text>
  <g font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="12" text-anchor="middle">
    <text x="242" y="97" fill="#8b949e" font-size="14">[</text>
    <rect x="254" y="80" width="76" height="24" rx="6" fill="#1c2128" stroke="#30363d"/>
    <text x="292" y="96" fill="#c9d1d9">msg_200</text>
    <rect x="338" y="80" width="76" height="24" rx="6" fill="#1c2128" stroke="#30363d"/>
    <text x="376" y="96" fill="#c9d1d9">msg_199</text>
    <text x="440" y="96" fill="#8b949e">...</text>
    <rect x="466" y="80" width="76" height="24" rx="6" fill="#d29922" fill-opacity=".16" stroke="#d29922"/>
    <text x="504" y="96" fill="#e3b341" font-weight="700">msg_151</text>
    <text x="554" y="97" fill="#8b949e" font-size="14">]</text>
  </g>

  <!-- 3 -->
  <circle cx="44" cy="140" r="12" fill="#1c2128" stroke="#58a6ff"/>
  <text x="44" y="144" fill="#79c0ff" font-size="12" font-weight="700" text-anchor="middle">3</text>
  <text x="70" y="145" fill="#e6edf3" font-size="13.5" font-weight="600">Takes the <tspan fill="#e3b341">LAST</tspan> item:</text>
  <rect x="236" y="128" width="76" height="24" rx="6" fill="#d29922" fill-opacity=".16" stroke="#d29922"/>
  <text x="274" y="144" fill="#e3b341" font-size="12" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">msg_151</text>

  <!-- 4 -->
  <circle cx="44" cy="188" r="12" fill="#1c2128" stroke="#58a6ff"/>
  <text x="44" y="192" fill="#79c0ff" font-size="12" font-weight="700" text-anchor="middle">4</text>
  <text x="70" y="193" fill="#e6edf3" font-size="13.5" font-weight="600">Encodes it:</text>
  <rect x="236" y="173" width="240" height="30" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="250" y="193" fill="#e6edf3" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">base64('{"msg_id":"msg_151"}')</text>
  <line x1="476" y1="188" x2="504" y2="188" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="508" y="173" width="250" height="30" rx="6" fill="#3fb950" fill-opacity=".10" stroke="#3fb950" stroke-opacity=".7"/>
  <text x="522" y="193" fill="#56d364" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">"eyJtc2dfaWQiOiJtc2dfMTUxIn0="</text>

  <!-- 5 -->
  <circle cx="44" cy="236" r="12" fill="#1c2128" stroke="#3fb950"/>
  <text x="44" y="240" fill="#56d364" font-size="12" font-weight="700" text-anchor="middle">5</text>
  <text x="70" y="241" fill="#e6edf3" font-size="13.5" font-weight="600">Returns to client:</text>
  <rect x="236" y="222" width="440" height="98" rx="8" fill="#0d1117" stroke="#30363d"/>
  <g font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="12" fill="#e6edf3">
    <text x="250" y="242">{</text>
    <text x="250" y="260">&#160;&#160;<tspan fill="#79c0ff">"data"</tspan>: [ <tspan fill="#8b949e">... 50 rows ...</tspan> ],</text>
    <text x="250" y="278">&#160;&#160;<tspan fill="#79c0ff">"next_cursor"</tspan>: <tspan fill="#56d364">"eyJtc2dfaWQiOiJtc2dfMTUxIn0="</tspan>,</text>
    <text x="250" y="296">&#160;&#160;<tspan fill="#79c0ff">"has_more"</tspan>: <tspan fill="#56d364">true</tspan></text>
    <text x="250" y="314">}</text>
  </g>
</svg>
