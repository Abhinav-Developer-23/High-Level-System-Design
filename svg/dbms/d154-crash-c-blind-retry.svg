<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Crash C: blind retry double-debits</title>
  <desc>Client sends COMMIT (debit 100). DB fsyncs (committed on disk) then crashes before sending OK. Client sees connection reset, thinks "failed, let me retry", sends COMMIT (debit 100) again; it commits again and 200 is debited.</desc>
  <defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d29922"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39c5cf"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs>
  <rect x="0.5" y="0.5" width="819" height="329" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="90" y="40" fill="#8b949e" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.5">CLIENT</text>
  <text x="420" y="40" fill="#8b949e" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.5">DB</text>
  <line x1="24" y1="54" x2="796" y2="54" stroke="#30363d" stroke-width="1"/>
  <line x1="90" y1="64" x2="90" y2="306" stroke="#30363d" stroke-width="2" stroke-dasharray="4 5"/>
  <line x1="420" y1="64" x2="420" y2="306" stroke="#30363d" stroke-width="2" stroke-dasharray="4 5"/>
  <text x="255.0" y="90" fill="#79c0ff" font-size="12.5" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">COMMIT (debit ₹100)</text>
  <line x1="90" y1="100" x2="416" y2="100" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <rect x="436" y="84" width="290" height="32" rx="8" fill="#3fb950" fill-opacity="0.12" stroke="#3fb950" stroke-opacity="0.6"/>
  <text x="452" y="105" fill="#c9d1d9" font-size="13"><tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none" fill="#e6edf3">fsync()</tspan><tspan fill="#56d364" font-weight="700"> ✔</tspan><tspan fill="#56d364" font-weight="600">  → committed on disk</tspan></text>
  <circle cx="420" cy="146" r="11" fill="#f85149" fill-opacity=".2" stroke="#f85149"/>
  <text x="420" y="151" fill="#ff7b72" font-size="13" font-weight="700" text-anchor="middle">✗</text>
  <rect x="436" y="130" width="216" height="32" rx="8" fill="#f85149" fill-opacity="0.14" stroke="#f85149" stroke-opacity="0.7"/>
  <text x="452" y="151" fill="#c9d1d9" font-size="13"><tspan fill="#ff7b72" font-weight="700">CRASH</tspan><tspan fill="#e6edf3"> before sending OK</tspan></text>
  <text x="255.0" y="184" fill="#ff7b72" font-size="13" font-weight="600" text-anchor="middle">connection reset</text>
  <line x1="420" y1="194" x2="94" y2="194" stroke="#f85149" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a-red)"/>
  <rect x="104" y="216" width="300" height="34" rx="8" fill="#d29922" fill-opacity="0.12" stroke="#d29922" stroke-opacity="0.6"/>
  <text x="118" y="238" fill="#c9d1d9" font-size="13"><tspan fill="#e3b341" font-weight="600">Client thinks: </tspan><tspan fill="#e6edf3">"failed, let me retry"</tspan></text>
  <text x="255.0" y="280" fill="#e3b341" font-size="12.5" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">COMMIT (debit ₹100)</text>
  <line x1="90" y1="290" x2="416" y2="290" stroke="#d29922" stroke-width="1.6" marker-end="url(#a-amber)"/>
  <rect x="436" y="274" width="316" height="32" rx="8" fill="#f85149" fill-opacity="0.14" stroke="#f85149" stroke-opacity="0.7"/>
  <text x="452" y="295" fill="#c9d1d9" font-size="13"><tspan fill="#ff7b72" font-weight="700">committed AGAIN</tspan><tspan fill="#e6edf3">  → ₹200 debited </tspan><tspan fill="#ff7b72" font-weight="700">✗</tspan></text>
</svg>
