<svg xmlns="http://www.w3.org/2000/svg" width="860" height="332" viewBox="0 0 860 332" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Timestamp ordering: read rule</title>
  <desc>Read by Ti: if TS(Ti) &lt; W-TS(X), Ti is trying to read a value written by a later transaction, so reject (roll back Ti and restart with a new timestamp). If TS(Ti) &gt;= W-TS(X), allow the read and set R-TS(X) = max(R-TS(X), TS(Ti)). Abbreviations: TS(Ti) = Timestamp of transaction Ti (when Ti started; smaller = older); W-TS(X) = Write Timestamp of data item X (TS of the youngest transaction that has written X); R-TS(X) = Read Timestamp of data item X (TS of the youngest transaction that has read X).</desc>
  <defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d29922"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39c5cf"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs>
  <rect x="0.5" y="0.5" width="859" height="331" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="24" y="40" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">READ OPERATION BY Ti</text>
  <rect x="24" y="56" width="400" height="204" rx="12" fill="#1c2128" stroke="#30363d"/>
  <path d="M24,68 a12,12 0 0 1 12,-12 h376 a12,12 0 0 1 12,12 v60 h-400 z" fill="#f85149" fill-opacity=".14" stroke="#f85149" stroke-opacity=".6"/>
  <text x="42" y="80" fill="#ff7b72" font-size="14" font-weight="600"><tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none" fill="#ff7b72">If TS(Ti) &lt; W-TS(X):</tspan></text>
  <text x="42" y="101" fill="#8b949e" font-size="12">Timestamp of Ti &lt; Write Timestamp of X</text>
  <text x="42" y="118" fill="#8b949e" font-size="12">→ Ti is older than X's last writer</text>
  <text x="44" y="156" fill="#c9d1d9" font-size="13">→ Ti is trying to read a value written</text>
  <text x="60" y="176" fill="#c9d1d9" font-size="13">by a <tspan fill="#e6edf3" font-weight="700">LATER</tspan> transaction</text>
  <rect x="44" y="192" width="360" height="50" rx="8" fill="#f85149" fill-opacity="0.14" stroke="#f85149" stroke-opacity="0.7"/>
  <text x="60" y="213" fill="#c9d1d9" font-size="13.5"><tspan fill="#ff7b72" font-weight="700">→ REJECT</tspan></text>
  <text x="60" y="232" fill="#c9d1d9" font-size="12.5">(rollback Ti and restart with new timestamp)</text>
  <rect x="436" y="56" width="400" height="204" rx="12" fill="#1c2128" stroke="#30363d"/>
  <path d="M436,68 a12,12 0 0 1 12,-12 h376 a12,12 0 0 1 12,12 v60 h-400 z" fill="#3fb950" fill-opacity=".14" stroke="#3fb950" stroke-opacity=".6"/>
  <text x="454" y="80" fill="#56d364" font-size="14" font-weight="600"><tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none" fill="#56d364">If TS(Ti) &gt;= W-TS(X):</tspan></text>
  <text x="454" y="101" fill="#8b949e" font-size="12">Timestamp of Ti ≥ Write Timestamp of X</text>
  <text x="454" y="118" fill="#8b949e" font-size="12">→ Ti is not older than X's last writer</text>
  <rect x="456" y="140" width="360" height="34" rx="8" fill="#3fb950" fill-opacity="0.14" stroke="#3fb950" stroke-opacity="0.7"/>
  <text x="472" y="162" fill="#56d364" font-size="13.5" font-weight="700">→ ALLOW the read</text>
  <text x="456" y="206" fill="#c9d1d9" font-size="13">→ Update <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none" fill="#79c0ff">R-TS(X) = max(R-TS(X), TS(Ti))</tspan></text>
  <rect x="24" y="276" width="812" height="32" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="40" y="296.5" font-size="12" fill="#8b949e"><tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" fill="#79c0ff">TS(Ti)</tspan> = Timestamp of transaction Ti<tspan fill="#484f58">&#160;&#160;&#160;·&#160;&#160;&#160;</tspan><tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" fill="#79c0ff">W-TS(X)</tspan> = Write Timestamp of X<tspan fill="#484f58">&#160;&#160;&#160;·&#160;&#160;&#160;</tspan><tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" fill="#79c0ff">R-TS(X)</tspan> = Read Timestamp of X</text>
</svg>
