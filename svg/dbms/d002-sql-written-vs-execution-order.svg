<svg xmlns="http://www.w3.org/2000/svg" width="640" height="392" viewBox="0 0 640 392" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>SQL written vs execution order</title>
  <desc>Clauses in written order (SELECT, FROM, WHERE, GROUP BY, HAVING, ORDER BY, LIMIT) mapped to logical execution order: 1 FROM and JOINs, 2 WHERE, 3 GROUP BY, 4 HAVING, 5 SELECT / DISTINCT, 6 ORDER BY, 7 LIMIT.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d29922"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="639" height="391" rx="14" fill="#161b22" stroke="#30363d"/>

  <text x="130" y="40" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">WRITTEN ORDER</text>
  <text x="500" y="40" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">EXECUTION ORDER</text>
  <line x1="24" y1="54" x2="616" y2="54" stroke="#30363d"/>

  <!-- connectors (written row -> execution row) -->
  <g fill="none" stroke="#8b949e" stroke-width="1.5">
    <path d="M220,130 C310,130 310,86 396,86" marker-end="url(#arr)"/>
    <path d="M220,174 C310,174 310,130 396,130" marker-end="url(#arr)"/>
    <path d="M220,218 C310,218 310,174 396,174" marker-end="url(#arr)"/>
    <path d="M220,262 C310,262 310,218 396,218" marker-end="url(#arr)"/>
    <path d="M220,306 L396,306" marker-end="url(#arr)"/>
    <path d="M220,350 L396,350" marker-end="url(#arr)"/>
  </g>
  <path d="M220,86 C320,86 300,262 396,262" fill="none" stroke="#d29922" stroke-width="2" marker-end="url(#arrA)"/>

  <!-- written order -->
  <g font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="13" fill="#79c0ff">
    <rect x="40" y="70" width="180" height="32" rx="8" fill="#d29922" fill-opacity=".12" stroke="#d29922"/>
    <text x="58" y="91" fill="#e3b341" font-weight="700">SELECT</text>
    <rect x="40" y="114" width="180" height="32" rx="8" fill="#1c2128" stroke="#30363d"/>
    <text x="58" y="135">FROM</text>
    <rect x="40" y="158" width="180" height="32" rx="8" fill="#1c2128" stroke="#30363d"/>
    <text x="58" y="179">WHERE</text>
    <rect x="40" y="202" width="180" height="32" rx="8" fill="#1c2128" stroke="#30363d"/>
    <text x="58" y="223">GROUP BY</text>
    <rect x="40" y="246" width="180" height="32" rx="8" fill="#1c2128" stroke="#30363d"/>
    <text x="58" y="267">HAVING</text>
    <rect x="40" y="290" width="180" height="32" rx="8" fill="#1c2128" stroke="#30363d"/>
    <text x="58" y="311">ORDER BY</text>
    <rect x="40" y="334" width="180" height="32" rx="8" fill="#1c2128" stroke="#30363d"/>
    <text x="58" y="355">LIMIT</text>
  </g>

  <!-- execution order -->
  <g font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="13" fill="#e6edf3">
    <rect x="400" y="70" width="200" height="32" rx="8" fill="#1c2128" stroke="#58a6ff" stroke-opacity=".6"/>
    <rect x="400" y="114" width="200" height="32" rx="8" fill="#1c2128" stroke="#58a6ff" stroke-opacity=".6"/>
    <rect x="400" y="158" width="200" height="32" rx="8" fill="#1c2128" stroke="#58a6ff" stroke-opacity=".6"/>
    <rect x="400" y="202" width="200" height="32" rx="8" fill="#1c2128" stroke="#58a6ff" stroke-opacity=".6"/>
    <rect x="400" y="246" width="200" height="32" rx="8" fill="#d29922" fill-opacity=".12" stroke="#d29922"/>
    <rect x="400" y="290" width="200" height="32" rx="8" fill="#1c2128" stroke="#58a6ff" stroke-opacity=".6"/>
    <rect x="400" y="334" width="200" height="32" rx="8" fill="#1c2128" stroke="#58a6ff" stroke-opacity=".6"/>
    <g fill="#58a6ff" fill-opacity=".2" stroke="#58a6ff">
      <circle cx="422" cy="86" r="11"/>
      <circle cx="422" cy="130" r="11"/>
      <circle cx="422" cy="174" r="11"/>
      <circle cx="422" cy="218" r="11"/>
      <circle cx="422" cy="306" r="11"/>
      <circle cx="422" cy="350" r="11"/>
    </g>
    <circle cx="422" cy="262" r="11" fill="#d29922" fill-opacity=".25" stroke="#d29922"/>
    <g font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#79c0ff">
      <text x="422" y="90">1</text>
      <text x="422" y="134">2</text>
      <text x="422" y="178">3</text>
      <text x="422" y="222">4</text>
      <text x="422" y="266" fill="#e3b341">5</text>
      <text x="422" y="310">6</text>
      <text x="422" y="354">7</text>
    </g>
    <text x="442" y="91">FROM (&amp; JOINs)</text>
    <text x="442" y="135">WHERE</text>
    <text x="442" y="179">GROUP BY</text>
    <text x="442" y="223">HAVING</text>
    <text x="442" y="267" fill="#e3b341" font-weight="700">SELECT / DISTINCT</text>
    <text x="442" y="311">ORDER BY</text>
    <text x="442" y="355">LIMIT</text>
  </g>
</svg>
