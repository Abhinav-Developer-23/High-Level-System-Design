<svg xmlns="http://www.w3.org/2000/svg" width="600" height="162" viewBox="0 0 600 162" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Trivial functional dependency</title>
  <desc>Trivial FD: {roll_no, name} → name. Y is a subset of X (X contains Y), so the dependency is trivial.</desc>
  <defs>
    <marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d29922"/></marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/></marker>
    <marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39c5cf"/></marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker>
    </defs>
  <rect x="0.5" y="0.5" width="599" height="161" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="32" y="38" fill="#e6edf3" font-size="15" font-weight="600">Trivial FD:</text>
  <text x="125.0" y="66" fill="#8b949e" font-size="12" font-weight="700" text-anchor="middle">X</text>
  <rect x="40" y="74" width="170" height="36" rx="8" fill="#58a6ff" fill-opacity="0.12" stroke="#58a6ff" stroke-opacity="0.65"/>
  <text x="125.0" y="96.68" fill="#e6edf3" font-size="13" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">roll_no, <tspan fill="#e3b341">name</tspan></text>
  <line x1="210" y1="92" x2="266" y2="92" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <rect x="272" y="74" width="62" height="36" rx="8" fill="#d29922" fill-opacity="0.12" stroke="#d29922" stroke-opacity="0.65"/>
  <text x="303.0" y="96.68" fill="#e3b341" font-size="13" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">name</text>
  <text x="303.0" y="66" fill="#8b949e" font-size="12" font-weight="700" text-anchor="middle">Y</text>
  <text x="362" y="97" fill="#e3b341" font-size="14" font-weight="700">Y ⊆ X → Trivial!</text>
  <text x="125.0" y="138" fill="#8b949e" font-size="12.5" text-anchor="middle">X contains Y</text>
</svg>
