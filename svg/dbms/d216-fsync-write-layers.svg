<svg xmlns="http://www.w3.org/2000/svg" width="740" height="448" viewBox="0 0 740 448" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Layers a write must cross</title>
  <desc>Database process (volatile) → write() returns in microseconds, not durable → OS page cache in kernel RAM (volatile) → fsync() blocks until done → disk write-back cache in controller DRAM (volatile unless power-loss protected) → FLUSH CACHE / FUA → persistent media (NAND / platters), which survives power loss.</desc>
  <defs>
    <marker id="d216a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
    <marker id="d216g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="739" height="447" rx="14" fill="#161b22" stroke="#30363d"/>

  <!-- L1 -->
  <rect x="40" y="24" width="420" height="46" rx="10" fill="#bc8cff" fill-opacity=".10" stroke="#bc8cff" stroke-opacity=".6"/>
  <text x="58" y="52" fill="#e6edf3" font-size="14" font-weight="600">Database process <tspan fill="#8b949e" font-weight="400" font-size="13">(buffer pool, log buf)</tspan></text>
  <line x1="500" y1="47" x2="466" y2="47" stroke="#484f58" stroke-width="1.3" marker-end="url(#d216a)"/>
  <rect x="504" y="36" width="90" height="22" rx="11" fill="#f85149" fill-opacity=".12" stroke="#f85149" stroke-opacity=".55"/>
  <text x="549" y="51" fill="#ff7b72" font-size="12" font-weight="600" text-anchor="middle">volatile</text>

  <line x1="250" y1="70" x2="250" y2="124" stroke="#8b949e" stroke-width="1.5" marker-end="url(#d216a)"/>
  <text x="264" y="102" fill="#c9d1d9" font-size="13"><tspan fill="#79c0ff" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">write()</tspan>   → returns in ~µs, <tspan fill="#ff7b72" font-weight="700">NOT durable</tspan></text>

  <!-- L2 -->
  <rect x="40" y="126" width="420" height="46" rx="10" fill="#bc8cff" fill-opacity=".10" stroke="#bc8cff" stroke-opacity=".6"/>
  <text x="58" y="154" fill="#e6edf3" font-size="14" font-weight="600">OS Page Cache <tspan fill="#8b949e" font-weight="400" font-size="13">(kernel RAM)</tspan></text>
  <line x1="500" y1="149" x2="466" y2="149" stroke="#484f58" stroke-width="1.3" marker-end="url(#d216a)"/>
  <rect x="504" y="138" width="90" height="22" rx="11" fill="#f85149" fill-opacity=".12" stroke="#f85149" stroke-opacity=".55"/>
  <text x="549" y="153" fill="#ff7b72" font-size="12" font-weight="600" text-anchor="middle">volatile</text>

  <line x1="250" y1="172" x2="250" y2="226" stroke="#8b949e" stroke-width="1.5" marker-end="url(#d216a)"/>
  <text x="264" y="204" fill="#c9d1d9" font-size="13"><tspan fill="#79c0ff" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">fsync()</tspan>   → <tspan fill="#e3b341" font-weight="700">BLOCKS until done</tspan></text>
  <circle cx="476" cy="199" r="7.5" fill="none" stroke="#d29922" stroke-width="1.5"/>
  <line x1="476" y1="199" x2="476" y2="194" stroke="#d29922" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="476" y1="199" x2="480" y2="201" stroke="#d29922" stroke-width="1.5" stroke-linecap="round"/>

  <!-- L3 -->
  <rect x="40" y="228" width="420" height="46" rx="10" fill="#d29922" fill-opacity=".08" stroke="#d29922" stroke-opacity=".6"/>
  <text x="58" y="256" fill="#e6edf3" font-size="14" font-weight="600">Disk write-back cache <tspan fill="#8b949e" font-weight="400" font-size="13">(controller DRAM)</tspan></text>
  <line x1="500" y1="251" x2="466" y2="251" stroke="#484f58" stroke-width="1.3" marker-end="url(#d216a)"/>
  <rect x="504" y="240" width="96" height="22" rx="11" fill="#d29922" fill-opacity=".14" stroke="#d29922" stroke-opacity=".6"/>
  <text x="552" y="255" fill="#e3b341" font-size="12" font-weight="600" text-anchor="middle">volatile*</text>

  <line x1="250" y1="274" x2="250" y2="328" stroke="#3fb950" stroke-width="1.5" marker-end="url(#d216g)"/>
  <text x="264" y="306" fill="#79c0ff" font-size="12.5" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">FLUSH CACHE / FUA command</text>

  <!-- L4 -->
  <rect x="40" y="330" width="420" height="46" rx="10" fill="#3fb950" fill-opacity=".14" stroke="#3fb950" stroke-opacity=".85"/>
  <text x="58" y="358" fill="#e6edf3" font-size="14" font-weight="600">Persistent media <tspan fill="#8b949e" font-weight="400" font-size="13">(NAND / platters)</tspan></text>
  <line x1="500" y1="353" x2="466" y2="353" stroke="#3fb950" stroke-opacity=".7" stroke-width="1.3" marker-end="url(#d216g)"/>
  <rect x="504" y="342" width="196" height="22" rx="11" fill="#3fb950" fill-opacity=".16" stroke="#3fb950" stroke-opacity=".75"/>
  <text x="602" y="357" fill="#56d364" font-size="12" font-weight="700" text-anchor="middle">✓ SURVIVES POWER LOSS</text>

  <!-- footnote -->
  <line x1="40" y1="394" x2="700" y2="394" stroke="#21262d"/>
  <text x="40" y="414" fill="#8b949e" font-size="12.5"><tspan fill="#e3b341" font-weight="700">*</tspan> unless the drive has battery- or capacitor-backed cache</text>
  <text x="52" y="432" fill="#8b949e" font-size="12.5">(power-loss protection), in which case it is effectively durable</text>
</svg>
