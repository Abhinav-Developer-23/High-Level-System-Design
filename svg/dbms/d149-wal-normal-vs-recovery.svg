<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>WAL normal operation and recovery</title>
  <desc>Normal operation: App writes to the WAL log on disk first, then to the database on disk second. After a crash, recovery reads the log, replays (redoes) committed changes and undoes uncommitted changes in the database.</desc>
  <defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d29922"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39c5cf"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs>
  <rect x="0.5" y="0.5" width="719" height="379" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="24" y="38" font-size="12" fill="#8b949e" font-weight="700" letter-spacing="1.5">NORMAL OPERATION</text>
  <rect x="24" y="54" width="120" height="52" rx="10" fill="#58a6ff" fill-opacity="0.12" stroke="#58a6ff" stroke-opacity="0.7"/>
  <text x="84.0" y="85" font-size="14" fill="#e6edf3" font-weight="600" text-anchor="middle">App</text>
  <line x1="148" y1="80" x2="214" y2="80" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <rect x="220" y="54" width="170" height="52" rx="10" fill="#39c5cf" fill-opacity="0.12" stroke="#39c5cf" stroke-opacity="0.7"/>
  <text x="305.0" y="77" font-size="14" fill="#e6edf3" font-weight="600" text-anchor="middle">WAL Log</text>
  <text x="305.0" y="96" font-size="12" fill="#56d4dd" text-anchor="middle">(disk)</text>
  <line x1="394" y1="80" x2="460" y2="80" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <rect x="466" y="54" width="170" height="52" rx="10" fill="#39c5cf" fill-opacity="0.12" stroke="#39c5cf" stroke-opacity="0.7"/>
  <text x="551.0" y="77" font-size="14" fill="#e6edf3" font-weight="600" text-anchor="middle">Database</text>
  <text x="551.0" y="96" font-size="12" fill="#56d4dd" text-anchor="middle">(disk)</text>
  <rect x="250.0" y="117.0" width="110" height="22" rx="11.0" fill="#3fb950" fill-opacity=".16" stroke="#3fb950" stroke-opacity=".6"/>
  <text x="305" y="132.32" font-size="12" fill="#56d364" font-weight="600" text-anchor="middle">Write FIRST</text>
  <rect x="489.0" y="117.0" width="124" height="22" rx="11.0" fill="#58a6ff" fill-opacity=".16" stroke="#58a6ff" stroke-opacity=".6"/>
  <text x="551" y="132.32" font-size="12" fill="#79c0ff" font-weight="600" text-anchor="middle">Write SECOND</text>
  <line x1="24" y1="162" x2="696" y2="162" stroke="#21262d" stroke-width="1"/>
  <text x="24" y="194" font-size="12" fill="#e3b341" font-weight="700" letter-spacing="1.5">AFTER CRASH + RECOVERY</text>
  <rect x="220" y="210" width="170" height="52" rx="10" fill="#39c5cf" fill-opacity="0.12" stroke="#39c5cf" stroke-opacity="0.7"/>
  <text x="305.0" y="233" font-size="14" fill="#e6edf3" font-weight="600" text-anchor="middle">WAL Log</text>
  <text x="305.0" y="252" font-size="12" fill="#56d4dd" text-anchor="middle">(disk)</text>
  <line x1="394" y1="236" x2="460" y2="236" stroke="#d29922" stroke-width="1.8" marker-end="url(#a-amber)"/>
  <rect x="466" y="210" width="170" height="52" rx="10" fill="#39c5cf" fill-opacity="0.12" stroke="#39c5cf" stroke-opacity="0.7"/>
  <text x="551.0" y="233" font-size="14" fill="#e6edf3" font-weight="600" text-anchor="middle">Database</text>
  <text x="551.0" y="252" font-size="12" fill="#56d4dd" text-anchor="middle">(disk)</text>
  <rect x="259.0" y="277.0" width="92" height="22" rx="11.0" fill="#d29922" fill-opacity=".16" stroke="#d29922" stroke-opacity=".6"/>
  <text x="305" y="292.32" font-size="12" fill="#e3b341" font-weight="600" text-anchor="middle">Read log</text>
  <rect x="420" y="276" width="262" height="74" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="436" y="302" font-size="13" fill="#56d364" font-weight="600">↻  Replay (redo) committed changes</text>
  <text x="436" y="330" font-size="13" fill="#e3b341" font-weight="600">↶  Undo uncommitted changes</text>
</svg>
