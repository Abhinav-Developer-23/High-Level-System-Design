<svg xmlns="http://www.w3.org/2000/svg" width="640" height="386" viewBox="0 0 640 386" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Is the view updatable?</title>
  <desc>A view is updatable only if it uses a single table, has no GROUP BY/HAVING, no DISTINCT and no aggregates. Failing any check means it is not updatable.</desc>
  <defs>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="639" height="385" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="40" y="38" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">UPDATABLE VIEW?</text>
  <rect x="40" y="58" width="260" height="40" rx="10" fill="#1c2128" stroke="#30363d"/>
  <text x="58" y="83.0" fill="#e6edf3" font-size="14" font-weight="600">Single table?</text>
  <line x1="300" y1="78.0" x2="406" y2="78.0" stroke="#f85149" stroke-width="1.6" marker-end="url(#arrR)"/>
  <text x="353" y="71.0" fill="#ff7b72" font-size="12" font-weight="700" text-anchor="middle">No</text>
  <rect x="410" y="62" width="180" height="32" rx="16.0" fill="#f85149" fill-opacity=".12" stroke="#f85149" stroke-opacity=".6"/>
  <text x="500" y="82.5" fill="#ff7b72" font-size="13" font-weight="600" text-anchor="middle">✗ Not updatable</text>
  <line x1="170" y1="98" x2="170" y2="120" stroke="#3fb950" stroke-width="1.6" marker-end="url(#arrG)"/>
  <text x="182" y="116" fill="#56d364" font-size="12" font-weight="700">Yes</text>
  <rect x="40" y="124" width="260" height="40" rx="10" fill="#1c2128" stroke="#30363d"/>
  <text x="58" y="149.0" fill="#e6edf3" font-size="14" font-weight="600">No <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" fill="#79c0ff">GROUP BY</tspan>/<tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" fill="#79c0ff">HAVING</tspan>?</text>
  <line x1="300" y1="144.0" x2="406" y2="144.0" stroke="#f85149" stroke-width="1.6" marker-end="url(#arrR)"/>
  <text x="353" y="137.0" fill="#ff7b72" font-size="12" font-weight="700" text-anchor="middle">No</text>
  <rect x="410" y="128" width="180" height="32" rx="16.0" fill="#f85149" fill-opacity=".12" stroke="#f85149" stroke-opacity=".6"/>
  <text x="500" y="148.5" fill="#ff7b72" font-size="13" font-weight="600" text-anchor="middle">✗ Not updatable</text>
  <line x1="170" y1="164" x2="170" y2="186" stroke="#3fb950" stroke-width="1.6" marker-end="url(#arrG)"/>
  <text x="182" y="182" fill="#56d364" font-size="12" font-weight="700">Yes</text>
  <rect x="40" y="190" width="260" height="40" rx="10" fill="#1c2128" stroke="#30363d"/>
  <text x="58" y="215.0" fill="#e6edf3" font-size="14" font-weight="600">No <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" fill="#79c0ff">DISTINCT</tspan>?</text>
  <line x1="300" y1="210.0" x2="406" y2="210.0" stroke="#f85149" stroke-width="1.6" marker-end="url(#arrR)"/>
  <text x="353" y="203.0" fill="#ff7b72" font-size="12" font-weight="700" text-anchor="middle">No</text>
  <rect x="410" y="194" width="180" height="32" rx="16.0" fill="#f85149" fill-opacity=".12" stroke="#f85149" stroke-opacity=".6"/>
  <text x="500" y="214.5" fill="#ff7b72" font-size="13" font-weight="600" text-anchor="middle">✗ Not updatable</text>
  <line x1="170" y1="230" x2="170" y2="252" stroke="#3fb950" stroke-width="1.6" marker-end="url(#arrG)"/>
  <text x="182" y="248" fill="#56d364" font-size="12" font-weight="700">Yes</text>
  <rect x="40" y="256" width="260" height="40" rx="10" fill="#1c2128" stroke="#30363d"/>
  <text x="58" y="281.0" fill="#e6edf3" font-size="14" font-weight="600">No aggregates?</text>
  <line x1="300" y1="276.0" x2="406" y2="276.0" stroke="#f85149" stroke-width="1.6" marker-end="url(#arrR)"/>
  <text x="353" y="269.0" fill="#ff7b72" font-size="12" font-weight="700" text-anchor="middle">No</text>
  <rect x="410" y="260" width="180" height="32" rx="16.0" fill="#f85149" fill-opacity=".12" stroke="#f85149" stroke-opacity=".6"/>
  <text x="500" y="280.5" fill="#ff7b72" font-size="13" font-weight="600" text-anchor="middle">✗ Not updatable</text>
  <line x1="170" y1="296" x2="170" y2="318" stroke="#3fb950" stroke-width="1.6" marker-end="url(#arrG)"/>
  <text x="182" y="314" fill="#56d364" font-size="12" font-weight="700">Yes</text>
  <rect x="40" y="322" width="260" height="40" rx="10" fill="#3fb950" fill-opacity=".14" stroke="#3fb950" stroke-opacity=".8"/>
  <text x="170" y="347.0" fill="#56d364" font-size="14.5" font-weight="700" text-anchor="middle">✓ Updatable!</text>
</svg>
