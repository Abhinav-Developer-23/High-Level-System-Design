<svg xmlns="http://www.w3.org/2000/svg" width="640" height="372" viewBox="0 0 640 372" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Database before and after seeding</title>
  <desc>After running migrations the users table exists with columns id, name, email but is empty. After seeding it holds Admin User, John Doe and Jane Smith with their emails.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="639" height="371" rx="14" fill="#161b22" stroke="#30363d"/>

  <text x="24" y="38" fill="#c9d1d9" font-size="13">After running migrations, your database looks like this:</text>

  <!-- empty table -->
  <rect x="40" y="54" width="300" height="96" rx="8" fill="#1c2128" stroke="#d29922" stroke-opacity=".7"/>
  <text x="54" y="74" fill="#e6edf3" font-size="13" font-weight="700" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">users table</text>
  <line x1="40" y1="84" x2="340" y2="84" stroke="#30363d"/>
  <rect x="41" y="84" width="298" height="26" fill="#21262d"/>
  <line x1="40" y1="110" x2="340" y2="110" stroke="#30363d"/>
  <line x1="90" y1="84" x2="90" y2="110" stroke="#30363d"/>
  <line x1="180" y1="84" x2="180" y2="110" stroke="#30363d"/>
  <g font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="12" fill="#8b949e" font-weight="700">
    <text x="54" y="102">id</text>
    <text x="102" y="102">name</text>
    <text x="192" y="102">email</text>
  </g>
  <text x="190" y="135" fill="#8b949e" font-size="13" font-style="italic" text-anchor="middle">(empty)</text>
  <text x="356" y="135" fill="#e3b341" font-size="13" font-weight="600">← Tables exist but NO data!</text>

  <line x1="190" y1="156" x2="190" y2="186" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="24" y="208" fill="#c9d1d9" font-size="13">After seeding:</text>

  <!-- seeded table -->
  <rect x="40" y="220" width="440" height="132" rx="8" fill="#1c2128" stroke="#3fb950" stroke-opacity=".8"/>
  <text x="54" y="240" fill="#e6edf3" font-size="13" font-weight="700" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">users table</text>
  <line x1="40" y1="250" x2="480" y2="250" stroke="#30363d"/>
  <rect x="41" y="250" width="438" height="26" fill="#21262d"/>
  <line x1="40" y1="276" x2="480" y2="276" stroke="#30363d"/>
  <line x1="40" y1="301" x2="480" y2="301" stroke="#21262d"/>
  <line x1="40" y1="326" x2="480" y2="326" stroke="#21262d"/>
  <line x1="90" y1="250" x2="90" y2="352" stroke="#30363d"/>
  <line x1="220" y1="250" x2="220" y2="352" stroke="#30363d"/>
  <g font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="12">
    <text x="54" y="268" fill="#8b949e" font-weight="700">id</text>
    <text x="102" y="268" fill="#8b949e" font-weight="700">name</text>
    <text x="232" y="268" fill="#8b949e" font-weight="700">email</text>
    <text x="54" y="294" fill="#56d364">1</text>
    <text x="102" y="294" fill="#e6edf3">Admin User</text>
    <text x="232" y="294" fill="#c9d1d9">admin@example.com</text>
    <text x="54" y="319" fill="#56d364">2</text>
    <text x="102" y="319" fill="#e6edf3">John Doe</text>
    <text x="232" y="319" fill="#c9d1d9">john@example.com</text>
    <text x="54" y="344" fill="#56d364">3</text>
    <text x="102" y="344" fill="#e6edf3">Jane Smith</text>
    <text x="232" y="344" fill="#c9d1d9">jane@example.com</text>
  </g>
</svg>
