<svg xmlns="http://www.w3.org/2000/svg" width="720" height="156" viewBox="0 0 720 156" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Lock upgrade and downgrade</title>
  <desc>Upgrade: S-Lock to X-Lock (reader wants to write). Downgrade: X-Lock to S-Lock (writer done, allows readers).</desc>
  <defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d29922"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39c5cf"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs>
  <rect x="0.5" y="0.5" width="719" height="155" rx="14" fill="#161b22" stroke="#30363d"/>
  <rect x="24" y="24" width="672" height="48" rx="10" fill="#1c2128" stroke="#30363d"/>
  <text x="44" y="53" fill="#e6edf3" font-size="14" font-weight="600">Upgrade:</text>
  <rect x="144.0" y="35" width="92" height="26" rx="13.0" fill="#58a6ff" fill-opacity="0.14" stroke="#58a6ff" stroke-opacity="0.6"/>
  <text x="190" y="52.68" fill="#79c0ff" font-size="13" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">S-Lock</text>
  <line x1="240" y1="48" x2="296" y2="48" stroke="#8b949e" stroke-width="1.8" marker-end="url(#a-gray)"/>
  <rect x="302.0" y="35" width="92" height="26" rx="13.0" fill="#f0883e" fill-opacity="0.14" stroke="#f0883e" stroke-opacity="0.6"/>
  <text x="348" y="52.68" fill="#ffa657" font-size="13" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">X-Lock</text>
  <text x="420" y="53" fill="#8b949e" font-size="13">(reader wants to write)</text>
  <rect x="24" y="84" width="672" height="48" rx="10" fill="#1c2128" stroke="#30363d"/>
  <text x="44" y="113" fill="#e6edf3" font-size="14" font-weight="600">Downgrade:</text>
  <rect x="144.0" y="95" width="92" height="26" rx="13.0" fill="#f0883e" fill-opacity="0.14" stroke="#f0883e" stroke-opacity="0.6"/>
  <text x="190" y="112.68" fill="#ffa657" font-size="13" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">X-Lock</text>
  <line x1="240" y1="108" x2="296" y2="108" stroke="#8b949e" stroke-width="1.8" marker-end="url(#a-gray)"/>
  <rect x="302.0" y="95" width="92" height="26" rx="13.0" fill="#58a6ff" fill-opacity="0.14" stroke="#58a6ff" stroke-opacity="0.6"/>
  <text x="348" y="112.68" fill="#79c0ff" font-size="13" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">S-Lock</text>
  <text x="420" y="113" fill="#8b949e" font-size="13">(writer done, allows readers)</text>
</svg>
