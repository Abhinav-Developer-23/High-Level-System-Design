<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>WAL commit — happy path</title>
  <desc>Client sends UPDATE then COMMIT. The server changes the page in RAM, writes the redo log to the OS cache, fsyncs it to disk (durability point), replies COMMIT OK, and later flushes the data page.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/>
    </marker>
  </defs>

  <!-- card -->
  <rect x="0.5" y="0.5" width="899" height="639" rx="14" fill="#161b22" stroke="#30363d"/>

  <!-- headers -->
  <text x="50" y="40" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">CLIENT</text>
  <text x="500" y="40" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">DATABASE SERVER</text>
  <text x="795" y="40" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">WHERE IT LIVES</text>
  <line x1="24" y1="54" x2="876" y2="54" stroke="#30363d"/>

  <!-- client lifeline -->
  <line x1="50" y1="64" x2="50" y2="616" stroke="#30363d" stroke-width="2" stroke-dasharray="4 5"/>

  <!-- ===== Step 0 ===== -->
  <text font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="12" fill="#79c0ff">
    <tspan x="64" y="86">BEGIN;</tspan>
    <tspan x="64" y="102">UPDATE accounts</tspan>
    <tspan x="64" y="118">SET balance = balance - 100</tspan>
    <tspan x="64" y="134">WHERE id = 1;</tspan>
  </text>
  <line x1="50" y1="146" x2="304" y2="146" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="310" y="106" width="380" height="92" rx="10" fill="#1c2128" stroke="#30363d"/>
  <text x="328" y="132" fill="#e6edf3" font-size="14.5" font-weight="600"><tspan fill="#8b949e" font-family="Cascadia Code, Consolas, monospace">[0]</tspan>  Apply the change in memory only</text>
  <text x="340" y="158" fill="#c9d1d9" font-size="13">•  modify data page in <tspan font-weight="600" fill="#e6edf3">Buffer Pool</tspan></text>
  <text x="340" y="182" fill="#c9d1d9" font-size="13">•  add redo record to <tspan font-weight="600" fill="#e6edf3">Log Buffer</tspan></text>

  <rect x="740" y="144" width="110" height="22" rx="11" fill="#bc8cff" fill-opacity=".14" stroke="#bc8cff" stroke-opacity=".5"/>
  <text x="795" y="159" fill="#d2a8ff" font-size="12" font-weight="600" text-anchor="middle">RAM</text>
  <rect x="740" y="168" width="110" height="22" rx="11" fill="#bc8cff" fill-opacity=".14" stroke="#bc8cff" stroke-opacity=".5"/>
  <text x="795" y="183" fill="#d2a8ff" font-size="12" font-weight="600" text-anchor="middle">RAM</text>

  <!-- ===== Step 1 ===== -->
  <text x="64" y="246" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="12" fill="#79c0ff">COMMIT;</text>
  <line x1="50" y1="258" x2="304" y2="258" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="310" y="226" width="380" height="66" rx="10" fill="#1c2128" stroke="#30363d"/>
  <text x="328" y="252" fill="#e6edf3" font-size="14.5" font-weight="600"><tspan fill="#8b949e" font-family="Cascadia Code, Consolas, monospace">[1]</tspan>  <tspan font-family="Cascadia Code, Consolas, monospace">write()</tspan> redo records + COMMIT mark</text>
  <text x="340" y="276" fill="#c9d1d9" font-size="13">to the redo log file</text>

  <rect x="722" y="248" width="146" height="22" rx="11" fill="#d29922" fill-opacity=".14" stroke="#d29922" stroke-opacity=".6"/>
  <text x="795" y="263" fill="#e3b341" font-size="12" font-weight="600" text-anchor="middle">RAM · OS page cache !</text>

  <line x1="500" y1="292" x2="500" y2="320" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ===== Step 2 ===== -->
  <rect x="310" y="324" width="380" height="50" rx="10" fill="#3fb950" fill-opacity=".10" stroke="#3fb950" stroke-opacity=".7"/>
  <text x="328" y="354" fill="#e6edf3" font-size="14.5" font-weight="600"><tspan fill="#8b949e" font-family="Cascadia Code, Consolas, monospace">[2]</tspan>  <tspan font-family="Cascadia Code, Consolas, monospace">fsync()</tspan> the redo log</text>

  <rect x="740" y="338" width="110" height="22" rx="11" fill="#3fb950" fill-opacity=".16" stroke="#3fb950" stroke-opacity=".6"/>
  <text x="795" y="353" fill="#56d364" font-size="12" font-weight="600" text-anchor="middle">DISK ✓</text>

  <!-- durability point -->
  <line x1="24" y1="404" x2="876" y2="404" stroke="#3fb950" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="390" y="391" width="220" height="26" rx="13" fill="#161b22" stroke="#3fb950"/>
  <text x="500" y="409" fill="#56d364" font-size="12.5" font-weight="700" letter-spacing="1.2" text-anchor="middle">DURABILITY POINT</text>

  <line x1="500" y1="374" x2="500" y2="388" stroke="#8b949e" stroke-width="1.5"/>
  <line x1="500" y1="418" x2="500" y2="430" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ===== Step 3 ===== -->
  <rect x="310" y="434" width="380" height="50" rx="10" fill="#1c2128" stroke="#30363d"/>
  <text x="328" y="464" fill="#e6edf3" font-size="14.5" font-weight="600"><tspan fill="#8b949e" font-family="Cascadia Code, Consolas, monospace">[3]</tspan>  Acknowledge the client</text>
  <line x1="310" y1="459" x2="56" y2="459" stroke="#3fb950" stroke-width="1.8" marker-end="url(#arrG)"/>
  <text x="180" y="449" fill="#56d364" font-size="13" font-weight="700" text-anchor="middle">"COMMIT OK"</text>

  <!-- ===== Step 4 ===== -->
  <rect x="310" y="524" width="380" height="88" rx="10" fill="#1c2128" stroke="#484f58" stroke-dasharray="6 5"/>
  <text x="328" y="550" fill="#e6edf3" font-size="14.5" font-weight="600"><tspan fill="#8b949e" font-family="Cascadia Code, Consolas, monospace">[4]</tspan>  LATER <tspan fill="#8b949e" font-weight="400">(seconds to minutes)</tspan></text>
  <text x="340" y="574" fill="#c9d1d9" font-size="13">background page cleaner writes the dirty</text>
  <text x="340" y="594" fill="#c9d1d9" font-size="13">data page to the <tspan font-family="Cascadia Code, Consolas, monospace" fill="#79c0ff">.ibd</tspan> file</text>

  <rect x="740" y="557" width="110" height="22" rx="11" fill="#39c5cf" fill-opacity=".14" stroke="#39c5cf" stroke-opacity=".55"/>
  <text x="795" y="572" fill="#56d4dd" font-size="12" font-weight="600" text-anchor="middle">DISK</text>
</svg>
