<svg xmlns="http://www.w3.org/2000/svg" width="680" height="210" viewBox="0 0 680 210" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Types of SQL triggers</title>
  <desc>SQL triggers come in three types: DDL triggers (CREATE/ALTER/DROP), DML triggers (INSERT/UPDATE/DELETE) and Logon triggers (user login events).</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs>
  <rect x="0.5" y="0.5" width="679" height="209" rx="14" fill="#161b22" stroke="#30363d"/>
  <rect x="250" y="24" width="180" height="42" rx="10" fill="#f0883e" fill-opacity=".12" stroke="#f0883e" stroke-opacity=".75"/>
  <text x="340" y="50" fill="#ffa657" font-size="15" font-weight="700" text-anchor="middle">SQL Triggers</text>
  <path d="M340,66 V86 M120,86 H560" fill="none" stroke="#8b949e" stroke-width="1.6"/>
  <line x1="120" y1="86" x2="120" y2="110" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="20" y="114" width="200" height="72" rx="10" fill="#1c2128" stroke="#58a6ff" stroke-opacity=".7"/>
  <text x="120" y="143" fill="#e6edf3" font-size="14.5" font-weight="600" text-anchor="middle">DDL Triggers</text>
  <text x="120" y="168" fill="#c9d1d9" font-size="12" text-anchor="middle"><tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" fill="#79c0ff">CREATE / ALTER / DROP</tspan></text>
  <line x1="340" y1="86" x2="340" y2="110" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="240" y="114" width="200" height="72" rx="10" fill="#1c2128" stroke="#bc8cff" stroke-opacity=".7"/>
  <text x="340" y="143" fill="#e6edf3" font-size="14.5" font-weight="600" text-anchor="middle">DML Triggers</text>
  <text x="340" y="168" fill="#c9d1d9" font-size="12" text-anchor="middle"><tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" fill="#79c0ff">INSERT / UPDATE / DELETE</tspan></text>
  <line x1="560" y1="86" x2="560" y2="110" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="460" y="114" width="200" height="72" rx="10" fill="#1c2128" stroke="#39c5cf" stroke-opacity=".7"/>
  <text x="560" y="143" fill="#e6edf3" font-size="14.5" font-weight="600" text-anchor="middle">Logon Triggers</text>
  <text x="560" y="168" fill="#c9d1d9" font-size="12" text-anchor="middle">User login events</text>
</svg>
