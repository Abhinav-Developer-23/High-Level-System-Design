<svg xmlns="http://www.w3.org/2000/svg" width="820" height="252" viewBox="0 0 820 252" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Redundancy and inconsistency</title>
  <desc>Alice's address appears in three files: savings_accounts.txt says 12 MG Road, Pune; loan_accounts.txt says 12 M.G. Rd, Pune 411001; customer_mailing.csv says 45 FC Road, Pune because she moved and only that file was updated. Which address is correct? The database cannot tell you.</desc>
  <defs>
    <marker id="d221g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="819" height="251" rx="14" fill="#161b22" stroke="#30363d"/>

  <!-- row 1 -->
  <rect x="24" y="24" width="544" height="40" rx="8" fill="#1c2128" stroke="#30363d"/>
  <line x1="236" y1="24" x2="236" y2="64" stroke="#30363d"/><line x1="320" y1="24" x2="320" y2="64" stroke="#30363d"/>
  <text x="38" y="49" fill="#79c0ff" font-size="13" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">savings_accounts.txt</text>
  <text x="278" y="49" fill="#e6edf3" font-size="13.5" font-weight="600" text-anchor="middle">Alice</text>
  <text x="336" y="49" fill="#e3b341" font-size="13" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">12 MG Road, Pune</text>

  <!-- row 2 -->
  <rect x="24" y="74" width="544" height="40" rx="8" fill="#1c2128" stroke="#30363d"/>
  <line x1="236" y1="74" x2="236" y2="114" stroke="#30363d"/><line x1="320" y1="74" x2="320" y2="114" stroke="#30363d"/>
  <text x="38" y="99" fill="#79c0ff" font-size="13" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">loan_accounts.txt</text>
  <text x="278" y="99" fill="#e6edf3" font-size="13.5" font-weight="600" text-anchor="middle">Alice</text>
  <text x="336" y="99" fill="#e3b341" font-size="13" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">12 M.G. Rd, Pune 411001</text>

  <!-- row 3 -->
  <rect x="24" y="124" width="544" height="40" rx="8" fill="#3fb950" fill-opacity=".08" stroke="#3fb950" stroke-opacity=".6"/>
  <line x1="236" y1="124" x2="236" y2="164" stroke="#30363d"/><line x1="320" y1="124" x2="320" y2="164" stroke="#30363d"/>
  <text x="38" y="149" fill="#79c0ff" font-size="13" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">customer_mailing.csv</text>
  <text x="278" y="149" fill="#e6edf3" font-size="13.5" font-weight="600" text-anchor="middle">Alice</text>
  <text x="336" y="149" fill="#56d364" font-size="13" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">45 FC Road, Pune</text>
  <line x1="608" y1="144" x2="572" y2="144" stroke="#3fb950" stroke-width="1.5" marker-end="url(#d221g)"/>
  <text x="616" y="139" fill="#56d364" font-size="12.5" font-weight="600">she moved;</text>
  <text x="616" y="157" fill="#c9d1d9" font-size="12.5">only this one updated</text>

  <!-- question -->
  <rect x="24" y="186" width="772" height="44" rx="10" fill="#f85149" fill-opacity=".08" stroke="#f85149" stroke-opacity=".6"/>
  <text x="410" y="213" fill="#c9d1d9" font-size="13.5" text-anchor="middle"><tspan fill="#ff7b72" font-weight="700">Which address is correct?</tspan>  The database cannot tell you.</text>
</svg>
