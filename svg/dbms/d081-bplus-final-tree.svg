<svg xmlns="http://www.w3.org/2000/svg" width="524" height="256" viewBox="0 0 524 256" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Final B+ Tree after inserting 10 to 90</title>
  <desc>Final tree after inserting 70, 80 and 90: root [40, 70] with leaves [10, 20, 30], [40, 50, 60] and [70, 80, 90], linked to each other.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#39c5cf"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="523" height="255" rx="14" fill="#161b22" stroke="#30363d"/>

  <text x="32" y="42" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">FINAL TREE</text>

  <!-- edges -->
  <g stroke="#8b949e" stroke-width="1.5">
    <line x1="222" y1="100" x2="98" y2="152" marker-end="url(#arr)"/>
    <line x1="262" y1="100" x2="262" y2="152" marker-end="url(#arr)"/>
    <line x1="302" y1="100" x2="426" y2="152" marker-end="url(#arr)"/>
  </g>

  <!-- root -->
  <rect x="218" y="60" width="88" height="38" rx="8" fill="#58a6ff" fill-opacity=".12" stroke="#58a6ff" stroke-opacity=".8"/>
  <line x1="262" y1="60" x2="262" y2="98" stroke="#58a6ff" stroke-opacity=".5"/>
  <g font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">
    <text x="240" y="84">40</text><text x="284" y="84">70</text>
  </g>

  <!-- leaves -->
  <g fill="#39c5cf" fill-opacity=".10" stroke="#39c5cf" stroke-opacity=".7">
    <rect x="32" y="156" width="132" height="38" rx="8"/>
    <rect x="196" y="156" width="132" height="38" rx="8"/>
    <rect x="360" y="156" width="132" height="38" rx="8"/>
  </g>
  <g stroke="#39c5cf" stroke-opacity=".4">
    <line x1="76" y1="156" x2="76" y2="194"/><line x1="120" y1="156" x2="120" y2="194"/>
    <line x1="240" y1="156" x2="240" y2="194"/><line x1="284" y1="156" x2="284" y2="194"/>
    <line x1="404" y1="156" x2="404" y2="194"/><line x1="448" y1="156" x2="448" y2="194"/>
  </g>
  <g font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">
    <text x="54" y="180">10</text><text x="98" y="180">20</text><text x="142" y="180">30</text>
    <text x="218" y="180">40</text><text x="262" y="180">50</text><text x="306" y="180">60</text>
    <text x="382" y="180">70</text><text x="426" y="180">80</text><text x="470" y="180">90</text>
  </g>

  <!-- linked list -->
  <g stroke="#39c5cf" stroke-width="1.5" fill="none">
    <path d="M128,198 Q180,232 232,198" marker-start="url(#arrT)" marker-end="url(#arrT)"/>
    <path d="M292,198 Q344,232 396,198" marker-start="url(#arrT)" marker-end="url(#arrT)"/>
  </g>

</svg>
