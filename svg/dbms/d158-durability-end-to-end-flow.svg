<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Durability end to end</title>
  <desc>Client COMMIT: [1] append to redo log (RAM buffer); [2] fsync() redo log to physical disk (durability on single machine); [3] if sync replication, wait for replica ACK (durability across machines); [4] return OK to client (the durability guarantee moment); [5] background checkpoint of dirty pages to .ibd files using the double write buffer to prevent torn pages.</desc>
  <defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d29922"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39c5cf"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs>
  <rect x="0.5" y="0.5" width="859" height="439" rx="14" fill="#161b22" stroke="#30363d"/>
  <rect x="180.0" y="24" width="180" height="34" rx="17" fill="#58a6ff" fill-opacity="0.12" stroke="#58a6ff" stroke-opacity="0.6"/>
  <text x="270.0" y="46" fill="#e6edf3" font-size="13" text-anchor="middle"><tspan fill="#8b949e">Client: </tspan><tspan fill="#79c0ff" font-weight="700" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">COMMIT</tspan></text>
  <line x1="270.0" y1="58" x2="270.0" y2="80" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a-gray)"/>
  <rect x="40" y="84" width="460" height="44" rx="10" fill="#1c2128" stroke="#30363d"/>
  <text x="58" y="111" fill="#e6edf3" font-size="14.5" font-weight="600"><tspan fill="#8b949e" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">[1]</tspan>  Append to redo log <tspan fill="#8b949e" font-weight="400">(RAM buffer)</tspan></text>
  <line x1="270.0" y1="128" x2="270.0" y2="150" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a-gray)"/>
  <rect x="40" y="154" width="460" height="44" rx="10" fill="#3fb950" fill-opacity="0.1" stroke="#3fb950" stroke-opacity="0.6"/>
  <text x="58" y="181" fill="#e6edf3" font-size="14.5" font-weight="600"><tspan fill="#8b949e" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">[2]</tspan>  <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">fsync()</tspan> redo log → physical disk</text>
  <line x1="540" y1="176" x2="506" y2="176" stroke="#3fb950" stroke-width="1.6" marker-end="url(#a-green)"/>
  <text x="548" y="181" fill="#56d364" font-size="13.5" font-weight="600">Durability on single machine</text>
  <line x1="270.0" y1="198" x2="270.0" y2="220" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a-gray)"/>
  <rect x="40" y="224" width="460" height="44" rx="10" fill="#58a6ff" fill-opacity="0.1" stroke="#58a6ff" stroke-opacity="0.6"/>
  <text x="58" y="251" fill="#e6edf3" font-size="14.5" font-weight="600"><tspan fill="#8b949e" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">[3]</tspan>  <tspan fill="#8b949e" font-weight="400">(If sync replication)</tspan> Wait for replica ACK</text>
  <line x1="540" y1="246" x2="506" y2="246" stroke="#58a6ff" stroke-width="1.6" marker-end="url(#a-blue)"/>
  <text x="548" y="251" fill="#79c0ff" font-size="13.5" font-weight="600">Durability across machines</text>
  <line x1="270.0" y1="268" x2="270.0" y2="290" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a-gray)"/>
  <rect x="40" y="294" width="460" height="44" rx="10" fill="#3fb950" fill-opacity="0.16" stroke="#3fb950" stroke-opacity="0.9" stroke-width="1.5"/>
  <text x="58" y="321" fill="#e6edf3" font-size="14.5" font-weight="600"><tspan fill="#8b949e" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">[4]</tspan>  Return <tspan fill="#56d364">"OK"</tspan> to client</text>
  <line x1="540" y1="316" x2="506" y2="316" stroke="#3fb950" stroke-width="1.6" marker-end="url(#a-green)"/>
  <text x="548" y="321" fill="#56d364" font-size="13.5" font-weight="600"><tspan font-weight="700">This is the durability guarantee moment</tspan></text>
  <line x1="270.0" y1="338" x2="270.0" y2="360" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a-gray)"/>
  <rect x="40" y="364" width="460" height="72" rx="10" fill="#1c2128" stroke="#484f58" stroke-dasharray="6 5"/>
  <text x="58" y="391" fill="#e6edf3" font-size="14.5" font-weight="600"><tspan fill="#8b949e" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">[5]</tspan>  <tspan fill="#8b949e" font-weight="400">Background:</tspan> checkpoint dirty pages to <tspan fill="#79c0ff" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">.ibd</tspan> data files</text>
  <text x="88" y="413" fill="#c9d1d9" font-size="13">(Using double write buffer to prevent torn pages)</text>
</svg>
