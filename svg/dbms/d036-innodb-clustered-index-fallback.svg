<svg xmlns="http://www.w3.org/2000/svg" width="800" height="306" viewBox="0 0 800 306" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>InnoDB clustered index fallback</title>
  <desc>If a PRIMARY KEY is declared it becomes the clustered index. Otherwise InnoDB promotes the first UNIQUE NOT NULL index. If none exists, InnoDB creates a hidden GEN_CLUST_INDEX over a synthetic 6-byte row ID (DB_ROW_ID) that you can never query, reference, or use in a WHERE clause.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d29922"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f85149"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="799" height="305" rx="14" fill="#161b22" stroke="#30363d"/>

  <!-- Q1 -->
  <rect x="24" y="24" width="300" height="46" rx="10" fill="#1c2128" stroke="#58a6ff" stroke-opacity=".7"/>
  <text x="174" y="52" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle">Did you declare a <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" fill="#79c0ff">PRIMARY KEY</tspan>?</text>

  <line x1="324" y1="47" x2="396" y2="47" stroke="#3fb950" stroke-width="1.6" marker-end="url(#arrG)"/>
  <text x="358" y="40" fill="#56d364" font-size="12" font-weight="700" text-anchor="middle">Yes</text>
  <rect x="400" y="24" width="376" height="46" rx="10" fill="#3fb950" fill-opacity=".10" stroke="#3fb950" stroke-opacity=".7"/>
  <text x="418" y="52" fill="#e6edf3" font-size="13.5">That becomes the clustered index</text>

  <line x1="174" y1="70" x2="174" y2="116" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="186" y="98" fill="#ff7b72" font-size="12" font-weight="700">No</text>

  <!-- Q2 -->
  <rect x="24" y="120" width="300" height="46" rx="10" fill="#1c2128" stroke="#58a6ff" stroke-opacity=".7"/>
  <text x="174" y="148" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle">Is there a <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" fill="#79c0ff">UNIQUE NOT NULL</tspan> index?</text>

  <line x1="324" y1="143" x2="396" y2="143" stroke="#d29922" stroke-width="1.6" marker-end="url(#arrA)"/>
  <text x="358" y="136" fill="#e3b341" font-size="12" font-weight="700" text-anchor="middle">Yes</text>
  <rect x="400" y="120" width="376" height="46" rx="10" fill="#d29922" fill-opacity=".10" stroke="#d29922" stroke-opacity=".7"/>
  <text x="418" y="148" fill="#e6edf3" font-size="13.5">InnoDB promotes the <tspan font-weight="700" fill="#e3b341">FIRST</tspan> one to clustered index</text>

  <line x1="174" y1="166" x2="174" y2="206" stroke="#f85149" stroke-width="1.6" marker-end="url(#arrR)"/>
  <text x="186" y="191" fill="#ff7b72" font-size="12" font-weight="700">No</text>

  <!-- fallback -->
  <rect x="24" y="210" width="752" height="72" rx="10" fill="#f85149" fill-opacity=".08" stroke="#f85149" stroke-opacity=".6"/>
  <text x="44" y="238" fill="#e6edf3" font-size="13.5">InnoDB creates a hidden <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" fill="#ff7b72" font-weight="700">GEN_CLUST_INDEX</tspan> over a synthetic 6-byte row ID (<tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" fill="#ff7b72">DB_ROW_ID</tspan>)</text>
  <text x="44" y="262" fill="#c9d1d9" font-size="13.5">that you can <tspan font-weight="700" fill="#ff7b72">never</tspan> query, reference, or use in a <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" fill="#79c0ff">WHERE</tspan> clause</text>
</svg>
