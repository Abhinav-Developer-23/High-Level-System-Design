<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Savepoint timeline</title>
  <desc>Timeline: BEGIN, Step 1, Step 2, SAVEPOINT, Step 4, Step 5 (ERROR!). ROLLBACK TO the savepoint undoes steps 4-5 only; then COMMIT makes steps 1-2 permanent.</desc>
  <defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d29922"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39c5cf"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs>
  <rect x="0.5" y="0.5" width="799" height="299" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="24" y="38" font-size="12" fill="#8b949e" font-weight="700" letter-spacing="1.5">TIMELINE</text>
  <rect x="24" y="60" width="74" height="34" rx="8" fill="#58a6ff" fill-opacity="0.1" stroke="#58a6ff" stroke-opacity="0.7"/>
  <text x="61.0" y="82" font-size="13" fill="#79c0ff" font-weight="600" text-anchor="middle">BEGIN</text>
  <line x1="98" y1="77" x2="138" y2="77" stroke="#8b949e" stroke-width="1.6"/>
  <rect x="138" y="60" width="74" height="34" rx="8" fill="#3fb950" fill-opacity="0.1" stroke="#3fb950" stroke-opacity="0.7"/>
  <text x="175.0" y="82" font-size="13" fill="#56d364" font-weight="600" text-anchor="middle">Step 1</text>
  <line x1="212" y1="77" x2="252" y2="77" stroke="#8b949e" stroke-width="1.6"/>
  <rect x="252" y="60" width="74" height="34" rx="8" fill="#3fb950" fill-opacity="0.1" stroke="#3fb950" stroke-opacity="0.7"/>
  <text x="289.0" y="82" font-size="13" fill="#56d364" font-weight="600" text-anchor="middle">Step 2</text>
  <line x1="326" y1="77" x2="366" y2="77" stroke="#8b949e" stroke-width="1.6"/>
  <rect x="366" y="60" width="108" height="34" rx="8" fill="#bc8cff" fill-opacity="0.16" stroke="#bc8cff" stroke-opacity="0.7"/>
  <text x="420.0" y="82" font-size="13" fill="#d2a8ff" font-weight="600" text-anchor="middle">SAVEPOINT</text>
  <line x1="474" y1="77" x2="514" y2="77" stroke="#8b949e" stroke-width="1.6"/>
  <rect x="514" y="60" width="74" height="34" rx="8" fill="#f85149" fill-opacity="0.1" stroke="#f85149" stroke-opacity="0.7"/>
  <text x="551.0" y="82" font-size="13" fill="#ff7b72" font-weight="600" text-anchor="middle">Step 4</text>
  <line x1="588" y1="77" x2="628" y2="77" stroke="#8b949e" stroke-width="1.6"/>
  <rect x="628" y="60" width="142" height="34" rx="8" fill="#f85149" fill-opacity="0.1" stroke="#f85149" stroke-opacity="0.7"/>
  <text x="699.0" y="82" font-size="13" fill="#ff7b72" font-weight="600" text-anchor="middle">Step 5 (ERROR!)</text>
  <path d="M699.0,94 V146 H430.0" fill="none" stroke="#d29922" stroke-width="1.8" marker-end="url(#a-amber)"/>
  <text x="565.5" y="138" font-size="13" fill="#e3b341" font-weight="700" text-anchor="middle">ROLLBACK TO</text>
  <text x="565.5" y="168" font-size="12.5" fill="#e3b341" text-anchor="middle">(undo steps 4-5 only)</text>
  <line x1="420.0" y1="94" x2="420.0" y2="196" stroke="#8b949e" stroke-width="1.6"/>
  <line x1="420.0" y1="150" x2="420.0" y2="200" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <rect x="350.0" y="204" width="140" height="34" rx="17" fill="#3fb950" fill-opacity="0.16" stroke="#3fb950" stroke-opacity="0.7"/>
  <text x="420.0" y="226" font-size="14" fill="#56d364" font-weight="700" text-anchor="middle">COMMIT ✓</text>
  <text x="420.0" y="262" font-size="12.5" fill="#56d364" text-anchor="middle">(steps 1-2 are permanent)</text>
</svg>
