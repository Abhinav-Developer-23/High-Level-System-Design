  <text x="620.0" y="84" fill="#56d364" font-size="13" font-weight="600" text-anchor="middle">COMMIT</text>
  <line x1="440.0" y1="120" x2="440.0" y2="100" stroke="#8b949e" stroke-width="1.4" marker-end="url(#a-gray)"/>
  <text x="440.0" y="134" fill="#c9d1d9" font-size="12.5" text-anchor="middle">(can release before commit)</text>
  <rect x="24" y="150" width="832" height="114" rx="10" fill="#1c2128" stroke="#30363d"/>
  <text x="44" y="176" fill="#e6edf3" font-size="14.5" font-weight="700">Strict 2PL</text>
