  <text x="254.0" y="210" fill="#79c0ff" font-size="13" font-weight="600" text-anchor="middle">Lock Point</text>
  <line x1="318" y1="205" x2="564" y2="205" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <rect x="570" y="190" width="100" height="30" rx="15" fill="#3fb950" fill-opacity="0.14" stroke="#3fb950" stroke-opacity="0.7"/>
  <text x="620.0" y="210" fill="#56d364" font-size="13" font-weight="600" text-anchor="middle">COMMIT</text>
  <line x1="676" y1="205" x2="698" y2="205" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <rect x="704" y="190" width="150" height="30" rx="15" fill="#d29922" fill-opacity="0.14" stroke="#d29922" stroke-opacity="0.7"/>
  <text x="779.0" y="210" fill="#e3b341" font-size="13" font-weight="600" text-anchor="middle">Release X-Locks</text>
  <line x1="620.0" y1="246" x2="620.0" y2="226" stroke="#8b949e" stroke-width="1.4" marker-end="url(#a-gray)"/>
  <text x="620.0" y="260" fill="#c9d1d9" font-size="12.5" text-anchor="middle">(X-locks held until commit)</text>
  <rect x="24" y="276" width="832" height="114" rx="10" fill="#1c2128" stroke="#30363d"/>
  <text x="44" y="302" fill="#e6edf3" font-size="14.5" font-weight="700">Rigorous 2PL</text>
  <rect x="40" y="316" width="96" height="30" rx="15" fill="#bc8cff" fill-opacity="0.14" stroke="#bc8cff" stroke-opacity="0.7"/>
  <text x="88.0" y="336" fill="#d2a8ff" font-size="13" font-weight="600" text-anchor="middle">Acquire</text>
  <line x1="142" y1="331" x2="190" y2="331" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <rect x="196" y="316" width="116" height="30" rx="15" fill="#58a6ff" fill-opacity="0.14" stroke="#58a6ff" stroke-opacity="0.7"/>
  <text x="254.0" y="336" fill="#79c0ff" font-size="13" font-weight="600" text-anchor="middle">Lock Point</text>
  <line x1="318" y1="331" x2="564" y2="331" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <rect x="570" y="316" width="100" height="30" rx="15" fill="#3fb950" fill-opacity="0.14" stroke="#3fb950" stroke-opacity="0.7"/>
  <text x="620.0" y="336" fill="#56d364" font-size="13" font-weight="600" text-anchor="middle">COMMIT</text>
  <line x1="676" y1="331" x2="698" y2="331" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <rect x="704" y="316" width="150" height="30" rx="15" fill="#d29922" fill-opacity="0.14" stroke="#d29922" stroke-opacity="0.7"/>
  <text x="779.0" y="336" fill="#e3b341" font-size="13" font-weight="600" text-anchor="middle">Release ALL Locks</text>
  <line x1="620.0" y1="372" x2="620.0" y2="352" stroke="#8b949e" stroke-width="1.4" marker-end="url(#a-gray)"/>
  <text x="620.0" y="386" fill="#c9d1d9" font-size="12.5" text-anchor="middle">(ALL locks held until commit)</text>
</svg>
