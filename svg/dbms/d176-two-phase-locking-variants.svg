<svg xmlns="http://www.w3.org/2000/svg" width="880" height="414" viewBox="0 0 880 414" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>2PL variants: basic, strict, rigorous</title>
  <desc>Basic 2PL: acquire, lock point, release, commit (can release before commit). Strict 2PL: acquire, lock point, commit, then release X-locks (X-locks held until commit). Rigorous 2PL: acquire, lock point, commit, then release all locks (all locks held until commit).</desc>
  <defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d29922"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39c5cf"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs>
  <rect x="0.5" y="0.5" width="879" height="413" rx="14" fill="#161b22" stroke="#30363d"/>
  <rect x="24" y="24" width="832" height="114" rx="10" fill="#1c2128" stroke="#30363d"/>
  <text x="44" y="50" fill="#e6edf3" font-size="14.5" font-weight="700">Basic 2PL</text>
  <rect x="40" y="64" width="96" height="30" rx="15" fill="#bc8cff" fill-opacity="0.14" stroke="#bc8cff" stroke-opacity="0.7"/>
  <text x="88.0" y="84" fill="#d2a8ff" font-size="13" font-weight="600" text-anchor="middle">Acquire</text>
  <line x1="142" y1="79" x2="190" y2="79" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <rect x="196" y="64" width="116" height="30" rx="15" fill="#58a6ff" fill-opacity="0.14" stroke="#58a6ff" stroke-opacity="0.7"/>
  <text x="254.0" y="84" fill="#79c0ff" font-size="13" font-weight="600" text-anchor="middle">Lock Point</text>
  <line x1="318" y1="79" x2="384" y2="79" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <rect x="390" y="64" width="100" height="30" rx="15" fill="#d29922" fill-opacity="0.14" stroke="#d29922" stroke-opacity="0.7"/>
  <text x="440.0" y="84" fill="#e3b341" font-size="13" font-weight="600" text-anchor="middle">Release</text>
  <line x1="496" y1="79" x2="564" y2="79" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a-gray)"/>
