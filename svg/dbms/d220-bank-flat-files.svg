<svg xmlns="http://www.w3.org/2000/svg" width="700" height="284" viewBox="0 0 700 284" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Pre-DBMS bank files</title>
  <desc>A bank/ folder holds savings_accounts.txt owned by the Savings dept program, loan_accounts.txt owned by the Loans dept program, and customer_mailing.csv owned by the Marketing dept program. Alice's address is stored in all three files, each in a different format written by a different programmer.</desc>
  <defs>
    <marker id="d220a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="699" height="283" rx="14" fill="#161b22" stroke="#30363d"/>

  <!-- folder -->
  <path d="M30,30 h9 l3,3 h12 a2,2 0 0 1 2,2 v12 a2,2 0 0 1 -2,2 h-24 a2,2 0 0 1 -2,-2 v-15 a2,2 0 0 1 2,-2 z" fill="#d29922" fill-opacity=".25" stroke="#d29922" stroke-width="1.3"/>
  <text x="66" y="45" fill="#e6edf3" font-size="14" font-weight="700" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">bank/</text>

  <!-- tree -->
  <g stroke="#484f58" stroke-width="1.5" fill="none">
    <path d="M42,52 V168"/>
    <path d="M42,88 H76"/><path d="M42,128 H76"/><path d="M42,168 H76"/>
  </g>

  <rect x="78" y="73" width="230" height="30" rx="7" fill="#1c2128" stroke="#30363d"/>
  <text x="92" y="93" fill="#79c0ff" font-size="13" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">savings_accounts.txt</text>
  <line x1="354" y1="88" x2="312" y2="88" stroke="#8b949e" stroke-width="1.4" marker-end="url(#d220a)"/>
  <rect x="358" y="76" width="290" height="24" rx="12" fill="#58a6ff" fill-opacity=".12" stroke="#58a6ff" stroke-opacity=".55"/>
  <text x="503" y="92.5" fill="#c9d1d9" font-size="12.5" text-anchor="middle">owned by the <tspan fill="#79c0ff" font-weight="700">Savings</tspan> dept program</text>

  <rect x="78" y="113" width="230" height="30" rx="7" fill="#1c2128" stroke="#30363d"/>
  <text x="92" y="133" fill="#79c0ff" font-size="13" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">loan_accounts.txt</text>
  <line x1="354" y1="128" x2="312" y2="128" stroke="#8b949e" stroke-width="1.4" marker-end="url(#d220a)"/>
  <rect x="358" y="116" width="290" height="24" rx="12" fill="#f0883e" fill-opacity=".12" stroke="#f0883e" stroke-opacity=".55"/>
  <text x="503" y="132.5" fill="#c9d1d9" font-size="12.5" text-anchor="middle">owned by the <tspan fill="#ffa657" font-weight="700">Loans</tspan> dept program</text>

  <rect x="78" y="153" width="230" height="30" rx="7" fill="#1c2128" stroke="#30363d"/>
  <text x="92" y="173" fill="#79c0ff" font-size="13" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">customer_mailing.csv</text>
  <line x1="354" y1="168" x2="312" y2="168" stroke="#8b949e" stroke-width="1.4" marker-end="url(#d220a)"/>
  <rect x="358" y="156" width="290" height="24" rx="12" fill="#bc8cff" fill-opacity=".12" stroke="#bc8cff" stroke-opacity=".55"/>
  <text x="503" y="172.5" fill="#c9d1d9" font-size="12.5" text-anchor="middle">owned by the <tspan fill="#d2a8ff" font-weight="700">Marketing</tspan> dept program</text>

  <!-- note -->
  <rect x="24" y="204" width="652" height="58" rx="10" fill="#d29922" fill-opacity=".08" stroke="#d29922" stroke-opacity=".55"/>
  <text x="42" y="228" fill="#c9d1d9" font-size="13">Alice's address is stored in <tspan fill="#e3b341" font-weight="700">ALL THREE</tspan> files.</text>
  <text x="42" y="249" fill="#c9d1d9" font-size="13">Each file has a different format, written by a different programmer.</text>
</svg>
