<svg xmlns="http://www.w3.org/2000/svg" width="720" height="456" viewBox="0 0 720 456" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Thomas' Write Rule</title>
  <desc>If TS(Ti) is less than W-TS(X), a later transaction already wrote X and Ti's write is outdated. Thomas' rule ignores Ti's write instead of rolling back, and Ti continues executing. Abbreviations: TS(Ti) = Timestamp of transaction Ti (when Ti started; smaller = older); W-TS(X) = Write Timestamp of data item X (TS of the youngest transaction that has written X).</desc>
  <defs>
    <marker id="d207a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
    <marker id="d207g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="719" height="455" rx="14" fill="#161b22" stroke="#30363d"/>

  <text x="24" y="38" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">THOMAS' WRITE RULE</text>

  <!-- condition -->
  <rect x="150" y="56" width="420" height="78" rx="10" fill="#58a6ff" fill-opacity=".10" stroke="#58a6ff" stroke-opacity=".7"/>
  <text x="360" y="82" fill="#79c0ff" font-size="14" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" text-anchor="middle">If TS(Ti) &lt; W-TS(X):</text>
  <text x="360" y="104" fill="#8b949e" font-size="12" text-anchor="middle">Timestamp of Ti &lt; Write Timestamp of X</text>
  <text x="360" y="122" fill="#8b949e" font-size="12" text-anchor="middle">→ Ti is older than X's last writer</text>
  <line x1="360" y1="134" x2="360" y2="156" stroke="#8b949e" stroke-width="1.5" marker-end="url(#d207a)"/>

  <!-- step 1 -->
  <rect x="80" y="160" width="560" height="42" rx="10" fill="#1c2128" stroke="#30363d"/>
  <text x="360" y="186" fill="#c9d1d9" font-size="13.5" text-anchor="middle">A later transaction already wrote X</text>
  <line x1="360" y1="202" x2="360" y2="222" stroke="#8b949e" stroke-width="1.5" marker-end="url(#d207a)"/>

  <!-- step 2 -->
  <rect x="80" y="226" width="560" height="42" rx="10" fill="#d29922" fill-opacity=".10" stroke="#d29922" stroke-opacity=".7"/>
  <text x="360" y="252" fill="#e3b341" font-size="13.5" font-weight="600" text-anchor="middle">Ti's write is outdated</text>
  <line x1="360" y1="268" x2="360" y2="288" stroke="#3fb950" stroke-width="1.5" marker-end="url(#d207g)"/>

  <!-- step 3: the rule -->
  <rect x="80" y="292" width="560" height="42" rx="10" fill="#3fb950" fill-opacity=".14" stroke="#3fb950" stroke-opacity=".8"/>
  <text x="360" y="318" fill="#c9d1d9" font-size="13.5" text-anchor="middle"><tspan fill="#56d364" font-weight="700">Thomas' Rule:</tspan>  Just <tspan font-weight="700" fill="#e6edf3">IGNORE</tspan> Ti's write (skip it, don't rollback)  <tspan fill="#56d364" font-weight="700">✓</tspan></text>
  <line x1="360" y1="334" x2="360" y2="354" stroke="#3fb950" stroke-width="1.5" marker-end="url(#d207g)"/>

  <!-- step 4 -->
  <rect x="80" y="358" width="560" height="28" rx="14" fill="#3fb950" fill-opacity=".08" stroke="#3fb950" stroke-opacity=".5"/>
  <text x="360" y="377" fill="#56d364" font-size="13.5" text-anchor="middle">Ti continues executing</text>
  <rect x="24" y="402" width="672" height="32" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="40" y="422.5" font-size="12" fill="#8b949e"><tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" fill="#79c0ff">TS(Ti)</tspan> = Timestamp of transaction Ti<tspan fill="#484f58">&#160;&#160;&#160;·&#160;&#160;&#160;</tspan><tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" fill="#79c0ff">W-TS(X)</tspan> = Write Timestamp of X</text>
</svg>
