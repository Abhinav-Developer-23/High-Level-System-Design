  <text x="371.0" y="142.68" fill="#56d364" font-size="13" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">ALL columns</text>
  <text x="504" y="143" fill="#8b949e" font-size="13">(full PK determines everything)</text>
</svg>
