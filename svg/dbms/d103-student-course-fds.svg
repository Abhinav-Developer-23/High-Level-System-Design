<svg xmlns="http://www.w3.org/2000/svg" width="780" height="188" viewBox="0 0 780 188" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Functional dependencies in student_course</title>
  <desc>roll_no determines name and dept; course_id determines course_name and instructor; the full key {roll_no, course_id} determines all columns.</desc>
  <defs>
    <marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d29922"/></marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/></marker>
    <marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39c5cf"/></marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker>
    </defs>
  <rect x="0.5" y="0.5" width="779" height="187" rx="14" fill="#161b22" stroke="#30363d"/>
  <rect x="24" y="24" width="190" height="36" rx="8" fill="#58a6ff" fill-opacity="0.12" stroke="#58a6ff" stroke-opacity="0.65"/>
  <text x="119.0" y="46.68" fill="#79c0ff" font-size="13" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">roll_no</text>
  <line x1="218" y1="42" x2="252" y2="42" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <rect x="258" y="24" width="226" height="36" rx="8" fill="#39c5cf" fill-opacity="0.12" stroke="#39c5cf" stroke-opacity="0.65"/>
  <text x="371.0" y="46.68" fill="#56d4dd" font-size="13" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">name, dept</text>
  <text x="504" y="47" fill="#8b949e" font-size="13">(knowing roll_no gives you name and dept)</text>
  <rect x="24" y="72" width="190" height="36" rx="8" fill="#58a6ff" fill-opacity="0.12" stroke="#58a6ff" stroke-opacity="0.65"/>
  <text x="119.0" y="94.68" fill="#79c0ff" font-size="13" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">course_id</text>
  <line x1="218" y1="90" x2="252" y2="90" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <rect x="258" y="72" width="226" height="36" rx="8" fill="#39c5cf" fill-opacity="0.12" stroke="#39c5cf" stroke-opacity="0.65"/>
  <text x="371.0" y="94.68" fill="#56d4dd" font-size="13" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">course_name, instructor</text>
  <text x="504" y="95" fill="#8b949e" font-size="13">(knowing course_id gives course info)</text>
  <rect x="24" y="120" width="190" height="36" rx="8" fill="#58a6ff" fill-opacity="0.12" stroke="#58a6ff" stroke-opacity="0.65"/>
  <text x="119.0" y="142.68" fill="#79c0ff" font-size="13" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">{roll_no, course_id}</text>
  <line x1="218" y1="138" x2="252" y2="138" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a-gray)"/>
