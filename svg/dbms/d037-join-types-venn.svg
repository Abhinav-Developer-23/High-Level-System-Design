<svg xmlns="http://www.w3.org/2000/svg" width="872" height="232" viewBox="0 0 872 232" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>SQL join types overview</title>
  <desc>Venn diagrams of tables A and B. INNER JOIN returns only matching rows from both; LEFT JOIN returns all of A plus matching B; RIGHT JOIN returns matching rows plus all of B; FULL JOIN returns all of A and all of B.</desc>
  <defs>
    <clipPath id="clipA0"><circle cx="96" cy="112" r="48"/></clipPath>
    <clipPath id="clipA1"><circle cx="304" cy="112" r="48"/></clipPath>
    <clipPath id="clipA2"><circle cx="512" cy="112" r="48"/></clipPath>
    <clipPath id="clipA3"><circle cx="720" cy="112" r="48"/></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="871" height="231" rx="14" fill="#161b22" stroke="#30363d"/>
  <!-- INNER JOIN -->
  <text x="124" y="40" fill="#79c0ff" font-size="13.5" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">INNER JOIN</text>
  <g opacity=".4">
  <circle cx="152" cy="112" r="48" fill="#58a6ff" clip-path="url(#clipA0)"/>
  </g>
  <circle cx="96" cy="112" r="48" fill="none" stroke="#c9d1d9" stroke-opacity=".7" stroke-width="1.5"/>
  <circle cx="152" cy="112" r="48" fill="none" stroke="#c9d1d9" stroke-opacity=".7" stroke-width="1.5"/>
  <text x="76" y="118" fill="#e6edf3" font-size="16" font-weight="700" text-anchor="middle">A</text>
  <text x="172" y="118" fill="#e6edf3" font-size="16" font-weight="700" text-anchor="middle">B</text>
  <text x="124" y="190" fill="#c9d1d9" font-size="13" text-anchor="middle">Only matching</text>
  <text x="124" y="208" fill="#c9d1d9" font-size="13" text-anchor="middle">rows from both</text>
  <!-- LEFT JOIN -->
  <line x1="228" y1="28" x2="228" y2="208" stroke="#21262d"/>
  <text x="332" y="40" fill="#79c0ff" font-size="13.5" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">LEFT JOIN</text>
  <g opacity=".4">
  <circle cx="304" cy="112" r="48" fill="#58a6ff"/>
  </g>
  <circle cx="304" cy="112" r="48" fill="none" stroke="#c9d1d9" stroke-opacity=".7" stroke-width="1.5"/>
  <circle cx="360" cy="112" r="48" fill="none" stroke="#c9d1d9" stroke-opacity=".7" stroke-width="1.5"/>
  <text x="284" y="118" fill="#e6edf3" font-size="16" font-weight="700" text-anchor="middle">A</text>
  <text x="380" y="118" fill="#e6edf3" font-size="16" font-weight="700" text-anchor="middle">B</text>
  <text x="332" y="190" fill="#c9d1d9" font-size="13" text-anchor="middle">All of A +</text>
  <text x="332" y="208" fill="#c9d1d9" font-size="13" text-anchor="middle">matching B</text>
  <!-- RIGHT JOIN -->
  <line x1="436" y1="28" x2="436" y2="208" stroke="#21262d"/>
  <text x="540" y="40" fill="#79c0ff" font-size="13.5" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">RIGHT JOIN</text>
  <g opacity=".4">
  <circle cx="568" cy="112" r="48" fill="#58a6ff"/>
  </g>
  <circle cx="512" cy="112" r="48" fill="none" stroke="#c9d1d9" stroke-opacity=".7" stroke-width="1.5"/>
  <circle cx="568" cy="112" r="48" fill="none" stroke="#c9d1d9" stroke-opacity=".7" stroke-width="1.5"/>
  <text x="492" y="118" fill="#e6edf3" font-size="16" font-weight="700" text-anchor="middle">A</text>
  <text x="588" y="118" fill="#e6edf3" font-size="16" font-weight="700" text-anchor="middle">B</text>
  <text x="540" y="190" fill="#c9d1d9" font-size="13" text-anchor="middle">Matching +</text>
  <text x="540" y="208" fill="#c9d1d9" font-size="13" text-anchor="middle">all of B</text>
  <!-- FULL JOIN -->
  <line x1="644" y1="28" x2="644" y2="208" stroke="#21262d"/>
  <text x="748" y="40" fill="#79c0ff" font-size="13.5" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">FULL JOIN</text>
  <g opacity=".4">
  <circle cx="720" cy="112" r="48" fill="#58a6ff"/>
  <circle cx="776" cy="112" r="48" fill="#58a6ff"/>
  </g>
  <circle cx="720" cy="112" r="48" fill="none" stroke="#c9d1d9" stroke-opacity=".7" stroke-width="1.5"/>
  <circle cx="776" cy="112" r="48" fill="none" stroke="#c9d1d9" stroke-opacity=".7" stroke-width="1.5"/>
  <text x="700" y="118" fill="#e6edf3" font-size="16" font-weight="700" text-anchor="middle">A</text>
  <text x="796" y="118" fill="#e6edf3" font-size="16" font-weight="700" text-anchor="middle">B</text>
  <text x="748" y="190" fill="#c9d1d9" font-size="13" text-anchor="middle">All of A +</text>
  <text x="748" y="208" fill="#c9d1d9" font-size="13" text-anchor="middle">All of B</text>
</svg>
