<svg xmlns="http://www.w3.org/2000/svg" width="720" height="252" viewBox="0 0 720 252" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Login bypass with " OR ""="</title>
  <desc>The attacker types " OR ""=" in both login fields. The server sees Name = "" OR ""="" (always true) and Pass = "" OR ""="" (always true). Result: the attacker is logged in as the first user in the table.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="719" height="251" rx="14" fill="#161b22" stroke="#30363d"/>

  <text x="32" y="42" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">LOGIN FORM</text>
  <text x="330" y="42" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">WHAT THE SERVER SEES</text>
  <line x1="24" y1="54" x2="696" y2="54" stroke="#30363d"/>

  <!-- form -->
  <rect x="24" y="66" width="250" height="104" rx="10" fill="#1c2128" stroke="#30363d"/>
  <text x="40" y="99" fill="#8b949e" font-size="13">Username:</text>
  <rect x="120" y="80" width="138" height="28" rx="5" fill="#0d1117" stroke="#f85149" stroke-opacity=".7"/>
  <text x="132" y="99" fill="#ff7b72" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="13">" OR ""="</text>
  <text x="40" y="145" fill="#8b949e" font-size="13">Password:</text>
  <rect x="120" y="126" width="138" height="28" rx="5" fill="#0d1117" stroke="#f85149" stroke-opacity=".7"/>
  <text x="132" y="145" fill="#ff7b72" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="13">" OR ""="</text>

  <line x1="262" y1="94" x2="324" y2="94" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="262" y1="140" x2="324" y2="140" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- server view -->
  <rect x="330" y="78" width="366" height="32" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="344" y="99" fill="#79c0ff" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="13">Name = "" <tspan fill="#ff7b72" font-weight="700">OR ""=""</tspan></text>
  <rect x="556" y="83" width="124" height="22" rx="11" fill="#f85149" fill-opacity=".14" stroke="#f85149" stroke-opacity=".6"/>
  <text x="618" y="98" fill="#ff7b72" font-size="12" font-weight="600" text-anchor="middle">always TRUE</text>

  <rect x="330" y="124" width="366" height="32" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="344" y="145" fill="#79c0ff" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="13">Pass = "" <tspan fill="#ff7b72" font-weight="700">OR ""=""</tspan></text>
  <rect x="556" y="129" width="124" height="22" rx="11" fill="#f85149" fill-opacity=".14" stroke="#f85149" stroke-opacity=".6"/>
  <text x="618" y="144" fill="#ff7b72" font-size="12" font-weight="600" text-anchor="middle">always TRUE</text>

  <!-- result -->
  <rect x="24" y="186" width="672" height="42" rx="10" fill="#f85149" fill-opacity=".12" stroke="#f85149" stroke-opacity=".7"/>
  <text x="42" y="212" fill="#ff7b72" font-size="14" font-weight="600">✗  Result: <tspan fill="#e6edf3">Attacker is logged in as the FIRST user in the table!</tspan></text>
</svg>
