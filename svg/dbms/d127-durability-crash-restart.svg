<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" viewBox="0 0 640 330" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Durability across a crash</title>
  <desc>T1 writes A = 500 and B = 2500 and commits. The system crashes. After restart A = 500 and B = 2500: the committed data is safe.</desc>
  <defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d29922"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39c5cf"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs>
  <rect x="0.5" y="0.5" width="639" height="329" rx="14" fill="#161b22" stroke="#30363d"/>
  <line x1="60" y1="40" x2="60" y2="300" stroke="#30363d" stroke-width="2" stroke-dasharray="4 5"/>
  <rect x="38.0" y="29.0" width="44" height="22" rx="11.0" fill="#bc8cff" fill-opacity=".16" stroke="#bc8cff" stroke-opacity=".6"/>
  <text x="60" y="44.32" font-size="12" fill="#d2a8ff" font-weight="600" text-anchor="middle">T1</text>
  <circle cx="60" cy="82" r="4" fill="#8b949e"/>
  <rect x="84" y="66" width="230" height="32" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="100" y="87" font-size="13" fill="#e6edf3" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">T1: Write(A) = 500</text>
  <circle cx="60" cy="126" r="4" fill="#8b949e"/>
  <rect x="84" y="110" width="230" height="32" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="100" y="131" font-size="13" fill="#e6edf3" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">T1: Write(B) = 2500</text>
  <circle cx="60" cy="170" r="5" fill="#3fb950"/>
  <rect x="84" y="154" width="230" height="32" rx="8" fill="#3fb950" fill-opacity="0.14" stroke="#3fb950" stroke-opacity="0.7"/>
  <text x="100" y="175" font-size="13" fill="#e6edf3" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">T1: COMMIT <tspan fill="#56d364" font-weight="700">✓</tspan></text>
  <line x1="24" y1="214" x2="616" y2="214" stroke="#f85149" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="220" y="200" width="200" height="28" rx="14" fill="#161b22" stroke="#f85149"/>
  <text x="320" y="219" font-size="13" fill="#ff7b72" font-weight="700" text-anchor="middle">✱  System crash!</text>
  <rect x="84" y="246" width="532" height="56" rx="10" fill="#3fb950" fill-opacity="0.1" stroke="#3fb950" stroke-opacity="0.7"/>
  <text x="100" y="270" font-size="12.5" fill="#8b949e">After restart:</text>
  <text x="100" y="291" font-size="13.5" fill="#e6edf3" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">A = 500, B = 2500</text>
  <text x="268" y="291" font-size="13.5" fill="#56d364" font-weight="600">← data is safe ✓</text>
</svg>
