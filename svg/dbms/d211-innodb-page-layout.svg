<svg xmlns="http://www.w3.org/2000/svg" width="640" height="290" viewBox="0 0 640 290" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>InnoDB page layout</title>
  <desc>One 16 KB InnoDB page: a header (page id, type, checksum, LSN), the rows, free space, and a slot directory with offsets to each row.</desc>
  <defs>
    <clipPath id="d211clip"><rect x="80" y="52" width="480" height="214" rx="10"/></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="639" height="289" rx="14" fill="#161b22" stroke="#30363d"/>

  <text x="80" y="36" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">ONE 16 KB INNODB PAGE</text>

  <g clip-path="url(#d211clip)">
    <rect x="80" y="52" width="480" height="46" fill="#58a6ff" fill-opacity=".12"/>
    <rect x="80" y="98" width="480" height="52" fill="#3fb950" fill-opacity=".09"/>
    <rect x="80" y="150" width="480" height="70" fill="#1c2128"/>
    <rect x="80" y="220" width="480" height="46" fill="#bc8cff" fill-opacity=".12"/>
  </g>

  <!-- header -->
  <text x="100" y="80" fill="#e6edf3" font-size="13.5"><tspan font-weight="700" fill="#79c0ff">Header</tspan>  (page id, type, checksum, LSN …)</text>
  <line x1="80" y1="98" x2="560" y2="98" stroke="#30363d"/>

  <!-- rows -->
  <rect x="92" y="108" width="80" height="32" rx="6" fill="#3fb950" fill-opacity=".14" stroke="#3fb950" stroke-opacity=".55"/>
  <text x="132" y="129" fill="#e6edf3" font-size="13" text-anchor="middle">Row 1</text>
  <rect x="180" y="108" width="80" height="32" rx="6" fill="#3fb950" fill-opacity=".14" stroke="#3fb950" stroke-opacity=".55"/>
  <text x="220" y="129" fill="#e6edf3" font-size="13" text-anchor="middle">Row 2</text>
  <rect x="268" y="108" width="80" height="32" rx="6" fill="#3fb950" fill-opacity=".14" stroke="#3fb950" stroke-opacity=".55"/>
  <text x="308" y="129" fill="#e6edf3" font-size="13" text-anchor="middle">Row 3</text>
  <rect x="356" y="108" width="80" height="32" rx="6" fill="#3fb950" fill-opacity=".14" stroke="#3fb950" stroke-opacity=".55"/>
  <text x="396" y="129" fill="#e6edf3" font-size="13" text-anchor="middle">Row 4</text>
  <text x="462" y="129" fill="#8b949e" font-size="15" font-weight="700">…</text>
  <line x1="80" y1="150" x2="560" y2="150" stroke="#30363d"/>

  <!-- free space -->
  <rect x="92" y="160" width="456" height="50" rx="6" fill="none" stroke="#484f58" stroke-dasharray="5 5"/>
  <text x="320" y="190" fill="#8b949e" font-size="13" font-style="italic" text-anchor="middle">free space</text>
  <line x1="80" y1="220" x2="560" y2="220" stroke="#30363d"/>

  <!-- slot directory -->
  <text x="100" y="248" fill="#e6edf3" font-size="13.5"><tspan font-weight="700" fill="#d2a8ff">Slot directory</tspan>  (offsets to each row)</text>

  <rect x="80" y="52" width="480" height="214" rx="10" fill="none" stroke="#484f58" stroke-width="1.5"/>
</svg>
