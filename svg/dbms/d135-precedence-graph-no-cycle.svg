<svg xmlns="http://www.w3.org/2000/svg" width="900" height="488" viewBox="0 0 900 488" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Precedence graph without a cycle</title>
  <desc>Interleaved schedule R1(A), W1(A), R2(A), R1(B), W2(A), W1(B). Every conflict on A has T1 first, so the only edge is T1 to T2; B is used only by T1. No cycle, so it is conflict serializable, equivalent to serial schedule T1, T2.</desc>
  <defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d29922"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39c5cf"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs>
  <rect x="0.5" y="0.5" width="899" height="487" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="24" y="40" font-size="14.5" fill="#e6edf3" font-weight="600">Schedule:</text>
  <rect x="24" y="56" width="812" height="34" rx="10" fill="#1c2128" stroke="#30363d"/>
  <text x="46.0" y="78" font-size="12" fill="#8b949e" font-weight="700" text-anchor="middle" letter-spacing="1.5">T</text>
  <text x="133.0" y="78" font-size="12" fill="#d2a8ff" font-weight="700" text-anchor="middle" letter-spacing="1.5">T1</text>
  <text x="263.0" y="78" font-size="12" fill="#56d4dd" font-weight="700" text-anchor="middle" letter-spacing="1.5">T2</text>
  <text x="344" y="78" font-size="12" fill="#8b949e" font-weight="700" letter-spacing="1.5">NOTE</text>
  <rect x="68" y="90" width="130" height="204" rx="0" fill="#bc8cff" fill-opacity="0.07" stroke="#bc8cff" stroke-opacity="0"/>
  <rect x="198" y="90" width="130" height="204" rx="0" fill="#39c5cf" fill-opacity="0.07" stroke="#39c5cf" stroke-opacity="0"/>
  <line x1="24" y1="90" x2="836" y2="90" stroke="#21262d" stroke-width="1"/>
  <text x="46.0" y="111.5" font-size="12" fill="#8b949e" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">t1</text>
  <text x="133.0" y="111.5" font-size="12.5" fill="#e6edf3" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">Read(A)</text>
  <line x1="24" y1="124" x2="836" y2="124" stroke="#21262d" stroke-width="1"/>
  <text x="46.0" y="145.5" font-size="12" fill="#8b949e" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">t2</text>
  <text x="133.0" y="145.5" font-size="12.5" fill="#e6edf3" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">Write(A)</text>
  <line x1="24" y1="158" x2="836" y2="158" stroke="#21262d" stroke-width="1"/>
  <text x="46.0" y="179.5" font-size="12" fill="#8b949e" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">t3</text>
  <text x="263.0" y="179.5" font-size="12.5" fill="#e6edf3" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">Read(A)</text>
  <text x="344" y="179.5" font-size="13" fill="#79c0ff" font-weight="600">← W1(A) before R2(A)  →  edge T1 → T2</text>
  <line x1="24" y1="192" x2="836" y2="192" stroke="#21262d" stroke-width="1"/>
  <text x="46.0" y="213.5" font-size="12" fill="#8b949e" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">t4</text>
  <text x="133.0" y="213.5" font-size="12.5" fill="#e6edf3" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">Read(B)</text>
  <text x="344" y="213.5" font-size="13" fill="#8b949e" font-weight="600">← only T1 touches B  →  no edge</text>
  <line x1="24" y1="226" x2="836" y2="226" stroke="#21262d" stroke-width="1"/>
  <text x="46.0" y="247.5" font-size="12" fill="#8b949e" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">t5</text>
  <text x="263.0" y="247.5" font-size="12.5" fill="#e6edf3" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">Write(A)</text>
  <text x="344" y="247.5" font-size="13" fill="#79c0ff" font-weight="600">← R1(A), W1(A) before W2(A)  →  edge T1 → T2</text>
  <line x1="24" y1="260" x2="836" y2="260" stroke="#21262d" stroke-width="1"/>
  <text x="46.0" y="281.5" font-size="12" fill="#8b949e" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">t6</text>
  <text x="133.0" y="281.5" font-size="12.5" fill="#e6edf3" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">Write(B)</text>
  <text x="344" y="281.5" font-size="13" fill="#8b949e" font-weight="600">← only T1 touches B  →  no edge</text>
  <rect x="24" y="56" width="812" height="238" rx="10" fill="none" stroke="#30363d"/>
  <rect x="24" y="318" width="400" height="146" rx="10" fill="#1c2128" stroke="#30363d"/>
  <text x="42" y="346" font-size="12" fill="#8b949e" font-weight="700" letter-spacing="1.5">PRECEDENCE GRAPH</text>
  <circle cx="144.0" cy="405" r="26" fill="#bc8cff" fill-opacity="0.14" stroke="#bc8cff" stroke-opacity=".8" stroke-width="1.5"/>
  <circle cx="304.0" cy="405" r="26" fill="#39c5cf" fill-opacity="0.14" stroke="#39c5cf" stroke-opacity=".8" stroke-width="1.5"/>
  <text x="144.0" y="410" font-size="15" fill="#d2a8ff" font-weight="700" text-anchor="middle">T1</text>
  <text x="304.0" y="410" font-size="15" fill="#56d4dd" font-weight="700" text-anchor="middle">T2</text>
  <line x1="172.0" y1="405" x2="274.0" y2="405" stroke="#58a6ff" stroke-width="2" marker-end="url(#a-blue)"/>
  <rect x="444" y="318" width="432" height="146" rx="10" fill="#3fb950" fill-opacity="0.1" stroke="#3fb950" stroke-opacity="0.7"/>
  <text x="464" y="370" font-size="15" fill="#e6edf3" font-weight="600">No cycle  →  <tspan fill="#56d364" font-weight="700">✓ Conflict Serializable!</tspan></text>
  <text x="464" y="408" font-size="13.5" fill="#c9d1d9">Equivalent to serial schedule:</text>
  <text x="464" y="432" font-size="14" fill="#e6edf3" font-weight="600" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">T1, T2</text>
</svg>
