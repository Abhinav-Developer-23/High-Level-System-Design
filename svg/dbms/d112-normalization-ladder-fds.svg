<svg xmlns="http://www.w3.org/2000/svg" width="760" height="344" viewBox="0 0 760 344" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Normalization and functional dependencies</title>
  <desc>1NF removes repeating groups; 2NF removes partial dependencies; 3NF removes transitive dependencies; BCNF requires every determinant to be a candidate key.</desc>
  <defs>
    <marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d29922"/></marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/></marker>
    <marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39c5cf"/></marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker>
    </defs>
  <rect x="0.5" y="0.5" width="759" height="343" rx="14" fill="#161b22" stroke="#30363d"/>
  <rect x="24" y="24" width="712" height="46" rx="10" fill="#1c2128" stroke="#30363d"/>
  <rect x="44.0" y="34.0" width="72" height="26" rx="13.0" fill="#58a6ff" fill-opacity=".14" stroke="#58a6ff" stroke-opacity=".6"/>
  <text x="80" y="51.68" fill="#79c0ff" font-size="13" font-weight="600" text-anchor="middle">1NF</text>
  <text x="140" y="52" fill="#e6edf3" font-size="14" font-weight="600">Remove repeating groups (atomic values)</text>
  <line x1="80" y1="72" x2="80" y2="94" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <rect x="24" y="96" width="712" height="66" rx="10" fill="#1c2128" stroke="#30363d"/>
  <rect x="44.0" y="106.0" width="72" height="26" rx="13.0" fill="#bc8cff" fill-opacity=".14" stroke="#bc8cff" stroke-opacity=".6"/>
  <text x="80" y="123.68" fill="#d2a8ff" font-size="13" font-weight="600" text-anchor="middle">2NF</text>
  <text x="140" y="124" fill="#e6edf3" font-size="14" font-weight="600">Remove PARTIAL dependencies</text>
  <text x="140" y="146" fill="#8b949e" font-size="13">(every non-key attr must depend on the FULL primary key)</text>
  <line x1="80" y1="164" x2="80" y2="186" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <rect x="24" y="188" width="712" height="66" rx="10" fill="#1c2128" stroke="#30363d"/>
  <rect x="44.0" y="198.0" width="72" height="26" rx="13.0" fill="#39c5cf" fill-opacity=".14" stroke="#39c5cf" stroke-opacity=".6"/>
  <text x="80" y="215.68" fill="#56d4dd" font-size="13" font-weight="600" text-anchor="middle">3NF</text>
  <text x="140" y="216" fill="#e6edf3" font-size="14" font-weight="600">Remove TRANSITIVE dependencies</text>
  <text x="140" y="238" fill="#8b949e" font-size="13">(non-key attr must depend ONLY on the key, not through another non-key attr)</text>
  <line x1="80" y1="256" x2="80" y2="278" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <rect x="24" y="280" width="712" height="46" rx="10" fill="#1c2128" stroke="#30363d"/>
  <rect x="44.0" y="290.0" width="72" height="26" rx="13.0" fill="#3fb950" fill-opacity=".14" stroke="#3fb950" stroke-opacity=".6"/>
  <text x="80" y="307.68" fill="#56d364" font-size="13" font-weight="600" text-anchor="middle">BCNF</text>
  <text x="140" y="308" fill="#e6edf3" font-size="14" font-weight="600">Every determinant must be a candidate key</text>
</svg>
