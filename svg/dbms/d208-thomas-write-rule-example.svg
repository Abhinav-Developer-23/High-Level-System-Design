<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Thomas' Write Rule example</title>
  <desc>T2 (TS=2) writes X, setting W-TS(X)=2. Then T1 (TS=1) tries to write X. The normal rule rolls back T1; Thomas' rule ignores T1's write and continues. X keeps T2's value, which would have overwritten T1 anyway. Abbreviations: TS(Ti) = Timestamp of transaction Ti (when Ti started; smaller = older); W-TS(X) = Write Timestamp of data item X (TS of the youngest transaction that has written X).</desc>
  <rect x="0.5" y="0.5" width="759" height="449" rx="14" fill="#161b22" stroke="#30363d"/>

  <text x="24" y="38" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">EXAMPLE</text>

  <!-- lane headers -->
  <rect x="24" y="52" width="200" height="34" rx="8" fill="#bc8cff" fill-opacity=".14" stroke="#bc8cff" stroke-opacity=".55"/>
  <text x="124" y="74" fill="#d2a8ff" font-size="14" font-weight="600" text-anchor="middle">T1 (TS=1)</text>
  <rect x="232" y="52" width="200" height="34" rx="8" fill="#39c5cf" fill-opacity=".14" stroke="#39c5cf" stroke-opacity=".55"/>
  <text x="332" y="74" fill="#56d4dd" font-size="14" font-weight="600" text-anchor="middle">T2 (TS=2)</text>
  <rect x="440" y="52" width="110" height="34" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="495" y="74" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">W-TS(X)</text>

  <!-- lane tints -->
  <rect x="24" y="92" width="200" height="96" rx="8" fill="#bc8cff" fill-opacity=".05"/>
  <rect x="232" y="92" width="200" height="96" rx="8" fill="#39c5cf" fill-opacity=".05"/>
  <rect x="440" y="92" width="110" height="96" rx="8" fill="#8b949e" fill-opacity=".05"/>
  <line x1="24" y1="140" x2="736" y2="140" stroke="#21262d"/>

  <!-- row 1 -->
  <rect x="282" y="100" width="100" height="30" rx="6" fill="#39c5cf" fill-opacity=".16" stroke="#39c5cf" stroke-opacity=".7"/>
  <text x="332" y="120" fill="#e6edf3" font-size="13" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">Write(X)</text>
  <text x="495" y="121" fill="#e6edf3" font-size="15" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">2</text>
  <text x="572" y="120" fill="#8b949e" font-size="12.5">T2 writes X</text>

  <!-- row 2 -->
  <rect x="74" y="148" width="100" height="30" rx="6" fill="#d29922" fill-opacity=".14" stroke="#d29922" stroke-opacity=".8"/>
  <text x="124" y="168" fill="#e6edf3" font-size="13" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">Write(X)</text>
  <text x="495" y="169" fill="#e3b341" font-size="15" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">?</text>

  <!-- verdict: normal rule -->
  <rect x="24" y="210" width="712" height="44" rx="10" fill="#f85149" fill-opacity=".10" stroke="#f85149" stroke-opacity=".7"/>
  <text x="44" y="237" fill="#ff7b72" font-size="14" font-weight="700">Normal rule:</text>
  <text x="170" y="237" fill="#e6edf3" font-size="13" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">TS(T1)=1 &lt; W-TS(X)=2</text>
  <text x="352" y="237" fill="#c9d1d9" font-size="13.5">→  <tspan fill="#ff7b72" font-weight="700">ROLLBACK T1  ✗</tspan></text>

  <!-- verdict: Thomas -->
  <rect x="24" y="266" width="712" height="44" rx="10" fill="#3fb950" fill-opacity=".12" stroke="#3fb950" stroke-opacity=".75"/>
  <text x="44" y="293" fill="#56d364" font-size="14" font-weight="700">Thomas' rule:</text>
  <text x="170" y="293" fill="#e6edf3" font-size="13" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">TS(T1)=1 &lt; W-TS(X)=2</text>
  <text x="352" y="293" fill="#c9d1d9" font-size="13.5">→  <tspan fill="#56d364" font-weight="700">IGNORE T1's write, continue  ✓</tspan></text>

  <!-- result -->
  <rect x="24" y="330" width="712" height="48" rx="10" fill="#1c2128" stroke="#30363d"/>
  <text x="44" y="359" fill="#c9d1d9" font-size="13.5"><tspan fill="#e6edf3" font-weight="700">Result:</tspan>  X keeps <tspan fill="#56d4dd" font-weight="600">T2's value</tspan>  (which would have overwritten T1 anyway)</text>
  <rect x="24" y="394" width="712" height="32" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="40" y="414.5" font-size="12" fill="#8b949e"><tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" fill="#79c0ff">TS(Ti)</tspan> = Timestamp of transaction Ti<tspan fill="#484f58">&#160;&#160;&#160;·&#160;&#160;&#160;</tspan><tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" fill="#79c0ff">W-TS(X)</tspan> = Write Timestamp of X</text>
</svg>
