<svg xmlns="http://www.w3.org/2000/svg" width="600" height="404" viewBox="0 0 600 404" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Consistency check flow</title>
  <desc>Transaction starts, operations execute, then constraints are checked. A violation leads to ROLLBACK; no violation leads to COMMIT.</desc>
  <defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d29922"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39c5cf"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs>
  <rect x="0.5" y="0.5" width="599" height="403" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="24" y="38" font-size="12" fill="#8b949e" font-weight="700" letter-spacing="1.5">CONSISTENCY CHECK FLOW</text>
  <rect x="70" y="58" width="200" height="38" rx="19" fill="#58a6ff" fill-opacity="0.14" stroke="#58a6ff" stroke-opacity="0.7"/>
  <text x="170" y="82" font-size="13.5" fill="#79c0ff" font-weight="600" text-anchor="middle">Transaction starts</text>
  <line x1="170" y1="96" x2="170" y2="124" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <rect x="70" y="128" width="200" height="40" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="170" y="153" font-size="13.5" fill="#e6edf3" font-weight="600" text-anchor="middle">Execute operations</text>
  <line x1="170" y1="168" x2="170" y2="196" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <rect x="70" y="200" width="200" height="44" rx="8" fill="#d29922" fill-opacity="0.12" stroke="#d29922" stroke-opacity="0.7"/>
  <text x="170" y="227" font-size="13.5" fill="#e3b341" font-weight="600" text-anchor="middle">Check constraints</text>
  <line x1="270" y1="222" x2="398" y2="222" stroke="#f85149" stroke-width="1.8" marker-end="url(#a-red)"/>
  <text x="335" y="212" font-size="13" fill="#ff7b72" font-weight="600" text-anchor="middle">Violation?</text>
  <rect x="402" y="202" width="170" height="40" rx="20" fill="#f85149" fill-opacity="0.14" stroke="#f85149" stroke-opacity="0.7"/>
  <text x="487" y="227" font-size="14" fill="#ff7b72" font-weight="700" text-anchor="middle">ROLLBACK ✗</text>
  <line x1="170" y1="244" x2="170" y2="336" stroke="#3fb950" stroke-width="1.8" marker-end="url(#a-green)"/>
  <rect x="114" y="276" width="112" height="26" rx="13" fill="#161b22" stroke="#3fb950"/>
  <text x="170" y="294" font-size="12.5" fill="#56d364" font-weight="600" text-anchor="middle">No violation</text>
  <rect x="85" y="340" width="170" height="40" rx="20" fill="#3fb950" fill-opacity="0.14" stroke="#3fb950" stroke-opacity="0.7"/>
  <text x="170" y="365" font-size="14" fill="#56d364" font-weight="700" text-anchor="middle">COMMIT ✓</text>
</svg>
