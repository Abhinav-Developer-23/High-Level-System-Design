<svg xmlns="http://www.w3.org/2000/svg" width="580" height="300" viewBox="0 0 580 300" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Clustered (PK) vs non-clustered (UQ) index</title>
  <desc>Clustered index on PK emp_id: data rows 1, 2, 3, 4 are stored physically in this order. Non-clustered index on UQ email: alice@co points to row 1, bob@co to row 2, carol@co to row 3; the index points to the row location.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="579" height="299" rx="14" fill="#161b22" stroke="#30363d"/>

  <!-- Clustered -->
  <text x="32" y="44" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">CLUSTERED</text>
  <text x="128" y="44" fill="#79c0ff" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">(PK = emp_id)</text>
  <rect x="32" y="60" width="256" height="44" rx="8" fill="#3fb950" fill-opacity=".10" stroke="#3fb950" stroke-opacity=".7"/>
  <line x1="96" y1="60" x2="96" y2="104" stroke="#3fb950" stroke-opacity=".5"/>
  <line x1="160" y1="60" x2="160" y2="104" stroke="#3fb950" stroke-opacity=".5"/>
  <line x1="224" y1="60" x2="224" y2="104" stroke="#3fb950" stroke-opacity=".5"/>
  <g font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="middle">
    <text x="64" y="87">1</text><text x="128" y="87">2</text><text x="192" y="87">3</text><text x="256" y="87">4</text>
  </g>
  <line x1="350" y1="82" x2="298" y2="82" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="362" y="87" fill="#c9d1d9" font-size="13">data physically in this order</text>

  <line x1="32" y1="132" x2="548" y2="132" stroke="#21262d"/>

  <!-- Non-clustered -->
  <text x="32" y="166" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">NON-CLUSTERED</text>
  <text x="160" y="166" fill="#79c0ff" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">(UQ = email)</text>
  <rect x="32" y="182" width="220" height="96" rx="8" fill="#1c2128" stroke="#58a6ff" stroke-opacity=".7"/>
  <line x1="172" y1="182" x2="172" y2="278" stroke="#30363d"/>
  <line x1="32" y1="214" x2="252" y2="214" stroke="#21262d"/>
  <line x1="32" y1="246" x2="252" y2="246" stroke="#21262d"/>
  <g font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="13" fill="#79c0ff">
    <text x="46" y="203">alice@co</text>
    <text x="46" y="235">bob@co</text>
    <text x="46" y="267">carol@co</text>
  </g>
  <g font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="13" fill="#e6edf3">
    <text x="188" y="203"><tspan fill="#8b949e">→</tspan> 1</text>
    <text x="188" y="235"><tspan fill="#8b949e">→</tspan> 2</text>
    <text x="188" y="267"><tspan fill="#8b949e">→</tspan> 3</text>
  </g>
  <line x1="314" y1="198" x2="262" y2="198" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="326" y="203" fill="#c9d1d9" font-size="13">index points to row location</text>
</svg>
