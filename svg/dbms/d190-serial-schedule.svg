<svg xmlns="http://www.w3.org/2000/svg" width="448" height="458" viewBox="0 0 448 458" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Serial schedule</title>
  <desc>T1 runs R(A), W(A), R(B), W(B), COMMIT at times 1-5, then T2 runs the same operations at times 6-10 with no interleaving.</desc>
