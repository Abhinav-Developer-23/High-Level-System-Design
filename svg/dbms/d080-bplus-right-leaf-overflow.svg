<svg xmlns="http://www.w3.org/2000/svg" width="600" height="206" viewBox="0 0 600 206" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>B+ Tree right leaf overflow</title>
  <desc>After inserting 50 and 60, root [30] has leaves [10, 20] and [30, 40, 50, 60]. The right leaf now has 4 keys, which is an overflow.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="599" height="205" rx="14" fill="#161b22" stroke="#30363d"/>

  <text x="32" y="42" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">AFTER INSERTING <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" letter-spacing="0" font-weight="400" fill="#79c0ff">50, 60</tspan></text>

  <g stroke="#8b949e" stroke-width="1.5">
    <line x1="160" y1="100" x2="98" y2="138" marker-end="url(#arr)"/>
    <line x1="180" y1="100" x2="238" y2="138" marker-end="url(#arr)"/>
  </g>
  <rect x="146" y="60" width="48" height="38" rx="8" fill="#58a6ff" fill-opacity=".12" stroke="#58a6ff" stroke-opacity=".8"/>
  <text x="170" y="84" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">30</text>

  <rect x="54" y="142" width="88" height="38" rx="8" fill="#39c5cf" fill-opacity=".10" stroke="#39c5cf" stroke-opacity=".8"/>
  <line x1="98" y1="142" x2="98" y2="180" stroke="#39c5cf" stroke-opacity=".4"/>
  <rect x="160" y="142" width="176" height="38" rx="8" fill="#f85149" fill-opacity=".12" stroke="#f85149" stroke-width="1.5"/>
  <g stroke="#f85149" stroke-opacity=".4"><line x1="204" y1="142" x2="204" y2="180"/><line x1="248" y1="142" x2="248" y2="180"/><line x1="292" y1="142" x2="292" y2="180"/></g>
  <g font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">
    <text x="76" y="166">10</text><text x="120" y="166">20</text>
    <text x="182" y="166">30</text><text x="226" y="166">40</text><text x="270" y="166" fill="#ff7b72">50</text><text x="314" y="166" fill="#ff7b72">60</text>
  </g>
  <line x1="388" y1="161" x2="344" y2="161" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="396" y="156" fill="#c9d1d9" font-size="13">This leaf now has 4 keys</text>
  <text x="396" y="175" fill="#ff7b72" font-size="13" font-weight="700">⚠ OVERFLOW!</text>
</svg>
