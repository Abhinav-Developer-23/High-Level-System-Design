<svg xmlns="http://www.w3.org/2000/svg" width="560" height="92" viewBox="0 0 560 92" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Simplistic lock protocol</title>
  <desc>T1 locks A, writes A, then unlocks A.</desc>
  <defs>
    <marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker>
    <marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker>
    <marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d29922"/></marker>
    <marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/></marker>
    <marker id="m-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39c5cf"/></marker>
    <marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker>
    <marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="559" height="91" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="24" y="51" font-size="15" fill="#d2a8ff" font-weight="700" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">T1:</text>
  <rect x="70" y="26" width="130" height="40" rx="8" fill="#d29922" fill-opacity="0.13" stroke="#d29922" stroke-opacity="0.6"/>
  <text x="135.0" y="51" font-size="14" fill="#e3b341" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">Lock(A)</text>
  <line x1="200" y1="46" x2="232" y2="46" stroke="#8b949e" stroke-width="1.8" marker-end="url(#m-gray)"/>
  <rect x="236" y="26" width="130" height="40" rx="8" fill="#bc8cff" fill-opacity="0.13" stroke="#bc8cff" stroke-opacity="0.6"/>
  <text x="301.0" y="51" font-size="14" fill="#d2a8ff" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">Write(A)</text>
  <line x1="366" y1="46" x2="398" y2="46" stroke="#8b949e" stroke-width="1.8" marker-end="url(#m-gray)"/>
  <rect x="402" y="26" width="130" height="40" rx="8" fill="#3fb950" fill-opacity="0.13" stroke="#3fb950" stroke-opacity="0.6"/>
  <text x="467.0" y="51" font-size="14" fill="#56d364" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">Unlock(A)</text>
</svg>
