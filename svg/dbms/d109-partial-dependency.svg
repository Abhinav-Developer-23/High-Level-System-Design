<svg xmlns="http://www.w3.org/2000/svg" width="620" height="252" viewBox="0 0 620 252" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Partial dependency</title>
  <desc>{roll_no, course_id} → name is a partial dependency: roll_no alone determines name, course_id is extra and not needed.</desc>
  <defs>
    <marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d29922"/></marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/></marker>
    <marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39c5cf"/></marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker>
    </defs>
  <rect x="0.5" y="0.5" width="619" height="251" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="32" y="38" fill="#e6edf3" font-size="15" font-weight="600">Partial Dependency:</text>
  <rect x="40" y="56" width="210" height="36" rx="8" fill="#58a6ff" fill-opacity="0.12" stroke="#58a6ff" stroke-opacity="0.65"/>
  <text x="56" y="79" fill="#e6edf3" font-size="13" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">{<tspan fill="#56d364" font-weight="700">roll_no</tspan>, <tspan fill="#8b949e">course_id</tspan>}</text>
  <line x1="250" y1="74" x2="306" y2="74" stroke="#d29922" stroke-width="1.6" marker-end="url(#a-amber)"/>
  <rect x="312" y="56" width="62" height="36" rx="8" fill="#d29922" fill-opacity="0.12" stroke="#d29922" stroke-opacity="0.65"/>
  <text x="343.0" y="78.68" fill="#e3b341" font-size="13" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">name</text>
  <line x1="92" y1="150" x2="92" y2="96" stroke="#3fb950" stroke-width="1.6" marker-end="url(#a-green)"/>
  <rect x="56" y="150" width="400" height="82" rx="10" fill="#d29922" fill-opacity="0.08" stroke="#d29922" stroke-opacity="0.5"/>
  <text x="76" y="174" fill="#c9d1d9" font-size="13"><tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none" fill="#79c0ff">roll_no</tspan> alone → <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none" fill="#79c0ff">name</tspan>  <tspan fill="#56d364" font-weight="700">✓</tspan></text>
  <text x="76" y="196" fill="#c9d1d9" font-size="13"><tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none" fill="#8b949e">course_id</tspan> is EXTRA, not needed</text>
  <text x="76" y="218" fill="#c9d1d9" font-size="13">→ This is a <tspan font-weight="700" fill="#e3b341">PARTIAL</tspan> dependency</text>
</svg>
