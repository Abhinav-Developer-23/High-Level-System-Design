<svg xmlns="http://www.w3.org/2000/svg" width="860" height="288" viewBox="0 0 860 288" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Timestamp ordering example</title>
  <desc>T1 (TS=1) reads X, T2 (TS=2) reads X raising R-TS(X) to 2, then T1's write of X is rejected because TS(T1)=1 &lt; R-TS=2: T2 already read the old X.</desc>
  <defs>
    <marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker>
    <marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker>
    <marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d29922"/></marker>
    <marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/></marker>
    <marker id="m-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39c5cf"/></marker>
    <marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker>
    <marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="859" height="287" rx="14" fill="#161b22" stroke="#30363d"/>
  <rect x="26" y="24" width="136" height="240" rx="6" fill="#bc8cff" fill-opacity="0.05" stroke="none"/>
  <rect x="166" y="24" width="136" height="240" rx="6" fill="#39c5cf" fill-opacity="0.05" stroke="none"/>
  <text x="94" y="46" font-size="14" fill="#d2a8ff" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">T1 (TS=1)</text>
  <text x="234" y="46" font-size="14" fill="#56d4dd" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">T2 (TS=2)</text>
  <text x="354" y="46" font-size="13" fill="#8b949e" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">W-TS(X)</text>
  <text x="454" y="46" font-size="13" fill="#8b949e" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">R-TS(X)</text>
  <line x1="24" y1="58" x2="836" y2="58" stroke="#30363d"/>
  <text x="354" y="82" font-size="14" fill="#8b949e" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">0</text>
  <text x="454" y="82" font-size="14" fill="#8b949e" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">0</text>
  <line x1="24" y1="96" x2="836" y2="96" stroke="#21262d"/>
  <rect x="48" y="103.0" width="92" height="24" rx="6" fill="#bc8cff" fill-opacity="0.14" stroke="#bc8cff" stroke-opacity="0.55"/>
  <text x="94.0" y="119.5" font-size="13" fill="#d2a8ff" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">Read(X)</text>
  <text x="354" y="120" font-size="14" fill="#e6edf3" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">0</text>
  <text x="454" y="120" font-size="14" fill="#79c0ff" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">1</text>
  <text x="522" y="120" font-size="13" fill="#c9d1d9"><tspan fill="#56d364" font-weight="700">✓  </tspan><tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="12.5">(TS(T1)=1 &gt;= W-TS=0)</tspan></text>
  <line x1="24" y1="134" x2="836" y2="134" stroke="#21262d"/>
  <rect x="188" y="141.0" width="92" height="24" rx="6" fill="#39c5cf" fill-opacity="0.14" stroke="#39c5cf" stroke-opacity="0.55"/>
  <text x="234.0" y="157.5" font-size="13" fill="#56d4dd" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">Read(X)</text>
  <text x="354" y="158" font-size="14" fill="#e6edf3" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">0</text>
  <text x="454" y="158" font-size="14" fill="#79c0ff" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">2</text>
  <text x="522" y="158" font-size="13" fill="#c9d1d9"><tspan fill="#56d364" font-weight="700">✓  </tspan><tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="12.5">(TS(T2)=2 &gt;= W-TS=0)</tspan></text>
  <line x1="24" y1="172" x2="836" y2="172" stroke="#21262d"/>
  <rect x="24" y="175" width="812" height="86" rx="8" fill="#f85149" fill-opacity="0.1" stroke="#f85149" stroke-opacity="0.45"/>
  <rect x="48" y="179.0" width="92" height="24" rx="6" fill="#f85149" fill-opacity="0.14" stroke="#f85149" stroke-opacity="0.55"/>
  <text x="94.0" y="195.5" font-size="13" fill="#ff7b72" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">Write(X)</text>
  <text x="354" y="196" font-size="14" fill="#ff7b72" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">?</text>
  <text x="454" y="196" font-size="14" fill="#ff7b72" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">?</text>
  <text x="522" y="196" font-size="14" fill="#ff7b72" font-weight="700">✗  REJECT!</text>
  <text x="542" y="221" font-size="12.5" fill="#c9d1d9" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">(TS(T1)=1 &lt; R-TS=2)</text>
  <text x="542" y="243" font-size="13" fill="#c9d1d9"><tspan fill="#56d4dd" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-weight="600">T2</tspan> already read old X</text>
</svg>
