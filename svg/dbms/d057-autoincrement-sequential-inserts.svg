<svg xmlns="http://www.w3.org/2000/svg" width="780" height="278" viewBox="0 0 780 278" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Auto-increment sequential inserts</title>
  <desc>Inserts id=1001, 1002, 1003 each go to the end of the tree and append. B+ Tree leaf pages are sequential and orderly: [1-500] then [501-1000] then [1001-1003, ...], which is always where appends happen.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="779" height="277" rx="14" fill="#161b22" stroke="#30363d"/>

  <text x="32" y="44" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">INSERTS</text>
  <g font-size="13">
    <text x="32" y="74" fill="#79c0ff" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">Insert id=1001:</text>
    <text x="32" y="98" fill="#79c0ff" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">Insert id=1002:</text>
    <text x="32" y="122" fill="#79c0ff" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">Insert id=1003:</text>
    <text x="32" y="144" fill="#8b949e" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">...</text>
    <text x="184" y="74" fill="#c9d1d9">goes to the <tspan fill="#56d364" font-weight="700">END</tspan> of the tree <tspan fill="#8b949e">→</tspan> append</text>
    <text x="184" y="98" fill="#c9d1d9">goes to the <tspan fill="#56d364" font-weight="700">END</tspan> of the tree <tspan fill="#8b949e">→</tspan> append</text>
    <text x="184" y="122" fill="#c9d1d9">goes to the <tspan fill="#56d364" font-weight="700">END</tspan> of the tree <tspan fill="#8b949e">→</tspan> append</text>
  </g>

  <line x1="32" y1="166" x2="748" y2="166" stroke="#21262d"/>
  <text x="32" y="194" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">B+ TREE LEAF PAGES</text>
  <text x="196" y="194" fill="#8b949e" font-size="12">(sequential, orderly)</text>

  <g font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="13" text-anchor="middle">
    <rect x="32" y="212" width="120" height="40" rx="8" fill="#1c2128" stroke="#30363d"/>
    <text x="92" y="237" fill="#e6edf3">1-500</text>
    <rect x="186" y="212" width="130" height="40" rx="8" fill="#1c2128" stroke="#30363d"/>
    <text x="251" y="237" fill="#e6edf3">501-1000</text>
    <rect x="350" y="212" width="190" height="40" rx="8" fill="#3fb950" fill-opacity=".12" stroke="#3fb950"/>
    <text x="445" y="237" fill="#56d364" font-weight="600">1001-1003, ...</text>
  </g>
  <line x1="152" y1="232" x2="182" y2="232" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="316" y1="232" x2="346" y2="232" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="590" y1="232" x2="546" y2="232" stroke="#3fb950" stroke-width="1.8" marker-end="url(#arrG)"/>
  <text x="598" y="237" fill="#56d364" font-size="13" font-weight="600">always appending here</text>
</svg>
