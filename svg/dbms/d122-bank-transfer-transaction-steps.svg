<svg xmlns="http://www.w3.org/2000/svg" width="680" height="346" viewBox="0 0 680 346" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Bank transfer transaction steps</title>
  <desc>Transaction T transfers 500 from A to B: read A (1000), subtract 500, write A = 500, read B (2000), add 500, write B = 2500, commit to make permanent.</desc>
  <defs>
    <marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d29922"/></marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/></marker>
    <marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39c5cf"/></marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker>
    </defs>
  <rect x="0.5" y="0.5" width="679" height="345" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="32" y="38" fill="#e6edf3" font-size="15" font-weight="600">Transaction T:</text>
  <rect x="32" y="56" width="616" height="32" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="48" y="77" fill="#8b949e" font-size="13" font-weight="600">Step 1:</text>
  <text x="130" y="77" fill="#56d4dd" font-size="13" font-weight="600" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">Read(A)</text>
  <line x1="300" y1="72" x2="336" y2="72" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <text x="350" y="77" fill="#e6edf3" font-size="13" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">A = 1000</text>
  <rect x="32" y="94" width="616" height="32" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="48" y="115" fill="#8b949e" font-size="13" font-weight="600">Step 2:</text>
  <text x="130" y="115" fill="#d2a8ff" font-size="13" font-weight="600" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">A = A - 500</text>
  <line x1="300" y1="110" x2="336" y2="110" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <text x="350" y="115" fill="#e6edf3" font-size="13" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">A = 500</text>
  <rect x="32" y="132" width="616" height="32" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="48" y="153" fill="#8b949e" font-size="13" font-weight="600">Step 3:</text>
  <text x="130" y="153" fill="#79c0ff" font-size="13" font-weight="600" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">Write(A)</text>
  <line x1="300" y1="148" x2="336" y2="148" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <text x="350" y="153" fill="#e6edf3" font-size="13" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">Save A = 500</text>
  <rect x="32" y="170" width="616" height="32" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="48" y="191" fill="#8b949e" font-size="13" font-weight="600">Step 4:</text>
  <text x="130" y="191" fill="#56d4dd" font-size="13" font-weight="600" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">Read(B)</text>
  <line x1="300" y1="186" x2="336" y2="186" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <text x="350" y="191" fill="#e6edf3" font-size="13" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">B = 2000</text>
  <rect x="32" y="208" width="616" height="32" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="48" y="229" fill="#8b949e" font-size="13" font-weight="600">Step 5:</text>
  <text x="130" y="229" fill="#d2a8ff" font-size="13" font-weight="600" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">B = B + 500</text>
  <line x1="300" y1="224" x2="336" y2="224" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <text x="350" y="229" fill="#e6edf3" font-size="13" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">B = 2500</text>
  <rect x="32" y="246" width="616" height="32" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="48" y="267" fill="#8b949e" font-size="13" font-weight="600">Step 6:</text>
  <text x="130" y="267" fill="#79c0ff" font-size="13" font-weight="600" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">Write(B)</text>
  <line x1="300" y1="262" x2="336" y2="262" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <text x="350" y="267" fill="#e6edf3" font-size="13" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">Save B = 2500</text>
  <rect x="32" y="284" width="616" height="32" rx="8" fill="#3fb950" fill-opacity="0.12" stroke="#3fb950" stroke-opacity="0.6"/>
  <text x="48" y="305" fill="#8b949e" font-size="13" font-weight="600">Step 7:</text>
  <text x="130" y="305" fill="#56d364" font-size="13" font-weight="600" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">COMMIT</text>
  <line x1="300" y1="300" x2="336" y2="300" stroke="#3fb950" stroke-width="1.6" marker-end="url(#a-green)"/>
  <text x="350" y="305" fill="#56d364" font-size="13" font-weight="600">Make permanent</text>
</svg>
