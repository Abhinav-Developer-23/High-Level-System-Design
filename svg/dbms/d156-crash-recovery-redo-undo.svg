<svg xmlns="http://www.w3.org/2000/svg" width="880" height="592" viewBox="0 0 880 592" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Crash recovery: redo and undo</title>
  <desc>Server restarts after a crash: 1 find last checkpoint LSN; 2 scan redo log forward, stopping at first bad checksum (torn tail = never happened, crash B); 3 REDO each record whose page_LSN &lt; record_LSN, otherwise skip (crash C, D, E); 4 UNDO transactions with no COMMIT record (crash A, B); then accept connections.</desc>
  <defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d29922"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39c5cf"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs>
  <rect x="0.5" y="0.5" width="879" height="591" rx="14" fill="#161b22" stroke="#30363d"/>
  <rect x="155.0" y="24" width="250" height="28" rx="14.0" fill="#58a6ff" fill-opacity="0.14" stroke="#58a6ff" stroke-opacity="0.6"/>
  <text x="280.0" y="42.68" fill="#79c0ff" font-size="13" font-weight="600" text-anchor="middle">Server restarts after a crash</text>
  <line x1="280.0" y1="52" x2="280.0" y2="74" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a-gray)"/>
  <rect x="40" y="78" width="480" height="52" rx="10" fill="#1c2128" stroke="#30363d"/>
  <text x="58" y="104" fill="#e6edf3" font-size="14.5" font-weight="600"><tspan fill="#8b949e" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">1.</tspan> Find the last <tspan fill="#56d4dd">CHECKPOINT LSN</tspan></text>
  <line x1="524" y1="104.0" x2="548" y2="104.0" stroke="#484f58" stroke-width="1.2" stroke-dasharray="3 4"/>
  <text x="556" y="98.0" fill="#c9d1d9" font-size="13">everything before it is already</text>
  <text x="556" y="118.0" fill="#c9d1d9" font-size="13">safely in the data files</text>
  <line x1="280.0" y1="130" x2="280.0" y2="152" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a-gray)"/>
  <rect x="40" y="156" width="480" height="72" rx="10" fill="#d29922" fill-opacity="0.1" stroke="#d29922" stroke-opacity="0.6"/>
  <text x="58" y="182" fill="#e6edf3" font-size="14.5" font-weight="600"><tspan fill="#8b949e" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">2.</tspan> Scan the redo log forward from there</text>
  <text x="88" y="202" fill="#c9d1d9" font-size="13"><tspan fill="#e3b341" font-weight="700">STOP</tspan> at the first block with a bad checksum</text>
  <line x1="524" y1="192.0" x2="548" y2="192.0" stroke="#484f58" stroke-width="1.2" stroke-dasharray="3 4"/>
  <text x="556" y="186.0" fill="#c9d1d9" font-size="13">a torn / half-written tail</text>
  <text x="556" y="206.0" fill="#c9d1d9" font-size="13">= never happened  <tspan fill="#e3b341" font-weight="600">(crash B)</tspan></text>
  <line x1="280.0" y1="228" x2="280.0" y2="250" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a-gray)"/>
  <rect x="40" y="254" width="480" height="96" rx="10" fill="#3fb950" fill-opacity="0.1" stroke="#3fb950" stroke-opacity="0.6"/>
  <text x="58" y="280" fill="#e6edf3" font-size="14.5" font-weight="600"><tspan fill="#8b949e" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">3.</tspan> <tspan fill="#56d364" font-weight="700">REDO</tspan>: for each record</text>
  <text x="88" y="306" fill="#79c0ff" font-size="12.5" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">page_LSN &lt; record_LSN</text>
  <text x="276" y="306" fill="#8b949e" font-size="13">→</text>
  <text x="300" y="306" fill="#56d364" font-size="13" font-weight="600">apply it</text>
  <text x="88" y="330" fill="#79c0ff" font-size="12.5" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">otherwise</text>
  <text x="276" y="330" fill="#8b949e" font-size="13">→</text>
  <text x="300" y="330" fill="#8b949e" font-size="13">skip (already on disk)</text>
  <line x1="524" y1="302" x2="548" y2="302" stroke="#484f58" stroke-width="1.2" stroke-dasharray="3 4"/>
  <text x="556" y="296" fill="#c9d1d9" font-size="13">brings every page up to date</text>
  <text x="556" y="316" fill="#c9d1d9" font-size="13"><tspan fill="#56d364" font-weight="600">(crash C, D, E)</tspan></text>
  <line x1="280.0" y1="350" x2="280.0" y2="372" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a-gray)"/>
  <rect x="40" y="376" width="480" height="72" rx="10" fill="#f85149" fill-opacity="0.1" stroke="#f85149" stroke-opacity="0.6"/>
  <text x="58" y="402" fill="#e6edf3" font-size="14.5" font-weight="600"><tspan fill="#8b949e" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">4.</tspan> <tspan fill="#ff7b72" font-weight="700">UNDO</tspan>: roll back every transaction that</text>
  <text x="88" y="422" fill="#c9d1d9" font-size="13">has no COMMIT record</text>
  <line x1="524" y1="412.0" x2="548" y2="412.0" stroke="#484f58" stroke-width="1.2" stroke-dasharray="3 4"/>
  <text x="556" y="406.0" fill="#c9d1d9" font-size="13">removes half-done work</text>
  <text x="556" y="426.0" fill="#c9d1d9" font-size="13"><tspan fill="#ff7b72" font-weight="600">(crash A, B)</tspan></text>
  <line x1="280.0" y1="448" x2="280.0" y2="470" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a-gray)"/>
  <rect x="40" y="474" width="480" height="94" rx="10" fill="#3fb950" fill-opacity="0.16" stroke="#3fb950" stroke-opacity="0.9" stroke-width="1.5"/>
  <text x="58" y="502" fill="#56d364" font-size="14.5" font-weight="700">Accept connections</text>
  <text x="58" y="526" fill="#c9d1d9" font-size="13">every transaction that was ACKed with "OK" is present,</text>
  <text x="58" y="546" fill="#c9d1d9" font-size="13">nothing else is</text>
</svg>
