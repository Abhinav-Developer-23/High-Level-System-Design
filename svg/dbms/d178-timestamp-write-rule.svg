<svg xmlns="http://www.w3.org/2000/svg" width="820" height="432" viewBox="0 0 820 432" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Timestamp ordering: write rule</title>
  <desc>Write(X) by Ti: if TS(Ti) &lt; R-TS(X) a later transaction already read the old X, reject. If TS(Ti) &lt; W-TS(X) a later transaction already wrote X, reject. Otherwise allow and set W-TS(X) = TS(Ti).</desc>
  <defs>
    <marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker>
    <marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker>
    <marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d29922"/></marker>
    <marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/></marker>
    <marker id="m-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39c5cf"/></marker>
    <marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker>
    <marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="819" height="431" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="24" y="40" font-size="12" fill="#8b949e" font-weight="700" letter-spacing="1.5">WRITE OPERATION BY Ti</text>
  <line x1="24" y1="54" x2="796" y2="54" stroke="#30363d"/>
  <rect x="24" y="74" width="250" height="98" rx="10" fill="#1c2128" stroke="#30363d"/>
  <text x="149.0" y="128.0" font-size="14" fill="#e6edf3" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">If TS(Ti) &lt; R-TS(X)</text>
  <line x1="274" y1="123.0" x2="310" y2="123.0" stroke="#f85149" stroke-width="1.8" marker-end="url(#m-red)"/>
  <rect x="314" y="74" width="482" height="98" rx="10" fill="#f85149" fill-opacity="0.1" stroke="#f85149" stroke-opacity="0.6"/>
  <text x="332" y="102" font-size="13" fill="#c9d1d9"><tspan fill="#8b949e">→  </tspan>A <tspan fill="#e6edf3" font-weight="700">LATER</tspan> transaction already read the old value of X</text>
  <text x="332" y="124" font-size="13" fill="#c9d1d9"><tspan fill="#8b949e">→  </tspan>Ti's write would invalidate that read</text>
  <text x="332" y="148" font-size="14" fill="#ff7b72" font-weight="700">✗  REJECT (rollback Ti)</text>
  <line x1="149" y1="172" x2="149" y2="196" stroke="#8b949e" stroke-width="1.5" marker-end="url(#m-gray)"/>
  <rect x="24" y="200" width="250" height="98" rx="10" fill="#1c2128" stroke="#30363d"/>
  <text x="149.0" y="254.0" font-size="14" fill="#e6edf3" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">If TS(Ti) &lt; W-TS(X)</text>
  <line x1="274" y1="249.0" x2="310" y2="249.0" stroke="#f85149" stroke-width="1.8" marker-end="url(#m-red)"/>
  <rect x="314" y="200" width="482" height="98" rx="10" fill="#f85149" fill-opacity="0.1" stroke="#f85149" stroke-opacity="0.6"/>
  <text x="332" y="228" font-size="13" fill="#c9d1d9"><tspan fill="#8b949e">→  </tspan>A <tspan fill="#e6edf3" font-weight="700">LATER</tspan> transaction already wrote X</text>
  <text x="332" y="250" font-size="13" fill="#c9d1d9"><tspan fill="#8b949e">→  </tspan>Ti's write is outdated</text>
  <text x="332" y="274" font-size="14" fill="#ff7b72" font-weight="700">✗  REJECT (rollback Ti)</text>
  <line x1="149" y1="298" x2="149" y2="322" stroke="#8b949e" stroke-width="1.5" marker-end="url(#m-gray)"/>
  <rect x="24" y="326" width="250" height="80" rx="10" fill="#1c2128" stroke="#30363d"/>
  <text x="149.0" y="371.0" font-size="14" fill="#e6edf3" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">Otherwise</text>
  <line x1="274" y1="366.0" x2="310" y2="366.0" stroke="#3fb950" stroke-width="1.8" marker-end="url(#m-green)"/>
  <rect x="314" y="326" width="482" height="80" rx="10" fill="#3fb950" fill-opacity="0.1" stroke="#3fb950" stroke-opacity="0.6"/>
  <text x="332" y="354" font-size="13" fill="#c9d1d9"><tspan fill="#8b949e">→  </tspan><tspan fill="#56d364" font-weight="700">ALLOW the write</tspan></text>
  <text x="332" y="376" font-size="13" fill="#c9d1d9"><tspan fill="#8b949e">→  </tspan>Update <tspan fill="#79c0ff" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">W-TS(X) = TS(Ti)</tspan></text>
</svg>
