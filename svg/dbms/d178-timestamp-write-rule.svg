<svg xmlns="http://www.w3.org/2000/svg" width="820" height="482" viewBox="0 0 820 482" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Timestamp ordering: write rule</title>
  <desc>Write(X) by Ti: if TS(Ti) &lt; R-TS(X) a later transaction already read the old X, reject. If TS(Ti) &lt; W-TS(X) a later transaction already wrote X, reject. Otherwise allow and set W-TS(X) = TS(Ti). Abbreviations: TS(Ti) = Timestamp of transaction Ti (when Ti started; smaller = older); R-TS(X) = Read Timestamp of data item X (TS of the youngest transaction that has read X); W-TS(X) = Write Timestamp of data item X (TS of the youngest transaction that has written X).</desc>
  <defs>
    <marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker>
    <marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker>
    <marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d29922"/></marker>
    <marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/></marker>
    <marker id="m-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39c5cf"/></marker>
    <marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker>
    <marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="819" height="481" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="24" y="40" font-size="12" fill="#8b949e" font-weight="700" letter-spacing="1.5">WRITE OPERATION BY Ti</text>
  <line x1="24" y1="54" x2="796" y2="54" stroke="#30363d"/>
  <rect x="24" y="74" width="290" height="98" rx="10" fill="#1c2128" stroke="#30363d"/>
  <text x="169" y="106" font-size="14" fill="#e6edf3" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">If TS(Ti) &lt; R-TS(X)</text>
  <text x="169" y="130" fill="#8b949e" font-size="12" text-anchor="middle">Timestamp of Ti &lt; Read Timestamp of X</text>
  <text x="169" y="149" fill="#8b949e" font-size="12" text-anchor="middle">→ a younger transaction already read X</text>
  <line x1="314" y1="123.0" x2="350" y2="123.0" stroke="#f85149" stroke-width="1.8" marker-end="url(#m-red)"/>
  <rect x="354" y="74" width="442" height="98" rx="10" fill="#f85149" fill-opacity="0.1" stroke="#f85149" stroke-opacity="0.6"/>
  <text x="372" y="102" font-size="13" fill="#c9d1d9"><tspan fill="#8b949e">→  </tspan>A <tspan fill="#e6edf3" font-weight="700">LATER</tspan> transaction already read the old value of X</text>
  <text x="372" y="124" font-size="13" fill="#c9d1d9"><tspan fill="#8b949e">→  </tspan>Ti's write would invalidate that read</text>
  <text x="372" y="148" font-size="14" fill="#ff7b72" font-weight="700">✗  REJECT (rollback Ti)</text>
  <line x1="169" y1="172" x2="169" y2="196" stroke="#8b949e" stroke-width="1.5" marker-end="url(#m-gray)"/>
  <rect x="24" y="200" width="290" height="98" rx="10" fill="#1c2128" stroke="#30363d"/>
  <text x="169" y="232" font-size="14" fill="#e6edf3" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">If TS(Ti) &lt; W-TS(X)</text>
  <text x="169" y="256" fill="#8b949e" font-size="12" text-anchor="middle">Timestamp of Ti &lt; Write Timestamp of X</text>
  <text x="169" y="275" fill="#8b949e" font-size="12" text-anchor="middle">→ Ti is older than X's last writer</text>
  <line x1="314" y1="249.0" x2="350" y2="249.0" stroke="#f85149" stroke-width="1.8" marker-end="url(#m-red)"/>
  <rect x="354" y="200" width="442" height="98" rx="10" fill="#f85149" fill-opacity="0.1" stroke="#f85149" stroke-opacity="0.6"/>
  <text x="372" y="228" font-size="13" fill="#c9d1d9"><tspan fill="#8b949e">→  </tspan>A <tspan fill="#e6edf3" font-weight="700">LATER</tspan> transaction already wrote X</text>
  <text x="372" y="250" font-size="13" fill="#c9d1d9"><tspan fill="#8b949e">→  </tspan>Ti's write is outdated</text>
  <text x="372" y="274" font-size="14" fill="#ff7b72" font-weight="700">✗  REJECT (rollback Ti)</text>
  <line x1="169" y1="298" x2="169" y2="322" stroke="#8b949e" stroke-width="1.5" marker-end="url(#m-gray)"/>
  <rect x="24" y="326" width="290" height="80" rx="10" fill="#1c2128" stroke="#30363d"/>
  <text x="169" y="360" font-size="14" fill="#e6edf3" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">Otherwise</text>
  <text x="169" y="381" fill="#8b949e" font-size="12" text-anchor="middle">(neither condition above holds)</text>
  <line x1="314" y1="366.0" x2="350" y2="366.0" stroke="#3fb950" stroke-width="1.8" marker-end="url(#m-green)"/>
  <rect x="354" y="326" width="442" height="80" rx="10" fill="#3fb950" fill-opacity="0.1" stroke="#3fb950" stroke-opacity="0.6"/>
  <text x="372" y="354" font-size="13" fill="#c9d1d9"><tspan fill="#8b949e">→  </tspan><tspan fill="#56d364" font-weight="700">ALLOW the write</tspan></text>
  <text x="372" y="376" font-size="13" fill="#c9d1d9"><tspan fill="#8b949e">→  </tspan>Update <tspan fill="#79c0ff" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">W-TS(X) = TS(Ti)</tspan></text>
  <rect x="24" y="426" width="772" height="32" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="40" y="446.5" font-size="12" fill="#8b949e"><tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" fill="#79c0ff">TS(Ti)</tspan> = Timestamp of transaction Ti<tspan fill="#484f58">&#160;&#160;&#160;·&#160;&#160;&#160;</tspan><tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" fill="#79c0ff">R-TS(X)</tspan> = Read Timestamp of X<tspan fill="#484f58">&#160;&#160;&#160;·&#160;&#160;&#160;</tspan><tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" fill="#79c0ff">W-TS(X)</tspan> = Write Timestamp of X</text>
</svg>
