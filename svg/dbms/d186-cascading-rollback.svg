<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Cascading rollback</title>
  <desc>T2 reads T1's write, T3 reads from T2. When T1 rolls back, T2 must roll back, then T3, and the cascade continues.</desc>
  <defs>
    <marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker>
    <marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker>
    <marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d29922"/></marker>
    <marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/></marker>
    <marker id="m-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39c5cf"/></marker>
    <marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker>
    <marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="719" height="359" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="24" y="40" font-size="15" fill="#e6edf3" font-weight="600">Cascading Rollback</text>
  <rect x="26" y="56" width="146" height="260" rx="6" fill="#bc8cff" fill-opacity="0.05" stroke="none"/>
  <rect x="176" y="56" width="146" height="260" rx="6" fill="#39c5cf" fill-opacity="0.05" stroke="none"/>
  <rect x="326" y="56" width="146" height="260" rx="6" fill="#f0883e" fill-opacity="0.05" stroke="none"/>
  <text x="99.0" y="77" font-size="14" fill="#d2a8ff" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">T1</text>
  <text x="249.0" y="77" font-size="14" fill="#56d4dd" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">T2</text>
  <text x="399.0" y="77" font-size="14" fill="#ffa657" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">T3</text>
  <line x1="24" y1="88" x2="474" y2="88" stroke="#30363d"/>
  <rect x="37.0" y="95.0" width="124" height="24" rx="6" fill="#bc8cff" fill-opacity="0.14" stroke="#bc8cff" stroke-opacity="0.55"/>
  <text x="99.0" y="111.5" font-size="13" fill="#d2a8ff" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">Write(X) = 50</text>
  <line x1="24" y1="126" x2="474" y2="126" stroke="#21262d"/>
  <rect x="191.0" y="133.0" width="116" height="24" rx="6" fill="#39c5cf" fill-opacity="0.14" stroke="#39c5cf" stroke-opacity="0.55"/>
  <text x="249.0" y="149.5" font-size="13" fill="#56d4dd" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">Read(X) = 50</text>
  <text x="490" y="149.5" font-size="13" fill="#c9d1d9"><tspan fill="#56d4dd" font-weight="600">T2</tspan> depends on <tspan fill="#d2a8ff" font-weight="600">T1</tspan></text>
  <line x1="24" y1="164" x2="474" y2="164" stroke="#21262d"/>
  <rect x="341.0" y="171.0" width="116" height="24" rx="6" fill="#f0883e" fill-opacity="0.14" stroke="#f0883e" stroke-opacity="0.55"/>
  <text x="399.0" y="187.5" font-size="13" fill="#ffa657" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">Read from T2</text>
  <text x="490" y="187.5" font-size="13" fill="#c9d1d9"><tspan fill="#ffa657" font-weight="600">T3</tspan> depends on <tspan fill="#56d4dd" font-weight="600">T2</tspan></text>
  <line x1="24" y1="202" x2="474" y2="202" stroke="#21262d"/>
  <rect x="24" y="204" width="450" height="34" rx="6" fill="#f85149" fill-opacity="0.1" stroke="#f85149" stroke-opacity="0.45"/>
  <rect x="48.5" y="209.0" width="101" height="24" rx="6" fill="#f85149" fill-opacity="0.14" stroke="#f85149" stroke-opacity="0.55"/>
  <text x="99.0" y="225.5" font-size="13" fill="#ff7b72" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">ROLLBACK ✗</text>
  <line x1="24" y1="240" x2="474" y2="240" stroke="#21262d"/>
  <rect x="24" y="242" width="450" height="34" rx="6" fill="#f85149" fill-opacity="0.1" stroke="#f85149" stroke-opacity="0.45"/>
  <rect x="179.0" y="247.0" width="140" height="24" rx="6" fill="#f85149" fill-opacity="0.14" stroke="#f85149" stroke-opacity="0.55"/>
  <text x="249.0" y="263.5" font-size="13" fill="#ff7b72" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">must ROLLBACK ✗</text>
  <text x="490" y="263.5" font-size="13" fill="#c9d1d9"><tspan fill="#8b949e">(read T1's data)</tspan></text>
  <line x1="24" y1="278" x2="474" y2="278" stroke="#21262d"/>
  <rect x="24" y="280" width="450" height="34" rx="6" fill="#f85149" fill-opacity="0.1" stroke="#f85149" stroke-opacity="0.45"/>
  <rect x="329.0" y="285.0" width="140" height="24" rx="6" fill="#f85149" fill-opacity="0.14" stroke="#f85149" stroke-opacity="0.55"/>
  <text x="399.0" y="301.5" font-size="13" fill="#ff7b72" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">must ROLLBACK ✗</text>
  <text x="490" y="301.5" font-size="13" fill="#c9d1d9"><tspan fill="#8b949e">(read T2's data)</tspan></text>
  <path d="M99,233.0 V259.0 H175" stroke="#f85149" stroke-width="1.6" fill="none" marker-end="url(#m-red)"/>
  <path d="M249,271.0 V297.0 H325" stroke="#f85149" stroke-width="1.6" fill="none" marker-end="url(#m-red)"/>
  <text x="334" y="346" font-size="14" fill="#c9d1d9"><tspan fill="#ff7b72">→ </tspan><tspan fill="#ff7b72" font-weight="700">... cascade continues!</tspan></text>
</svg>
