<svg xmlns="http://www.w3.org/2000/svg" width="560" height="236" viewBox="0 0 560 236" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Conflict vs view serializable</title>
  <desc>Conflict Serializable is nested inside View Serializable: every conflict serializable schedule is view serializable, but not vice versa.</desc>
  <defs>
    <marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker>
    <marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker>
    <marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d29922"/></marker>
    <marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/></marker>
    <marker id="m-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39c5cf"/></marker>
    <marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker>
    <marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="559" height="235" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="24" y="40" font-size="12" fill="#8b949e" font-weight="700" letter-spacing="1.5">RELATIONSHIP</text>
  <rect x="24" y="56" width="512" height="100" rx="12" fill="#58a6ff" fill-opacity="0.06" stroke="#58a6ff" stroke-opacity="0.6"/>
  <text x="280.0" y="82" font-size="14.5" fill="#79c0ff" font-weight="600" text-anchor="middle">View Serializable</text>
  <rect x="46" y="88" width="468" height="46" rx="12" fill="#3fb950" fill-opacity="0.09" stroke="#3fb950" stroke-opacity="0.6"/>
  <text x="280.0" y="116.0" font-size="14.5" fill="#56d364" font-weight="600" text-anchor="middle">Conflict Serializable</text>
  <text x="280.0" y="190" font-size="14" fill="#c9d1d9" text-anchor="middle">Every <tspan fill="#56d364" font-weight="600">Conflict Serializable</tspan><tspan fill="#8b949e">  ⊂  </tspan><tspan fill="#79c0ff" font-weight="600">View Serializable</tspan></text>
  <text x="280.0" y="212" font-size="13" fill="#8b949e" text-anchor="middle">(but NOT vice versa)</text>
</svg>
