<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Why deep OFFSET is slow</title>
  <desc>For ORDER BY price, id LIMIT 20 OFFSET 450000: InnoDB walks the tiny (price, id) secondary index entries, but for every one of the 450,020 entries does a bookmark lookup into the clustered primary-key B+ tree to read the full row, hands all 450,020 rows to the SQL layer, which only then applies LIMIT/OFFSET, discarding 450,000 rows and returning 20.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f85149"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="819" height="399" rx="14" fill="#161b22" stroke="#30363d"/>

  <!-- step 1 -->
  <rect x="24" y="24" width="772" height="64" rx="10" fill="#1c2128" stroke="#30363d"/>
  <circle cx="48" cy="45" r="11" fill="#58a6ff" fill-opacity=".2" stroke="#58a6ff"/>
  <text x="48" y="49" fill="#79c0ff" font-size="12" font-weight="700" text-anchor="middle">1</text>
  <text x="72" y="50" fill="#e6edf3" font-size="13.5" font-weight="600">Walk the secondary index <tspan fill="#79c0ff" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">(price, id)</tspan> in sorted order.</text>
  <text x="72" y="74" fill="#c9d1d9" font-size="13">Each index entry is tiny: just <tspan fill="#79c0ff" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">[price | id]</tspan>  ≈ 20 bytes.</text>

  <line x1="410" y1="88" x2="410" y2="102" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- step 2 -->
  <rect x="24" y="106" width="772" height="128" rx="10" fill="#f85149" fill-opacity=".08" stroke="#f85149" stroke-opacity=".8"/>
  <circle cx="48" cy="127" r="11" fill="#f85149" fill-opacity=".25" stroke="#f85149"/>
  <text x="48" y="131" fill="#ff7b72" font-size="12" font-weight="700" text-anchor="middle">2</text>
  <rect x="660" y="116" width="122" height="24" rx="12" fill="#f85149" fill-opacity=".2" stroke="#f85149"/>
  <text x="721" y="132" fill="#ff7b72" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.8">✗ THE KILLER</text>
  <text x="72" y="132" fill="#e6edf3" font-size="13.5" font-weight="600">For EVERY entry it walks — all 450,020 of them — MySQL needs</text>
  <text x="72" y="154" fill="#c9d1d9" font-size="13">the other columns <tspan fill="#8b949e">(name, description, stock, created_at...)</tspan> because you asked for <tspan fill="#79c0ff" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">SELECT *</tspan>.</text>
  <text x="72" y="176" fill="#c9d1d9" font-size="13">Those columns are NOT in the index. So for each one it does a <tspan fill="#ff7b72" font-weight="600">"bookmark lookup"</tspan>:</text>
  <!-- lookup chain -->
  <rect x="72" y="190" width="112" height="30" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="128" y="210" fill="#e6edf3" font-size="13" text-anchor="middle">take the id</text>
  <line x1="184" y1="205" x2="208" y2="205" stroke="#f85149" stroke-width="1.5" marker-end="url(#arrR)"/>
  <rect x="212" y="190" width="336" height="30" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="380" y="210" fill="#e6edf3" font-size="13" text-anchor="middle">descend the clustered (primary key) B+ Tree</text>
  <line x1="548" y1="205" x2="572" y2="205" stroke="#f85149" stroke-width="1.5" marker-end="url(#arrR)"/>
  <rect x="576" y="190" width="140" height="30" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="646" y="210" fill="#e6edf3" font-size="13" text-anchor="middle">read the full row</text>

  <line x1="410" y1="234" x2="410" y2="248" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- step 3 -->
  <rect x="24" y="252" width="772" height="44" rx="10" fill="#d29922" fill-opacity=".07" stroke="#d29922" stroke-opacity=".6"/>
  <circle cx="48" cy="274" r="11" fill="#d29922" fill-opacity=".25" stroke="#d29922"/>
  <text x="48" y="278" fill="#e3b341" font-size="12" font-weight="700" text-anchor="middle">3</text>
  <text x="72" y="279" fill="#e6edf3" font-size="13.5" font-weight="600">Hand all 450,020 fully-built rows up to the SQL layer.</text>

  <line x1="410" y1="296" x2="410" y2="310" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- step 4 -->
  <rect x="24" y="314" width="772" height="64" rx="10" fill="#d29922" fill-opacity=".07" stroke="#d29922" stroke-opacity=".6"/>
  <circle cx="48" cy="335" r="11" fill="#d29922" fill-opacity=".25" stroke="#d29922"/>
  <text x="48" y="339" fill="#e3b341" font-size="12" font-weight="700" text-anchor="middle">4</text>
  <text x="72" y="340" fill="#e6edf3" font-size="13.5" font-weight="600">The SQL layer applies <tspan fill="#79c0ff" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">LIMIT/OFFSET</tspan> <tspan font-style="italic">here, at the very top</tspan> —</text>
  <text x="72" y="364" fill="#c9d1d9" font-size="13">throws away the first <tspan fill="#ff7b72" font-weight="700">450,000</tspan> rows and returns <tspan fill="#56d364" font-weight="700">20</tspan>.</text>
</svg>
