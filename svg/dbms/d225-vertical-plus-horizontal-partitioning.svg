<svg xmlns="http://www.w3.org/2000/svg" width="920" height="436" viewBox="0 0 920 436" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Combining vertical and horizontal partitioning</title>
  <desc>A massive orders table (50 columns, 1 billion rows) is first split vertically into orders_core (queried on every listing) and orders_detail (queried on the detail page only), then orders_core is partitioned by range on YEAR(order_date) into p2023, p2024, p2025 and so on. Listing queries hit only the narrow, pruned partition; detail queries join orders_detail for a single order.</desc>
  <defs>
    <marker id="d225a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="919" height="435" rx="14" fill="#161b22" stroke="#30363d"/>

  <!-- ===== Original ===== -->
  <rect x="24" y="37" width="96" height="22" rx="11" fill="#1c2128" stroke="#484f58"/>
  <text x="72" y="52" fill="#c9d1d9" font-size="11.5" font-weight="700" letter-spacing="1" text-anchor="middle">ORIGINAL</text>
  <rect x="168" y="24" width="728" height="48" rx="10" fill="#1c2128" stroke="#30363d"/>
  <text x="532" y="53" fill="#c9d1d9" font-size="13.5" text-anchor="middle">one massive "<tspan fill="#e6edf3" font-weight="700" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">orders</tspan>" table  <tspan fill="#8b949e">(50 columns, 1 billion rows)</tspan></text>

  <path d="M532,72 V88 H346 V100" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#d225a)"/>
  <path d="M532,88 H718 V100" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#d225a)"/>

  <!-- ===== Step 1 ===== -->
  <rect x="24" y="110" width="72" height="22" rx="11" fill="#58a6ff" fill-opacity=".12" stroke="#58a6ff" stroke-opacity=".6"/>
  <text x="60" y="125" fill="#79c0ff" font-size="11.5" font-weight="700" letter-spacing="1" text-anchor="middle">STEP 1</text>
  <text x="24" y="154" fill="#e6edf3" font-size="13" font-weight="600">Vertical</text>
  <text x="24" y="172" fill="#e6edf3" font-size="13" font-weight="600">Partition</text>

  <rect x="168" y="104" width="356" height="112" rx="10" fill="#f0883e" fill-opacity=".07" stroke="#f0883e" stroke-opacity=".6"/>
  <text x="186" y="129" fill="#e6edf3" font-size="14" font-weight="700" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">orders_core</text>
  <text x="186" y="152" fill="#c9d1d9" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">(id, customer_id, order_date,</text>
  <text x="186" y="170" fill="#c9d1d9" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace"> total, status)</text>
  <rect x="186" y="184" width="196" height="22" rx="11" fill="#f0883e" fill-opacity=".14" stroke="#f0883e" stroke-opacity=".6"/>
  <text x="284" y="199" fill="#ffa657" font-size="12" font-weight="600" text-anchor="middle">— queried on every listing</text>

  <rect x="540" y="104" width="356" height="112" rx="10" fill="#58a6ff" fill-opacity=".06" stroke="#58a6ff" stroke-opacity=".55"/>
  <text x="558" y="129" fill="#e6edf3" font-size="14" font-weight="700" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">orders_detail</text>
  <text x="558" y="152" fill="#c9d1d9" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">(order_id, shipping_address,</text>
  <text x="558" y="170" fill="#c9d1d9" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace"> notes, gift_msg)</text>
  <rect x="558" y="184" width="226" height="22" rx="11" fill="#58a6ff" fill-opacity=".12" stroke="#58a6ff" stroke-opacity=".6"/>
  <text x="671" y="199" fill="#79c0ff" font-size="12" font-weight="600" text-anchor="middle">— queried on detail page only</text>

  <line x1="346" y1="216" x2="346" y2="244" stroke="#8b949e" stroke-width="1.5" marker-end="url(#d225a)"/>

  <!-- ===== Step 2 ===== -->
  <rect x="24" y="254" width="72" height="22" rx="11" fill="#39c5cf" fill-opacity=".12" stroke="#39c5cf" stroke-opacity=".6"/>
  <text x="60" y="269" fill="#56d4dd" font-size="11.5" font-weight="700" letter-spacing="1" text-anchor="middle">STEP 2</text>
  <text x="24" y="296" fill="#e6edf3" font-size="13" font-weight="600">Horizontal</text>
  <text x="24" y="314" fill="#e6edf3" font-size="13" font-weight="600">Partition</text>
  <text x="24" y="332" fill="#8b949e" font-size="12">(on orders_core)</text>

  <rect x="168" y="248" width="472" height="86" rx="10" fill="#39c5cf" fill-opacity=".06" stroke="#39c5cf" stroke-opacity=".55"/>
  <text x="186" y="274" fill="#e6edf3" font-size="12.5" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">orders_core <tspan fill="#79c0ff">PARTITION BY RANGE</tspan> (YEAR(order_date))</text>
  <rect x="186" y="292" width="70" height="26" rx="6" fill="#39c5cf" fill-opacity=".14" stroke="#39c5cf" stroke-opacity=".7"/>
  <text x="221" y="310" fill="#e6edf3" font-size="12.5" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">p2023</text>
  <rect x="264" y="292" width="70" height="26" rx="6" fill="#39c5cf" fill-opacity=".14" stroke="#39c5cf" stroke-opacity=".7"/>
  <text x="299" y="310" fill="#e6edf3" font-size="12.5" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">p2024</text>
  <rect x="342" y="292" width="70" height="26" rx="6" fill="#39c5cf" fill-opacity=".14" stroke="#39c5cf" stroke-opacity=".7"/>
  <text x="377" y="310" fill="#e6edf3" font-size="12.5" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">p2025</text>
  <text x="422" y="310" fill="#8b949e" font-size="13" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">...</text>

  <!-- ===== Result ===== -->
  <rect x="24" y="373" width="72" height="22" rx="11" fill="#3fb950" fill-opacity=".14" stroke="#3fb950" stroke-opacity=".7"/>
  <text x="60" y="388" fill="#56d364" font-size="11.5" font-weight="700" letter-spacing="1" text-anchor="middle">RESULT</text>
  <rect x="168" y="356" width="728" height="58" rx="10" fill="#3fb950" fill-opacity=".09" stroke="#3fb950" stroke-opacity=".6"/>
  <text x="186" y="380" fill="#c9d1d9" font-size="13"><tspan fill="#56d364" font-weight="700">Fast listing queries</tspan> hit only the narrow, pruned partition of <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" fill="#e6edf3">orders_core</tspan>.</text>
  <text x="186" y="402" fill="#c9d1d9" font-size="13"><tspan fill="#e6edf3" font-weight="700">Detail queries</tspan> JOIN <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" fill="#e6edf3">orders_detail</tspan> only for a single order.</text>
</svg>
