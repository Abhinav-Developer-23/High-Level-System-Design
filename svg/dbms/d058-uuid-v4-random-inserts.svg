<svg xmlns="http://www.w3.org/2000/svg" width="700" height="330" viewBox="0 0 700 330" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>UUID v4 random inserts</title>
  <desc>Insert a3b8d1b6... goes to the middle of the tree, f81d4fae... to the end, 0c8cfc82... to the beginning. B+ Tree leaf pages are fragmented and random: [0c8f..., 0e2a...], [..., a3b8...], [..., f81d...], and each one is an insert target.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f85149"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="699" height="329" rx="14" fill="#161b22" stroke="#30363d"/>

  <text x="32" y="44" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">INSERTS</text>
  <g font-size="13">
    <text x="32" y="74" fill="#79c0ff" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">Insert id=a3b8d1b6...:</text>
    <text x="32" y="98" fill="#79c0ff" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">Insert id=f81d4fae...:</text>
    <text x="32" y="122" fill="#79c0ff" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">Insert id=0c8cfc82...:</text>
    <text x="32" y="144" fill="#8b949e" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">...</text>
    <text x="236" y="74" fill="#c9d1d9">goes to the <tspan fill="#ff7b72" font-weight="700">MIDDLE</tspan> of the tree</text>
    <text x="236" y="98" fill="#c9d1d9">goes to the <tspan fill="#ff7b72" font-weight="700">END</tspan> of the tree</text>
    <text x="236" y="122" fill="#c9d1d9">goes to the <tspan fill="#ff7b72" font-weight="700">BEGINNING</tspan> of the tree</text>
  </g>

  <line x1="32" y1="166" x2="668" y2="166" stroke="#21262d"/>
  <text x="32" y="194" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">B+ TREE LEAF PAGES</text>
  <text x="196" y="194" fill="#8b949e" font-size="12">(fragmented, random)</text>

  <g font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="13" text-anchor="middle">
    <rect x="32" y="212" width="180" height="40" rx="8" fill="#f85149" fill-opacity=".10" stroke="#f85149" stroke-opacity=".7"/>
    <text x="122" y="237" fill="#e6edf3">0c8f..., 0e2a...</text>
    <rect x="252" y="212" width="160" height="40" rx="8" fill="#f85149" fill-opacity=".10" stroke="#f85149" stroke-opacity=".7"/>
    <text x="332" y="237" fill="#e6edf3">..., a3b8...</text>
    <rect x="452" y="212" width="160" height="40" rx="8" fill="#f85149" fill-opacity=".10" stroke="#f85149" stroke-opacity=".7"/>
    <text x="532" y="237" fill="#e6edf3">..., f81d...</text>
  </g>
  <line x1="212" y1="232" x2="248" y2="232" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="412" y1="232" x2="448" y2="232" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>

  <g stroke="#f85149" stroke-width="1.8">
    <line x1="122" y1="284" x2="122" y2="258" marker-end="url(#arrR)"/>
    <line x1="332" y1="284" x2="332" y2="258" marker-end="url(#arrR)"/>
    <line x1="532" y1="284" x2="532" y2="258" marker-end="url(#arrR)"/>
  </g>
  <g fill="#ff7b72" font-size="13" font-weight="600" text-anchor="middle">
    <text x="122" y="304">insert here</text>
    <text x="332" y="304">insert here</text>
    <text x="532" y="304">insert here</text>
  </g>
</svg>
