  <text x="84" y="370" fill="#e6edf3" font-size="12.5" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none" xml:space="preserve">B = B + 50</text>
  <line x1="24" y1="384" x2="756" y2="384" stroke="#21262d" stroke-width="1"/>
