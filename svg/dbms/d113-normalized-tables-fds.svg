<svg xmlns="http://www.w3.org/2000/svg" width="730" height="236" viewBox="0 0 730 236" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Normalized schema: one fact per table</title>
  <desc>Students: StudentID → StudentName; Courses: CourseID → CourseName, Instructor, DepartmentID; Departments: DeptID → Department, DeptHead; Enrollments: StudentID, CourseID junction table.</desc>
  <defs>
    <marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d29922"/></marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/></marker>
    <marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39c5cf"/></marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker>
    </defs>
  <rect x="0.5" y="0.5" width="729" height="235" rx="14" fill="#161b22" stroke="#30363d"/>
  <rect x="24" y="24" width="682" height="40" rx="9" fill="#1c2128" stroke="#30363d"/>
  <text x="42" y="49" fill="#e6edf3" font-size="14" font-weight="600">Students:</text>
  <rect x="160" y="30" width="180" height="28" rx="8" fill="#58a6ff" fill-opacity="0.12" stroke="#58a6ff" stroke-opacity="0.65"/>
  <text x="250.0" y="48.68" fill="#79c0ff" font-size="13" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">StudentID</text>
  <line x1="344" y1="44" x2="370" y2="44" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <text x="380" y="48.5" fill="#e6edf3" font-size="13" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">StudentName</text>
  <rect x="24" y="74" width="682" height="40" rx="9" fill="#1c2128" stroke="#30363d"/>
  <text x="42" y="99" fill="#e6edf3" font-size="14" font-weight="600">Courses:</text>
  <rect x="160" y="80" width="180" height="28" rx="8" fill="#58a6ff" fill-opacity="0.12" stroke="#58a6ff" stroke-opacity="0.65"/>
  <text x="250.0" y="98.68" fill="#79c0ff" font-size="13" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">CourseID</text>
  <line x1="344" y1="94" x2="370" y2="94" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <text x="380" y="98.5" fill="#e6edf3" font-size="13" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">CourseName, Instructor, DepartmentID</text>
  <rect x="24" y="124" width="682" height="40" rx="9" fill="#1c2128" stroke="#30363d"/>
  <text x="42" y="149" fill="#e6edf3" font-size="14" font-weight="600">Departments:</text>
  <rect x="160" y="130" width="180" height="28" rx="8" fill="#58a6ff" fill-opacity="0.12" stroke="#58a6ff" stroke-opacity="0.65"/>
  <text x="250.0" y="148.68" fill="#79c0ff" font-size="13" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">DeptID</text>
  <line x1="344" y1="144" x2="370" y2="144" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <text x="380" y="148.5" fill="#e6edf3" font-size="13" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">Department, DeptHead</text>
  <rect x="24" y="174" width="682" height="40" rx="9" fill="#1c2128" stroke="#30363d"/>
  <text x="42" y="199" fill="#e6edf3" font-size="14" font-weight="600">Enrollments:</text>
  <rect x="160" y="180" width="180" height="28" rx="8" fill="#d29922" fill-opacity="0.12" stroke="#d29922" stroke-opacity="0.65"/>
  <text x="250.0" y="198.68" fill="#e3b341" font-size="13" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" style="font-variant-ligatures:none">StudentID, CourseID</text>
  <text x="356" y="199" fill="#8b949e" font-size="13">(junction/relationship table)</text>
</svg>
