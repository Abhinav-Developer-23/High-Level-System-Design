<svg xmlns="http://www.w3.org/2000/svg" width="840" height="576" viewBox="0 0 840 576" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Non-recoverable vs recoverable schedule</title>
  <desc>Non-recoverable: T2 reads T1's uncommitted X and commits before T1 rolls back, which cannot be undone. Recoverable: T1 commits first, then T2.</desc>
  <defs>
    <marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker>
    <marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker>
    <marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d29922"/></marker>
    <marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/></marker>
    <marker id="m-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39c5cf"/></marker>
    <marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker>
    <marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="839" height="575" rx="14" fill="#161b22" stroke="#30363d"/>
  <rect x="24" y="24" width="792" height="268" rx="12" fill="#f85149" fill-opacity="0.05" stroke="#f85149" stroke-opacity="0.55"/>
  <text x="44" y="54" font-size="15" fill="#ff7b72" font-weight="700">✗  Non-Recoverable (DANGEROUS)</text>
  <rect x="42" y="68" width="146" height="208" rx="6" fill="#bc8cff" fill-opacity="0.05" stroke="none"/>
  <rect x="192" y="68" width="146" height="208" rx="6" fill="#39c5cf" fill-opacity="0.05" stroke="none"/>
  <text x="115.0" y="89" font-size="14" fill="#d2a8ff" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">T1</text>
  <text x="265.0" y="89" font-size="14" fill="#56d4dd" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">T2</text>
  <line x1="40" y1="100" x2="340" y2="100" stroke="#30363d"/>
  <rect x="53.0" y="107.0" width="124" height="24" rx="6" fill="#bc8cff" fill-opacity="0.14" stroke="#bc8cff" stroke-opacity="0.55"/>
  <text x="115.0" y="123.5" font-size="13" fill="#d2a8ff" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">Write(X) = 50</text>
  <line x1="40" y1="138" x2="340" y2="138" stroke="#21262d"/>
  <rect x="207.0" y="145.0" width="116" height="24" rx="6" fill="#39c5cf" fill-opacity="0.14" stroke="#39c5cf" stroke-opacity="0.55"/>
  <text x="265.0" y="161.5" font-size="13" fill="#56d4dd" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">Read(X) = 50</text>
  <text x="356" y="161.5" font-size="13" fill="#c9d1d9"><tspan fill="#8b949e">← </tspan>T2 reads T1's <tspan fill="#e3b341" font-weight="700">uncommitted</tspan> value</text>
  <line x1="40" y1="176" x2="340" y2="176" stroke="#21262d"/>
  <rect x="230.5" y="183.0" width="69" height="24" rx="6" fill="#d29922" fill-opacity="0.14" stroke="#d29922" stroke-opacity="0.55"/>
  <text x="265.0" y="199.5" font-size="13" fill="#e3b341" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">COMMIT</text>
  <text x="356" y="199.5" font-size="13" fill="#c9d1d9"><tspan fill="#8b949e">← </tspan>T2 commits <tspan fill="#ff7b72" font-weight="700">BEFORE</tspan> T1!</text>
  <line x1="40" y1="214" x2="340" y2="214" stroke="#21262d"/>
  <rect x="40" y="216" width="300" height="58" rx="6" fill="#f85149" fill-opacity="0.1" stroke="#f85149" stroke-opacity="0.45"/>
  <rect x="72.5" y="221.0" width="85" height="24" rx="6" fill="#f85149" fill-opacity="0.14" stroke="#f85149" stroke-opacity="0.55"/>
  <text x="115.0" y="237.5" font-size="13" fill="#ff7b72" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">ROLLBACK</text>
  <text x="356" y="237.5" font-size="13" fill="#c9d1d9"><tspan fill="#8b949e">← </tspan>T1 rolls back... but T2 already committed with T1's value!</text>
  <text x="356" y="256.5" font-size="13" fill="#c9d1d9"><tspan fill="#ff7b72" font-weight="700">Can't undo T2 → IRRECOVERABLE!</tspan></text>
  <rect x="24" y="308" width="792" height="244" rx="12" fill="#3fb950" fill-opacity="0.05" stroke="#3fb950" stroke-opacity="0.55"/>
  <text x="44" y="338" font-size="15" fill="#56d364" font-weight="700">✓  Recoverable</text>
  <rect x="42" y="352" width="146" height="184" rx="6" fill="#bc8cff" fill-opacity="0.05" stroke="none"/>
  <rect x="192" y="352" width="146" height="184" rx="6" fill="#39c5cf" fill-opacity="0.05" stroke="none"/>
  <text x="115.0" y="373" font-size="14" fill="#d2a8ff" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">T1</text>
  <text x="265.0" y="373" font-size="14" fill="#56d4dd" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">T2</text>
  <line x1="40" y1="384" x2="340" y2="384" stroke="#30363d"/>
  <rect x="53.0" y="391.0" width="124" height="24" rx="6" fill="#bc8cff" fill-opacity="0.14" stroke="#bc8cff" stroke-opacity="0.55"/>
  <text x="115.0" y="407.5" font-size="13" fill="#d2a8ff" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">Write(X) = 50</text>
  <line x1="40" y1="422" x2="340" y2="422" stroke="#21262d"/>
  <rect x="207.0" y="429.0" width="116" height="24" rx="6" fill="#39c5cf" fill-opacity="0.14" stroke="#39c5cf" stroke-opacity="0.55"/>
  <text x="265.0" y="445.5" font-size="13" fill="#56d4dd" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">Read(X) = 50</text>
  <line x1="40" y1="460" x2="340" y2="460" stroke="#21262d"/>
  <rect x="72.5" y="467.0" width="85" height="24" rx="6" fill="#3fb950" fill-opacity="0.14" stroke="#3fb950" stroke-opacity="0.55"/>
  <text x="115.0" y="483.5" font-size="13" fill="#56d364" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">COMMIT ✓</text>
  <text x="356" y="483.5" font-size="13" fill="#c9d1d9"><tspan fill="#8b949e">← </tspan>T1 commits <tspan fill="#56d364" font-weight="700">FIRST</tspan></text>
  <line x1="40" y1="498" x2="340" y2="498" stroke="#21262d"/>
  <rect x="222.5" y="505.0" width="85" height="24" rx="6" fill="#3fb950" fill-opacity="0.14" stroke="#3fb950" stroke-opacity="0.55"/>
  <text x="265.0" y="521.5" font-size="13" fill="#56d364" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">COMMIT ✓</text>
  <text x="356" y="521.5" font-size="13" fill="#c9d1d9"><tspan fill="#8b949e">← </tspan>T2 commits <tspan fill="#56d364" font-weight="700">AFTER</tspan> T1 → safe to depend on T1's value</text>
</svg>
