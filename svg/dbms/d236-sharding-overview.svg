<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Sharding overview</title>
  <desc>The app sends a query for user_id = 42 to a router (the app itself, Vitess, or the database's built-in router). The router computes hash(user_id) and sends the query only to shard 2. Three shards hold different slices of users (A–H, I–P, Q–Z); each shard is a primary with its own replica. All shards have the same schema but different rows.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="819" height="499" rx="14" fill="#161b22" stroke="#30363d"/>

  <!-- App -->
  <rect x="340" y="24" width="140" height="44" rx="9" fill="#1c2128" stroke="#8b949e"/>
  <text x="410" y="51" fill="#e6edf3" font-size="15" font-weight="600" text-anchor="middle">App</text>

  <line x1="410" y1="68" x2="410" y2="116" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrB)"/>
  <text x="422" y="97" fill="#c9d1d9" font-size="13">query for <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="12" fill="#79c0ff">user_id = 42</tspan></text>

  <!-- Router -->
  <rect x="250" y="120" width="320" height="94" rx="10" fill="#1c2128" stroke="#30363d"/>
  <text x="410" y="145" fill="#e6edf3" font-size="15" font-weight="600" text-anchor="middle">Router</text>
  <text x="410" y="164" fill="#8b949e" font-size="12" text-anchor="middle">app / Vitess / built-in</text>
  <rect x="300" y="176" width="220" height="26" rx="6" fill="#58a6ff" fill-opacity=".10" stroke="#58a6ff" stroke-opacity=".5"/>
  <text x="410" y="194" fill="#79c0ff" font-size="12" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">hash(user_id) → shard 2</text>

  <line x1="410" y1="214" x2="410" y2="266" stroke="#58a6ff" stroke-width="2.2" marker-end="url(#arrB)"/>
  <text x="422" y="245" fill="#79c0ff" font-size="12" font-weight="600">only shard 2 is asked</text>

  <!-- Shard 1 -->
  <rect x="50" y="270" width="220" height="170" rx="10" fill="#1c2128" fill-opacity=".6" stroke="#30363d"/>
  <text x="66" y="294" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">SHARD 1</text>
  <text x="254" y="294" fill="#c9d1d9" font-size="12" text-anchor="end">users A–H</text>
  <rect x="70" y="308" width="180" height="40" rx="8" fill="#1c2128" stroke="#8b949e"/>
  <text x="160" y="333" fill="#e6edf3" font-size="13" text-anchor="middle">primary</text>
  <line x1="160" y1="348" x2="160" y2="376" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="70" y="380" width="180" height="40" rx="8" fill="#1c2128" stroke="#484f58" stroke-dasharray="5 4"/>
  <text x="160" y="405" fill="#c9d1d9" font-size="13" text-anchor="middle">replica</text>

  <!-- Shard 2 (target) -->
  <rect x="300" y="270" width="220" height="170" rx="10" fill="#58a6ff" fill-opacity=".08" stroke="#58a6ff" stroke-width="1.8"/>
  <text x="316" y="294" fill="#79c0ff" font-size="12" font-weight="700" letter-spacing="1.5">SHARD 2</text>
  <text x="504" y="294" fill="#c9d1d9" font-size="12" text-anchor="end">users I–P</text>
  <rect x="320" y="308" width="180" height="40" rx="8" fill="#1c2128" stroke="#58a6ff"/>
  <text x="410" y="333" fill="#e6edf3" font-size="13" text-anchor="middle">primary</text>
  <line x1="410" y1="348" x2="410" y2="376" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="320" y="380" width="180" height="40" rx="8" fill="#1c2128" stroke="#484f58" stroke-dasharray="5 4"/>
  <text x="410" y="405" fill="#c9d1d9" font-size="13" text-anchor="middle">replica</text>

  <!-- Shard 3 -->
  <rect x="550" y="270" width="220" height="170" rx="10" fill="#1c2128" fill-opacity=".6" stroke="#30363d"/>
  <text x="566" y="294" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">SHARD 3</text>
  <text x="754" y="294" fill="#c9d1d9" font-size="12" text-anchor="end">users Q–Z</text>
  <rect x="570" y="308" width="180" height="40" rx="8" fill="#1c2128" stroke="#8b949e"/>
  <text x="660" y="333" fill="#e6edf3" font-size="13" text-anchor="middle">primary</text>
  <line x1="660" y1="348" x2="660" y2="376" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="570" y="380" width="180" height="40" rx="8" fill="#1c2128" stroke="#484f58" stroke-dasharray="5 4"/>
  <text x="660" y="405" fill="#c9d1d9" font-size="13" text-anchor="middle">replica</text>

  <!-- caption -->
  <path d="M50,454 V462 H770 V454" fill="none" stroke="#484f58" stroke-width="1.5"/>
  <text x="410" y="484" fill="#e6edf3" font-size="13" font-weight="600" text-anchor="middle">same schema · different rows</text>
</svg>
