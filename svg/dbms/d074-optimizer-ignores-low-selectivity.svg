<svg xmlns="http://www.w3.org/2000/svg" width="600" height="406" viewBox="0 0 600 406" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Why the optimizer abandons a low-selectivity index</title>
  <desc>WHERE gender = 'M' matches 500,000 index entries, which is cheap because they are sequential in the index. It then needs 500,000 random lookups into the clustered index to fetch the columns not in the index. That is more expensive than reading the whole table sequentially from start to finish, so the optimizer ignores the index and does a full table scan.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="599" height="405" rx="14" fill="#161b22" stroke="#30363d"/>

  <g stroke="#8b949e" stroke-width="1.5">
    <line x1="300" y1="64" x2="300" y2="88" marker-end="url(#arr)"/>
    <line x1="300" y1="146" x2="300" y2="170" marker-end="url(#arr)"/>
    <line x1="300" y1="228" x2="300" y2="252" marker-end="url(#arr)"/>
    <line x1="300" y1="310" x2="300" y2="334" marker-end="url(#arr)"/>
  </g>

  <rect x="190" y="28" width="220" height="36" rx="18" fill="#58a6ff" fill-opacity=".12" stroke="#58a6ff" stroke-opacity=".7"/>
  <text x="300" y="51" fill="#79c0ff" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="13.5" font-weight="600" text-anchor="middle">WHERE gender = 'M'</text>

  <rect x="40" y="92" width="520" height="54" rx="10" fill="#3fb950" fill-opacity=".08" stroke="#3fb950" stroke-opacity=".6"/>
  <text x="300" y="115" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle"><tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">500,000</tspan> matching index entries</text>
  <text x="300" y="135" fill="#56d364" font-size="12.5" text-anchor="middle">(cheap — sequential in the index)</text>

  <rect x="40" y="174" width="520" height="54" rx="10" fill="#d29922" fill-opacity=".10" stroke="#d29922" stroke-opacity=".7"/>
  <text x="300" y="197" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle"><tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">500,000</tspan> <tspan fill="#e3b341">RANDOM</tspan> lookups into the clustered index</text>
  <text x="300" y="217" fill="#e3b341" font-size="12.5" text-anchor="middle">(to fetch the columns not in the index)</text>

  <rect x="40" y="256" width="520" height="54" rx="10" fill="#1c2128" stroke="#30363d"/>
  <text x="300" y="279" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle">More expensive than just reading the whole table</text>
  <text x="300" y="299" fill="#c9d1d9" font-size="13" text-anchor="middle">sequentially from start to finish</text>

  <rect x="40" y="338" width="520" height="44" rx="10" fill="#f85149" fill-opacity=".12" stroke="#f85149" stroke-opacity=".8"/>
  <text x="300" y="365" fill="#ff7b72" font-size="14" font-weight="700" text-anchor="middle">✗  Optimizer IGNORES the index <tspan fill="#8b949e" font-weight="400">→</tspan> full table scan</text>
</svg>
