<svg xmlns="http://www.w3.org/2000/svg" width="640" height="212" viewBox="0 0 640 212" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Candidate keys split into primary and alternate</title>
  <desc>Candidate keys {roll_no, email, phone}: roll_no becomes the primary key, email and phone become alternate keys.</desc>
  <defs>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="639" height="211" rx="14" fill="#161b22" stroke="#30363d"/>

  <rect x="150" y="24" width="340" height="40" rx="10" fill="#58a6ff" fill-opacity=".08" stroke="#58a6ff" stroke-opacity=".7"/>
  <text x="320" y="49" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle">Candidate Keys = <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" fill="#79c0ff" font-weight="400">{roll_no, email, phone}</tspan></text>

  <path d="M320,64 V88 M140,88 H500" fill="none" stroke="#8b949e" stroke-width="1.6"/>
  <line x1="140" y1="88" x2="140" y2="120" stroke="#3fb950" stroke-width="1.6" marker-end="url(#arrG)"/>
  <line x1="320" y1="88" x2="320" y2="120" stroke="#bc8cff" stroke-width="1.6" marker-end="url(#arrP)"/>
  <line x1="500" y1="88" x2="500" y2="120" stroke="#bc8cff" stroke-width="1.6" marker-end="url(#arrP)"/>

  <rect x="65" y="124" width="150" height="64" rx="10" fill="#3fb950" fill-opacity=".10" stroke="#3fb950" stroke-opacity=".7"/>
  <text x="140" y="150" fill="#56d364" font-size="13" font-weight="700" letter-spacing="1" text-anchor="middle">PRIMARY</text>
  <text x="140" y="174" fill="#e6edf3" font-size="13" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">{roll_no}</text>

  <rect x="245" y="124" width="150" height="64" rx="10" fill="#bc8cff" fill-opacity=".10" stroke="#bc8cff" stroke-opacity=".7"/>
  <text x="320" y="150" fill="#d2a8ff" font-size="13" font-weight="700" letter-spacing="1" text-anchor="middle">ALTERNATE</text>
  <text x="320" y="174" fill="#e6edf3" font-size="13" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">{email}</text>

  <rect x="425" y="124" width="150" height="64" rx="10" fill="#bc8cff" fill-opacity=".10" stroke="#bc8cff" stroke-opacity=".7"/>
  <text x="500" y="150" fill="#d2a8ff" font-size="13" font-weight="700" letter-spacing="1" text-anchor="middle">ALTERNATE</text>
  <text x="500" y="174" fill="#e6edf3" font-size="13" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">{phone}</text>
</svg>
