<svg xmlns="http://www.w3.org/2000/svg" width="610" height="412" viewBox="0 0 610 412" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Ladder of normal forms</title>
  <desc>UNF to 1NF removes repeating groups; 1NF to 2NF removes partial dependencies; 2NF to 3NF removes transitive dependencies; 3NF to BCNF requires every determinant to be a candidate key.</desc>
  <defs>
    <marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d29922"/></marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/></marker>
    <marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39c5cf"/></marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker>
    </defs>
  <rect x="0.5" y="0.5" width="609" height="411" rx="14" fill="#161b22" stroke="#30363d"/>
  <rect x="32" y="24" width="180" height="36" rx="9" fill="#1c2128" stroke="#484f58" stroke-dasharray="6 5"/>
  <text x="122" y="47" fill="#c9d1d9" font-size="14" font-weight="700" text-anchor="middle">Unnormalized (UNF)</text>
  <line x1="122" y1="62" x2="122" y2="100" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <text x="146" y="86" fill="#c9d1d9" font-size="13">remove multi-valued / repeating groups → atomic values</text>
  <rect x="32" y="104" width="180" height="36" rx="9" fill="#58a6ff" fill-opacity="0.14" stroke="#58a6ff" stroke-opacity="0.7"/>
  <text x="122" y="127" fill="#79c0ff" font-size="14" font-weight="700" text-anchor="middle">1NF</text>
  <line x1="122" y1="142" x2="122" y2="180" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <text x="146" y="166" fill="#c9d1d9" font-size="13">remove <tspan font-weight="700" fill="#e6edf3">PARTIAL</tspan> dependencies <tspan fill="#8b949e">(part of the composite key → non-key)</tspan></text>
  <rect x="32" y="184" width="180" height="36" rx="9" fill="#bc8cff" fill-opacity="0.14" stroke="#bc8cff" stroke-opacity="0.7"/>
  <text x="122" y="207" fill="#d2a8ff" font-size="14" font-weight="700" text-anchor="middle">2NF</text>
  <line x1="122" y1="222" x2="122" y2="260" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <text x="146" y="246" fill="#c9d1d9" font-size="13">remove <tspan font-weight="700" fill="#e6edf3">TRANSITIVE</tspan> dependencies <tspan fill="#8b949e">(non-key → non-key)</tspan></text>
  <rect x="32" y="264" width="180" height="36" rx="9" fill="#39c5cf" fill-opacity="0.14" stroke="#39c5cf" stroke-opacity="0.7"/>
  <text x="122" y="287" fill="#56d4dd" font-size="14" font-weight="700" text-anchor="middle">3NF</text>
  <line x1="122" y1="302" x2="122" y2="340" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <text x="146" y="326" fill="#c9d1d9" font-size="13">every determinant <tspan fill="#8b949e">(LHS of an FD)</tspan> must be a candidate key</text>
  <rect x="32" y="344" width="180" height="36" rx="9" fill="#3fb950" fill-opacity="0.14" stroke="#3fb950" stroke-opacity="0.7"/>
  <text x="122" y="367" fill="#56d364" font-size="14" font-weight="700" text-anchor="middle">BCNF</text>
</svg>
