<svg xmlns="http://www.w3.org/2000/svg" width="860" height="268" viewBox="0 0 860 268" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>OFFSET scan cost</title>
  <desc>OFFSET 0 scans 20 rows (fast); OFFSET 1000 scans 1,020 rows (okay); OFFSET 100,000 scans 100,020 rows (very slow); OFFSET 1M scans 1,000,020 rows (database crying). Every query returns only 20 rows.</desc>
  <rect x="0.5" y="0.5" width="859" height="267" rx="14" fill="#161b22" stroke="#30363d"/>

  <g fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">
    <text x="24" y="36">OFFSET</text>
    <text x="184" y="36">ROWS SCANNED</text>
    <text x="600" y="36">RETURNED</text>
    <text x="700" y="36">VERDICT</text>
  </g>
  <line x1="24" y1="50" x2="836" y2="50" stroke="#30363d"/>

  <g font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="13" fill="#79c0ff">
    <text x="24" y="85">OFFSET = 0</text>
    <text x="24" y="129">OFFSET = 1000</text>
    <text x="24" y="173">OFFSET = 100,000</text>
    <text x="24" y="217">OFFSET = 1M</text>
  </g>

  <!-- bars (log scale) -->
  <rect x="184" y="68" width="240" height="24" rx="5" fill="#21262d"/>
  <rect x="184" y="112" width="240" height="24" rx="5" fill="#21262d"/>
  <rect x="184" y="156" width="240" height="24" rx="5" fill="#21262d"/>
  <rect x="184" y="200" width="240" height="24" rx="5" fill="#21262d"/>
  <rect x="184" y="68" width="52" height="24" rx="5" fill="#3fb950" fill-opacity=".7"/>
  <rect x="184" y="112" width="120" height="24" rx="5" fill="#d29922" fill-opacity=".75"/>
  <rect x="184" y="156" width="200" height="24" rx="5" fill="#f0883e" fill-opacity=".8"/>
  <rect x="184" y="200" width="240" height="24" rx="5" fill="#f85149" fill-opacity=".85"/>

  <g font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="12" fill="#e6edf3">
    <text x="438" y="85">Scan 20 rows</text>
    <text x="438" y="129">Scan 1,020 rows</text>
    <text x="438" y="173">Scan 100,020 rows</text>
    <text x="438" y="217">Scan 1,000,020</text>
    <text x="600" y="85" fill="#56d364">Return 20</text>
    <text x="600" y="129" fill="#56d364">Return 20</text>
    <text x="600" y="173" fill="#56d364">Return 20</text>
    <text x="600" y="217" fill="#56d364">Return 20</text>
  </g>

  <g font-size="12" font-weight="600" text-anchor="middle">
    <rect x="700" y="69" width="136" height="22" rx="11" fill="#3fb950" fill-opacity=".14" stroke="#3fb950" stroke-opacity=".6"/>
    <text x="768" y="84" fill="#56d364">✓ Fast</text>
    <rect x="700" y="113" width="136" height="22" rx="11" fill="#d29922" fill-opacity=".14" stroke="#d29922" stroke-opacity=".6"/>
    <text x="768" y="128" fill="#e3b341">↻ Okay</text>
    <rect x="700" y="157" width="136" height="22" rx="11" fill="#f0883e" fill-opacity=".14" stroke="#f0883e" stroke-opacity=".6"/>
    <text x="768" y="172" fill="#ffa657">⚠ Very slow</text>
    <rect x="700" y="201" width="136" height="22" rx="11" fill="#f85149" fill-opacity=".16" stroke="#f85149" stroke-opacity=".7"/>
    <text x="768" y="216" fill="#ff7b72">✗ Database crying</text>
  </g>

  <text x="184" y="248" fill="#8b949e" font-size="12">bar length: log scale</text>
</svg>
