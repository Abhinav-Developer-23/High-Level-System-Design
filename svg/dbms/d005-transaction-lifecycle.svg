<svg xmlns="http://www.w3.org/2000/svg" width="520" height="312" viewBox="0 0 520 312" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Transaction lifecycle</title>
  <desc>BEGIN TRANSACTION, then SQL statements (INSERT, UPDATE, DELETE, etc.), then either COMMIT (save) or ROLLBACK (undo all).</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f85149"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="519" height="311" rx="14" fill="#161b22" stroke="#30363d"/>

  <rect x="150" y="24" width="220" height="34" rx="17" fill="#58a6ff" fill-opacity=".12" stroke="#58a6ff"/>
  <text x="260" y="46" fill="#79c0ff" font-size="13" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">BEGIN TRANSACTION</text>

  <line x1="260" y1="58" x2="260" y2="90" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="150" y="94" width="220" height="80" rx="10" fill="#1c2128" stroke="#30363d"/>
  <text x="260" y="121" fill="#e6edf3" font-size="14.5" font-weight="600" text-anchor="middle">SQL statements</text>
  <text x="260" y="143" fill="#79c0ff" font-size="12" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">(INSERT, UPDATE,</text>
  <text x="260" y="161" fill="#79c0ff" font-size="12" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">DELETE, etc.)</text>

  <line x1="260" y1="174" x2="260" y2="198" stroke="#8b949e" stroke-width="1.5"/>
  <line x1="140" y1="198" x2="380" y2="198" stroke="#8b949e" stroke-width="1.5"/>
  <line x1="140" y1="198" x2="140" y2="228" stroke="#3fb950" stroke-width="1.8" marker-end="url(#arrG)"/>
  <line x1="380" y1="198" x2="380" y2="228" stroke="#f85149" stroke-width="1.8" marker-end="url(#arrR)"/>

  <rect x="70" y="232" width="140" height="56" rx="10" fill="#3fb950" fill-opacity=".12" stroke="#3fb950"/>
  <text x="140" y="256" fill="#56d364" font-size="14" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">COMMIT</text>
  <text x="140" y="276" fill="#c9d1d9" font-size="12" text-anchor="middle">(save)</text>

  <rect x="310" y="232" width="140" height="56" rx="10" fill="#f85149" fill-opacity=".12" stroke="#f85149"/>
  <text x="380" y="256" fill="#ff7b72" font-size="14" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">ROLLBACK</text>
  <text x="380" y="276" fill="#c9d1d9" font-size="12" text-anchor="middle">(undo all)</text>
</svg>
