  <rect x="230.5" y="221.0" width="69" height="24" rx="6" fill="#3fb950" fill-opacity="0.14" stroke="#3fb950" stroke-opacity="0.55"/>
  <text x="265.0" y="237.5" font-size="13" fill="#56d364" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">COMMIT</text>
  <rect x="24" y="284" width="672" height="244" rx="12" fill="#3fb950" fill-opacity="0.05" stroke="#3fb950" stroke-opacity="0.55"/>
  <text x="44" y="314" font-size="15" fill="#56d364" font-weight="700">Strict</text>
  <rect x="42" y="328" width="146" height="184" rx="6" fill="#bc8cff" fill-opacity="0.05" stroke="none"/>
  <rect x="192" y="328" width="146" height="184" rx="6" fill="#39c5cf" fill-opacity="0.05" stroke="none"/>
  <text x="115.0" y="349" font-size="14" fill="#d2a8ff" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">T1</text>
  <text x="265.0" y="349" font-size="14" fill="#56d4dd" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">T2</text>
  <line x1="40" y1="360" x2="340" y2="360" stroke="#30363d"/>
  <rect x="88.5" y="367.0" width="53" height="24" rx="6" fill="#bc8cff" fill-opacity="0.14" stroke="#bc8cff" stroke-opacity="0.55"/>
  <text x="115.0" y="383.5" font-size="13" fill="#d2a8ff" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">W(A)</text>
  <line x1="40" y1="398" x2="340" y2="398" stroke="#21262d"/>
  <rect x="72.5" y="405.0" width="85" height="24" rx="6" fill="#3fb950" fill-opacity="0.14" stroke="#3fb950" stroke-opacity="0.55"/>
  <text x="115.0" y="421.5" font-size="13" fill="#56d364" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">COMMIT ✓</text>
  <line x1="40" y1="436" x2="340" y2="436" stroke="#21262d"/>
  <rect x="238.5" y="443.0" width="53" height="24" rx="6" fill="#39c5cf" fill-opacity="0.14" stroke="#39c5cf" stroke-opacity="0.55"/>
  <text x="265.0" y="459.5" font-size="13" fill="#56d4dd" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">W(A)</text>
  <text x="356" y="459.5" font-size="13" fill="#c9d1d9"><tspan fill="#8b949e">← </tspan>writes <tspan fill="#56d364" font-weight="700">AFTER</tspan> T1 commits <tspan fill="#56d364" font-weight="700">✓</tspan></text>
  <line x1="40" y1="474" x2="340" y2="474" stroke="#21262d"/>
  <rect x="222.5" y="481.0" width="85" height="24" rx="6" fill="#3fb950" fill-opacity="0.14" stroke="#3fb950" stroke-opacity="0.55"/>
  <text x="265.0" y="497.5" font-size="13" fill="#56d364" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">COMMIT ✓</text>
</svg>
