  </defs>
  <rect x="0.5" y="0.5" width="579" height="259" rx="14" fill="#161b22" stroke="#30363d"/>
  <rect x="82" y="24" width="146" height="212" rx="6" fill="#bc8cff" fill-opacity="0.05" stroke="none"/>
