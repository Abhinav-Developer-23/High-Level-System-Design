<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Concurrency control protocols</title>
  <desc>Concurrency control protocols split into lock-based protocols (including two-phase locking, 2PL), timestamp-based protocols, and optimistic concurrency control.</desc>
