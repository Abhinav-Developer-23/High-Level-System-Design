  <rect x="0.5" y="0.5" width="759" height="299" rx="14" fill="#161b22" stroke="#30363d"/>
  <rect x="250" y="24" width="260" height="44" rx="10" fill="#58a6ff" fill-opacity="0.12" stroke="#58a6ff" stroke-opacity="0.7"/>
  <text x="380" y="51" fill="#e6edf3" font-size="14.5" font-weight="600" text-anchor="middle">Concurrency Control Protocols</text>
