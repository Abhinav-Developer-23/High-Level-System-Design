  <text x="140" y="147" fill="#d2a8ff" font-size="14" font-weight="600" text-anchor="middle">Lock-Based</text>
  <text x="140" y="167" fill="#d2a8ff" font-size="14" font-weight="600" text-anchor="middle">Protocols</text>
