<svg xmlns="http://www.w3.org/2000/svg" width="860" height="450" viewBox="0 0 860 450" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Precedence graph test</title>
  <desc>Schedule S interleaves T1 and T2 on A and B. T1:R(A) before T2:W(A) gives T1 to T2; T2:R(A) at time 2 before T1:W(A) at time 3 gives T2 to T1. The graph has a cycle, so S is not conflict serializable.</desc>
  <defs>
    <marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker>
    <marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker>
    <marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d29922"/></marker>
    <marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/></marker>
    <marker id="m-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39c5cf"/></marker>
    <marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker>
    <marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="859" height="449" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="24" y="40" font-size="12" fill="#8b949e" font-weight="700" letter-spacing="1.5">EXAMPLE SCHEDULE S</text>
  <text x="80.0" y="68" font-size="12" fill="#8b949e" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">1</text>
  <rect x="34.0" y="82.0" width="92" height="24" rx="6" fill="#bc8cff" fill-opacity="0.14" stroke="#bc8cff" stroke-opacity="0.55"/>
  <text x="80.0" y="98.5" font-size="13" fill="#d2a8ff" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">T1: R(A)</text>
  <text x="180.0" y="68" font-size="12" fill="#8b949e" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">2</text>
  <rect x="134.0" y="82.0" width="92" height="24" rx="6" fill="#39c5cf" fill-opacity="0.14" stroke="#39c5cf" stroke-opacity="0.55"/>
  <text x="180.0" y="98.5" font-size="13" fill="#56d4dd" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">T2: R(A)</text>
  <text x="280.0" y="68" font-size="12" fill="#8b949e" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">3</text>
  <rect x="234.0" y="82.0" width="92" height="24" rx="6" fill="#bc8cff" fill-opacity="0.14" stroke="#bc8cff" stroke-opacity="0.55"/>
  <text x="280.0" y="98.5" font-size="13" fill="#d2a8ff" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">T1: W(A)</text>
  <text x="380.0" y="68" font-size="12" fill="#8b949e" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">4</text>
  <rect x="334.0" y="82.0" width="92" height="24" rx="6" fill="#39c5cf" fill-opacity="0.14" stroke="#39c5cf" stroke-opacity="0.55"/>
  <text x="380.0" y="98.5" font-size="13" fill="#56d4dd" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">T2: W(A)</text>
  <text x="480.0" y="68" font-size="12" fill="#8b949e" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">5</text>
  <rect x="434.0" y="82.0" width="92" height="24" rx="6" fill="#bc8cff" fill-opacity="0.14" stroke="#bc8cff" stroke-opacity="0.55"/>
  <text x="480.0" y="98.5" font-size="13" fill="#d2a8ff" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">T1: R(B)</text>
  <text x="580.0" y="68" font-size="12" fill="#8b949e" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">6</text>
  <rect x="534.0" y="82.0" width="92" height="24" rx="6" fill="#39c5cf" fill-opacity="0.14" stroke="#39c5cf" stroke-opacity="0.55"/>
  <text x="580.0" y="98.5" font-size="13" fill="#56d4dd" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">T2: R(B)</text>
  <text x="680.0" y="68" font-size="12" fill="#8b949e" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">7</text>
  <rect x="634.0" y="82.0" width="92" height="24" rx="6" fill="#bc8cff" fill-opacity="0.14" stroke="#bc8cff" stroke-opacity="0.55"/>
  <text x="680.0" y="98.5" font-size="13" fill="#d2a8ff" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">T1: W(B)</text>
  <text x="780.0" y="68" font-size="12" fill="#8b949e" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">8</text>
  <rect x="734.0" y="82.0" width="92" height="24" rx="6" fill="#39c5cf" fill-opacity="0.14" stroke="#39c5cf" stroke-opacity="0.55"/>
  <text x="780.0" y="98.5" font-size="13" fill="#56d4dd" font-weight="600" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">T2: W(B)</text>
  <path d="M80.0,107 Q230.0,164 378.0,110" stroke="#bc8cff" stroke-width="1.6" fill="none" marker-end="url(#m-purple)"/>
  <path d="M180.0,107 Q230.0,138 278.0,110" stroke="#39c5cf" stroke-width="1.6" fill="none" marker-end="url(#m-teal)"/>
  <line x1="24" y1="156" x2="836" y2="156" stroke="#21262d"/>
  <text x="24" y="184" font-size="12" fill="#8b949e" font-weight="700" letter-spacing="1.5">CONFLICTS</text>
  <rect x="24" y="198" width="660" height="36" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="40" y="221" font-size="12.5" fill="#c9d1d9" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace"><tspan fill="#d2a8ff" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-weight="600">T1</tspan>:R(A) before <tspan fill="#56d4dd" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-weight="600">T2</tspan>:W(A)</text>
  <line x1="688" y1="216" x2="718" y2="216" stroke="#8b949e" stroke-width="1.5" marker-end="url(#m-gray)"/>
  <rect x="722" y="198" width="114" height="36" rx="8" fill="#bc8cff" fill-opacity="0.12" stroke="#bc8cff" stroke-opacity="0.55"/>
  <text x="779.0" y="221" font-size="14" fill="#e6edf3" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace"><tspan fill="#d2a8ff" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-weight="600">T1</tspan> → <tspan fill="#56d4dd" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-weight="600">T2</tspan></text>
  <rect x="24" y="244" width="660" height="36" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="40" y="267" font-size="12.5" fill="#c9d1d9" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace"><tspan fill="#d2a8ff" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-weight="600">T1</tspan>:W(A) before <tspan fill="#56d4dd" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-weight="600">T2</tspan>:R(A)? No, <tspan fill="#56d4dd" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-weight="600">T2</tspan>:R(A) is at time 2, <tspan fill="#d2a8ff" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-weight="600">T1</tspan>:W(A) is at time 3</text>
  <line x1="688" y1="262" x2="718" y2="262" stroke="#8b949e" stroke-width="1.5" marker-end="url(#m-gray)"/>
  <rect x="722" y="244" width="114" height="36" rx="8" fill="#39c5cf" fill-opacity="0.12" stroke="#39c5cf" stroke-opacity="0.55"/>
  <text x="779.0" y="267" font-size="14" fill="#e6edf3" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace"><tspan fill="#56d4dd" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-weight="600">T2</tspan> → <tspan fill="#d2a8ff" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-weight="600">T1</tspan></text>
  <line x1="24" y1="302" x2="836" y2="302" stroke="#21262d"/>
  <text x="24" y="330" font-size="12" fill="#8b949e" font-weight="700" letter-spacing="1.5">PRECEDENCE GRAPH</text>
  <path d="M142,370 Q220.0,328 296,370" stroke="#f85149" stroke-width="1.8" fill="none" marker-end="url(#m-red)"/>
  <path d="M298,398 Q220.0,440 144,398" stroke="#f85149" stroke-width="1.8" fill="none" marker-end="url(#m-red)"/>
  <circle cx="120" cy="384" r="26" fill="#bc8cff" fill-opacity=".16" stroke="#bc8cff" stroke-width="1.6"/>
  <text x="120" y="389" font-size="15" fill="#d2a8ff" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">T1</text>
  <circle cx="320" cy="384" r="26" fill="#39c5cf" fill-opacity=".16" stroke="#39c5cf" stroke-width="1.6"/>
  <text x="320" y="389" font-size="15" fill="#56d4dd" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">T2</text>
  <text x="440" y="364" font-size="14" fill="#e6edf3" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace"><tspan fill="#d2a8ff" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-weight="600">T1</tspan> ──→ <tspan fill="#56d4dd" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-weight="600">T2</tspan></text>
  <text x="440" y="392" font-size="14" fill="#e6edf3" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace"><tspan fill="#56d4dd" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-weight="600">T2</tspan> ──→ <tspan fill="#d2a8ff" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-weight="600">T1</tspan><tspan fill="#ff7b72" font-weight="700">   ← CYCLE! ✗</tspan></text>
  <rect x="436" y="408" width="236" height="30" rx="8" fill="#f85149" fill-opacity="0.14" stroke="#f85149" stroke-opacity="0.6"/>
  <text x="452" y="428" font-size="14" fill="#ff7b72" font-weight="700">→ NOT Conflict Serializable</text>
</svg>
