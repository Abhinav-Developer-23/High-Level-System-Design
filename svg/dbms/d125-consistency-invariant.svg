<svg xmlns="http://www.w3.org/2000/svg" width="700" height="214" viewBox="0 0 700 214" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Consistency invariant</title>
  <desc>Before the transaction A + B = 3000 (consistent); after it A + B = 3000 (still consistent). If A + B is not 3000 after the transaction the state is inconsistent, a violation.</desc>
  <defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d29922"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39c5cf"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs>
  <rect x="0.5" y="0.5" width="699" height="213" rx="14" fill="#161b22" stroke="#30363d"/>
  <rect x="24" y="24" width="280" height="92" rx="10" fill="#1c2128" stroke="#30363d"/>
  <text x="42" y="50" font-size="12" fill="#8b949e" font-weight="700" letter-spacing="1.5">BEFORE</text>
  <text x="42" y="80" font-size="15" fill="#e6edf3" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">A + B = 3000</text>
  <text x="42" y="102" font-size="12.5" fill="#8b949e">(consistent)</text>
  <line x1="312" y1="70" x2="386" y2="70" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <rect x="396" y="24" width="280" height="92" rx="10" fill="#3fb950" fill-opacity="0.1" stroke="#3fb950" stroke-opacity="0.7"/>
  <text x="414" y="50" font-size="12" fill="#56d364" font-weight="700" letter-spacing="1.5">AFTER</text>
  <text x="414" y="80" font-size="15" fill="#e6edf3" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">A + B = 3000</text>
  <text x="414" y="102" font-size="12.5" fill="#8b949e">(still consistent)  <tspan fill="#56d364" font-weight="700" font-size="15">✓</tspan></text>
  <rect x="24" y="136" width="652" height="54" rx="10" fill="#f85149" fill-opacity="0.1" stroke="#f85149" stroke-opacity="0.7"/>
  <text x="42" y="168" font-size="13.5" fill="#c9d1d9">If <tspan fill="#e6edf3" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">A + B ≠ 3000</tspan> after transaction  →  inconsistent  →  <tspan fill="#ff7b72" font-weight="700">violation!</tspan></text>
</svg>
