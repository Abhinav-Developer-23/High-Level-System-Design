<svg xmlns="http://www.w3.org/2000/svg" width="760" height="262" viewBox="0 0 760 262" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Foreign key: students to departments</title>
  <desc>Child table students (roll_no, name, dept) references parent table departments (dept_id, dept_name). Alice and Carol point to CSE, Bob to ECE, Dave to ME. PK: dept_id. FK: dept references dept_id.</desc>
  <defs>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#39c5cf"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="759" height="261" rx="14" fill="#161b22" stroke="#30363d"/>

  <text x="40" y="40" fill="#e6edf3" font-size="14.5" font-weight="600" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">departments <tspan font-family="Segoe UI, Inter, system-ui, sans-serif" fill="#8b949e" font-size="13" font-weight="400">(Parent)</tspan></text>
  <text x="480" y="40" fill="#e6edf3" font-size="14.5" font-weight="600" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">students <tspan font-family="Segoe UI, Inter, system-ui, sans-serif" fill="#8b949e" font-size="13" font-weight="400">(Child)</tspan></text>

  <!-- departments table -->
  <rect x="40" y="56" width="240" height="126" rx="8" fill="#1c2128" stroke="#30363d"/>
  <path d="M40,86 V64 a8,8 0 0 1 8,-8 H272 a8,8 0 0 1 8,8 V86 z" fill="#21262d"/>
  <line x1="130" y1="56" x2="130" y2="182" stroke="#30363d"/>
  <line x1="40" y1="86" x2="280" y2="86" stroke="#30363d"/>
  <line x1="40" y1="118" x2="280" y2="118" stroke="#21262d"/>
  <line x1="40" y1="150" x2="280" y2="150" stroke="#21262d"/>
  <g font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="12.5">
    <text x="52" y="76" fill="#e3b341" font-weight="700">dept_id</text>
    <text x="142" y="76" fill="#8b949e" font-weight="700">dept_name</text>
    <text x="52" y="107" fill="#79c0ff" font-weight="700">CSE</text>
    <text x="142" y="107" fill="#c9d1d9">Comp. Sci.</text>
    <text x="52" y="139" fill="#56d4dd" font-weight="700">ECE</text>
    <text x="142" y="139" fill="#c9d1d9">Electronics</text>
    <text x="52" y="171" fill="#ffa657" font-weight="700">ME</text>
    <text x="142" y="171" fill="#c9d1d9">Mechanical</text>
  </g>

  <!-- students table -->
  <rect x="480" y="56" width="250" height="158" rx="8" fill="#1c2128" stroke="#30363d"/>
  <path d="M480,86 V64 a8,8 0 0 1 8,-8 H722 a8,8 0 0 1 8,8 V86 z" fill="#21262d"/>
  <line x1="560" y1="56" x2="560" y2="214" stroke="#30363d"/>
  <line x1="650" y1="56" x2="650" y2="214" stroke="#30363d"/>
  <line x1="480" y1="86" x2="730" y2="86" stroke="#30363d"/>
  <line x1="480" y1="118" x2="730" y2="118" stroke="#21262d"/>
  <line x1="480" y1="150" x2="730" y2="150" stroke="#21262d"/>
  <line x1="480" y1="182" x2="730" y2="182" stroke="#21262d"/>
  <g font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="12.5">
    <text x="492" y="76" fill="#8b949e" font-weight="700">roll_no</text>
    <text x="572" y="76" fill="#8b949e" font-weight="700">name</text>
    <text x="662" y="76" fill="#79c0ff" font-weight="700">dept</text>
    <text x="492" y="107" fill="#c9d1d9">1</text>
    <text x="572" y="107" fill="#c9d1d9">Alice</text>
    <text x="662" y="107" fill="#79c0ff" font-weight="700">CSE</text>
    <text x="492" y="139" fill="#c9d1d9">3</text>
    <text x="572" y="139" fill="#c9d1d9">Carol</text>
    <text x="662" y="139" fill="#79c0ff" font-weight="700">CSE</text>
    <text x="492" y="171" fill="#c9d1d9">2</text>
    <text x="572" y="171" fill="#c9d1d9">Bob</text>
    <text x="662" y="171" fill="#56d4dd" font-weight="700">ECE</text>
    <text x="492" y="203" fill="#c9d1d9">4</text>
    <text x="572" y="203" fill="#c9d1d9">Dave</text>
    <text x="662" y="203" fill="#ffa657" font-weight="700">ME</text>
  </g>

  <!-- FK arrows -->
  <line x1="480" y1="102" x2="284" y2="100" stroke="#58a6ff" stroke-width="1.6" marker-end="url(#arrB)"/>
  <line x1="480" y1="134" x2="284" y2="106" stroke="#58a6ff" stroke-width="1.6" marker-end="url(#arrB)"/>
  <line x1="480" y1="166" x2="284" y2="134" stroke="#39c5cf" stroke-width="1.6" marker-end="url(#arrT)"/>
  <line x1="480" y1="198" x2="284" y2="166" stroke="#f0883e" stroke-width="1.6" marker-end="url(#arrO)"/>

  <!-- captions -->
  <rect x="94" y="222" width="132" height="22" rx="11" fill="#d29922" fill-opacity=".14" stroke="#d29922" stroke-opacity=".6"/>
  <text x="160" y="237" fill="#e3b341" font-size="12" font-weight="600" text-anchor="middle">PK: <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">dept_id</tspan></text>
  <rect x="510" y="222" width="190" height="22" rx="11" fill="#58a6ff" fill-opacity=".14" stroke="#58a6ff" stroke-opacity=".6"/>
  <text x="605" y="237" fill="#79c0ff" font-size="12" font-weight="600" text-anchor="middle">FK: <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">dept → dept_id</tspan></text>
</svg>
