<svg xmlns="http://www.w3.org/2000/svg" width="880" height="382" viewBox="0 0 880 382" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Sliding-window partition retention</title>
  <desc>Day 1: partitions p1 to p8 are created for Day 1 through Day 8 (7-day window plus 1 future); p1 is oldest, p7 is today, p8 is pre-created. Day 8: p1 is dropped and p9 is added; p2 is oldest, p8 is today, p9 is new. Day 9: drop p2, add p10, and so on forever.</desc>
  <rect x="0.5" y="0.5" width="879" height="381" rx="14" fill="#161b22" stroke="#30363d"/>
  <rect x="24" y="18" width="832" height="32" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="40" y="39" fill="#c9d1d9" font-size="13.5"><tspan fill="#79c0ff" font-weight="700">Day 1:</tspan>  Create partitions for Day 1 through Day 8 <tspan fill="#8b949e">(7-day window + 1 future)</tspan></text>
  <text x="88" y="74" fill="#8b949e" font-size="12" text-anchor="middle">Day 1</text>
  <rect x="52" y="82" width="72" height="34" rx="8" fill="#d29922" fill-opacity=".14" stroke="#d29922"/>
  <text x="88" y="104" fill="#e3b341" font-size="13.5" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">p1</text>
