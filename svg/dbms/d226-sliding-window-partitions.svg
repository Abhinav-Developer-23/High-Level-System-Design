  <text x="528" y="228" fill="#8b949e" font-size="12" text-anchor="middle">Day 6</text>
  <rect x="492" y="236" width="72" height="34" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="528" y="258" fill="#e6edf3" font-size="13.5" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">p6</text>
  <text x="616" y="228" fill="#8b949e" font-size="12" text-anchor="middle">Day 7</text>
  <rect x="580" y="236" width="72" height="34" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="616" y="258" fill="#e6edf3" font-size="13.5" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">p7</text>
  <text x="704" y="228" fill="#8b949e" font-size="12" text-anchor="middle">Day 8</text>
  <rect x="668" y="236" width="72" height="34" rx="8" fill="#58a6ff" fill-opacity=".16" stroke="#58a6ff"/>
  <text x="704" y="258" fill="#79c0ff" font-size="13.5" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">p8</text>
  <text x="792" y="228" fill="#8b949e" font-size="12" text-anchor="middle">Day 9</text>
  <rect x="756" y="236" width="72" height="34" rx="8" fill="#3fb950" fill-opacity=".14" stroke="#3fb950" stroke-dasharray="5 4"/>
  <text x="792" y="258" fill="#56d364" font-size="13.5" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">p9</text>
  <text x="176" y="290" fill="#e3b341" font-size="12.5" font-weight="600" text-anchor="middle">↑ oldest</text>
  <text x="704" y="290" fill="#79c0ff" font-size="12.5" font-weight="600" text-anchor="middle">↑ today</text>
  <text x="792" y="290" fill="#56d364" font-size="12.5" font-weight="600" text-anchor="middle">↑ new</text>
