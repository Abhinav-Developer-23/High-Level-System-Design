  <rect x="52" y="236" width="72" height="34" rx="8" fill="#f85149" fill-opacity=".06" stroke="#f85149" stroke-opacity=".7" stroke-dasharray="4 4"/>
  <text x="88" y="258" fill="#ff7b72" font-size="13.5" font-weight="700" text-anchor="middle" text-decoration="line-through" opacity=".8" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">p1</text>
