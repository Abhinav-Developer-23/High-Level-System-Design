  <text x="176" y="104" fill="#e6edf3" font-size="13.5" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">p2</text>
  <text x="264" y="74" fill="#8b949e" font-size="12" text-anchor="middle">Day 3</text>
  <rect x="228" y="82" width="72" height="34" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="264" y="104" fill="#e6edf3" font-size="13.5" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">p3</text>
  <text x="352" y="74" fill="#8b949e" font-size="12" text-anchor="middle">Day 4</text>
  <rect x="316" y="82" width="72" height="34" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="352" y="104" fill="#e6edf3" font-size="13.5" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">p4</text>
  <text x="440" y="74" fill="#8b949e" font-size="12" text-anchor="middle">Day 5</text>
  <rect x="404" y="82" width="72" height="34" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="440" y="104" fill="#e6edf3" font-size="13.5" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">p5</text>
  <text x="528" y="74" fill="#8b949e" font-size="12" text-anchor="middle">Day 6</text>
  <rect x="492" y="82" width="72" height="34" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="528" y="104" fill="#e6edf3" font-size="13.5" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">p6</text>
  <text x="616" y="74" fill="#8b949e" font-size="12" text-anchor="middle">Day 7</text>
