  <text x="704" y="104" fill="#56d4dd" font-size="13.5" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">p8</text>
  <text x="88" y="136" fill="#e3b341" font-size="12.5" font-weight="600" text-anchor="middle">↑ oldest</text>
  <text x="616" y="136" fill="#79c0ff" font-size="12.5" font-weight="600" text-anchor="middle">↑ today</text>
  <text x="704" y="136" fill="#56d4dd" font-size="12.5" font-weight="600" text-anchor="middle">↑ pre-created</text>
