  <rect x="228" y="236" width="72" height="34" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="264" y="258" fill="#e6edf3" font-size="13.5" font-weight="700" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">p3</text>
  <text x="352" y="228" fill="#8b949e" font-size="12" text-anchor="middle">Day 4</text>
