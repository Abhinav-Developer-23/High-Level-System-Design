<svg xmlns="http://www.w3.org/2000/svg" width="900" height="636" viewBox="0 0 900 636" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>Closing the old version instead of overwriting it</title>
  <desc>Timeline of UPI_LITE per_txn_limit: Rs 500 under OC-L1 is valid from E1 to E2, Rs 1,000 under OC-L2 is valid from E2 and still open. OC-L2 is issued before E2; in between the answer is still Rs 500. Before ingesting OC-L2 the rule ledger has one open row. After, the Rs 500 row is closed with valid_to E2 and superseded_by OC-L2, and a new open Rs 1,000 row exists. Weaviate chunks get the same metadata patch without re-embedding. Queries filter effective_from &lt;= as_of &lt; effective_to.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="635" rx="14" fill="#161b22" stroke="#30363d"/>

  <!-- timeline -->
  <text x="24" y="34" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">VALIDITY TIMELINE · <tspan font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" letter-spacing="0">UPI_LITE.per_txn_limit</tspan></text>

  <rect x="120" y="62" width="440" height="34" rx="6" fill="#d29922" fill-opacity="0.12" stroke="#d29922"/>
  <text x="340" y="84" fill="#e3b341" font-size="13" font-weight="600" text-anchor="middle">₹500 · OC-L1 (now history)</text>
  <rect x="560" y="62" width="300" height="34" rx="6" fill="#3fb950" fill-opacity="0.14" stroke="#3fb950"/>
  <text x="700" y="84" fill="#56d364" font-size="13" font-weight="600" text-anchor="middle">₹1,000 · OC-L2 (open)</text>

  <line x1="40" y1="118" x2="868" y2="118" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="120" y1="110" x2="120" y2="126" stroke="#c9d1d9" stroke-width="2"/>
  <line x1="470" y1="110" x2="470" y2="126" stroke="#c9d1d9" stroke-width="2"/>
  <line x1="560" y1="104" x2="560" y2="126" stroke="#3fb950" stroke-width="2.5"/>
  <line x1="760" y1="110" x2="760" y2="126" stroke="#c9d1d9" stroke-width="2"/>

  <text x="120" y="144" fill="#c9d1d9" font-size="12" text-anchor="middle">E1 · OC-L1 takes effect</text>
  <text x="560" y="144" fill="#56d364" font-size="12" text-anchor="middle">E2 · OC-L2 takes effect</text>
  <text x="760" y="144" fill="#c9d1d9" font-size="12" text-anchor="middle">today</text>
  <text x="470" y="162" fill="#c9d1d9" font-size="12" text-anchor="middle">OC-L2 issued</text>
  <path d="M470,170 L470,176 L560,176 L560,170" fill="none" stroke="#d29922" stroke-width="1.4"/>
  <text x="515" y="194" fill="#e3b341" font-size="12" text-anchor="middle">issued, not yet effective: still ₹500</text>

  <!-- before panel -->
  <rect x="24" y="214" width="420" height="150" rx="10" fill="#1c2128" stroke="#30363d"/>
  <path d="M24,244 L24,224 Q24,214 34,214 L434,214 Q444,214 444,224 L444,244 Z" fill="#8b949e" fill-opacity="0.10"/>
  <line x1="24" y1="244" x2="444" y2="244" stroke="#30363d"/>
  <text x="40" y="234" fill="#e6edf3" font-size="13" font-weight="600">rule_fact before OC-L2 is ingested</text>
  <g font-size="12" fill="#8b949e">
    <text x="40" y="268">value</text><text x="110" y="268">circular</text><text x="190" y="268">valid_from</text><text x="270" y="268">valid_to</text>
  </g>
  <rect x="32" y="278" width="404" height="26" rx="5" fill="#3fb950" fill-opacity="0.08"/>
  <g font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">
    <text x="40" y="296" fill="#e6edf3">₹500</text><text x="110" y="296" fill="#e6edf3">OC-L1</text><text x="190" y="296" fill="#e6edf3">E1</text><text x="270" y="296" fill="#56d364">9999-12-31 (open)</text>
  </g>
  <text x="40" y="332" fill="#8b949e" font-size="12">Unique index: at most one open version</text>
  <text x="40" y="350" fill="#8b949e" font-size="12">per (product, parameter, scope).</text>

  <!-- after panel -->
  <rect x="456" y="214" width="420" height="150" rx="10" fill="#1c2128" stroke="#3fb950"/>
  <path d="M456,244 L456,224 Q456,214 466,214 L866,214 Q876,214 876,224 L876,244 Z" fill="#3fb950" fill-opacity="0.12"/>
  <line x1="456" y1="244" x2="876" y2="244" stroke="#3fb950" stroke-opacity="0.5"/>
  <text x="472" y="234" fill="#e6edf3" font-size="13" font-weight="600">after: one Postgres transaction</text>
  <g font-size="12" fill="#8b949e">
    <text x="472" y="268">value</text><text x="542" y="268">circular</text><text x="622" y="268">valid_from</text><text x="702" y="268">valid_to</text>
  </g>
  <rect x="464" y="278" width="404" height="44" rx="5" fill="#d29922" fill-opacity="0.08"/>
  <g font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">
    <text x="472" y="296" fill="#c9d1d9">₹500</text><text x="542" y="296" fill="#c9d1d9">OC-L1</text><text x="622" y="296" fill="#c9d1d9">E1</text><text x="702" y="296" fill="#e3b341">E2 (closed)</text>
  </g>
  <text x="702" y="314" fill="#8b949e" font-size="11">superseded_by → OC-L2</text>
  <rect x="464" y="328" width="404" height="26" rx="5" fill="#3fb950" fill-opacity="0.10"/>
  <g font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">
    <text x="472" y="346" fill="#e6edf3">₹1,000</text><text x="542" y="346" fill="#e6edf3">OC-L2</text><text x="622" y="346" fill="#e6edf3">E2</text><text x="702" y="346" fill="#56d364">9999-12-31 (open)</text>
  </g>

  <line x1="444" y1="289" x2="454" y2="289" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- weaviate note -->
  <rect x="24" y="380" width="852" height="58" rx="9" fill="#39c5cf" fill-opacity="0.08" stroke="#39c5cf"/>
  <text x="40" y="404" fill="#c9d1d9" font-size="12"><tspan fill="#56d4dd" font-weight="600">Weaviate:</tspan> the changed clause's chunks of OC-L1 get effective_to = E2 and superseded_by = OC-L2. Metadata patch only, vectors untouched.</text>
  <text x="40" y="424" fill="#c9d1d9" font-size="12">Clauses of OC-L1 that OC-L2 didn't change stay open and keep being retrieved. Nothing is deleted.</text>

  <!-- queries -->
  <text x="24" y="470" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">EVERY QUERY FILTERS</text>
  <text x="200" y="470" fill="#79c0ff" font-size="12" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">effective_from &lt;= as_of &lt; effective_to</text>

  <g font-size="12">
    <rect x="24" y="484" width="852" height="28" rx="6" fill="#1c2128" stroke="#30363d"/>
    <text x="40" y="503" fill="#c9d1d9">as_of = today (default)</text>
    <line x1="330" y1="498" x2="370" y2="498" stroke="#8b949e" stroke-width="1.4" marker-end="url(#arr)"/>
    <text x="384" y="503" fill="#56d364" font-weight="600">₹1,000 (OC-L2)</text>

    <rect x="24" y="518" width="852" height="28" rx="6" fill="#1c2128" stroke="#30363d"/>
    <text x="40" y="537" fill="#c9d1d9">as_of = between issue and E2</text>
    <line x1="330" y1="532" x2="370" y2="532" stroke="#8b949e" stroke-width="1.4" marker-end="url(#arr)"/>
    <text x="384" y="537" fill="#e3b341" font-weight="600">₹500 (OC-L1)<tspan fill="#8b949e" font-weight="400">  + "OC-L2 raises it to ₹1,000 from E2"</tspan></text>

    <rect x="24" y="552" width="852" height="28" rx="6" fill="#1c2128" stroke="#30363d"/>
    <text x="40" y="571" fill="#c9d1d9">as_of = a date in the ₹500 era</text>
    <line x1="330" y1="566" x2="370" y2="566" stroke="#8b949e" stroke-width="1.4" marker-end="url(#arr)"/>
    <text x="384" y="571" fill="#e3b341" font-weight="600">₹500 (OC-L1)<tspan fill="#8b949e" font-weight="400">  history questions still work</tspan></text>

    <rect x="24" y="586" width="852" height="28" rx="6" fill="#58a6ff" fill-opacity="0.08" stroke="#58a6ff"/>
    <text x="40" y="605" fill="#c9d1d9">"what changed?" (no date filter)</text>
    <line x1="330" y1="600" x2="370" y2="600" stroke="#8b949e" stroke-width="1.4" marker-end="url(#arr)"/>
    <text x="384" y="605" fill="#79c0ff" font-weight="600">₹500 → ₹1,000<tspan fill="#8b949e" font-weight="400">  both versions, sorted by effective_from</tspan></text>
  </g>
</svg>
