<svg xmlns="http://www.w3.org/2000/svg" width="900" height="564" viewBox="0 0 900 564" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>NPCI circular RAG architecture</title>
  <desc>Ingestion path: EventBridge every 10 minutes starts one ingest task that reads new PDFs from S3 by content hash, OCRs them with Textract, extracts metadata and tags each clause with its rule_key using regex and Claude, chunks by clause and embeds. It appends the registry row to Postgres and the chunks with vectors to Weaviate; nothing stored is edited. Query path: a PM or engineer asks; a LangGraph flow runs understand, retrieve (every clause of the rule plus hybrid search on Weaviate), rerank with MMR, latest_wins per rule_key, generate with Claude Sonnet and check_grounding with one retry, and returns a cited answer.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
    <marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39c5cf"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d29922"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="563" rx="14" fill="#161b22" stroke="#30363d"/>

  <!-- ingestion lane -->
  <text x="24" y="34" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">INGESTION · WRITE PATH · EVERY 10 MINUTES</text>

  <rect x="24" y="50" width="152" height="80" rx="9" fill="#1c2128" stroke="#30363d"/>
  <text x="100" y="76" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle">EventBridge</text>
  <text x="100" y="98" fill="#c9d1d9" font-size="12" text-anchor="middle">Scheduler</text>
  <text x="100" y="116" fill="#79c0ff" font-size="12" text-anchor="middle" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">rate(10 minutes)</text>

  <rect x="199" y="50" width="152" height="80" rx="9" fill="#58a6ff" fill-opacity="0.12" stroke="#58a6ff"/>
  <text x="275" y="76" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle">Ingest task</text>
  <text x="275" y="98" fill="#c9d1d9" font-size="12" text-anchor="middle">one run at a time</text>
  <text x="275" y="116" fill="#c9d1d9" font-size="12" text-anchor="middle">new = unseen hash</text>

  <rect x="374" y="50" width="152" height="80" rx="9" fill="#58a6ff" fill-opacity="0.12" stroke="#58a6ff"/>
  <text x="450" y="76" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle">OCR</text>
  <text x="450" y="98" fill="#c9d1d9" font-size="12" text-anchor="middle">Textract</text>
  <text x="450" y="116" fill="#e3b341" font-size="12" text-anchor="middle">PDFs are scans</text>

  <rect x="549" y="50" width="152" height="80" rx="9" fill="#58a6ff" fill-opacity="0.12" stroke="#58a6ff"/>
  <text x="625" y="76" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle">Extract</text>
  <text x="625" y="98" fill="#c9d1d9" font-size="12" text-anchor="middle">regex + Claude</text>
  <text x="625" y="116" fill="#c9d1d9" font-size="12" text-anchor="middle">ids, dates, rules</text>

  <rect x="724" y="50" width="152" height="80" rx="9" fill="#58a6ff" fill-opacity="0.12" stroke="#58a6ff"/>
  <text x="800" y="76" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle">Chunk + embed</text>
  <text x="800" y="98" fill="#c9d1d9" font-size="12" text-anchor="middle">one per clause</text>
  <text x="800" y="116" fill="#c9d1d9" font-size="12" text-anchor="middle">+ context header</text>

  <line x1="176" y1="90" x2="197" y2="90" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="351" y1="90" x2="372" y2="90" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="526" y1="90" x2="547" y2="90" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="701" y1="90" x2="722" y2="90" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- ingest <-> stores -->
  <line x1="230" y1="184" x2="230" y2="132" stroke="#39c5cf" stroke-width="1.6" marker-end="url(#arrT)"/>
  <text x="238" y="162" fill="#8b949e" font-size="11">read new PDFs</text>
  <line x1="600" y1="130" x2="600" y2="182" stroke="#39c5cf" stroke-width="1.6" marker-end="url(#arrT)"/>
  <text x="608" y="162" fill="#8b949e" font-size="11">registry</text>
  <line x1="800" y1="130" x2="800" y2="182" stroke="#39c5cf" stroke-width="1.6" marker-end="url(#arrT)"/>
  <text x="808" y="162" fill="#8b949e" font-size="11">chunks</text>

  <!-- stores -->
  <rect x="24" y="184" width="236" height="96" rx="9" fill="#39c5cf" fill-opacity="0.10" stroke="#39c5cf"/>
  <text x="40" y="208" fill="#56d4dd" font-size="14" font-weight="600">S3</text>
  <text x="40" y="230" fill="#c9d1d9" font-size="12"><tspan fill="#79c0ff" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">raw/</tspan>  original PDFs</text>
  <text x="40" y="250" fill="#c9d1d9" font-size="12"><tspan fill="#79c0ff" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">ocr/</tspan>  cached Textract output</text>

  <rect x="292" y="184" width="316" height="96" rx="9" fill="#39c5cf" fill-opacity="0.10" stroke="#39c5cf"/>
  <text x="308" y="208" fill="#56d4dd" font-size="14" font-weight="600">Postgres</text>
  <text x="308" y="228" fill="#c9d1d9" font-size="12">manifest (SHA-256) · circular registry</text>
  <text x="308" y="246" fill="#c9d1d9" font-size="12">references between circulars</text>
  <text x="308" y="264" fill="#c9d1d9" font-size="12">LangGraph checkpoints</text>

  <rect x="640" y="184" width="236" height="96" rx="9" fill="#39c5cf" fill-opacity="0.10" stroke="#39c5cf"/>
  <text x="656" y="208" fill="#56d4dd" font-size="14" font-weight="600">Weaviate</text>
  <text x="656" y="228" fill="#c9d1d9" font-size="12">CircularChunk: text + vector</text>
  <text x="656" y="246" fill="#c9d1d9" font-size="12">effective_from · rule_key</text>
  <text x="656" y="264" fill="#c9d1d9" font-size="12">products · clause · page</text>

  <!-- stores -> query -->
  <polyline points="700,280 700,300 366,300 366,370" fill="none" stroke="#39c5cf" stroke-width="1.6" marker-end="url(#arrT)"/>
  <text x="533" y="294" fill="#8b949e" font-size="11" text-anchor="middle">rule_key fetch + hybrid</text>

  <!-- query lane -->
  <text x="24" y="326" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">QUERY · READ PATH</text>

  <rect x="24" y="354" width="140" height="62" rx="9" fill="#1c2128" stroke="#30363d"/>
  <text x="94" y="380" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle">PM / engineer</text>
  <text x="94" y="400" fill="#8b949e" font-size="12" text-anchor="middle">asks in chat</text>
  <line x1="164" y1="385" x2="188" y2="385" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="190" y="336" width="686" height="124" rx="10" fill="#bc8cff" fill-opacity="0.07" stroke="#bc8cff"/>
  <text x="862" y="358" fill="#d2a8ff" font-size="14" font-weight="600" text-anchor="end">LangGraph flow · API service</text>

  <g font-family="Cascadia Code, JetBrains Mono, Consolas, monospace" font-size="12" text-anchor="middle">
    <rect x="216" y="372" width="93" height="26" rx="13" fill="#1c2128" stroke="#30363d"/>
    <text x="262.5" y="389" fill="#e6edf3">understand</text>
    <rect x="327" y="372" width="78" height="26" rx="13" fill="#1c2128" stroke="#30363d"/>
    <text x="366" y="389" fill="#e6edf3">retrieve</text>
    <rect x="423" y="372" width="64" height="26" rx="13" fill="#1c2128" stroke="#30363d"/>
    <text x="455" y="389" fill="#e6edf3">rerank</text>
    <rect x="505" y="372" width="100" height="26" rx="13" fill="#d29922" fill-opacity="0.12" stroke="#d29922"/>
    <text x="555" y="389" fill="#e6edf3">latest_wins</text>
    <rect x="623" y="372" width="78" height="26" rx="13" fill="#bc8cff" fill-opacity="0.15" stroke="#bc8cff"/>
    <text x="662" y="389" fill="#e6edf3">generate</text>
    <rect x="719" y="372" width="130" height="26" rx="13" fill="#1c2128" stroke="#30363d"/>
    <text x="784" y="389" fill="#e6edf3">check_grounding</text>
  </g>
  <line x1="309" y1="385" x2="325" y2="385" stroke="#8b949e" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="405" y1="385" x2="421" y2="385" stroke="#8b949e" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="487" y1="385" x2="503" y2="385" stroke="#8b949e" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="605" y1="385" x2="621" y2="385" stroke="#8b949e" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="701" y1="385" x2="717" y2="385" stroke="#8b949e" stroke-width="1.4" marker-end="url(#arr)"/>

  <g font-size="11" fill="#8b949e" text-anchor="middle">
    <text x="262.5" y="416">Claude</text>
    <text x="366" y="416">Weaviate</text>
    <text x="455" y="416">+ MMR</text>
    <text x="555" y="416">per rule_key</text>
    <text x="662" y="416" fill="#d2a8ff">Claude Sonnet</text>
    <text x="784" y="416">grounded?</text>
  </g>
  <polyline points="830,398 830,440 400,440 400,400" fill="none" stroke="#d29922" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrA)"/>
  <text x="672" y="454" fill="#e3b341" font-size="11" text-anchor="middle">retry once if not grounded</text>

  <line x1="533" y1="460" x2="533" y2="478" stroke="#3fb950" stroke-width="1.6" marker-end="url(#arrG)"/>

  <rect x="190" y="480" width="686" height="60" rx="9" fill="#3fb950" fill-opacity="0.10" stroke="#3fb950"/>
  <text x="206" y="505" fill="#e6edf3" font-size="13"><tspan fill="#56d364" font-weight="600">Answer:</tspan> ₹1,000 per txn [OC-L2 › 2(a)], effective E2. Earlier ₹500 (OC-L1, history).</text>
  <text x="206" y="526" fill="#8b949e" font-size="12">+ link to the source PDF page · ends with "check the source circular before acting"</text>

  <polyline points="190,510 94,510 94,418" fill="none" stroke="#3fb950" stroke-width="1.6" marker-end="url(#arrG)"/>
</svg>
