<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" style="font-variant-ligatures:none">
  <title>What each change operation does to the rule ledger</title>
  <desc>Six small timelines. REPLACE closes the old version and opens the new one. ADD_MEMBER opens rows for new list members and leaves existing ones untouched. REMOVE_MEMBER closes one member and opens nothing. EXTEND_SCOPE opens rows for a new scope and leaves the old scope untouched. TEMPORARY closes the current value, opens a temporary value with an end date and then a copy of the old value. CORRECT voids the wrong row and opens the corrected value with the same start date.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs>
  <rect x="0.5" y="0.5" width="899" height="639" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="24" y="34" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">WHAT EACH CHANGE OPERATION DOES TO THE RULE ROWS</text>
  <rect x="24" y="56" width="420" height="170" rx="10" fill="#1c2128" stroke="#30363d"/>
  <text x="40" y="82" fill="#79c0ff" font-size="13" font-weight="700" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">REPLACE</text>
  <text x="40" y="100" fill="#8b949e" font-size="12">Lite ₹500 → ₹1,000 (OC-L1 → OC-L2)</text>
  <line x1="234" y1="108" x2="234" y2="200" stroke="#8b949e" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="234" y="216" fill="#8b949e" font-size="11" text-anchor="middle">E</text>
  <rect x="41" y="112" width="192" height="20" rx="4" fill="#d29922" fill-opacity=".14" stroke="#d29922"/>
  <text x="49" y="126" fill="#e3b341" font-size="12">₹500 · OC-L1 · closed at E</text>
  <rect x="235" y="138" width="192" height="20" rx="4" fill="#3fb950" fill-opacity=".14" stroke="#3fb950"/>
  <text x="243" y="152" fill="#56d364" font-size="12">₹1,000 · OC-L2</text>
  <line x1="40" y1="200" x2="428" y2="200" stroke="#8b949e" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="456" y="56" width="420" height="170" rx="10" fill="#1c2128" stroke="#30363d"/>
  <text x="472" y="82" fill="#79c0ff" font-size="13" font-weight="700" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">ADD_MEMBER</text>
  <text x="472" y="100" fill="#8b949e" font-size="12">OC-161A adds 19 countries to the 12 of OC-161</text>
  <line x1="666" y1="108" x2="666" y2="200" stroke="#8b949e" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="666" y="216" fill="#8b949e" font-size="11" text-anchor="middle">E</text>
  <rect x="473" y="112" width="386" height="20" rx="4" fill="#484f58" fill-opacity=".10" stroke="#484f58"/>
  <text x="481" y="126" fill="#c9d1d9" font-size="12">12 existing countries · untouched</text>
  <rect x="667" y="138" width="192" height="20" rx="4" fill="#3fb950" fill-opacity=".14" stroke="#3fb950"/>
  <text x="675" y="152" fill="#56d364" font-size="12">+19 countries · OC-161A</text>
  <line x1="472" y1="200" x2="860" y2="200" stroke="#8b949e" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="24" y="238" width="420" height="170" rx="10" fill="#1c2128" stroke="#30363d"/>
  <text x="40" y="264" fill="#79c0ff" font-size="13" font-weight="700" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">REMOVE_MEMBER</text>
  <text x="40" y="282" fill="#8b949e" font-size="12">OC-229A takes the receivable section away</text>
  <line x1="234" y1="290" x2="234" y2="382" stroke="#8b949e" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="234" y="398" fill="#8b949e" font-size="11" text-anchor="middle">E</text>
  <rect x="41" y="294" width="386" height="20" rx="4" fill="#484f58" fill-opacity=".10" stroke="#484f58"/>
  <text x="49" y="308" fill="#c9d1d9" font-size="12">payable · OC-229 · untouched</text>
  <rect x="41" y="320" width="192" height="20" rx="4" fill="#d29922" fill-opacity=".14" stroke="#d29922"/>
  <text x="49" y="334" fill="#e3b341" font-size="12">receivable · OC-229</text>
  <line x1="40" y1="382" x2="428" y2="382" stroke="#8b949e" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="246" y="334" fill="#ff7b72" font-size="12">✕ closed, nothing opens</text>
  <rect x="456" y="238" width="420" height="170" rx="10" fill="#1c2128" stroke="#30363d"/>
  <text x="472" y="264" fill="#79c0ff" font-size="13" font-weight="700" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">EXTEND_SCOPE</text>
  <text x="472" y="282" fill="#8b949e" font-size="12">OC-186A: Tap &amp; Pay goes from QR to PoS</text>
  <line x1="666" y1="290" x2="666" y2="382" stroke="#8b949e" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="666" y="398" fill="#8b949e" font-size="11" text-anchor="middle">E</text>
  <rect x="473" y="294" width="386" height="20" rx="4" fill="#484f58" fill-opacity=".10" stroke="#484f58"/>
  <text x="481" y="308" fill="#c9d1d9" font-size="12">QR · OC-186 · untouched</text>
  <rect x="667" y="320" width="192" height="20" rx="4" fill="#3fb950" fill-opacity=".14" stroke="#3fb950"/>
  <text x="675" y="334" fill="#56d364" font-size="12">PoS ₹5,000 · OC-186A</text>
  <line x1="472" y1="382" x2="860" y2="382" stroke="#8b949e" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="24" y="420" width="420" height="170" rx="10" fill="#1c2128" stroke="#30363d"/>
  <text x="40" y="446" fill="#79c0ff" font-size="13" font-weight="700" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">TEMPORARY</text>
  <text x="40" y="464" fill="#8b949e" font-size="12">e.g. a relaxation until a date, then back</text>
  <line x1="174" y1="472" x2="174" y2="564" stroke="#8b949e" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="174" y="580" fill="#8b949e" font-size="11" text-anchor="middle">start</text>
  <line x1="314" y1="472" x2="314" y2="564" stroke="#8b949e" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="314" y="580" fill="#8b949e" font-size="11" text-anchor="middle">end</text>
  <rect x="41" y="476" width="132" height="20" rx="4" fill="#d29922" fill-opacity=".14" stroke="#d29922"/>
  <text x="49" y="490" fill="#e3b341" font-size="12">₹X · OC-A</text>
  <rect x="175" y="502" width="138" height="20" rx="4" fill="#58a6ff" fill-opacity=".14" stroke="#58a6ff"/>
  <text x="183" y="516" fill="#79c0ff" font-size="12">₹Y · temporary</text>
  <rect x="315" y="528" width="112" height="20" rx="4" fill="#3fb950" fill-opacity=".14" stroke="#3fb950"/>
  <text x="323" y="542" fill="#56d364" font-size="12">₹X again</text>
  <line x1="40" y1="564" x2="428" y2="564" stroke="#8b949e" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="456" y="420" width="420" height="170" rx="10" fill="#1c2128" stroke="#30363d"/>
  <text x="472" y="446" fill="#79c0ff" font-size="13" font-weight="700" font-family="Cascadia Code, JetBrains Mono, Consolas, monospace">CORRECT</text>
  <text x="472" y="464" fill="#8b949e" font-size="12">corrigendum: read ₹2,000 as ₹5,000</text>
  <line x1="666" y1="472" x2="666" y2="564" stroke="#8b949e" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="666" y="580" fill="#8b949e" font-size="11" text-anchor="middle">E</text>
  <rect x="473" y="476" width="192" height="20" rx="4" fill="#d29922" fill-opacity=".14" stroke="#d29922"/>
  <text x="481" y="490" fill="#e3b341" font-size="12">₹500 · before</text>
  <rect x="667" y="502" width="192" height="20" rx="4" fill="#f85149" fill-opacity=".08" stroke="#f85149" stroke-dasharray="5 4"/>
  <text x="675" y="516" fill="#ff7b72" font-size="12">₹2,000 · VOID</text>
  <rect x="667" y="528" width="192" height="20" rx="4" fill="#3fb950" fill-opacity=".14" stroke="#3fb950"/>
  <text x="675" y="542" fill="#56d364" font-size="12">₹5,000 · same start date</text>
  <line x1="472" y1="564" x2="860" y2="564" stroke="#8b949e" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="24" y="606" width="16" height="12" rx="3" fill="#d29922" fill-opacity=".14" stroke="#d29922"/>
  <text x="46" y="616" fill="#8b949e" font-size="12">closed (valid_to set)</text>
  <rect x="210" y="606" width="16" height="12" rx="3" fill="#3fb950" fill-opacity=".14" stroke="#3fb950"/>
  <text x="232" y="616" fill="#8b949e" font-size="12">opened</text>
  <rect x="297" y="606" width="16" height="12" rx="3" fill="#484f58" fill-opacity=".10" stroke="#484f58"/>
  <text x="319" y="616" fill="#8b949e" font-size="12">untouched</text>
  <rect x="404" y="606" width="16" height="12" rx="3" fill="#f85149" fill-opacity=".08" stroke="#f85149" stroke-dasharray="5 4"/>
  <text x="426" y="616" fill="#8b949e" font-size="12">VOID: never valid</text>
  <rect x="564" y="606" width="16" height="12" rx="3" fill="#58a6ff" fill-opacity=".14" stroke="#58a6ff"/>
  <text x="586" y="616" fill="#8b949e" font-size="12">temporary</text>
  <text x="876" y="616" fill="#8b949e" font-size="12" text-anchor="end">E = new circular's effective date</text>
</svg>
